    resources:
    - name: volumes
      path: /volumes
      operations:
      - name: getvolumes
        method: GET
        description: List volumes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createvolume
        method: POST
        description: Create a volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: volumes-volumeId
      path: /volumes/{volumeId}
      operations:
      - name: getvolume
        method: GET
        description: Get a volume
