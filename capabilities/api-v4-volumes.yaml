    resources:
    - path: /v1/volumes
      name: volumes
      description: REST surface for volumes.
      operations:
      - method: GET
        name: getvolumes
        description: List volumes
        call: api-v4-volumes.getvolumes
        outputParameters:
        - type: object
          mapping: $.
