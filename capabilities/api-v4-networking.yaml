      operations:
      - name: getipaddress
        method: GET
        description: Get an IP address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: address
          in: path
          type: string
          description: The IP address to look up.
          required: true
    - name: networking-vlans
      path: /networking/vlans
