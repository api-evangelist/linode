      operations:
      - name: getfirewalls
        method: GET
        description: List firewalls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createfirewall
        method: POST
        description: Create a firewall
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
