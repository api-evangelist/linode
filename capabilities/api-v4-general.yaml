naftiko: 1.0.0-alpha2
info:
  label: Linode API v4
  description: 'Linode API v4. 3 operations. Lead operation: List tags. Self-contained Naftiko capability covering one Linode
    business surface.'
  tags:
  - Linode
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LINODE_API_KEY: LINODE_API_KEY
capability:
  consumes:
  - type: http
    namespace: api-v4-general
    baseUri: https://api.linode.com/v4
    description: Linode API v4 business capability. Self-contained, no shared references.
    resources:
    - name: tags
      path: /tags
      operations:
      - name: gettags
        method: GET
        description: List tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtag
        method: POST
        description: Create a tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tags-label
      path: /tags/{label}
      operations:
      - name: deletetag
        method: DELETE
        description: Delete a tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: label
          in: path
          type: string
          description: The label of the tag to delete.
          required: true
    authentication:
      type: bearer
      token: '{{env.LINODE_API_KEY}}'
  exposes:
  - type: rest
    namespace: api-v4-general-rest
    port: 8080
    description: REST adapter for Linode API v4. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/tags
      name: tags
      description: REST surface for tags.
      operations:
      - method: GET
        name: gettags
        description: List tags
        call: api-v4-general.gettags
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtag
        description: Create a tag
        call: api-v4-general.createtag
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tags/{label}
      name: tags-label
      description: REST surface for tags-label.
      operations:
      - method: DELETE
        name: deletetag
        description: Delete a tag
        call: api-v4-general.deletetag
        with:
          label: rest.label
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: api-v4-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Linode API v4. One tool per consumed operation, routed inline through this capability's consumes
      block.
    tools:
    - name: list-tags
      description: List tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v4-general.gettags
      outputParameters:
      - type: object
        mapping: $.
    - name: create-tag
      description: Create a tag
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-v4-general.createtag
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-tag
      description: Delete a tag
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: api-v4-general.deletetag
      with:
        label: tools.label
      outputParameters:
      - type: object
        mapping: $.
