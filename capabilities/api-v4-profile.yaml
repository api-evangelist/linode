    namespace: api-v4-profile
    baseUri: https://api.linode.com/v4
    description: Linode API v4 — Profile business capability. Self-contained, no shared references.
    resources:
    - name: profile
      path: /profile
      operations:
      - name: getprofile
        method: GET
        description: Get your profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateprofile
        method: PUT
        description: Update your profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: profile-sshkeys
      path: /profile/sshkeys
      operations:
      - name: getsshkeys
        method: GET
        description: List SSH keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsshkey
        method: POST
        description: Add an SSH key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: profile-tokens
      path: /profile/tokens
