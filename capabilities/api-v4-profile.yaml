    port: 9090
    transport: http
    description: MCP adapter for Linode API v4 — Profile. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-your-profile
      description: Get your profile
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v4-profile.getprofile
      outputParameters:
      - type: object
        mapping: $.
    - name: update-your-profile
      description: Update your profile
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: api-v4-profile.updateprofile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-ssh-keys
      description: List SSH keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v4-profile.getsshkeys
      outputParameters:
      - type: object
        mapping: $.
    - name: add-ssh-key
      description: Add an SSH key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-v4-profile.createsshkey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-personal-access-tokens
      description: List personal access tokens
