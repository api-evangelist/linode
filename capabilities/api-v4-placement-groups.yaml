naftiko: 1.0.0-alpha2
info:
  label: Linode API v4 — Placement Groups
  description: 'Linode API v4 — Placement Groups. 2 operations. Lead operation: List placement groups. Self-contained Naftiko
    capability covering one Linode business surface.'
  tags:
  - Linode
  - Placement Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LINODE_API_KEY: LINODE_API_KEY
capability:
  consumes:
  - type: http
    namespace: api-v4-placement-groups
    baseUri: https://api.linode.com/v4
    description: Linode API v4 — Placement Groups business capability. Self-contained, no shared references.
    resources:
    - name: placement-groups
      path: /placement/groups
      operations:
      - name: getplacementgroups
        method: GET
        description: List placement groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createplacementgroup
        method: POST
        description: Create a placement group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LINODE_API_KEY}}'
  exposes:
  - type: rest
    namespace: api-v4-placement-groups-rest
    port: 8080
    description: REST adapter for Linode API v4 — Placement Groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/placement/groups
      name: placement-groups
      description: REST surface for placement-groups.
      operations:
      - method: GET
        name: getplacementgroups
        description: List placement groups
        call: api-v4-placement-groups.getplacementgroups
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createplacementgroup
        description: Create a placement group
        call: api-v4-placement-groups.createplacementgroup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: api-v4-placement-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Linode API v4 — Placement Groups. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-placement-groups
      description: List placement groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v4-placement-groups.getplacementgroups
      outputParameters:
      - type: object
        mapping: $.
    - name: create-placement-group
      description: Create a placement group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-v4-placement-groups.createplacementgroup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
