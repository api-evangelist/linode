note: 'Two credential models, both bearer tokens on the Authorization header. Personal access tokens are created
  in Cloud Manager (or via post-personal-access-token) with a fixed expiry chosen at creation that cannot be changed
  afterwards, and a per-category read/write access level that also cannot be changed afterwards. OAuth 2.0 authorization
  code (RFC 6749) is for third-party applications: login.linode.com is the authorization server, api.linode.com
  the resource server, access tokens live two hours, and only the private (confidential) client flow issues a refresh
  token - the public client flow requires the user to log in again. Since Identity and Access reached GA on 2026-03-31,
  OAuth scope is layered over an RBAC permission model, so an operation can fail on the permission even when the
  scope is present; each operation reference page names both. Some catalog operations (regions, plan types, pricing)
  need no credential at all.'
token_ttl:
  oauth_access_token: 2 hours
  oauth_refresh_token: issued only to private/confidential clients
  personal_access_token: fixed expiry chosen at creation, not extendable
authorization_model:
  style: RBAC (Identity and Access in Akamai Cloud) layered under OAuth scopes
  ga_date: '2026-03-31'
  docs: https://techdocs.akamai.com/cloud-computing/docs/identity-and-access-cm
