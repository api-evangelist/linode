specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Linode (Akamai Cloud)
providerId: linode
generated: '2026-09-17'
method: probed
modified: '2026-09-17'
source: https://api.linode.com/v4/linode/types
docs: https://www.linode.com/pricing/
note: Read from Linode's own unauthenticated plan catalog endpoint on 2026-09-17, which returned 75 plan types across
  seven classes with hourly and monthly prices, per-region price overrides and a backups addon price on every type.
  This replaces a 2026-05-04 generated artifact transcribed from the pricing page. www.linode.com/pricing/ answers
  our crawler with an Akamai bot-manager 403, so the machine-readable catalog is the only source that could be verified
  here — which is the stronger one anyway. The GPU class returns a $0 base price on the public catalog; no figure
  is invented for it.
tags:
- Cloud Compute
- Hosting
- GPU
- Pricing API
description: Akamai Cloud (Linode) compute plan classes and prices, read from the public plan catalog endpoint.
sources:
- https://api.linode.com/v4/linode/types
- https://www.linode.com/pricing/
machine_readable_pricing:
  available: true
  endpoints:
  - url: https://api.linode.com/v4/linode/types
    auth: none
    status: 200
    note: Compute plan catalog, 75 types.
  - url: https://api.linode.com/v4/volumes/types
    auth: none
    note: Block Storage pricing.
  - url: https://api.linode.com/v4/nodebalancers/types
    auth: none
    note: NodeBalancer pricing.
  - url: https://api.linode.com/v4/lke/types
    auth: none
    note: LKE control-plane tiers.
  - url: https://api.linode.com/v4/object-storage/types
    auth: none
    note: Object Storage pricing.
  - url: https://api.linode.com/v4/network-transfer/prices
    auth: none
    note: Network transfer overage pricing.
  - url: https://api.linode.com/v4/databases/types
    auth: none
    note: Managed Database plan pricing.
  note: Linode publishes its price book as an unauthenticated API, which is why its own MCP server can cost a stack
    without a token.
addons:
- name: Backups
  note: Priced per plan type on each entry's addons.backups; $2.00/mo on the Nanode 1GB, with per-region overrides.
plan_count: 7
plan_type_count: 75
