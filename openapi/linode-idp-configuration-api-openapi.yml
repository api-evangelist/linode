openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode IDP configuration API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Use the Identity Management IDP Configuration endpoints to configure SAML-based Single Sign-On (SSO) for your account. You can create and manage an external identity provider (IDP) configuration, control which users are required to authenticate through SSO, and manage the public certificates used to verify SAML assertions. These endpoints are in Beta and available from the `v4beta` URL.
  name: IDP configuration
paths:
  /{apiVersion}/iam/idp-configs:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/idp-configs.yaml
      path-info: /{apiVersion}/iam/idp-configs
    post:
      description: 'Creates an external identity provider (IDP) configuration for the account. You can have only one configuration per account. To learn more about the single sign-on for Akamai Cloud, including emergency access accounts setup, see Single Sign-On.


        **Prerequisite**


        You need to have IDP metadata from your identity provider.


        To create the IDP configuration:


        1. Provide a unique label for the configuration.

        1. To activate the SSO, set `enabled` to `true`.

        1. Enforce SSO for all users of your account with `enforce` set to `true`. The enforcement doesn''t apply to users listed as SSO user exceptions.


        > 📘

        >

        > Set the enforcement to `false`, if you want to test SSO on a small subset of users. After you create this configuration, add the SSO-required users and test the login flow. If the test is successful, enforce the SSO login for all users with the Update an IDP configuration operation.


        1. Specify the SAML configuration settings with details from the IDP metadata you got from the identity provider.


        > 👍 There''s a tutorial

        >

        > We offer an example API workflow you can follow to create an IDP configuration, test it, and configure an account with emergency access.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_idp_config`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-idp-config
      operationId: post-idp-config
      requestBody:
        content:
          application/json:
            example:
              enabled: false
              enforce: false
              label: Example IDP
              saml:
                entity_id: https://idp.example.com
                identity_element: USER_ID_ATTRIBUTE
                idp_url: https://idp.example.com/login
                public_certificates:
                - certificate: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                user_id_attribute: EmailAddress
            schema:
              additionalProperties: false
              properties:
                enabled:
                  default: false
                  description: Activates the IDP configuration. When `false`, SSO is not enforced even if `enforce` is set to `true`. Defaults to `false`.
                  example: '{{enabled}}'
                  type: boolean
                enforce:
                  default: false
                  description: Enforces IDP authentication for all users except those listed as [SSO user exceptions](https://techdocs.akamai.com/linode-api/reference/get-idp-config-users-excluded). When `false`, only users designated as [SSO-required users](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-included) are required to use SSO.
                  example: '{{enforce}}'
                  type: boolean
                label:
                  description: The unique IDP configuration's label.
                  example: '{{label}}'
                  type: string
                saml:
                  additionalProperties: false
                  description: The SAML configuration settings provided by an identity provider.
                  properties:
                    entity_id:
                      description: The unique entity identifier (Issuer) of the identity provider.
                      example: https://idp.example.com
                      type: string
                    identity_element:
                      description: 'Specifies which element in the SAML assertion identifies the user:


                        - `NAME_ID`. Uses the SAML `NameID` element.

                        - `USER_ID_ATTRIBUTE`. Uses a specific SAML attribute set in `user_id_attribute`.'
                      enum:
                      - NAME_ID
                      - USER_ID_ATTRIBUTE
                      example: USER_ID_ATTRIBUTE
                      type: string
                    idp_url:
                      description: The SSO login URL provided by the identity provider.
                      example: https://idp.example.com/login
                      format: uri
                      type: string
                    public_certificates:
                      description: Public certificates from the identity provider. You need to provide at least one valid certificate.
                      items:
                        additionalProperties: false
                        properties:
                          certificate:
                            description: The public certificate data from the identity provider used to verify SAML assertion signatures. The `-----BEGIN CERTIFICATE-----` and `-----END CERTIFICATE-----` delimiters are optional.
                            example: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                            type: string
                        required:
                        - certificate
                        type: object
                      minItems: 1
                      type: array
                    user_id_attribute:
                      description: The name of the SAML attribute containing the user's identifier. Required when `identity_element` is `USER_ID_ATTRIBUTE`.
                      example: EmailAddress
                      type: string
                  required:
                  - idp_url
                  - entity_id
                  - identity_element
                  - public_certificates
                  type: object
              required:
              - label
              - saml
              type: object
              x-akamai:
                file-path: schemas/post-idp-config.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2026-03-11T12:00:00'
                created_by: username
                enabled: false
                enforce: false
                excluded_users_count: 0
                id: 7368e7af-e333-43b8-8917-4c7cba153d9d
                included_users_count: 0
                label: Example IDP
                saml:
                  entity_id: https://idp.example.com
                  identity_element: USER_ID_ATTRIBUTE
                  idp_url: https://idp.example.com/login
                  public_certificates:
                  - certificate: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                    created: '2026-03-11T12:00:00'
                    created_by: username
                    id: 1a664bea-993d-4979-b629-858cbbb66aac
                    not_after: '2027-03-11T12:00:00'
                    not_before: '2026-03-11T12:00:00'
                  user_id_attribute: EmailAddress
                updated: null
                updated_by: null
              schema:
                additionalProperties: false
                description: An external identity provider configuration for SAML-based SSO on the account.
                properties:
                  created:
                    description: __Read-only__ When this configuration was created, as a UTC timestamp.
                    example: '2025-07-17T12:00:00'
                    readOnly: true
                    type: string
                  created_by:
                    description: __Read-only__ The username for who created this configuration.
                    example: user1
                    readOnly: true
                    type: string
                  enabled:
                    description: Whether the IDP configuration is active. When `false`, SSO is not enforced even if `enforce` is set to `true`.
                    example: false
                    type: boolean
                  enforce:
                    description: Enforces the IDP authentication for all users except those listed as [SSO user exceptions](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-excluded) list. When `false`, only users designated as [SSO-required users](https://techdocs.akamai.com/linode-api/reference/get-idp-config-users-included) are required to use SSO.
                    example: false
                    type: boolean
                  excluded_users_count:
                    description: __Read-only__ The number of users excluded from logging in with SSO for this configuration. These users are frequently referred to as emergency access accounts and SSO user exceptions. It applies only with `enforce` set to `true`. By default, this list is empty. To update it, run the [Update SSO user exceptions](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-excluded) operation.
                    example: 0
                    readOnly: true
                    type: integer
                  id:
                    description: __Read-only__ The unique identifier of the IDP configuration.
                    example: 7368e7af-e333-43b8-8917-4c7cba153d9d
                    format: uuid
                    readOnly: true
                    type: string
                  included_users_count:
                    description: __Read-only__ The number of users for which the configuration applies when `enforce` is set to `false`. By default, this list is empty. To update it, run the [Update SSO-required users](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-included) operation.
                    example: 2
                    readOnly: true
                    type: integer
                  label:
                    description: The unique IDP configuration's label.
                    example: Example IDP
                    type: string
                  saml:
                    additionalProperties: false
                    description: The SAML configuration settings for an external identity provider.
                    properties:
                      entity_id:
                        description: The unique entity identifier (issuer) of the identity provider, typically a URI.
                        example: https://idp.example.com
                        type: string
                      identity_element:
                        description: 'The element in the SAML assertion that identifies the user.


                          - `NAME_ID`. Uses the SAML `NameID` element.

                          - `USER_ID_ATTRIBUTE`. Uses a specific SAML attribute set in `user_id_attribute`.'
                        enum:
                        - NAME_ID
                        - USER_ID_ATTRIBUTE
                        example: USER_ID_ATTRIBUTE
                        type: string
                      idp_url:
                        description: The identity provider's SSO login URL. Users are redirected here to authenticate.
                        example: https://idp.example.com/login
                        format: uri
                        type: string
                      public_certificates:
                        description: The public certificates from the identity provider used to verify SAML assertion signatures. At least one valid certificate is required.
                        items:
                          additionalProperties: false
                          description: A SAML public certificate associated with an external identity provider configuration.
                          properties:
                            certificate:
                              description: The public certificate data from the identity provider, used to verify SAML assertion signatures. The `-----BEGIN CERTIFICATE-----` and `-----END CERTIFICATE-----` delimiters are optional.
                              example: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                              type: string
                            created:
                              description: __Read-only__ When this certificate was added, as a UTC timestamp.
                              example: '2025-01-24T12:00:00'
                              readOnly: true
                              type: string
                            created_by:
                              description: __Read-only__ The username of the user who added this certificate.
                              example: user1
                              readOnly: true
                              type: string
                            id:
                              description: __Read-only__ The certificate's unique ID.
                              example: 33a0a159-b649-43e5-9ade-e6182b2d5872
                              format: uuid
                              readOnly: true
                              type: string
                            not_after:
                              description: __Read-only__ When this certificate is no longer valid, extracted from certificate string.
                              example: '2025-07-24T12:00:00'
                              readOnly: true
                              type: string
                            not_before:
                              description: __Read-only__ When this certificate starts to be valid, extracted from certificate string.
                              example: '2025-01-24T12:00:00'
                              readOnly: true
                              type: string
                          type: object
                          x-akamai:
                            file-path: schemas/idp-certificate.yaml
                        minItems: 1
                        type: array
                      user_id_attribute:
                        description: The name of the SAML attribute that contains the user's identifier. Required when `identity_element` is `USER_ID_ATTRIBUTE`.
                        example: EmailAddress
                        type: string
                    required:
                    - idp_url
                    - entity_id
                    - identity_element
                    - public_certificates
                    type: object
                    x-akamai:
                      file-path: schemas/idp-saml-config.yaml
                  updated:
                    description: __Read-only__ When this configuration was last updated, as a UTC timestamp. It returns `null` if the configuration was never updated.
                    example: '2025-07-17T12:00:00'
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  updated_by:
                    description: __Read-only__ The username for who last updated this configuration. This is `null` if the configuration was never updated.
                    example: user1
                    readOnly: true
                    type:
                    - string
                    - 'null'
                type: object
                x-akamai:
                  file-path: schemas/idp-config.yaml
          description: IDP configuration created successfully.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      summary: Create an IDP configuration
      tags:
      - IDP configuration
      x-linode-cli-skip: true
      x-linode-grant: add_idp_configs
      x-linode-iam:
      - permissions:
        - create_idp_config
    get:
      description: 'Returns a list of all external identity provider (IDP) configurations for the account. For the initial release, the list contains only a single item.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_idp_config`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-idp-configs
      operationId: get-idp-configs
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2026-03-01T12:00:00'
                  created_by: username
                  enabled: false
                  enforce: false
                  excluded_users_count: 0
                  id: 7368e7af-e333-43b8-8917-4c7cba153d9d
                  included_users_count: 2
                  label: Example IDP
                  saml:
                    entity_id: https://idp.example.com
                    identity_element: USER_ID_ATTRIBUTE
                    idp_url: https://idp.example.com/login
                    public_certificates:
                    - certificate: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                      created: '2026-03-01T12:00:00'
                      created_by: username
                      id: 33a0a159-b649-43e5-9ade-e6182b2d5872
                      not_after: '2027-03-01T12:00:00'
                      not_before: '2026-03-01T12:00:00'
                    - certificate: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                      created: '2026-03-11T12:00:00'
                      created_by: username
                      id: 1a664bea-993d-4979-b629-858cbbb66aac
                      not_after: '2027-03-11T12:00:00'
                      not_before: '2026-03-11T12:00:00'
                    user_id_attribute: EmailAddress
                  updated: '2026-03-01T12:00:00'
                  updated_by: user1
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                description: A paginated list of external identity provider configurations for the account.
                properties:
                  data:
                    description: The list of IDP configurations.
                    items:
                      additionalProperties: false
                      description: An external identity provider configuration for SAML-based SSO on the account.
                      properties:
                        created:
                          description: __Read-only__ When this configuration was created, as a UTC timestamp.
                          example: '2025-07-17T12:00:00'
                          readOnly: true
                          type: string
                        created_by:
                          description: __Read-only__ The username for who created this configuration.
                          example: user1
                          readOnly: true
                          type: string
                        enabled:
                          description: Whether the IDP configuration is active. When `false`, SSO is not enforced even if `enforce` is set to `true`.
                          example: false
                          type: boolean
                        enforce:
                          description: Enforces the IDP authentication for all users except those listed as [SSO user exceptions](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-excluded) list. When `false`, only users designated as [SSO-required users](https://techdocs.akamai.com/linode-api/reference/get-idp-config-users-included) are required to use SSO.
                          example: false
                          type: boolean
                        excluded_users_count:
                          description: __Read-only__ The number of users excluded from logging in with SSO for this configuration. These users are frequently referred to as emergency access accounts and SSO user exceptions. It applies only with `enforce` set to `true`. By default, this list is empty. To update it, run the [Update SSO user exceptions](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-excluded) operation.
                          example: 0
                          readOnly: true
                          type: integer
                        id:
                          description: __Read-only__ The unique identifier of the IDP configuration.
                          example: 7368e7af-e333-43b8-8917-4c7cba153d9d
                          format: uuid
                          readOnly: true
                          type: string
                        included_users_count:
                          description: __Read-only__ The number of users for which the configuration applies when `enforce` is set to `false`. By default, this list is empty. To update it, run the [Update SSO-required users](https://techdocs.akamai.com/linode-api/reference/put-idp-config-users-included) operation.
                          example: 2
                          readOnly: true
                          type: integer
                        label:
                          description: The unique IDP configuration's label.
                          example: Example IDP
                          type: string
                        saml:
                          additionalProperties: false
                          description: The SAML configuration settings for an external identity provider.
                          properties:
                            entity_id:
                              description: The unique entity identifier (issuer) of the identity provider, typically a URI.
                              example: https://idp.example.com
                              type: string
                            identity_element:
                              description: 'The element in the SAML assertion that identifies the user.


                                - `NAME_ID`. Uses the SAML `NameID` element.

                                - `USER_ID_ATTRIBUTE`. Uses a specific SAML attribute set in `user_id_attribute`.'
                              enum:
                              - NAME_ID
                              - USER_ID_ATTRIBUTE
                              example: USER_ID_ATTRIBUTE
                              type: string
                            idp_url:
                              description: The identity provider's SSO login URL. Users are redirected here to authenticate.
                              example: https://idp.example.com/login
                              format: uri
                              type: string
                            public_certificates:
                              description: The public certificates from the identity provider used to verify SAML assertion signatures. At least one valid certificate is required.
                              items:
                                additionalProperties: false
                                description: A SAML public certificate associated with an external identity provider configuration.
                                properties:
                                  certificate:
                                    description: The public certificate data from the identity provider, used to verify SAML assertion signatures. The `-----BEGIN CERTIFICATE-----` and `-----END CERTIFICATE-----` delimiters are optional.
                                    example: MIICODCCAeagAwIBAgIQqHmpBAv+CY9IJF...
                                    type: string
                                  created:
                                    description: __Read-only__ When this certificate was added, as a UTC timestamp.
                                    example: '2025-01-24T12:00:00'
                                    readOnly: true
                                    type: string
                                  created_by:
                                    description: __Read-only__ The username of the user who added this certificate.
                                    example: user1
                                    readOnly: true
                                    type: string
                                  id:
                                    description: __Read-only__ The certificate's unique ID.
                                    example: 33a0a159-b649-43e5-9ade-e6182b2d5872
                                    format: uuid
                                    readOnly: true
                                    type: string
                                  not_after:
                                    description: __Read-only__ When this certificate is no longer valid, extracted from certificate string.
                                    example: '2025-07-24T12:00:00'
                                    readOnly: true
                                    type: string
                                  not_before:
                                    description: __Read-only__ When this certificate starts to be valid, extracted from certificate string.
                                    example: '2025-01-24T12:00:00'
                                    readOnly: true
                                    type: string
                                type: object
                                x-akamai:
                                  file-path: schemas/idp-certificate.yaml
                              minItems: 1
                              type: array
                            user_id_attribute:
                              description: The name of the SAML attribute that contains the user's identifier. Required when `identity_element` is `USER_ID_ATTRIBUTE`.
                              example: EmailAddress
                              type: string
                          required:
                          - idp_url
                          - entity_id
                          - identity_element
                          - public_certificates
                          type: object
                          x-akamai:
                            file-path: schemas/idp-saml-config.yaml
                        updated:
                          description: __Read-only__ When this configuration was last updated, as a UTC timestamp. It returns `null` if the configuration was never updated.
                          example: '2025-07-17T12:00:00'
                          readOnly: true
                          type:
                          - string
                          - 'null'
                        updated_by:
                          description: __Read-only__ The username for who last updated this configuration. This is `null` if the configuration was never updated.
                          example: user1
                          readOnly: true
                          type:
                          - string
                          - 'null'
                      type: object
                      x-akamai:
                        file-path: schemas/idp-config.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/idp-configs.yaml
          description: A paginated list of external identity provider configurations.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
