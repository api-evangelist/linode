  /{apiVersion}/iam/idp-configs/{idpConfigId}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The unique identifier of the external identity provider configuration. This is the `id` value returned by the [List IDP configurations](https://techdocs.akamai.com/linode-api/reference/get-idp-configs) operation.
      example: '{{idpConfigId}}'
      in: path
      name: idpConfigId
      required: true
      schema:
        example: 7368e7af-e333-43b8-8917-4c7cba153d9d
        format: uuid
        type: string
      x-akamai:
        file-path: parameters/idp-config-euuid.yaml
