  title: 'Akamai: Linode Prefix Lists API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- name: Prefix Lists
paths:
  /{apiVersion}/networking/firewalls/{firewallId}/rules/expansion:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: ID of the Firewall to access.
      example: '{{firewallId}}'
      in: path
      name: firewallId
      required: true
      schema:
        example: 9000
        type: integer
      x-akamai:
        file-path: parameters/firewall-id.yaml
    x-akamai:
      file-path: paths/firewall-rules-expansion.yaml
      path-info: /{apiVersion}/networking/firewalls/{firewallId}/rules/expansion
    x-linode-cli-command: firewalls
    get:
      description: 'Returns firewall rules with Rule Sets always expanded to explicit IPs or CIDRs, while Prefix Lists are either retained by name or expanded into the appropriate ipv4 or ipv6 arrays.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `firewall:read_only`


        **CLI**


        ```shell

        linode-cli firewalls rules expansion-view 123

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-expanded-firewall-rules
      operationId: get-expanded-firewall-rules
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: "The inbound and outbound access rules to apply to the firewall. A firewall can contain up to 25 effective rules. This limit includes:\n  - Rules defined directly under inbound and outbound.\n  - All rules contained in any referenced Rule Sets, unless the Rule Set was created by a service account. Referenced Rule Sets may contain one or more rules, and those rules contribute to the firewall’s total rule count.\n\nMultiple rules are applied in order. If two rules conflict, the first rule takes precedence. For example, if the first rule accepts inbound traffic from an address, and the second rule drops inbound traffic the same address, the first rule applies and inbound traffic from that address is accepted."
                properties:
                  fingerprint:
                    description: __Read-only__ The fingerprint is a 32-bit hash. It represents the firewall rules as an 8 character hex string. You can use `fingerprint` to compare rule versions.
                    example: 997dd135
                    readOnly: true
                    type: string
                  inbound:
                    description: The inbound rules for the firewall.
                    items:
                      additionalProperties: false
                      description: One of a Firewall's inbound or outbound access rules. The `ports` property can be used to allow traffic on a comma-separated list of different ports.
                      properties:
                        action:
                          description: Controls whether traffic is accepted or dropped by this rule. Overrides the Firewall's `inbound_policy` if this is an inbound rule, or the `outbound_policy` if this is an outbound rule.
                          enum:
                          - ACCEPT
                          - DROP
                          example: ACCEPT
                          type: string
                        addresses:
                          additionalProperties: false
                          description: 'The explicit IPv4 or IPv6 IPs and CIDRs, and referenced Prefix Lists, affected by this rule. Each rule can include up to 255 addresses or networks across its `ipv4` and `ipv6` arrays. Both networks and individual IPs count equally toward this limit.


                            Must contain `ipv4`, `ipv6`, or both.'
                          properties:
                            ipv4:
                              description: 'The names of the Prefix Lists with IPv4 CIDRs referenced in this rule, as well as IPv4 addresses or networks in IP/mask format. The `zone_id` notation described in [RFC 4007](https://www.rfc-editor.org/rfc/rfc4007) is not supported. Must not be an empty list.


                                If `0.0.0.0/0` is included in this list, all IPv4 addresses are affected by this rule.'
                              example:
                              - 192.0.2.0/24
                              - 198.51.100.2/32
                              - pl::vpcs:1234
                              - pl::vpcs:<current>
                              items:
                                type: string
                              minItems: 1
                              type: array
                            ipv6:
                              description: 'The names of the Prefix Lists with IPv6 CIDRs referenced in this rule, as well as IPv6 addresses or networks in IP/mask format. The `zone_id` notation described in [RFC 4007](https://www.rfc-editor.org/rfc/rfc4007) is not supported. Must not be an empty list.


                                If `::/0` is included in this list, all IPv6 addresses are affected by this rule.'
                              example:
                              - 2001:DB8::/128
                              - pl::vpcs:1234
                              - pl::vpcs:<current>
                              items:
                                type: string
                              type: array
                          type: object
                        description:
                          description: Used to describe this rule. For display purposes only.
                          example: An example firewall rule description.
                          maxLength: 100
                          minLength: 1
                          type: string
                        label:
                          description: Used to identify this rule. For display purposes only.
                          example: firewallrule123
                          maxLength: 32
                          minLength: 3
                          type: string
                        ports:
                          description: 'A string representing the port or ports affected by this rule:


                            - The string may be a single port, a range of ports, or a comma-separated list of single ports and port ranges. A space is permitted following each comma.

                            - A range of ports is inclusive of the start and end values for the range. The end value of the range must be greater than the start value.

                            - Ports must be within 1 and 65535, and may not contain any leading zeroes. For example, port `080` is not allowed.

                            - The ports string can have up to 15 _pieces_, where a single port is treated as one piece, and a port range is treated as two pieces. For example, the string "22-24, 80, 443" has four pieces.

                            - If no ports are configured, all ports are affected.

                            - Only allowed for the TCP and UDP protocols. Ports are not allowed for the ICMP and IPENCAP protocols.'
                          example: 22-24, 80, 443
                          type:
                          - string
                          - 'null'
                        protocol:
                          description: The type of network traffic affected by this rule.
                          enum:
                          - TCP
                          - UDP
                          - ICMP
                          - IPENCAP
                          example: TCP
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/firewall-rule-config-prefixlist-expanded.yaml
                    type: array
                    x-linode-cli-format: json
                  inbound_policy:
                    description: The default behavior for inbound traffic. You can override this setting by [updating](https://techdocs.akamai.com/linode-api/reference/put-firewall-rules) the `inbound.action` property of the Firewall Rule.
                    enum:
                    - ACCEPT
                    - DROP
                    example: DROP
                    type: string
                  outbound:
                    description: The outbound rules for the firewall.
                    items:
                      additionalProperties: false
                      description: One of a Firewall's inbound or outbound access rules. The `ports` property can be used to allow traffic on a comma-separated list of different ports.
                      properties:
                        action:
                          description: Controls whether traffic is accepted or dropped by this rule. Overrides the Firewall's `inbound_policy` if this is an inbound rule, or the `outbound_policy` if this is an outbound rule.
                          enum:
                          - ACCEPT
                          - DROP
                          example: ACCEPT
                          type: string
                        addresses:
                          additionalProperties: false
                          description: 'The explicit IPv4 or IPv6 IPs and CIDRs, and referenced Prefix Lists, affected by this rule. Each rule can include up to 255 addresses or networks across its `ipv4` and `ipv6` arrays. Both networks and individual IPs count equally toward this limit.


                            Must contain `ipv4`, `ipv6`, or both.'
                          properties:
                            ipv4:
                              description: 'The names of the Prefix Lists with IPv4 CIDRs referenced in this rule, as well as IPv4 addresses or networks in IP/mask format. The `zone_id` notation described in [RFC 4007](https://www.rfc-editor.org/rfc/rfc4007) is not supported. Must not be an empty list.


                                If `0.0.0.0/0` is included in this list, all IPv4 addresses are affected by this rule.'
                              example:
                              - 192.0.2.0/24
                              - 198.51.100.2/32
                              - pl::vpcs:1234
                              - pl::vpcs:<current>
                              items:
                                type: string
                              minItems: 1
                              type: array
                            ipv6:
                              description: 'The names of the Prefix Lists with IPv6 CIDRs referenced in this rule, as well as IPv6 addresses or networks in IP/mask format. The `zone_id` notation described in [RFC 4007](https://www.rfc-editor.org/rfc/rfc4007) is not supported. Must not be an empty list.


                                If `::/0` is included in this list, all IPv6 addresses are affected by this rule.'
                              example:
                              - 2001:DB8::/128
                              - pl::vpcs:1234
                              - pl::vpcs:<current>
                              items:
                                type: string
                              type: array
                          type: object
                        description:
                          description: Used to describe this rule. For display purposes only.
                          example: An example firewall rule description.
                          maxLength: 100
                          minLength: 1
                          type: string
                        label:
                          description: Used to identify this rule. For display purposes only.
                          example: firewallrule123
                          maxLength: 32
                          minLength: 3
                          type: string
                        ports:
                          description: 'A string representing the port or ports affected by this rule:


                            - The string may be a single port, a range of ports, or a comma-separated list of single ports and port ranges. A space is permitted following each comma.

                            - A range of ports is inclusive of the start and end values for the range. The end value of the range must be greater than the start value.

                            - Ports must be within 1 and 65535, and may not contain any leading zeroes. For example, port `080` is not allowed.

                            - The ports string can have up to 15 _pieces_, where a single port is treated as one piece, and a port range is treated as two pieces. For example, the string "22-24, 80, 443" has four pieces.

                            - If no ports are configured, all ports are affected.

                            - Only allowed for the TCP and UDP protocols. Ports are not allowed for the ICMP and IPENCAP protocols.'
                          example: 22-24, 80, 443
                          type:
                          - string
                          - 'null'
                        protocol:
                          description: The type of network traffic affected by this rule.
                          enum:
                          - TCP
                          - UDP
                          - ICMP
                          - IPENCAP
                          example: TCP
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/firewall-rule-config-prefixlist-expanded.yaml
                    type: array
                    x-linode-cli-format: json
                  outbound_policy:
                    description: The default behavior for outbound traffic. You can override this setting by [updating](https://techdocs.akamai.com/linode-api/reference/put-firewall-rules) the `outbound.action` property of the Firewall Rule.
                    enum:
                    - ACCEPT
                    - DROP
                    example: DROP
                    type: string
                  version:
                    description: __Read-only__ The firewall's rule version. The first version is `1`. The version number increments when the firewall's rules change.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
              x-example:
                x-ref: ../examples/prefixlists-200.json
              x-linode-cli-subtables:
              - inbound
              - outbound
          description: IPv4 and IPv6 IPs, CIDRs, or Prefix List names affected by this rule, organized into arrays for `ipv4` and `ipv6`.
        default:
          content:
            application/json:
