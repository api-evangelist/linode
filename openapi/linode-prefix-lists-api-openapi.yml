  /{apiVersion}/networking/prefixlists:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/prefixlists.yaml
      path-info: /{apiVersion}/networking/prefixlists
    x-linode-cli-command: prefixlists
    get:
      description: 'Returns a paginated list of Prefix Lists.


        Prefix Lists are named lists of CIDRs that can represent subnets, VPCs, data center DNS resolvers, or other service endpoints. Cloud Firewall rules reference Prefix Lists, and any updates to a Prefix List automatically apply to all rules that use it.


        Prefix List names start with `pl` and follow this format: `pl:{scope}:{list}:{key}`


        - **{scope}**: Can be blank (account-level scope) or set to `system` (platform-wide scope).

        - Prefix Lists with a blank scope must be unique within each account. For example, you can have different `pl::foo:bar` Prefix Lists in separate accounts. Prefix List names starting with `pl::` are always private.

        - Prefix Lists with `system` as the scope must be unique across the entire platform. For example, only one `pl:system:foo:bar` can exist platform-wide. Prefix List names starting with `pl:system:` are visible to all enabled customers on the platform.

        - **{list}**: Represents the platform service, such as `vpcs`.

        - **{key}**: Identifies the specific instance of the service element with endpoint addresses to be accessed. You may further subdivide {key} (e.g., adding `:staging` or `:test`).


        Special Prefix List names include `pl::vpcs:` and `pl::subnets:`. These are generated Prefix Lists that provide access to VPC or VPC subnet perimeter addresses. When used in firewall rules for IPv4 or IPv6 addresses and applied to a VPC interface, the Prefix List automatically adds the CIDRs for the VPC or VPC subnet perimeter to control access to the interface.


        **Examples of Prefix List names:**

        - VPC:

        - `pl::vpcs:{vpc_id}` (e.g., `pl::vpcs:101`)

        - `pl::subnets:{subnet_id}` (e.g., `pl::subnets:202`)

        - Special Prefix Lists:

        - `pl::vpcs:`

        - `pl::subnets:`

        - Object Storage:

        - `pl:system:object-storage:{region}` (e.g., `pl:system:object-storage:us-iad`)

        - `pl:system:object-storage:{region}:staging` (e.g., `pl:system:object-storage:no-osl-1:staging`)

        - DNS:

        - `pl:system:resolvers:{region}` (e.g., `pl:system:resolvers:us-iad`)

        - `pl:system:resolvers:{region}:staging` (e.g., `pl:system:resolvers:no-osl-1:staging`)


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `firewall:read_only`


        **CLI**


        ```shell

        linode-cli prefixlists list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-prefixlists
      operationId: get-prefixlists
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      description: A Prefix List that can be referenced in firewall rules.
                      properties:
                        created:
                          description: __Read-only__ When this Prefix List was created.
                          example: '2025-09-01T00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                          x-linode-cli-display: 8
                        deleted:
                          description: __Read-only__ If there are no references to the Prefix List, it is deleted immediately. If there are references to the Prefix List, it is marked for deletion.  When the last reference is removed, the Prefix List is deleted.
                          example: null
                          format: date-time
                          readOnly: true
                          type:
                          - string
                          - 'null'
                          x-linode-cli-display: 11
                        description:
                          description: Description of what the list includes.
                          example: Resolver access control list for us-iad (staging)
                          maxLength: 255
                          minLength: 0
                          type: string
                          x-linode-cli-display: 5
                        id:
                          description: __Read-only__ The Prefix List's unique ID.
                          example: 123
                          readOnly: true
                          type: integer
                          x-linode-cli-display: 9
                        ipv4:
                          description: IPv4 CIDR list.
                          items:
                            example:
                            - 10.0.0.0/16
                            - 10.4.0.0/16
                            format: ipv4-cidr
                            type: string
                          type:
                          - array
                          - 'null'
                        ipv6:
                          description: IPv6 CIDR list.
                          items:
                            example:
                            - 2001:db8:0:200::/56
                            format: ipv6-cidr
                            type: string
                          type:
                          - array
                          - 'null'
                        name:
                          description: __Filterable__ The Prefix List `name` that begins with either `pl:system:` or `pl::`.
                          example: pl::vpcs:24
                          maxLength: 150
                          minLength: 1
                          pattern: ^pl:(system)?:[A-Za-z0-9-:]+$
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        updated:
                          description: __Read-only__ When the Prefix List was last updated.
                          example: '2025-09-01 00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                          x-linode-cli-display: 10
                        version:
                          description: __Read-only__ The Prefix List version. The first version is `1`. The version number increments when the Prefix List updates.
                          example: 1
                          readOnly: true
                          type: integer
                        visibility:
                          default: private
                          description: A `private` Prefix List is visible only to you. A `public` Prefix List is visible to everyone.
                          enum:
                          - private
                          - public
                          example: private
                          type: string
                          x-linode-cli-display: 3
                      required:
                      - name
                      - visibility
                      type: object
                      x-akamai:
                        file-path: schemas/prefixlists.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-prefixlists-200.yaml
              x-example:
                x-ref: ../examples/prefixlists-200.json
          description: A paginated list of Prefix Lists.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - firewall:read_only
      summary: List Prefix Lists
      tags:
      - Prefix Lists
      x-akamai:
        tabs:
        - syntax: linode-cli prefixlists list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
