                          example: ''
                          readOnly: true
                          type: string
                          x-linode-cli-display: 9
                        ssl_fingerprint:
                          description: __Read-only__ Not applicable for UDP configs.
                          example: ''
                          readOnly: true
                          type: string
                          x-linode-cli-display: 10
                        ssl_key:
                          description: __Read-only__ Not applicable for UDP configs.
                          example: null
                          readOnly: true
                          type:
                          - string
                          - 'null'
                        stickiness:
                          default: session
                          description: 'Controls how session stickiness is handled on this port.


                            - If set to `none`, connections are assigned a backend server based on the algorithm configured.

                            - If set to `session`, all packets with the same session identifiers are routed to the same backend server. Two packets are considered part of the same session if they share the same source and destination IP addresses or ports, and are received within a short time window.

                            - If set to `source_ip`, the NodeBalancer uses the client''s source IP address to route all packets from the same client to the same backend server.'
                          enum:
                          - none
                          - session
                          - source_ip
                          example: none
                          type: string
                          x-linode-cli-display: 5
                        udp_check_port:
                          default: 80
                          description: UDP NodeBalancers use TCP and HTTP active health checks to ensure back-end nodes can receive traffic. You can specify the health check port that the backend node listens on, which may differ from the UDP port used to serve traffic.
                          example: 5795
                          maximum: 65535
                          minimum: 1
                          type: integer
                          x-linode-cli-display: 6
                        udp_session_timeout:
                          default: 16
                          description: __Read-only__ The maximum duration in seconds, a UDP session can be idle before it is closed.
                          example: 2
                          maximum: 300
                          minimum: 1
                          readOnly: true
                          type: integer
