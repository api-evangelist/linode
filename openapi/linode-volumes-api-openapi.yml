openapi: 3.2.0
info:
  title: Linode Volumes API
  version: '1.0'
  description: 'Operations tagged Volumes across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: The Block Storage service lets you add additional storage drives to Linodes, to store more data without resizing your Linode to a larger plan. These storage drives, called volumes, can be formatted with any Linux-compatible file system and attached and mounted to a Linode.
  name: Volumes
paths:
  /{apiVersion}/volumes:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/volumes.yaml
      path-info: /{apiVersion}/volumes
    x-linode-cli-command: volumes
    post:
      description: 'Creates a Block Storage volume on your account. Creating a new volume accrues additional charges on your account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_volume`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `volumes:read_write`


        **CLI**


        ```shell

        linode-cli volumes create \

        --label my-volume \

        --size 20 \

        --linode_id 12346 \

        --no-defaults

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-volume
      operationId: post-volume
      requestBody:
        content:
          application/json:
            example:
              config_id: 23456
              encryption: enabled
              label: Video-file-storage
              linode_id: 12346
              region: us-iad
              size: 30
              tags:
              - blk-stg-volume-1
              - videos-storage
            schema:
              additionalProperties: false
              properties:
                config_id:
                  description: 'When creating a volume attached to a Linode, this is the identifier of the Linode configuration profile (config) where the volume will live. Run the [List configuration profiles](https://techdocs.akamai.com/linode-api/reference/get-linode-configs) operation and store the `id` for the applicable config. The following apply when adding a `config_id`:


                    - The selected config needs to belong to the Linode referenced by `linode_id` in this request.


                    - You can''t provide a `config_id` if you don''t also provide a `linode_id` in the request.


                    - If you send a `linode_id` without a `config_id`, the API attaches the volume to that Linode''s last used config, or to the only config in that Linode. If there isn''t a config available for attachment, the API returns an error.'
                  example: '{{config_id}}'
                  type: integer
                encryption:
                  default: enabled
                  description: 'Sets the disk encryption status for a volume, either `enabled` or `disabled`. When you create a new volume, disk encryption is enabled by default. Full disk encryption ensures the data stored on a Block Storage volume drive is secure. It protects against unauthorized access by keeping the data encrypted if the volume drive is removed from the data center, decommissioned, or disposed of. The platform automatically manages the encryption and decryption process for you. You can use an encrypted volume the same way you use a non-encrypted volume.


                    > 📘

                    >

                    > You can only set disk encryption status when creating a new Block Storage volume. After you create a volume, you can''t change its encryption setting.'
                  enum:
                  - enabled
                  - disabled
                  example: '{{encryption}}'
                  type: string
                label:
                  description: The name of the volume. A `label` can be up to 32 characters long and contain alphanumeric characters, hyphens, and underscores. This value is also used in the volume's `filesystem_path`.
                  example: '{{label}}'
                  maxLength: 32
                  minLength: 1
                  pattern: ^[a-zA-Z]((?!--|__)[a-zA-Z0-9-_])+$
                  type: string
                linode_id:
                  description: The Linode this volume should be attached to after it's created. If not given, the volume will be created without an attachment.
                  example: '{{linode_id}}'
                  type: integer
                region:
                  description: The region where the API deploys the volume. This is only required if you didn't provide a `linode_id` for the volume.
                  example: '{{region}}'
                  type:
                  - string
                  - 'null'
                size:
                  default: 20
                  description: The initial size of this volume, in GB. Volumes can only be resized after the creation completes.
                  example: '{{size}}'
                  type: integer
                tags:
                  description: __Filterable__ Any tags applied to this object. Use [tags](https://techdocs.akamai.com/linode-api/reference/post-tag) to label and organize your cloud computing resources.
                  example:
                  - example tag
                  - another example
                  items:
                    type: string
                  type: array
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-filterable: true
              required:
              - label
              type: object
              x-akamai:
                file-path: schemas/added-post-volume.yaml
        required: true
        x-linode-cli-allowed-defaults:
        - region
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2025-01-01T00:01:01'
                encryption: enabled
                filesystem_path: /dev/disk/by-id/scsi-0Linode_Volume_my-volume
                hardware_type: nvme
                id: 12345
                io_ready: true
                label: Video-file-storage
                linode_id: 12346
                linode_label: linode123
                region: us-iad
                size: 30
                status: active
                tags:
                - blk-stg-volume-1
                - videos-storage
                updated: '2025-01-01T00:01:01'
              schema:
                additionalProperties: false
                description: A newly created Block Storage volume on your account.
                properties:
                  created:
                    description: __Read-only__ When this volume was created.
                    example: '2025-01-01T00:01:01'
                    readOnly: true
                    type: string
                  encryption:
                    description: __Read-only__ Indicates whether encryption is `enabled` or `disabled` on this volume.
                    enum:
                    - enabled
                    - disabled
                    example: enabled
                    readOnly: true
                    type: string
                    x-linode-cli-display: 8
                  filesystem_path:
                    description: __Read-only__ The full file system path for the volume, based on its `label`. The path is `/dev/disk/by-id/scsi-0Linode_Volume_label`.
                    example: /dev/disk/by-id/scsi-0Linode_Volume_my-volume
                    readOnly: true
                    type: string
                  hardware_type:
                    description: __Read-only__ The storage type of this volume. This can be either `hdd` to emulate a hard disk drive for the volume, or `nvme` to emulate a non-volatile memory express solid state drive.
                    enum:
                    - hdd
                    - nvme
                    example: nvme
                    readOnly: true
                    type: string
                  id:
                    description: __Read-only__ The unique identifier for the volume.
                    example: 12345
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  io_ready:
                    description: __Read-only__ Indicates whether the volume is successfully attached to a Linode and ready for read and write operations.
                    example: true
                    readOnly: true
                    type: boolean
                  label:
                    description: __Filterable__ The name of the volume. A `label` can be up to 32 characters long and contain alphanumeric characters, hyphens, and underscores. This value is also used in the volume's `filesystem_path`.
                    example: my-volume
                    maxLength: 32
                    minLength: 1
                    pattern: ^[a-zA-Z]((?!--|__)[a-zA-Z0-9-_])+$
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  linode_id:
                    description: The unique identifier of the Linode this volume is attached to, if applicable.
                    example: 12346
                    type:
                    - integer
                    - 'null'
                    x-linode-cli-display: 6
                  linode_label:
                    description: __Read-only__ The name of the Linode this volume is attached to, if applicable.
                    example: linode123
                    readOnly: true
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 7
                  region:
                    description: The unique identifier for the region where the volume lives.
                    example: us-iad
                    type: string
                    x-linode-cli-display: 5
                  size:
                    description: The volume's size, in gigabytes.
                    example: 30
                    maximum: 10240
                    type: integer
                    x-linode-cli-display: 4
                  status:
                    description: '__Read-only__ The current status of the volume. This can be one of:


                      - `creating`. The API is creating the volume and it''s not ready for use.


                      - `active`. The volume is online and ready for use.


                      - `resizing`. The volume''s capacity is being upgraded.


                      - `key_rotating`. The volume''s encryption keys are being rotated to new values. Requests to resize, delete, or clone a volume fail during encryption key rotation.'
                    enum:
                    - creating
                    - active
                    - resizing
                    - key_rotating
                    example: active
                    readOnly: true
                    type: string
                    x-linode-cli-color:
                      active: green
                      contact_support: red
                      default_: yellow
                    x-linode-cli-display: 3
                  tags:
                    description: __Filterable__ Any tags applied to this object. Use [tags](https://techdocs.akamai.com/linode-api/reference/post-tag) to label and organize your cloud computing resources.
                    example:
                    - example tag
                    - another example
                    items:
                      type: string
                    type: array
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  updated:
                    description: __Read-only__ When this volume was last updated.
                    example: '2025-01-01T00:01:01'
                    readOnly: true
                    type: string
                title: Volume
                type: object
                x-akamai:
                  file-path: schemas/post-volume.yaml
          description: Creating volume.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - volumes:read_write
      summary: Create a volume
      tags:
      - Volumes
      x-akamai:
        tabs:
        - syntax: "linode-cli volumes create \\\n  --label my-volume \\\n  --size 20 \\\n  --linode_id 12346 \\\n  --no-defaults"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-charge: true
      x-linode-cli-action: create
      x-linode-grant: add_volumes
      x-linode-iam:
      - permissions:
        - create_volume
    get:
      description: 'Returns a paginated list of the Block Storage volumes that you have permission to view.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_volume`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `volumes:read_only`


        **CLI**


        ```shell

        linode-cli volumes list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-volumes
      operationId: get-volumes
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2025-01-01T00:01:01'
                  encryption: enabled
                  filesystem_path: /dev/disk/by-id/scsi-0Linode_Volume_my-volume
                  hardware_type: nvme
                  id: 12345
                  io_ready: true
                  label: Video-file-storage
                  linode_id: 12346
                  linode_label: linode123
                  locks:
                  - cannot_delete
                  region: us-iad
                  size: 30
                  status: active
                  tags:
                  - blk-stg-volume-1
                  - videos-storage
                  updated: '2025-01-01T00:01:01'
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: A Block Storage volume on your account.
                      properties:
                        created:
                          description: __Read-only__ When this volume was created.
                          example: '2025-01-01T00:01:01'
                          readOnly: true
                          type: string
                        encryption:
                          description: __Read-only__ Indicates whether encryption is `enabled` or `disabled` on this volume.
                          enum:
                          - enabled
                          - disabled
                          example: enabled
                          readOnly: true
                          type: string
                          x-linode-cli-display: 8
                        filesystem_path:
                          description: __Read-only__ The full file system path for the volume, based on its `label`. The path is `/dev/disk/by-id/scsi-0Linode_Volume_label`.
                          example: /dev/disk/by-id/scsi-0Linode_Volume_my-volume
                          readOnly: true
                          type: string
                        hardware_type:
                          description: __Read-only__ The storage type of this volume. This can be either `hdd` to emulate a hard disk drive for the volume, or `nvme` to emulate a non-volatile memory express solid state drive.
                          enum:
                          - hdd
                          - nvme
                          example: nvme
                          readOnly: true
                          type: string
                        id:
                          description: __Read-only__ The unique identifier for the volume.
                          example: 12345
                          readOnly: true
                          type: integer
                          x-linode-cli-display: 1
                        io_ready:
                          description: __Read-only__ Indicates whether the volume is successfully attached to a Linode and ready for read and write operations.
                          example: true
                          readOnly: true
                          type: boolean
                        label:
                          description: __Filterable__ The name of the volume. A `label` can be up to 32 characters long and contain alphanumeric characters, dashes, and underscores. This value is also used in the volume's `filesystem_path`.
                          example: my-volume
                          maxLength: 32
                          minLength: 1
                          pattern: ^[a-zA-Z]((?!--|__)[a-zA-Z0-9-_])+$
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        linode_id:
                          description: The unique identifier of the Linode this volume is attached to, if applicable.
                          example: 12346
                          type:
                          - integer
                          - 'null'
                          x-linode-cli-display: 6
                        linode_label:
                          description: __Read-only__ The name of the Linode this volume is attached to, if applicable.
                          example: linode123
                          readOnly: true
                          type:
                          - string
                          - 'null'
                          x-linode-cli-display: 7
                        locks:
                          description: '__Beta__ A resource lock applied to the Block Storage volume. You can optionally [set up this lock](https://techdocs.akamai.com/linode-api/reference/post-resource-lock) to prevent you from inadvertently deleting the volume. Supported values here include:


                            - `cannot_delete`. The volume itself can''t be deleted. Any sub-resources assigned to it can be freely deleted. You need to unlock the volume by [deleting its lock](https://techdocs.akamai.com/linode-api/reference/delete-resource-lock) to delete the volume.


                            - `cannot_delete_with_subresources`.  The volume and various sub-resources assigned to it can''t be deleted. For example, if a volume has a configuration profile interface assigned to it, this lock prevents you from deleting either of them. You need to unlock the resource (the volume) by deleting its lock. Then you can delete the volume and any of its sub-resources.


                            - **Empty**. The volume doesn''t have a resource lock configured. This is also empty when you clone a volume, because resource lock settings aren''t carried to the cloned volume.


                            > 📘

                            >

                            > This array appears for a volume only if you call this operation using the `v4beta` path parameter in the URL.'
                          example:
                          - cannot_delete
                          items:
                            enum:
                            - cannot_delete
                            - cannot_delete_with_subresources
                            type: string
                          type: array
                          x-akamai:
                            status: BETA
                        region:
                          description: The unique identifier for the region where the volume lives.
                          example: us-iad
                          type: string
                          x-linode-cli-display: 5
                        size:
                          description: The volume's size, in gigabytes.
                          example: 30
                          maximum: 10240
                          type: integer
                          x-linode-cli-display: 4
                        status:
                          description: '__Read-only__ The current status of the volume. This can be one of:


                            - `creating`. The API is creating the volume and it''s not ready for use.


                            - `active`. The volume is online and ready for use.


                            - `resizing`. The volume''s capacity is being upgraded.


                            - `key_rotating`. The volume''s encryption keys are being rotated to new values. Requests to resize, delete, or clone a volume fail during encryption key rotation.'
                          enum:
                          - creating
                          - active
                          - resizing
                          - key_rotating
                          example: active
                          readOnly: true
                          type: string
                          x-linode-cli-color:
                            active: green
                            contact_support: red
                            default_: yellow
                          x-linode-cli-display: 3
                        tags:
                          description: __Filterable__ Any tags applied to this object. Use [tags](https://techdocs.akamai.com/linode-api/reference/post-tag) to label and organize your cloud computing resources.
                          example:
                          - blk-stg-volume-1
                          - videos-storage
                          items:
                            type: string
                          type: array
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        updated:
                          description: __Read-only__ When this volume was last updated.
                          example: '2025-01-01T00:01:01'
                          readOnly: true
                          type: string
                      title: Volume
                      type: object
                      x-akamai:
                        file-path: schemas/volume.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/volumes.yaml
          description: The Block Storage volumes on your account are returned.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - volumes:read_only
      summary: List volumes
      tags:
      - Volumes
      x-akamai:
        tabs:
        - syntax: linode-cli volumes list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action:
      - list
      - ls
      x-linode-grant: read_only
      x-linode-iam:
      - permissions:
        - view_volume
    servers:
    - url: https://api.linode.com
  /{apiVersion}/volumes/{volumeId}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The unique identifier for the target volume. Run the [List volumes](https://techdocs.akamai.com/linode-api/reference/get-volumes) operation and store the `id` for the target volume as your `volumeId`.
      example: '{{volumeId}}'
      in: path
      name: volumeId
      required: true
      schema:
        example: 251
        type: integer
      x-akamai:
        file-path: parameters/volume-id.yaml
    x-akamai:
      file-path: paths/volume.yaml
      path-info: /{apiVersion}/volumes/{volumeId}
    x-linode-cli-command: volumes
    get:
      description: 'Get information about a specific Block Storage volume.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_volume`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `volumes:read_only`


        **CLI**


        ```shell

        linode-cli volumes view 12345

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-volume
      operationId: get-volume
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2025-01-01T00:01:01'
                encryption: enabled
                filesystem_path: /dev/disk/by-id/scsi-0Linode_Volume_my-volume
                hardware_type: nvme
                id: 12345
                io_ready: true
                label: my-volume
                linode_id: 12346
                linode_label: linode123
                locks:
                - cannot_delete
                region: us-iad
                size: 30
                status: active
                tags:
                - blk-stg-volume-1
                - videos-storage
                updated: '2025-01-01T00:01:01'
              schema:
                additionalProperties: false
                description: A Block Storage volume on your account.
                properties:
                  created:
                    description: __Read-only__ When this volume was created.
                    example: '2025-01-01T00:01:01'
                    readOnly: true
                    type: string
                  encryption:
                    description: __Read-only__ Indicates whether encryption is `enabled` or `disabled` on this volume.
                    enum:
                    - enabled
                    - disabled
                    example: enabled
                    readOnly: true
                    type: string
