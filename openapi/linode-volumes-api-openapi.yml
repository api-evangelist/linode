components:
  schemas:
    PaginatedVolumeList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Volume'
    Volume:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this volume.
        label:
          type: string
          description: The label of this volume.
        status:
          type: string
          enum:
          - creating
          - active
          - resizing
          - deleting
          description: The current status of this volume.
        size:
          type: integer
          description: The size of this volume in GB.
        region:
          type: string
          description: The region where this volume is located.
        linode_id:
          type: integer
          description: The ID of the Linode this volume is attached to, or null.
        linode_label:
          type: string
          description: The label of the Linode this volume is attached to.
        filesystem_path:
          type: string
          description: The filesystem path for this volume on the attached Linode.
        tags:
          type: array
          items:
            type: string
          description: Tags for this volume.
        created:
          type: string
          format: date-time
          description: When this volume was created.
        updated:
          type: string
          format: date-time
          description: When this volume was last updated.
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: The current page number.
        pages:
          type: integer
          description: The total number of pages.
        results:
          type: integer
          description: The total number of results.
    VolumeRequest:
      type: object
      required:
      - label
      - size
      - region
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 32
          description: The label for the new volume.
        size:
          type: integer
          minimum: 10
          maximum: 10240
          description: The size of the volume in GB.
        region:
          type: string
          description: The region to create the volume in.
        linode_id:
          type: integer
          description: A Linode instance to attach the volume to.
        tags:
          type: array
          items:
            type: string
          description: Tags for the new volume.
    VolumeUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 32
          description: The new label for the volume.
        tags:
          type: array
          items:
            type: string
          description: Updated tags for the volume.
  parameters:
    pageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 25
        maximum: 500
        default: 100
      description: The number of items per page.
    volumeIdParam:
      name: volumeId
      in: path
      required: true
      schema:
        type: integer
      description: The ID of the volume.
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: The page number to return.
