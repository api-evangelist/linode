paths:
  /{apiVersion}/account/oauth-clients/{clientId}/thumbnail:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The OAuth Client ID to look up.
      example: '{{clientId}}'
      in: path
      name: clientId
      required: true
      schema:
        type: string
      x-akamai:
        file-path: parameters/client-id-path-ecf807fb.yaml
    x-akamai:
      file-path: paths/thumbnail.yaml
      path-info: /{apiVersion}/account/oauth-clients/{clientId}/thumbnail
    x-linode-cli-command: account
    get:
      description: Returns the PNG thumbnail for this OAuth client. This is a publicly viewable operation, and you can access it without authentication.
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-client-thumbnail
      operationId: get-client-thumbnail
      responses:
        '200':
          content:
            image/png:
              schema:
                format: binary
                type: string
          description: The client's thumbnail.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      summary: Get the OAuth client's thumbnail
      tags:
      - OAuth client
      x-linode-cli-action: client-thumbnail
      x-linode-cli-skip: true
    put:
      description: 'Upload a thumbnail for a client you own. You need to upload a PNG image file that the Linode API returns when the thumbnail is retrieved. This image is publicly viewable.


        >


        ---


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-client-thumbnail
      operationId: put-client-thumbnail
      requestBody:
        content:
          image/png:
            schema:
              format: binary
              type: string
        description: The image to set as the thumbnail.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/get-client-thumbnail-200.json
          description: Thumbnail updated successfully.
        default:
