                    inbound:
                    - linode_id: 123
                    outbound:
                    - linode_id: 456
                  placement_group_policy: strict
                  placement_group_type: anti_affinity:local
                  region: us-mia
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      properties:
                        id:
                          description: The placement group's ID. You need to provide it for all operations that affect it.
                          example: 528
                          type: integer
                          x-linode-cli-display: 1
                        is_compliant:
                          description: 'Whether all of the Linodes in your placement group are compliant. If `true`, all Linodes meet either the grouped-together or spread-apart model, which you determine through your selected `placement_group_type`. If `false`, a Linode isn''t compliant. For example, assume you''ve set `anti_affinity:local` as your `placement_group_type` and your group already has three qualifying Linodes on separate hosts, to support the spread-apart model. If a fourth Linode is assigned that''s on the same host as one of the existing three, the placement group is non-compliant. Enforce compliance in your group by setting a `placement_group_policy`.


                            > 📘

                            >

                            > Fixing compliance is not self-service. You need to wait for our assistance to physically move Linodes to make the group compliant again.'
                          example: true
                          type: boolean
                        label:
                          description: '__Filterable__ The unique name set for the placement group. A label has these constraints:


                            - It needs to begin and end with an alphanumeric character.

                            - It can only consist of alphanumeric characters, hyphens (`-`), underscores (`_`), or periods (`.`).'
                          example: PG_Miami_failover
                          minLength: 1
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 1
                          x-linode-filterable: true
                        members:
