                          example: 528
                          type: integer
                          x-linode-cli-display: 1
                        is_compliant:
                          description: 'Whether all of the compute instances in your placement group are compliant. If `true`, all compute instances meet either the grouped-together or spread-apart model, which you determine through your selected `placement_group_type`. If `false`, a compute instance is out of this compliance. For example, assume you''ve set `anti-affinity:local` as your `placement_group_type` and your group already has three qualifying compute instances on separate hosts, to support the spread-apart model. If a fourth compute instance is assigned that''s on the same host as one of the existing three, the placement group is non-compliant. Enforce compliance in your group by setting a `placement_group_policy`.


                            > 📘

                            >

                            > Fixing compliance is not self-service. You need to wait for our assistance to physically move compute instances to make the group compliant again.'
                          example: true
                          type: boolean
                        label:
                          description: '__Filterable__ The unique name set for the placement group. A label has these constraints:


                            - It needs to begin and end with an alphanumeric character.

                            - It can only consist of alphanumeric characters, hyphens (`-`), underscores (`_`) or periods (`.`).'
                          example: PG_Miami_failover
                          minLength: 1
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 1
                          x-linode-filterable: true
                        members:
                          description: An array of compute instances included in the placement group.
                          items:
                            additionalProperties: false
                            properties:
                              is_compliant:
                                description: The compliance status of each individual compute instance in the placement group.
                                example: true
                                type: boolean
                              linode_id:
                                description: __Read-only__ The unique identifier for a compute instance included in the placement group.
                                example: 123
                                readOnly: true
                                type: integer
                            type: object
                          type: array
                        migrations:
                          additionalProperties: false
                          description: Any compute instances that are being migrated to or from the placement group. Returned as `null` if no migrations are taking place.
                          properties:
                            inbound:
                              description: The individual compute instances the system is migrating into the placement group.
                              items:
