openapi: 3.2.0
info:
  title: Linode Placement groups API
  version: '1.0'
  description: 'Operations tagged Placement groups across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: Use a placement group to distribute your Linodes within a core compute region. Depending on your needs, you can group them together to reduce latency or spread them apart to promote high-availability.
  name: Placement groups
paths:
  /{apiVersion}/placement/groups:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/placement-groups.yaml
      path-info: /{apiVersion}/placement/groups
    x-linode-cli-command: placement
    post:
      description: 'Creates a placement group on your account. Placement groups disperse your Linodes across physical machines (hosts) in one of our compute regions. Depending on your workload requirements, you may need your Linodes to follow specific strategies:


        - __Grouped-together model__. You may want them placed close together to reduce latency between Linodes that are used for an application or workload. Affinity placement groups follow this model.


        - __Spread-apart model__. You may want to disperse them across several hosts to support high availability, for example when required for failover. Anti-affinity placement groups follow this model.


        To run this operation, your user needs the `add_linodes` grant. Talk to your local account administrator about grant management for your user.


        > 👍 There''s a tutorial

        >

        > We offer an example API workflow you can follow to create a placement group and add Linodes to it.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli placement group-create \

        --label PG_Miami_failover \

        --region us-mia \

        --placement_group_type "anti_affinity:local" \

        --placement_group_policy strict

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-placement-group
      operationId: post-placement-group
      requestBody:
        content:
          application/json:
            example:
              label: PG_Miami_failover
              placement_group_policy: strict
              placement_group_type: anti_affinity:local
              region: us-iad
            schema:
              allOf:
              - additionalProperties: false
                description: Common properties for creating and rebuilding placement groups.
                properties:
                  label:
                    description: 'A unique name for the placement group. A placement group `label` has the following constraints:


                      - It needs to begin and end with an alphanumeric character.

                      - It can only consist of alphanumeric characters, hyphens (`-`), underscores (`_`), or periods (`.`).'
                    example: PG_Miami_failover
                    minLength: 1
                    type: string
                  placement_group_policy:
                    description: 'How requests to add future Linodes to your placement group are handled:


                      - `strict`: Ensures the placement group stays compliant with your selected model. If a target Linode breaks the grouped-together or spread-apart model set by your placement group type, it won''t be added. For example, with `anti-affinity:local` as your `placement_group_type`, assume it already has three qualifying Linodes on separate hosts, to support the spread-apart model. If a fourth Linode is assigned that''s on the same host as one of the existing three, an error is thrown and the system won''t add it. You can add up to 5 Linodes to a strict placement group.


                      - `flexible`. A target Linode will be added even if it breaks the grouped-together or spread-apart model set by your placement group type. Breaking the model makes the placement group non-compliant. This makes the placement group non-compliant. Use this if you need more flexibility to add future Linodes and compliance isn''t an immediate concern. You can add up to 250 Linodes to a flexible placement group.


                      > 📘

                      >

                      > Once you create a placement group, you can''t change its `placement_group_policy` setting.'
                    enum:
                    - strict
                    - flexible
                    example: strict
                    type: string
                  placement_group_type:
                    description: 'How Linodes are distributed in your placement group. A `placement_group_type` using anti-affinity (`anti_affinity:local`) places Linodes in separate hosts, but still in the same region. This best supports the spread-apart model for high availability. A `placement_group_type` using affinity places Linodes physically close together, possibly on the same host. This supports the grouped-together model for low-latency.


                      > 📘

                      >

                      > Currently, only `anti_affinity:local` is available for `placement_group_type`.'
                    enum:
                    - anti_affinity:local
                    example: anti_affinity:local
                    type: string
                    x-linode-cli-display: 1
                  region:
                    description: The data center that houses the Linodes you want to add to your placement group. Run the [List Linodes](https://techdocs.akamai.com/linode-api/reference/get-linode-instances) operation to view your Linodes and store the `region` identifier.
                    example: us-iad
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/placement-group-request.yaml
              required:
              - placement_group_type
              - placement_group_policy
              - label
              - region
              type: object
              x-akamai:
                file-path: schemas/added-post-placement-group.yaml
        required: true
        x-linode-cli-allowed-defaults:
        - placement_group_type
        - placement_group_policy
        - label
        - region
      responses:
        '200':
          content:
            application/json:
              example:
                id: 528
                is_compliant: true
                label: PG_Miami_failover
                members:
                - is_compliant: true
                  linode_id: 123
                placement_group_policy: strict
                placement_group_type: anti_affinity:local
                region: us-mia
              schema:
                additionalProperties: false
                properties:
                  id:
                    description: The placement group's ID. You need to provide it for all operations that affect it.
                    example: 528
                    type: integer
                    x-linode-cli-display: 1
                  is_compliant:
                    description: 'Whether all of the Linodes in your placement group are compliant. If `true`, all Linodes meet either the grouped-together or spread-apart model, which you determine through your selected `placement_group_type`. If `false`, a Linode isb''t compliant. For example, assume you''ve set `anti-affinity:local` as your `placement_group_type` and your group already has three qualifying Linodes on separate hosts, to support the spread-apart model. If a fourth Linode is assigned that''s on the same host as one of the existing three, the placement group is non-compliant. Enforce compliance in your group by setting a `placement_group_policy`.


                      > 📘

                      >

                      > Fixing compliance is not self-service. You need to wait for our assistance to physically move Linodes to make the group compliant again.'
                    example: true
                    type: boolean
                  label:
                    description: '__Filterable__ The unique name set for the placement group. A label has these constraints:


                      - It needs to begin and end with an alphanumeric character.

                      - It can only consist of alphanumeric characters, hyphens (`-`), underscores (`_`), or periods (`.`).'
                    example: PG_Miami_failover
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                    x-linode-filterable: true
                  members:
                    description: Linodes included in the placement group.
                    items:
                      additionalProperties: false
                      properties:
                        is_compliant:
                          description: The compliance status of each individual Linode in the placement group.
                          example: true
                          type: boolean
                        linode_id:
                          description: __Read-only__ The unique identifier for a Linode included in the placement group.
                          example: 123
                          readOnly: true
                          type: integer
                      type: object
                    type: array
                  placement_group_policy:
                    description: 'How requests to add future Linodes to your placement group are handled, and whether it remains compliant:


                      - `strict`. Don''t assign a new Linode if it breaks the grouped-together or spread-apart model set by the `placement_group_type`. Use this to ensure the placement group stays compliant (`is_compliant: true`).

                      - `flexible`. Assign a new Linode, even if it breaks the grouped-together or spread-apart model set by the `placement_group_type`. This makes the group non-compliant (`is_compliant: false`). You need to wait for Akamai to move the offending Linode to make it compliant again, once the necessary capacity is available in the region. Offers flexibility to add future Linodes if compliance isn''t an immediate concern.


                      <<LB>>


                      > 📘

                      >

                      > In rare cases, non-compliance can occur with a `strict` placement group if Akamai needs to failover or migrate your Linodes for maintenance. Fixing non-compliance for a `strict` placement group is prioritized over a `flexible` group.'
                    enum:
                    - strict
                    - flexible
                    example: strict
                    type: string
                  placement_group_type:
                    description: '__Filterable__, __Read-only__ How Linodes are distributed in your placement group. A `placement_group_type` using anti-affinity (`anti_affinity:local`) places Linodes in separate hosts, but still in the same region. This best supports the spread-apart model for high availability. A `placement_group_type` using affinity places Linodes physically close together, possibly on the same host. This supports the grouped-together model for low-latency.


                      > 📘

                      >

                      > Currently, only `anti_affinity:local` is available for `placement_group_type`.'
                    enum:
                    - anti_affinity:local
                    example: anti_affinity:local
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                    x-linode-filterable: true
                  region:
                    description: __Filterable__, __Read-only__ The [region](https://techdocs.akamai.com/linode-api/reference/get-regions) where the placement group was deployed.
                    example: us-mia
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                    x-linode-filterable: true
                type: object
                x-akamai:
                  file-path: schemas/placement-group.yaml
          description: A new placement group is being created.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - linodes:read_write
      summary: Create a placement group
      tags:
      - Placement groups
      x-akamai:
        tabs:
        - syntax: "linode-cli placement group-create \\\n  --label PG_Miami_failover \\\n  --region us-mia \\\n  --placement_group_type \"anti_affinity:local\" \\\n  --placement_group_policy strict"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: linodes:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode charge: true
      x-linode grant: add_placement
      x-linode-cli-action: group-create
    get:
      description: 'Returns a paginated list of placement groups you have permission to view.


        > 📘

        >

        > Your user needs at least `read-only` permission to all Linodes included in a placement group to view it. Placement groups that contain Linodes that you don''t have this permission for are left out of the response. If all placement groups contain Linodes that lack this permission, the API returns a 403 error. Talk to your local account administrator about managing permissions.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linode:read_only`


        **CLI**


        ```shell

        linode-cli placement groups-list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-placement-groups
      operationId: get-placement-groups
      parameters:
      - description: The page of a collection to return.
