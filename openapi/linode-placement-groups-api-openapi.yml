                            type: object
                          type: array
                        migrations:
                          additionalProperties: false
                          description: Any Linodes that are being migrated to or from the placement group. Returned as `null` if no migrations are taking place.
                          properties:
                            inbound:
                              description: The individual Linodes the system is migrating into the placement group.
                              items:
                                additionalProperties: false
                                properties:
                                  linode_id:
                                    description: __Read-only__ The unique identifier for a Linode being migrated into the placement group.
                                    example: 123
