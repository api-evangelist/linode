paths:
  /{apiVersion}/account/logins:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/account-logins.yaml
      path-info: /{apiVersion}/account/logins
    x-linode-cli-command: account
    get:
      description: 'Returns a collection of successful logins for all users on the account during the last 90 days. This operation can only be accessed by the unrestricted users of an account.


        >


        ---


        - __CLI__.


        ```

        linode-cli account logins-list

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-account-logins
      operationId: get-account-logins
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: An object representing a previous successful login for a User.
                      properties:
                        datetime:
                          description: __Read-only__ When the login was initiated.
                          example: '2018-01-01T00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                          x-linode-cli-display: 2
                        id:
                          description: __Read-only__ The unique ID of this login object.
                          example: 1234
                          readOnly: true
                          type: integer
                          x-linode-cli-display: 1
                        ip:
                          description: __Read-only__ The remote IP address that requested the login.
                          example: 192.0.2.0
                          format: ip
                          readOnly: true
                          type: string
                          x-linode-cli-display: 3
                        restricted:
                          description: __Read-only__ True if the User that attempted the login was a restricted User, false otherwise.
                          example: true
                          readOnly: true
                          type: boolean
                          x-linode-cli-display: 6
                        status:
                          description: __Read-only__ Whether the login attempt succeeded or failed.
                          enum:
                          - successful
                          - failed
                          example: successful
                          readOnly: true
                          type: string
                          x-linode-cli-display: 5
                        username:
                          description: __Read-only__ The username of the User that attempted the login.
                          example: example_user
                          readOnly: true
                          type: string
                          x-linode-cli-display: 4
                      type: object
                      x-akamai:
                        file-path: schemas/login.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/added-get-account-logins-200.yaml
              x-example:
                x-ref: ../examples/get-account-logins-200.json
          description: A collection of successful logins for all users on the account during the last 90 days.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List user logins
      tags:
      - Logins
      x-akamai:
        tabs:
        - syntax: linode-cli account logins-list
