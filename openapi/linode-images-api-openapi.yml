                  description: Example image description.
                  eol: '2026-07-01T04:00:00'
                  expiry: null
                  id: private/15
                  image_sharing:
                    shared_by: null
                    shared_with:
                      sharegroup_count: 0
                      sharegroup_list_url: /images/private/15/sharegroups
                  is_public: false
                  is_shared: false
                  label: Debian 13
                  regions:
                  - region: us-iad
                    status: available
                  size: 2500
                  status: available
                  tags:
                  - repair-image
                  - fix-1
                  total_size: 1234567
                  type: manual
                  updated: '2021-08-14T22:44:02'
                  vendor: Debian
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: Image object.
                      properties:
                        capabilities:
                          description: '__Read-only__ A list of the possible capabilities of this image.


                            - `cloud-init`. The image supports the cloud-init multi-distribution method with our [Metadata service](https://www.linode.com/docs/products/compute/compute-instances/guides/metadata/#troubleshoot-metadata-and-cloud-init). This only applies to public images.


                            - `distributed-sites`. Whether the image can be used in distributed compute regions. Compared to a core compute region, distributed compute regions offer limited functionality, but they''re globally distributed. Your image can be geographically closer to you, potentially letting you deploy it quicker. See [Regions and images](https://techdocs.akamai.com/cloud-computing/docs/images#regions-and-images) for complete details.'
                          example:
                          - cloud-init
                          - distributed-sites
                          items:
                            type: string
                          readOnly: true
                          type: array
                          x-linode-cli-display: 8
                        created:
                          description: __Read-only__ When this image was created.
                          example: '2021-08-14T22:44:02'
                          readOnly: true
                          type: string
                        created_by:
                          description: __Read-only__ The name of the user who created this image, or `linode` for public images.
                          example: linode
                          readOnly: true
                          type: string
                        deprecated:
                          description: __Filterable__, __Read-only__ A `true` value indicates a deprecated image. Only public images can be deprecated.
                          example: false
                          readOnly: true
                          type: boolean
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        description:
                          description: A detailed description of this image.
                          example: Example image description.
                          maxLength: 65000
                          minLength: 1
                          type:
                          - string
                          - 'null'
                          x-linode-cli-color:
                            None: black
                            default_: white
                          x-linode-cli-display: 4
                        eol:
                          description: __Read-only__ The time of the public image's planned removal from service. This is `null` for private images.
                          example: '2026-07-01T04:00:00'
                          readOnly: true
                          type:
                          - string
                          - 'null'
                        expiry:
                          description: __Read-only__ Only images created automatically from a deleted compute instance (type=automatic) expire. This is `null` for private images.
                          example: null
                          readOnly: true
                          type:
                          - string
                          - 'null'
                        id:
                          description: __Read-only__ The unique identifier for each image.
                          example: private/15
                          readOnly: true
                          type: string
                          x-linode-cli-display: 1
                        image_sharing:
                          description: Details about image sharing.
                          oneOf:
                          - additionalProperties: false
                            example:
                              shared_by: null
                              shared_with:
                                sharegroup_count: 0
                                sharegroup_list_url: /images/private/15/sharegroups
                            properties:
                              shared_by:
                                description: This field is `null` in this case, meaning the image is not shared by any group. See the `shared_with` field for details on the image's share group.
                                type:
                                - object
                                - 'null'
                              shared_with:
                                additionalProperties: false
                                description: Specifies the group that the image is shared with, including the number of share groups and a URL to view the share groups' list.
                                properties:
                                  sharegroup_count:
                                    description: The number of share groups the image is shared with.
                                    type: integer
                                  sharegroup_list_url:
                                    description: A URL to view the list of share groups the image is shared with.
                                    type: string
                                required:
                                - sharegroup_count
                                - sharegroup_list_url
                                type: object
                            required:
                            - shared_with
                            - shared_by
                            title: shared_with
                            type: object
                          - additionalProperties: false
                            example:
                              shared_by:
                                sharegroup_id: 3
                                sharegroup_label: label
                                sharegroup_uuid: 8003abfe-6b03-41a1-9e4c-a234ae3060c8
                                source_image_id: null
                                source_image_label: source image label
                              shared_with: null
                            properties:
                              shared_by:
                                additionalProperties: false
                                description: Specifies the details of the share group that is sharing the image.
                                properties:
                                  sharegroup_id:
                                    description: The share group's identifier.
                                    type: integer
                                  sharegroup_label:
                                    description: The share group's descriptive name.
                                    type: string
                                  sharegroup_uuid:
                                    description: The share group's unique identifier.
                                    format: uuid
                                    type: string
                                  source_image_id:
                                    description: The source image's slug identifier. It's `null` if no specific source image is referenced.
                                    type:
                                    - string
                                    - 'null'
                                  source_image_label:
                                    description: __Read-only__ The source image's label. It's `null` if no specific source image is referenced.
                                    example: Source Image Label
                                    readOnly: true
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - sharegroup_id
                                - sharegroup_uuid
                                - sharegroup_label
                                - source_image_id
                                - source_image_label
                                type: object
                              shared_with:
                                description: This field is `null` in this case, meaning the image is not shared with anyone. See the `shared_by` fields for additional details about this shared image.
                                type:
                                - object
                                - 'null'
                            required:
                            - shared_with
                            - shared_by
                            title: shared_by
                            type: object
                        is_public:
                          description: __Filterable__, __Read-only__ A `true` value if the image is a public distribution image. A `false` value indicates private, account-specific images.
                          example: false
                          readOnly: true
                          type: boolean
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 5
                          x-linode-filterable: true
                        is_shared:
                          description: '__Filterable__, __Read-only__ Indicates whether this image is shared with other accounts. The available values are:

                            - `true`: The private image is shared.

                            - `false`: The private image is not shared.

                            - `none`: The image is not owned by you, but has been shared with your account via an image share group.'
                          example: false
                          oneOf:
