openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Trusted devices API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: View details about trusted devices associated with your user account. If needed, you can revoke a trusted device so any future login attempts from that device will go through the full authentication process.
  name: Trusted devices
paths:
  /{apiVersion}/profile/devices:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/profile-devices.yaml
      path-info: /{apiVersion}/profile/devices
    x-linode-cli-command: profile
    get:
      description: 'Returns a paginated list of active trusted devices for your user. Browsers with an active Remember Me Session are logged into your account until the session expires or is revoked.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `list_profile_devices`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli profile devices-list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-devices
      operationId: get-devices
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2018-01-01T01:01:01'
                  expiry: '2018-01-31T01:01:01'
                  id: 123
                  last_authenticated: '2018-01-05T12:57:12'
                  last_remote_addr: 203.0.113.1
                  user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_13_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36 Vivaldi/2.1.1337.36
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: A trusted device object represents an active Remember Me session with [login.linode.com](https://login.linode.com).
                      properties:
                        created:
                          description: __Read-only__ When this Remember Me session was started.  This corresponds to the time of login with the "Remember Me" box checked.
                          example: '2018-01-01T01:01:01'
                          readOnly: true
                          type: string
                        expiry:
                          description: __Read-only__ When this TrustedDevice session expires.  Sessions typically last 30 days.
                          example: '2018-01-31T01:01:01'
                          readOnly: true
                          type: string
                        id:
                          description: __Read-only__ The unique ID for this TrustedDevice.
                          example: 123
                          readOnly: true
                          type: integer
                        last_authenticated:
                          description: __Read-only__ The last time this TrustedDevice was successfully used to authenticate to [login.linode.com](https://login.linode.com).
                          example: '2018-01-05T12:57:12'
                          readOnly: true
                          type: string
                        last_remote_addr:
                          description: __Read-only__ The last IP Address to successfully authenticate with this TrustedDevice.
                          example: 203.0.113.1
                          readOnly: true
                          type: string
                        user_agent:
                          description: __Read-only__ The User Agent of the browser that created this TrustedDevice session.
                          example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_13_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36 Vivaldi/2.1.1337.36
                          readOnly: true
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/trusted-device.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-devices-200.yaml
          description: Returns a paginated list of TrustedDevice objects.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List trusted devices
      tags:
      - Trusted devices
      x-akamai:
        tabs:
        - syntax: linode-cli profile devices-list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: devices-list
      x-linode-iam:
      - permissions:
