    delete:
      description: 'Revoke an active trusted device for your user. Once a trusted device is revoked, this device will have to log in again before accessing your account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `revoke_profile_device`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli profile device-revoke 123

        ```


        Learn more'
      externalDocs:
