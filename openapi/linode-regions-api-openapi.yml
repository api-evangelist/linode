                additionalProperties: false
                properties:
                  data:
                    description: Regions where you can deploy Akamai Cloud services. Note that some services may not be available in all regions.
                    items:
                      additionalProperties: false
                      description: An area where Linode services are available.
                      properties:
                        capabilities:
