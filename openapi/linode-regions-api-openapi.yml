                          example: Newark, NJ, USA
                          type: string
                          x-linode-cli-display: 2
                        monitors:
                          additionalProperties: false
                          description: '__Beta__ Lists the services in this region that support metrics and alerts use with Akamai Cloud Pulse (ACLP).


