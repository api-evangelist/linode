                          - Block Storage
                          - Object Storage
                          - Placement Groups
                          - Block Storage Encryption
                          - Linode Interfaces
                          items:
                            type: string
                          type: array
                          x-linode-cli-display: 4
                        country:
                          description: __Filterable__ The country where this region resides.
                          example: us
                          type: string
                          x-akamai:
                            labels:
