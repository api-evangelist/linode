                            alerts:
                              description: Each `service_type` supported for use in managing ACLP [alerts](https://techdocs.akamai.com/linode-api/reference/post-alert-definition-for-service-type) in this region, for your account. A `service_type` identifies the Akamai Cloud Computing service.
                              example:
                              - dbaas
                              items:
                                type: string
                              type: array
                            metrics:
                              description: Each `service_type` supported for use in managing ACLP [metrics](https://techdocs.akamai.com/linode-api/reference/get-dashboards-all) in this region, for your account. A `service_type` identifies the Akamai Cloud Computing service.
                              example:
                              - dbaas
                              items:
                                type: string
                              type: array
                          required:
