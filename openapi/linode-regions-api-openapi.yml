openapi: 3.2.0
info:
  title: Linode Regions API
  version: '1.0'
  description: 'Operations tagged Regions across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: Use these operations to view information about the various Akamai cloud computing data center regions, including their service capabilities, the country where they exist, their current status, and more.
  name: Regions
paths:
  /{apiVersion}/regions:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/regions.yaml
      path-info: /{apiVersion}/regions
    x-linode-cli-command: regions
    get:
      description: 'Lists the regions available for Linode services. Not all services are guaranteed to be available in all regions.


        **CLI**


        ```shell

        linode-cli regions list

        ```


        Learn more'
