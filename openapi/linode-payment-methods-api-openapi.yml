      x-linode-grant: read_write
    get:
      description: 'Returns a paginated list of Payment Methods for this Account.


        >


        ---


        - __CLI__.


        ```

        linode-cli payment-methods list

        ```


        Learn more...


        - __OAuth scopes__.


        ```

