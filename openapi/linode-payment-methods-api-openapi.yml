openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Payment methods API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to review and manage the payment method you've set up to pay your invoices.
  name: Payment Methods
paths:
  /{apiVersion}/account/payment-methods:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/payment-methods.yaml
      path-info: /{apiVersion}/account/payment-methods
    x-linode-cli-command: payment-methods
    post:
      description: 'Adds a Payment Method to your Account with the option to set it as the default method.


        - Adding a default Payment Method removes the default status from any other Payment Method.


        - An Account can have up to 6 active Payment Methods.


        - Up to 60 Payment Methods can be added each day.


        - Prior to adding a Payment Method, ensure that your billing address information is up-to-date with a valid `zip` by running the Update your account operation.


        - A `payment_method_add` event is generated when a payment is successfully submitted.


        __Parent and child accounts__


        In a parent and child account environment, the following apply:


        - Child account users can''t run this operation. These users don''t have access to billing-related operations.


        >


        ---


        - __CLI__.


        ```

        linode-cli payment-methods add \

        --type credit_card \

        --is_default true \

        --data.card_number 4111111111111111 \

        --data.expiry_month 11 \

        --data.expiry_year 2020 \

        --data.cvv 111

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-payment-method
      operationId: post-payment-method
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Payment Method Request Object.
              properties:
                data:
                  additionalProperties: false
                  description: An object representing the credit card information you have on file with Linode to make Payments against your Account.
                  properties:
                    card_number:
                      description: Your credit card number. No spaces or hyphens (`-`) allowed.
                      example: 4111111111111111
                      format: digits
                      maxLength: 24
                      minLength: 14
                      type: string
                    cvv:
                      description: CVV (Card Verification Value) of the credit card, typically found on the back of the card.
                      example: '123'
                      format: digits
                      maxLength: 4
                      minLength: 3
                      type: string
                    expiry_month:
                      description: "A value from 1-12 representing the expiration month of your credit card.\n\n  - 1 = January\n  - 2 = February\n  - 3 = March\n  - Etc."
                      example: 12
                      maximum: 12
                      minimum: 1
                      type: integer
                    expiry_year:
                      description: 'A four-digit integer representing the expiration year of your credit card.


                        The combination of `expiry_month` and `expiry_year` must result in a month/year combination of the current month or in the future. An expiration date set in the past is invalid.'
                      example: 2020
                      maxLength: 4
                      minLength: 4
                      type: integer
                  required:
                  - card_number
                  - expiry_month
                  - expiry_year
                  - cvv
                  type: object
                  x-akamai:
                    file-path: schemas/credit-card.yaml
                is_default:
                  description: Whether this Payment Method is the default method for automatically processing service charges.
                  example: '{{is_default}}'
                  type: boolean
                  x-linode-cli-display: 3
                type:
                  description: 'The type of Payment Method.


                    Alternative Payment Methods including Google Pay and PayPal can be added using the Cloud Manager. See the [Manage Payment Methods](https://www.linode.com/docs/products/platform/billing/guides/payment-methods/) guide

                    for details and instructions.'
                  enum:
                  - credit_card
                  example: '{{type}}'
                  type: string
              required:
              - type
              - data
              - is_default
              type: object
              x-akamai:
                file-path: schemas/added-post-payment-method.yaml
            x-example:
              x-ref: ../examples/post-payment-method.json
        description: The details of the Payment Method to add.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/post-payment-method-200.json
          description: Payment Method added.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Add a payment method
      tags:
      - Payment Methods
      x-akamai:
        tabs:
        - syntax: "linode-cli payment-methods add \\\n  --type credit_card \\\n  --is_default true \\\n  --data.card_number 4111111111111111 \\\n  --data.expiry_month 11 \\\n  --data.expiry_year 2020 \\\n  --data.cvv 111"
