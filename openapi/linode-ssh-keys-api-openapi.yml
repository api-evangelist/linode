openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode SSH keys API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Manage SSH keys for your user account. When creating a Linode, you can choose to have one or more SSH keys automatically added to the new Linode for secure access.
  name: SSH Keys
paths:
  /{apiVersion}/profile/sshkeys:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/profile-ssh-keys.yaml
      path-info: /{apiVersion}/profile/sshkeys
    x-linode-cli-command: sshkeys
    post:
      description: 'Adds an SSH Key to your Account profile.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_profile_ssh_key`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli sshkeys create \

        --label "My SSH Key" \

        --ssh_key "ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-add-ssh-key
      operationId: post-add-ssh-key
      requestBody:
        content:
          application/json:
            example:
              label: Example SSH Key
              ssh_key: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@hostname
            schema:
              additionalProperties: false
              description: An SSH key that serves as a credential to authenticate a user's secure shell connection to a Linode.
              properties:
                created:
                  description: __Read-only__ The date this key was added.
                  example: '{{created}}'
                  readOnly: true
                  type: string
                id:
                  description: __Read-only__ The unique identifier of an SSH Key object.
                  example: '{{id}}'
                  readOnly: true
                  type: integer
                label:
                  description: __Filterable__ A label for the SSH Key.
                  example: '{{label}}'
                  maxLength: 64
                  minLength: 0
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-filterable: true
                ssh_key:
                  description: 'The public SSH Key, which is used to authenticate to the root user of the Linodes you deploy.


                    Accepted formats:


                    - ssh-dss

                    - ssh-rsa

                    - ecdsa-sha2-nistp

                    - ssh-ed25519

                    - sk-ecdsa-sha2-nistp256 (Akamai-specific)'
                  example: '{{ssh_key}}'
                  format: ssh-key
                  type: string
              type: object
              x-akamai:
                file-path: schemas/ssh-key.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2024-01-01T00:01:01'
                id: 42
                label: Example SSH Key
                ssh_key: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@hostname
              schema:
                additionalProperties: false
                description: An SSH key that serves as a credential to authenticate a user's secure shell connection to a Linode.
                properties:
                  created:
                    description: __Read-only__ The date this key was added.
                    example: '2018-01-01T00:01:01'
                    readOnly: true
                    type: string
                  id:
                    description: __Read-only__ The unique identifier of an SSH Key object.
                    example: 42
                    readOnly: true
                    type: integer
                  label:
                    description: __Filterable__ A label for the SSH Key.
                    example: My SSH Key
                    maxLength: 64
                    minLength: 0
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  ssh_key:
                    description: 'The public SSH Key, which is used to authenticate to the root user of the Linodes you deploy.


                      Accepted formats:


                      - ssh-dss

                      - ssh-rsa

                      - ecdsa-sha2-nistp

                      - ssh-ed25519

                      - sk-ecdsa-sha2-nistp256 (Akamai-specific)'
                    example: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                    format: ssh-key
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/ssh-key.yaml
          description: SSH Key associated successfully.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Add an SSH key
      tags:
      - SSH Keys
      x-akamai:
        tabs:
        - syntax: "linode-cli sshkeys create \\\n  --label \"My SSH Key\" \\\n  --ssh_key \"ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer\""
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
