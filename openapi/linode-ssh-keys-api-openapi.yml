        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: A credential object for authenticating a User's secure shell connection to a Linode.
                      properties:
                        created:
                          description: __Read-only__ The date this key was added.
                          example: '2018-01-01T00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                        id:
                          description: __Read-only__ The unique identifier of an SSH Key object.
                          example: 42
                          readOnly: true
                          type: integer
                        label:
                          description: A label for the SSH Key.
                          example: My SSH Key
                          maxLength: 64
                          minLength: 0
                          type: string
                        ssh_key:
                          description: 'The public SSH Key, which is used to authenticate to the root user of the Linodes you deploy.


                            Accepted formats:


                            - ssh-dss

                            - ssh-rsa

                            - ecdsa-sha2-nistp

                            - ssh-ed25519

                            - sk-ecdsa-sha2-nistp256 (Akamai-specific)'
                          example: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                          format: ssh-key
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/ssh-key.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-ssh-keys-200.yaml
              x-example:
                x-ref: ../examples/get-ssh-keys-200.json
          description: Returns a paginated list of SSH Key objects.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List SSH keys
      tags:
      - SSH Keys
      x-akamai:
        tabs:
        - syntax: linode-cli sshkeys list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action:
      - list
      - ls
      x-linode-grant: read_only
