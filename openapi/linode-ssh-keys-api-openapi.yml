        - create_profile_ssh_key
    get:
      description: 'Returns a collection of SSH Keys you''ve added to your Profile.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `list_profile_ssh_keys`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli sshkeys list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-ssh-keys
      operationId: get-ssh-keys
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2024-01-01T00:01:01'
                  id: 42
                  label: Example SSH Key
                  ssh_key: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@hostname
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: SSH keys that have been added to the user's account.
                    items:
                      additionalProperties: false
                      description: An SSH key that serves as a credential to authenticate a user's secure shell connection to a Linode.
                      properties:
                        created:
                          description: __Read-only__ The date this key was added.
                          example: '2018-01-01T00:01:01'
                          readOnly: true
                          type: string
                        id:
                          description: __Read-only__ The unique identifier of an SSH Key object.
                          example: 42
                          readOnly: true
                          type: integer
                        label:
                          description: __Filterable__ A label for the SSH Key.
                          example: My SSH Key
                          maxLength: 64
                          minLength: 0
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        ssh_key:
                          description: 'The public SSH Key, which is used to authenticate to the root user of the Linodes you deploy.


                            Accepted formats:


                            - ssh-dss

                            - ssh-rsa

                            - ecdsa-sha2-nistp

                            - ssh-ed25519

                            - sk-ecdsa-sha2-nistp256 (Akamai-specific)'
                          example: ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                          format: ssh-key
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/ssh-key.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-ssh-keys-200.yaml
          description: Returns a paginated list of SSH Key objects.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List SSH keys
      tags:
      - SSH Keys
      x-akamai:
        tabs:
        - syntax: linode-cli sshkeys list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action:
      - list
      - ls
      x-linode-grant: read_only
      x-linode-iam:
      - permissions:
        - list_profile_ssh_keys
