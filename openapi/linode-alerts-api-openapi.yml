                            - johndoe
                            - janedoe
                            items:
                              type: string
                            maxItems: 10
                            minItems: 1
                            type: array
                        type: object
                    title: email
                    type: object
                    x-akamai:
                      file-path: schemas/aclp-notification-channels-email.yaml
                  - additionalProperties: false
                    description: Configuration settings for a `webhook` notification channel.
                    properties:
