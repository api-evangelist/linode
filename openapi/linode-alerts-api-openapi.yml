    get:
      description: '__Limited availability__ Returns all of the monitoring alert notification channels available to your user. A notification channel is a method of communication used to send a monitoring alert.


        > 📘

        >

        > Filtering is supported for specific objects, labeled as **Filterable**. However, only the `+and` and `+or` operators are supported, and you can''t nest filter operators.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `monitor:read_only`


        **CLI**


        ```shell

        linode-cli alerts channels-list

        ```


        Learn more'
