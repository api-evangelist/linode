                        additionalProperties: false
                        description: A notification channel set up to deliver an alert as a webhook HTTPS message to a specified URL.
                        properties:
                          authentication:
                            additionalProperties: false
                            description: Authentication details required to access the `endpoint_url`.
                            properties:
                              details:
                                additionalProperties: false
                                description: __Write-only__ Includes additional parameters necessary to define `basic` authentication. If `type` is set to `none`, leave this object empty or out of a request.
                                properties:
                                  basic_authentication_password:
                                    description: The password tied to the `basic_authentication_user`, for `basic` authentication.
                                    example: C0mPl3X_p@$$w0Rd
                                    type: string
                                  basic_authentication_user:
                                    description: The user name for `basic` authentication.
                                    example: John_Q
                                    type: string
                                required:
                                - basic_authentication_user
                                - basic_authentication_password
                                type:
                                - object
                                - 'null'
                                writeOnly: true
                              type:
                                description: The type of authentication in use. This can be `none` for no authentication, or `basic` for authentication using a username and password, set using the `details` parameters.
                                enum:
                                - none
                                - basic
                                example: basic
                                type: string
                            required:
                            - type
                            type: object
                          client_certificate_details:
                            additionalProperties: false
                            description: 'Contains mutual transport layer security (mTLS) client certificate information to additionally secure the connection for the request.


                              > 📘

                              >

                              > This object only appears in a response to an operation if its `tls_hostname` object was set for the notification channel.'
                            properties:
                              client_ca_certificate:
                                description: The certificate authority (CA) certificate used to verify a requesting server's identity.
                                example: '-----BEGIN CERTIFICATE-----\aBCDEfgHIJ1klMnOPQrSTUvXYZA+bCdefGh ... IjKlmN2OPqRSTu\vwx3y\z-----END CERTIFICATE-----'
                                type: string
                              client_certificate:
                                description: '__Write-only__ The PEM-formatted digital certificate you want to authenticate requests to the `endpoint_url`.


                                  > 📘

                                  >

                                  > For security purposes, this field is hidden from the response for all operations.'
                                example: '-----BEGIN CERTIFICATE-----\aBCDEfgHIJ1klMnOPQrSTUvXYZA+bCdefGh ... IjKlmN2OPqRSTu\vwx3y\z-----END CERTIFICATE-----'
                                type: string
                                writeOnly: true
                              client_private_key:
                                description: '__Write-only__ The private key in the non-encrypted PKCS8 format that authenticates with the back-end server.


                                  > 📘

                                  >

                                  > For security purposes, this field is hidden from the response for all operations.'
                                example: '-----BEGIN CERTIFICATE-----\aBCDEfgHIJ1klMnOPQrSTUvXYZA+bCdefGh ... IjKlmN2OPqRSTu\vwx3y\z-----END CERTIFICATE-----'
                                type: string
                                writeOnly: true
                              tls_hostname:
                                description: For mTLS support, this is the hostname that verifies the server's certificate and matches the Subject Alternative Names (SANs) in the certificate. If this field is left out, the API fetches the hostname from the `endpoint_url`.
                                example: my-site.com
                                type: string
                            required:
                            - client_ca_certificate
                            - client_certificate
                            - client_private_key
                            type: object
                          custom_headers:
                            description: 'Pairs of parameters used to optionally include custom headers in the request.


                              > 📘

                              >

                              > These headers are _not_ supported: `content_type`, `encoding`, `authorization`, `host`, and `akamai`.'
                            items:
                              additionalProperties: false
                              properties:
                                name:
                                  description: The name of the custom header to include in the request.
                                  example: Cache-Control
                                  type: string
                                value:
                                  description: The body content for the custom header to include in the request.
                                  example: max-age=0
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                          data_compression:
                            description: Specifies whether data compression is applied to files included in a request. This can be `gzip` to apply this compression format or `none`.
                            enum:
                            - gzip
                            - none
                            example: gzip
                            type: string
                          endpoint_url:
                            description: 'The URL where the request will be sent for the webhook.


                              > 📘

                              >

                              > Requests to the `endpoint_url` need to use a content-type of `application/json`. All other format requests return an error.'
                            example: https://my-site.com/alerts-storage/basicAuth
                            type: string
                        required:
                        - endpoint_url
                        - authentication
                        type: object
                    title: webhook
                    type: object
                    x-akamai:
                      file-path: schemas/aclp-notification-channels-webhook.yaml
                label:
                  description: The name of the notification channel for identification purposes. This value needs to be unique for each notification channel.
                  example: '{{label}}'
                  type: string
              required:
              - channel_type
              - details
              type: object
              x-akamai:
