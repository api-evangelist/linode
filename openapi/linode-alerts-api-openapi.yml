                          data_compression: gzip
                          endpoint_url: https://my-site.com/alerts-storage/basicAuth
                      id: 10000
                      label: Read-Write Channel
                      type: user
                      updated: '2025-03-20T01:41:09'
                      updated_by: johndoe
                    page: 1
