  title: 'Akamai: Linode Alerts API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Akamai Cloud Pulse lets you configure alerts to monitor key metrics and events in real time and automatically trigger notifications or actions when predefined thresholds or conditions are met.
  name: Alerts
paths:
  /{apiVersion}/monitor/alert-channels:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/aclp-notification-channels.yaml
      path-info: /{apiVersion}/monitor/alert-channels
    x-linode-cli-command: alerts
    post:
      description: '__Limited availability__ Create a new notification channel, to set up a communication method for a monitoring alert. This is referred to as a `user` channel and you can have a maximum of five on your account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `monitor:read_write`


        **CLI**


        ```shell

        linode-cli alerts channels-create

        --label Email channel for Managed Database alerts \

        --channel_type email \

        --details.email.usernames johndoe \

        --details.email.usernames janedoe

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-notification-channel
      operationId: post-notification-channel
      requestBody:
        content:
          application/json:
            example:
              channel_type: email
              details:
                email:
                  usernames:
                  - johndoe
                  - janedoe
              label: Email channel for Managed Database alerts
            schema:
              additionalProperties: false
              properties:
                channel_type:
                  description: 'The type of notification used with the channel. This can be `email` to send the alert via email message or `webhook` to send an HTTP message to a specified URL.


                    > 📘

                    >

                    > Before you create a notification channel that uses a `channel_type` of `webhook`, you should run the [Verify a webhook notification channel](https://techdocs.akamai.com/linode-api/reference/verify-notification-channel) operation to validate your webhook configuration.'
                  enum:
                  - email
                  - webhook
                  example: '{{channel_type}}'
                  type: string
                details:
                  example: '{{details}}'
                  oneOf:
                  - additionalProperties: false
                    description: Configuration settings for an `email` notification channel.
                    properties:
                      email:
                        additionalProperties: false
                        description: A notification channel set up to deliver an alert via email.
                        properties:
                          recipient_type:
                            description: __Read-only__ The type of email recipient, based on the notification channel `type`. This can be `user` for a custom, user-generated notification channel, `read_write_users` for a pre-defined, system alert's notification channel, when the target entities in the alert require read-write access, and `read_users` for a system alert's notification channel for read-only entities.
                            enum:
                            - user
                            - read_write_users
                            - read_users
                            example: user
                            readOnly: true
                            type: string
                          usernames:
                            description: 'The usernames on your account that should receive the alert. When you create a new user, you assign it a username and an email address. This email address is used for the alert. Run the [List users](https://techdocs.akamai.com/linode-api/reference/get-users) operation and store the `username` for applicable users. This is empty if the notification channel `type` is `system`.


                              Currently, any username on your account can be included in an email notification channel.'
