tags:
- description: Operations to verify and delete the phone number associated with your user account, which is used to send SMS messages as a form of two-factor authentication (2FA).
  name: Phone number
paths:
  /{apiVersion}/profile/phone-number:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/profile-phone.yaml
      path-info: /{apiVersion}/profile/phone-number
    x-linode-cli-command: phone
    post:
      description: 'Send a one-time verification code via SMS message to the submitted phone number. Providing your phone number helps ensure you can securely access your Account in case other ways to connect are lost. Your phone number is only used to verify your identity by sending an SMS message. Standard carrier messaging fees may apply.


        - By accessing this operation you are opting in to receive SMS messages. You can opt out of SMS messages by running the Delete a phone number operation after your phone number is verified.


        - Verification codes are valid for 10 minutes after they are sent.


        - Subsequent requests made prior to code expiration result in sending the same code.


        Once a verification code is received, verify your phone number with the Verify a phone number operation.


        >


        ---


        - __CLI__.


        ```

        linode-cli phone sms-code-send \

        --iso-code US \

        --phone-number 555-555-5555

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-profile-phone-number
      operationId: post-profile-phone-number
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                iso_code:
                  description: The two-letter ISO 3166 country code associated with the phone number.
                  example: '{{iso_code}}'
                  type: string
                phone_number:
                  description: A valid phone number.
                  example: '{{phone_number}}'
                  format: phone
                  type: string
              required:
              - iso_code
              - phone_number
              type: object
              x-akamai:
                file-path: schemas/post-profile-phone-number.yaml
            x-example:
              x-ref: ../examples/post-profile-phone-number.json
        description: Enter a phone number and country code for verification.
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/post-profile-phone-number-200.json
          description: Phone number verification code request successful.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Send a phone number verification code
      tags:
      - Phone number
      x-akamai:
        tabs:
        - syntax: "linode-cli phone sms-code-send \\\n  --iso-code US \\\n  --phone-number 555-555-5555"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: sms-code-send
      x-linode-grant: read_write
    delete:
      description: 'Delete the verified phone number for the User making this request.


        Use this operation to opt out of SMS messages for the requesting User after a phone number has been verified with the Verify a phone number operation.


        >


        ---


        - __CLI__.


        ```

        linode-cli phone delete

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/delete-profile-phone-number
      operationId: delete-profile-phone-number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/delete-profile-phone-number-200.json
          description: Phone number deletion request successful.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Delete a phone number
      tags:
      - Phone number
      x-akamai:
        tabs:
        - syntax: linode-cli phone delete
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: delete
      x-linode-grant: read_write
  /{apiVersion}/profile/phone-number/verify:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/profile-phone-verify.yaml
      path-info: /{apiVersion}/profile/phone-number/verify
    x-linode-cli-command: phone
    post:
      description: 'Verify a phone number by confirming the one-time code received via SMS message after running the Send a phone number verification code operation.


        - Verification codes are valid for 10 minutes after they are sent.


        - Only the same User that made the verification code request can use that code with this operation.


        Once completed, the verified phone number is assigned to the User making the request. To change the verified phone number for a User, first run the Delete a phone number operation, then begin the verification process again with the Send a phone number verification code operation.


        >


        ---


        - __CLI__.


        ```

        linode-cli phone verify \

        --otp_code 123456

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-profile-phone-number-verify
      operationId: post-profile-phone-number-verify
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                otp_code:
                  description: The one-time code received via SMS message after running the [Send a phone number verification code](https://techdocs.akamai.com/linode-api/reference/post-profile-phone-number) operation.
                  example: '{{otp_code}}'
                  type: string
              required:
              - otp_code
              type: object
              x-akamai:
                file-path: schemas/post-profile-phone-number-verify.yaml
            x-example:
              x-ref: ../examples/post-profile-phone-number-verify.json
        description: Enter a phone verification code for confirmation.
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/post-profile-phone-number-verify-200.json
          description: Phone number verification successful.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Verify a phone number
      tags:
      - Phone number
      x-akamai:
        tabs:
        - syntax: "linode-cli phone verify \\\n  --otp_code 123456"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: verify
