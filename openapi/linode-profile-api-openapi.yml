openapi: 3.2.0
info:
  title: Linode Profile API
  version: '1.0'
  description: 'Operations tagged Profile across 2 of this provider''s published API definitions: linode-api-v4-openapi.yml, linode-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com/v4
  description: Production Server
- url: https://api.linode.com
tags:
- name: Profile
  description: Manage your user profile settings, SSH keys, authorized applications, personal access tokens, and two-factor authentication.
paths:
  /profile:
    get:
      operationId: getProfile
      summary: Get your profile
      description: Returns information about the current user, including their username, email address, timezone, and authentication settings.
      tags:
      - Profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    put:
      operationId: updateProfile
      summary: Update your profile
      description: Updates information about the current user.
      tags:
      - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /profile/tokens:
    get:
      operationId: getPersonalAccessTokens
      summary: List personal access tokens
      description: Returns a paginated list of personal access tokens for the current user.
      tags:
      - Profile
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Personal access tokens retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTokenList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createPersonalAccessToken
      summary: Create a personal access token
      description: Creates a new personal access token with the specified scopes and expiry. The token value is only returned once at creation time.
      tags:
      - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Personal access token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /profile/sshkeys:
    get:
      operationId: getSSHKeys
      summary: List SSH keys
      description: Returns a paginated list of SSH keys on the current user's profile.
      tags:
      - Profile
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: SSH keys retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSSHKeyList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createSSHKey
      summary: Add an SSH key
      description: Adds an SSH key to the current user's profile for use when deploying Linode instances.
      tags:
      - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSHKeyRequest'
      responses:
        '200':
          description: SSH key added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKey'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /{apiVersion}/profile:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/profile.yaml
      path-info: /{apiVersion}/profile
    x-linode-cli-command: profile
    get:
      description: 'Returns information about the current user. Use this to see who is acting in applications where more than one token is managed, such as a third-party OAuth application.


        > 📘

        >

        > A third-party OAuth application accessing a profile with this operation has full access to all aspects of that profile.


        >


        ---


        - __CLI__.


        ```

        linode-cli profile view

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-profile
      operationId: get-profile
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A profile represents your user in our system. This is where you can change information about your user. This information is available to any OAuth client regardless of requested scopes, and you can use it to populate user information in third-party applications.
                properties:
                  authentication_type:
                    description: '__Read-only__ This account''s Cloud Manager authentication type. You choose an authentication type in Cloud Manager and Akamai authorizes it when you log into your account. Authentication types include your user''s password (in conjunction with your username), or the name of your identity provider, such as GitHub. Here are some examples:


                      - If a user has never used third-party authentication, the authentication type will be `password`.


                      - If a user is using third-party authentication, the name of their identity provider is used for the authentication type, for example, `github`.


                      - If a user has used third-party authentication and has since revoked it, the authentication type is `password`.'
                    enum:
                    - password
                    - github
                    example: password
                    readOnly: true
                    type: string
                  authorized_keys:
                    description: Your user can use these SSH Keys to access Lish. This value is ignored if `lish_auth_method` is `disabled`.
                    example: null
                    items:
                      format: ssh-key
                      type: string
                    type:
                    - array
                    - 'null'
                  email:
                    description: Your email address. We use this address for Akamai Cloud Computing-related communication.
                    example: example-user@gmail.com
                    format: email
                    type: string
                    x-linode-cli-display: 2
                  email_notifications:
                    description: When set to `true`, you will receive email notifications about account activity. When `false`, you may still receive business-critical communications through email.
                    example: true
                    type: boolean
                  ip_whitelist_enabled:
                    deprecated: true
                    description: When set to `true`, your user logins are only allowed from whitelisted IPs. This setting is deprecated, and can't be enabled. If you disable this setting, you won't be able to re-enable it.
                    example: false
                    type: boolean
                  lish_auth_method:
                    description: 'The authentication methods that you can use when connecting to the [Linode Shell (Lish)](https://www.linode.com/docs/guides/lish/).


                      - `keys_only` is the most secure if you intend to use Lish.


                      - `disabled` is recommended if you don''t want to use Lish.


                      - If this account''s Cloud Manager authentication type is set to a third-party authentication method, you can''t use `password_keys` as your Lish authentication method. Run the [Get a profile](https://techdocs.akamai.com/linode-api/reference/get-profile) operation to view your account''s Cloud Manager `authentication_type` field.'
                    enum:
                    - password_keys
                    - keys_only
                    - disabled
                    example: keys_only
                    type: string
                  referrals:
                    additionalProperties: false
                    description: __Read-only__ Information about your status in our referral program. The API makes this information available after this profile's account has established at least $25.00 USD of total payments.
                    properties:
                      code:
                        description: __Read-only__ Your referral code. If others use this when signing up for Linode, you receive an account credit.
                        example: 871be32f49c1411b14f29f618aaf0c14637fb8d3
                        readOnly: true
                        type: string
                      completed:
                        description: __Read-only__ The number of completed sign-ups that used your referral code.
                        example: 0
                        readOnly: true
                        type: integer
                      credit:
                        description: __Read-only__ Your referral program account credit in US dollars.
                        example: 0
                        readOnly: true
                        type: integer
                      pending:
                        description: __Read-only__ The number of pending sign-ups that used your referral code. Akamai gives you credit for these sign-ups once they've completed.
                        example: 0
                        readOnly: true
                        type: integer
                      total:
                        description: __Read-only__ The number of users who have signed up with your referral code.
                        example: 0
                        readOnly: true
                        type: integer
                      url:
                        description: __Read-only__ The referral URL that Akamai uses to direct others to sign up for Akamai Cloud Computing with your referral code.
                        example: https://www.linode.com/?r=871be32f49c1411b14f29f618aaf0c14637fb8d3
                        format: url
                        readOnly: true
                        type: string
                    readOnly: true
                    type: object
                  restricted:
                    description: When set to `true`, there are restrictions on what your user can access on your account. Run [List grants](https://techdocs.akamai.com/linode-api/reference/get-profile-grants) to get details on what entities and actions you can access and perform.
                    example: false
                    type: boolean
                    x-linode-cli-display: 3
                  timezone:
                    description: The time zone you want to display for your Linode assets. This API doesn't directly use this time zone. It's provided for the benefit of clients such as the Akamai Cloud Manager and other clients built on the API. All times returned by the API are in UTC.
                    example: US/Eastern
                    type: string
                  two_factor_auth:
                    description: When set to `true`, a login from an untrusted computer requires two-factor authentication. You also need to run [Create a two factor secret](https://techdocs.akamai.com/linode-api/reference/post-tfa-enable) to enable two-factor authentication.
                    example: true
                    type: boolean
                    x-linode-cli-display: 4
                  uid:
                    description: __Read-only__ Your unique ID in our system. This value will never change, and can safely be used to identify your user.
                    example: 1234
                    readOnly: true
                    type: integer
                  username:
                    description: __Read-only__ Your username, used for logging in to our system.
                    example: exampleUser
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  verified_phone_number:
                    description: __Read-only__ The phone number verified for this profile with the [Verify a phone number](https://techdocs.akamai.com/linode-api/reference/post-profile-phone-number-verify) operation. Displayed as `null` if the profile doesn't have a verified phone number.
                    example: '+5555555555'
                    format: phone
                    readOnly: true
                    type:
                    - string
                    - 'null'
                type: object
                x-akamai:
                  file-path: schemas/profile.yaml
              x-example:
                x-ref: ../examples/get-profile-200.json
          description: Profile response.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth: []
      summary: Get a profile
      tags:
