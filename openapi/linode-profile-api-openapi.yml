components:
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: The current page number.
        pages:
          type: integer
          description: The total number of pages.
        results:
          type: integer
          description: The total number of results.
    Token:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this token.
        scopes:
          type: string
          description: The OAuth scopes for this token.
        label:
          type: string
          description: The label for this token.
        token:
          type: string
          description: The token string. Only returned at creation time.
        created:
          type: string
          format: date-time
          description: When this token was created.
        expiry:
          type: string
          format: date-time
          description: When this token expires.
    SSHKeyRequest:
      type: object
      required:
      - label
      - ssh_key
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: The label for the SSH key.
        ssh_key:
          type: string
          description: The SSH public key content.
    TokenRequest:
      type: object
      required:
      - scopes
      - label
      properties:
        scopes:
          type: string
          description: The OAuth scopes for the token.
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: The label for the token.
        expiry:
          type: string
          format: date-time
          description: When the token should expire.
    Profile:
      type: object
      properties:
        username:
          type: string
          description: The user's username.
        email:
          type: string
          format: email
          description: The user's email address.
        timezone:
          type: string
          description: The user's preferred timezone.
        email_notifications:
          type: boolean
          description: Whether email notifications are enabled.
        ip_whitelist_enabled:
          type: boolean
          description: Whether IP whitelisting is enabled.
        two_factor_auth:
          type: boolean
          description: Whether two-factor authentication is enabled.
        restricted:
          type: boolean
          description: Whether the user has restricted access.
        authorized_keys:
          type: array
          items:
            type: string
          description: SSH keys authorized on the profile.
    SSHKey:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this SSH key.
        label:
          type: string
          description: The label for this SSH key.
        ssh_key:
          type: string
          description: The SSH public key.
        created:
          type: string
          format: date-time
          description: When this SSH key was added.
    PaginatedTokenList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Token'
    PaginatedSSHKeyList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/SSHKey'
  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: The page number to return.
    pageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 25
        maximum: 500
        default: 100
      description: The number of items per page.
  securitySchemes:
    oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://login.linode.com/oauth/authorize
          scopes:
            account:read_only: Allows access to GET information about your account.
            account:read_write: Allows access to all endpoints related to your account.
            child_account:read_only: Allows access to GET information about deprecated parent/child operations.
            child_account:read_write: Allows access to deprecated parent/child operations.
            databases:read_only: Allows access to GET information about databases.
            databases:read_write: Allows access to all endpoints related to databases.
            domains:read_only: Allows access to GET Domains on your account.
            domains:read_write: Allows access to all Domain endpoints.
            events:read_only: Allows access to GET your Events.
            events:read_write: Allows access to all endpoints related to your Events.
            firewall:read_only: Allows access to GET information about your Firewalls.
            firewall:read_write: Allows access to all Firewall endpoints.
            images:read_only: Allows access to GET your Images.
            images:read_write: Allows access to all endpoints related to your Images.
            ips:read_only: Allows access to GET your ips.
            ips:read_write: Allows access to all endpoints related to your ips.
            linodes:read_only: Allows access to GET Linodes on your account.
            linodes:read_write: Allow access to all endpoints related to your Linodes.
            lke:read_only: Allows access to GET LKE Clusters on your account.
            lke:read_write: Allows access to all endpoints related to LKE Clusters on your account.
            longview:read_only: Allows access to GET your Longview Clients.
            longview:read_write: Allows access to all endpoints related to your Longview Clients.
            monitor:read_only: Allows access to Monitor (Akamai Cloud Pulse) data.
            monitor:read_write: Allows access to GET Monitor (Akamai Cloud Pulse) data.
            nodebalancers:read_only: Allows access to GET NodeBalancers on your account.
            nodebalancers:read_write: Allows access to all NodeBalancer endpoints.
            object_storage:read_only: Allows access to GET information related to your Object Storage.
            object_storage:read_write: Allows access to all Object Storage endpoints.
            stackscripts:read_only: Allows access to GET your StackScripts.
            stackscripts:read_write: Allows access to all endpoints related to your StackScripts.
            volumes:read_only: Allows access to GET your Volumes.
            volumes:read_write: Allows access to all endpoints related to your Volumes.
            vpc:read_write: Allows access to all endpoints related to VPC and Subnet creation, updating, and deletion.
          tokenUrl: https://login.linode.com/oauth/token
      type: oauth2
    personalAccessToken:
      scheme: bearer
