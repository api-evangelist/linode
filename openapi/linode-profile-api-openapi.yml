components:
  schemas:
    TokenRequest:
      type: object
      required:
      - scopes
      - label
      properties:
        scopes:
          type: string
          description: The OAuth scopes for the token.
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: The label for the token.
        expiry:
          type: string
          format: date-time
          description: When the token should expire.
    SSHKeyRequest:
      type: object
      required:
      - label
      - ssh_key
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: The label for the SSH key.
        ssh_key:
          type: string
          description: The SSH public key content.
    Token:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this token.
        scopes:
          type: string
          description: The OAuth scopes for this token.
        label:
          type: string
          description: The label for this token.
        token:
          type: string
          description: The token string. Only returned at creation time.
        created:
          type: string
          format: date-time
          description: When this token was created.
        expiry:
          type: string
          format: date-time
          description: When this token expires.
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: The current page number.
        pages:
          type: integer
          description: The total number of pages.
        results:
          type: integer
          description: The total number of results.
    PaginatedSSHKeyList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/SSHKey'
