  title: 'Akamai: Linode Longview subscriptions API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Get publicly-accessible information about the Longview plans available on Akamai Cloud, including the number of supported clients.
  name: Longview subscriptions
paths:
  /{apiVersion}/longview/subscriptions:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/longview-subscriptions.yaml
      path-info: /{apiVersion}/longview/subscriptions
    x-linode-cli-command: longview
    get:
      description: 'Returns a paginated list of available Longview subscriptions. This is a public endpoint and requires no authentication.


        >


        ---


        - __CLI__.


        ```

        linode-cli longview subscriptions-list

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-longview-subscriptions
      operationId: get-longview-subscriptions
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: A Longview Subscription represents a tier of Longview service you can subscribe to.
                      properties:
                        clients_included:
                          description: __Read-only__ The number of Longview Clients that may be created with this Subscription tier.
                          example: 10
                          readOnly: true
                          type: integer
                          x-linode-cli-display: 3
                        id:
                          description: __Read-only__ The unique ID of this Subscription tier.
                          enum:
                          - longview-3
                          - longview-10
                          - longview-40
                          - longview-100
                          example: longview-10
                          readOnly: true
                          type: string
                          x-linode-cli-display: 1
                        label:
                          description: __Read-only__ A display name for this Subscription tier.
                          example: Longview Pro 10 pack
                          readOnly: true
                          type: string
                          x-linode-cli-display: 2
                        price:
                          additionalProperties: false
                          description: __Read-only__ Pricing information about this Subscription tier.
                          properties:
                            hourly:
                              description: __Read-only__ The hourly price, in US dollars, for this Subscription tier.
                              example: 0.06
                              readOnly: true
                              type: number
                            monthly:
                              description: __Read-only__ The maximum monthly price in US Dollars for this Subscription tier. You will never be charged more than this amount per month for this subscription.
                              example: 40
                              readOnly: true
                              type: number
                          readOnly: true
                          type: object
                          x-linode-cli-display: 4
                      type: object
                      x-akamai:
                        file-path: schemas/longview-subscription.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-longview-subscriptions-200.yaml
              x-example:
                x-ref: ../examples/get-longview-subscriptions-200.json
          description: A paginated list of Longview subscriptions.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      summary: List Longview subscriptions
      tags:
      - Longview subscriptions
      x-akamai:
        tabs:
        - syntax: linode-cli longview subscriptions-list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: subscriptions-list
  /{apiVersion}/longview/subscriptions/{subscriptionId}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The Longview Subscription to look up.
      example: '{{subscriptionId}}'
      in: path
      name: subscriptionId
      required: true
      schema:
        type: string
      x-akamai:
        file-path: parameters/subscription-id-path.yaml
    x-akamai:
      file-path: paths/longview-subscription.yaml
      path-info: /{apiVersion}/longview/subscriptions/{subscriptionId}
    x-linode-cli-command: longview
    get:
      description: 'Get the Longview plan details as a single `LongviewSubscription` object for the provided subscription ID. This is a public endpoint and requires no authentication.


        >


        ---


        - __CLI__.


        ```

        linode-cli longview subscription-view

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-longview-subscription
      operationId: get-longview-subscription
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A Longview Subscription represents a tier of Longview service you can subscribe to.
                properties:
                  clients_included:
                    description: __Read-only__ The number of Longview Clients that may be created with this Subscription tier.
                    example: 10
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 3
                  id:
                    description: __Read-only__ The unique ID of this Subscription tier.
                    enum:
                    - longview-3
                    - longview-10
                    - longview-40
                    - longview-100
                    example: longview-10
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  label:
                    description: __Read-only__ A display name for this Subscription tier.
                    example: Longview Pro 10 pack
                    readOnly: true
                    type: string
                    x-linode-cli-display: 2
                  price:
                    additionalProperties: false
                    description: __Read-only__ Pricing information about this Subscription tier.
                    properties:
                      hourly:
                        description: __Read-only__ The hourly price, in US dollars, for this Subscription tier.
                        example: 0.06
                        readOnly: true
                        type: number
                      monthly:
                        description: __Read-only__ The maximum monthly price in US Dollars for this Subscription tier. You will never be charged more than this amount per month for this subscription.
                        example: 40
                        readOnly: true
                        type: number
                    readOnly: true
                    type: object
                    x-linode-cli-display: 4
                type: object
                x-akamai:
                  file-path: schemas/longview-subscription.yaml
              x-example:
                x-ref: ../examples/get-longview-subscription-200.json
          description: The requested Longview Subscription details.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      summary: Get a Longview subscription
      tags:
      - Longview subscriptions
      x-akamai:
        tabs:
        - syntax: linode-cli longview subscription-view
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: subscription-view
components:
  securitySchemes:
    oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://login.linode.com/oauth/authorize
          scopes:
            account:read_only: Allows access to GET information about your account.
            account:read_write: Allows access to all endpoints related to your account.
            domains:read_only: Allows access to GET Domains on your account.
            domains:read_write: Allows access to all Domain endpoints.
            events:read_only: Allows access to GET your Events.
            events:read_write: Allows access to all endpoints related to your Events.
            firewall:read_only: Allows access to GET information about your Firewalls.
            firewall:read_write: Allows access to all Firewall endpoints.
            images:read_only: Allows access to GET your Images.
            images:read_write: Allows access to all endpoints related to your Images.
            ips:read_only: Allows access to GET your ips.
            ips:read_write: Allows access to all endpoints related to your ips.
            linodes:read_only: Allows access to GET Linodes on your account.
            linodes:read_write: Allow access to all endpoints related to your Linodes.
            lke:read_only: Allows access to GET LKE Clusters on your account.
            lke:read_write: Allows access to all endpoints related to LKE Clusters on your account.
            longview:read_only: Allows access to GET your Longview Clients.
            longview:read_write: Allows access to all endpoints related to your Longview Clients.
            monitor:read-write: Allows access to all Monitor (Akamai Cloud Pulse) endpoints.
            monitor:read_only: Allows access to Monitor (Akamai Cloud Pulse) data.
            nodebalancers:read_only: Allows access to GET NodeBalancers on your account.
            nodebalancers:read_write: Allows access to all NodeBalancer endpoints.
            object_storage:read_only: Allows access to GET information related to your Object Storage.
            object_storage:read_write: Allows access to all Object Storage endpoints.
            stackscripts:read_only: Allows access to GET your StackScripts.
            stackscripts:read_write: Allows access to all endpoints related to your StackScripts.
            volumes:read_only: Allows access to GET your Volumes.
            volumes:read_write: Allows access to all endpoints related to your Volumes.
            vpc:read_write: Allows access to all endpoints related to VPC and Subnet creation, updating, and deletion.
          tokenUrl: https://login.linode.com/oauth/token
      type: oauth2
    personalAccessToken:
      scheme: bearer
      type: http
