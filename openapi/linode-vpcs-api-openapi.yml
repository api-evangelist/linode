                      - Each subnet within a VPC gets a single IPv6 prefix, which must be part of the VPC’s assigned range.

                      - Network interfaces within the subnet can then use one or more `/64` prefixes derived from the subnet’s prefix.

                      - Akamai reserves the first `/64` prefix. This means you can''t use the first `/64` prefix in your subnet.

                      - Not available for `rdma` VPCs'
