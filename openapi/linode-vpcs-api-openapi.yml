openapi: 3.2.0
info:
  title: Linode VPCs API
  version: '1.0'
  description: 'Operations tagged VPCs across 2 of this provider''s published API definitions: linode-api-v4-openapi.yml, linode-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com/v4
  description: Production Server
- url: https://api.linode.com
tags:
- name: VPCs
  description: Create and manage Virtual Private Clouds for isolated network environments and subnets for Linode instances.
paths:
  /vpcs:
    get:
      operationId: getVPCs
      summary: List VPCs
      description: Returns a paginated list of VPCs on your account.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: VPCs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVPCList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createVPC
      summary: Create a VPC
      description: Creates a new VPC in the specified region with optional subnets.
      tags:
      - VPCs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCRequest'
      responses:
        '200':
          description: VPC created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /vpcs/{vpcId}:
    get:
      operationId: getVPC
      summary: Get a VPC
      description: Returns the details for a single VPC.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/vpcIdParam'
      responses:
        '200':
          description: VPC retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: VPC not found
      security:
      - personalAccessToken: []
      - oauth: []
    put:
      operationId: updateVPC
      summary: Update a VPC
      description: Updates the label and description for a VPC.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/vpcIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCUpdateRequest'
      responses:
        '200':
          description: VPC updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: VPC not found
      security:
      - personalAccessToken: []
      - oauth: []
    delete:
      operationId: deleteVPC
      summary: Delete a VPC
      description: Deletes a VPC. The VPC must not have any active subnets with assigned Linode instances.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/vpcIdParam'
      responses:
        '200':
          description: VPC deleted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: VPC not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /vpcs/{vpcId}/subnets:
    get:
      operationId: getVPCSubnets
      summary: List VPC subnets
      description: Returns a paginated list of subnets for a VPC.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/vpcIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: VPC subnets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubnetList'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: VPC not found
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createVPCSubnet
      summary: Create a VPC subnet
      description: Creates a new subnet in the specified VPC.
      tags:
      - VPCs
      parameters:
      - $ref: '#/components/parameters/vpcIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubnetRequest'
      responses:
        '200':
          description: VPC subnet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: VPC not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /{apiVersion}/nodebalancers/{nodeBalancerId}/vpcs:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the NodeBalancer.
      example: '{{nodeBalancerId}}'
      in: path
      name: nodeBalancerId
      required: true
      schema:
        type: integer
      x-akamai:
        file-path: parameters/node-balancer-id.yaml
    x-akamai:
      file-path: paths/node-balancer-vpcs.yaml
      path-info: /{apiVersion}/nodebalancers/{nodeBalancerId}/vpcs
    x-linode-cli-command: nodebalancers
    get:
      description: 'Returns a paginated list of VPC configurations for the NodeBalancer.


        >


        ---


        - __CLI__.


        ```

        linode-cli nodebalancers vpcs-list 12345

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        nodebalancers:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-node-balancer-vpcs
      operationId: get-node-balancer-vpcs
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - id: 6
                  ipv4_range: 10.0.0.12/30
                  ipv6_range: null
                  nodebalancer_id: 8
                  subnet_id: 1
                  vpc_id: 1
                - id: 7
                  ipv4_range: 10.0.1.8/30
                  ipv6_range: null
                  nodebalancer_id: 8
                  subnet_id: 7
                  vpc_id: 1
                page: 1
                pages: 1
                results: 2
              schema:
                additionalProperties: false
                properties:
                  data:
                    example:
                    - id: 6
                      ipv4_range: 10.0.0.12/30
                      ipv6_range: null
                      nodebalancer_id: 8
                      subnet_id: 1
                      vpc_id: 1
                    items:
                      additionalProperties: false
                      description: You can have only one VPC in a NodeBalancer configuration. If any of your backend nodes are VPC Linodes, specify the VPC subnet and CIDR range. NodeBalancer routes traffic to backend VPC nodes through this subnet. Once the NodeBalancer is created, its VPC cannot be changed.
                      properties:
                        id:
                          description: __Read-only__ Identifies the VPC configuration for this NodeBalancer.
                          example: 6
                          readOnly: true
                          type: integer
                        ipv4_range:
                          description: A CIDR range for the VPC's IPv4 addresses. The NodeBalancer sources IP addresses from this range when routing traffic to the backend VPC nodes.
                          example: 10.100.5.100/30
                          type: string
                          x-linode-cli-display: 12
                        ipv4_range_auto_assign:
                          default: false
                          description: 'Enables the use of a larger `ipv4_range` subnet for multiple NodeBalancers within the same VPC by allocating smaller `/30` subnets for each NodeBalancer''s backends.


                            - When set to `true`, the system automatically allocates the smallest possible subnet (`/30`) from the provided `ipv4_range` for the NodeBalancer''s backend interface. If the specified range doesn''t have enough available IPs to allocate a `/30` subnet, the creation fails.


                            - When set to `false`, the NodeBalancer is created using the entire `ipv4_range` as specified, without attempting to allocate a `/30` subnet.'
                          example: false
                          type:
                          - boolean
                          - 'null'
                          x-linode-cli-display: 14
                        nodebalancer_id:
                          description: __Read-only__ Identifies the NodeBalancer.
                          example: 8
                          readOnly: true
                          type: integer
                        subnet_id:
                          description: The VPC's subnet. Run the [List VPCs](https://techdocs.akamai.com/linode-api/reference/get-vpcs) operation provides data for your VPCs and their subnets.
                          example: 1
                          type: integer
                          x-linode-cli-display: 11
                        vpc_id:
                          description: __Read-only__ The `id` of the VPC configured for this NodeBalancer.
                          example: 1
                          readOnly: true
                          type:
                          - integer
                          - 'null'
                      required:
                      - subnet_id
                      type: object
                      x-akamai:
                        file-path: schemas/node-balancer-vpc.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/added-get-node-balancer-vpcs-200.yaml
          description: A paginated list of NodeBalancer VPC configurations.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - nodebalancers:read_only
      summary: List VPC configurations
      tags:
      - VPCs
      x-akamai:
        tabs:
        - syntax: linode-cli nodebalancers vpcs-list 12345
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: nodebalancers:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: vpcs-list
      x-linode-grant: read_only
    servers:
    - url: https://api.linode.com
  /{apiVersion}/nodebalancers/{nodeBalancerId}/vpcs/{nodeBalancerVpcConfigId}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the NodeBalancer.
      example: '{{nodeBalancerId}}'
      in: path
      name: nodeBalancerId
      required: true
      schema:
        type: integer
      x-akamai:
        file-path: parameters/node-balancer-id.yaml
    - description: The VPC configuration `id` for the NodeBalancer.
      example: '{{nodeBalancerVpcConfigId}}'
      in: path
      name: nodeBalancerVpcConfigId
      required: true
      schema:
        example: 7
        type: integer
      x-akamai:
        file-path: parameters/node-balancer-vpc-config-id.yaml
    x-akamai:
      file-path: paths/node-balancer-vpc.yaml
      path-info: /{apiVersion}/nodebalancers/{nodeBalancerId}/vpcs/{nodeBalancerVPCConfigId}
    x-linode-cli-command: nodebalancers
    get:
      description: 'Returns a single VPC configuration for the NodeBalancer ID.


        >


        ---


        - __CLI__.


        ```

        linode-cli nodebalancers vpcs-view \

        12345 7

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        nodebalancers:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-node-balancer-vpc-config
      operationId: get-node-balancer-vpc-config
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: You can have only one VPC in a NodeBalancer configuration. If any of your backend nodes are VPC Linodes, specify the VPC subnet and CIDR range. NodeBalancer routes traffic to backend VPC nodes through this subnet. Once the NodeBalancer is created, its VPC cannot be changed.
                properties:
                  id:
                    description: __Read-only__ Identifies the VPC configuration for this NodeBalancer.
                    example: 6
                    readOnly: true
                    type: integer
                  ipv4_range:
                    description: A CIDR range for the VPC's IPv4 addresses. The NodeBalancer sources IP addresses from this range when routing traffic to the backend VPC nodes.
                    example: 10.100.5.100/30
                    type: string
                    x-linode-cli-display: 12
                  ipv4_range_auto_assign:
                    default: false
                    description: 'Enables the use of a larger `ipv4_range` subnet for multiple NodeBalancers within the same VPC by allocating smaller `/30` subnets for each NodeBalancer''s backends.


                      - When set to `true`, the system automatically allocates the smallest possible subnet (`/30`) from the provided `ipv4_range` for the NodeBalancer''s backend interface. If the specified range doesn''t have enough available IPs to allocate a `/30` subnet, the creation fails.


                      - When set to `false`, the NodeBalancer is created using the entire `ipv4_range` as specified, without attempting to allocate a `/30` subnet.'
                    example: false
                    type:
                    - boolean
                    - 'null'
                    x-linode-cli-display: 14
                  nodebalancer_id:
                    description: __Read-only__ Identifies the NodeBalancer.
                    example: 8
                    readOnly: true
                    type: integer
                  subnet_id:
                    description: The VPC's subnet. Run the [List VPCs](https://techdocs.akamai.com/linode-api/reference/get-vpcs) operation provides data for your VPCs and their subnets.
                    example: 1
                    type: integer
                    x-linode-cli-display: 11
                  vpc_id:
                    description: __Read-only__ The `id` of the VPC configured for this NodeBalancer.
                    example: 1
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                required:
                - subnet_id
                type: object
                x-akamai:
                  file-path: schemas/node-balancer-vpc.yaml
              x-example:
                x-ref: ../examples/get-node-balancer-config-200.json
          description: The requested NodeBalancer VPC configuration.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - nodebalancers:read_only
      summary: Get a VPC configuration
      tags:
      - VPCs
      x-akamai:
        tabs:
        - syntax: "linode-cli nodebalancers vpcs-view \\\n  12345 7"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: nodebalancers:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: vpc-view
      x-linode-grant: read_only
    servers:
    - url: https://api.linode.com
  /{apiVersion}/vpcs:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/vpcs.yaml
      path-info: /{apiVersion}/vpcs
    x-linode-cli-command: vpcs
    post:
      description: 'Create a new VPC and optionally associated VPC Subnets.


        - Users must have the `add_vpc` grant to access this operation.

        - A successful request triggers a `vpc_create` event and `subnet_create` events for any created VPC Subnets.


        Once a VPC is created, it can be attached to a Linode by assigning a VPC Subnet to one of the Linode''s Configuration Profile Interfaces. This step can be accomplished with the following operations:


        - Create a Linode

        - Create a config profile

        - Update a config profile

        - Add a configuration profile interface


        >


        ---


        - __CLI__.


        ```

        linode-cli vpcs create \

        --description "A description of my VPC." \

        --label cool-vpc \

        --region us-east \

        --subnets.label cool-vpc-subnet \

        --subnets.ipv4 10.0.1.0/24

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        vpc:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-vpc
      operationId: post-vpc
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - required:
                - label
                - region
              - properties:
                  subnets:
                    required:
                    - ipv4
                    - label
              - additionalProperties: false
                description: An object describing a VPC belonging to the Account.
                properties:
                  created:
                    description: __Filterable__, __Read-only__ The date-time of VPC creation.
                    example: '2023-07-11T00:00:00'
                    format: date-time
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  description:
                    default: ''
                    description: A written description to help distinguish the VPC.
                    example: A description of my VPC.
                    maxLength: 255
                    type: string
                    x-linode-cli-display: 3
                  id:
                    description: __Filterable__, __Read-only__ The unique ID of the VPC.
                    example: 123
                    readOnly: true
                    type: integer
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                    x-linode-filterable: true
                  label:
                    description: '__Filterable__ The VPC''s label, for display purposes only.


                      - Needs to be unique among the Account''s VPCs.

                      - Can only contain ASCII letters, numbers, and hyphens (`-`). You can''t use two consecutive hyphens (`--`).'
                    example: cool-vpc
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  region:
                    description: __Filterable__ The Region for the VPC.
                    example: us-east
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  subnets:
                    description: A list of subnets associated with the VPC.
                    items:
                      additionalProperties: false
                      description: An object describing a VPC Subnet.
                      properties:
                        created:
                          description: __Filterable__, __Read-only__ The date-time of VPC Subnet creation.
                          example: '2023-07-11T00:00:00'
                          format: date-time
                          readOnly: true
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        id:
                          description: __Filterable__, __Read-only__ The unique ID of the VPC Subnet.
                          example: 456
                          readOnly: true
                          type: integer
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 1
                          x-linode-filterable: true
                        ipv4:
                          description: 'IPv4 range in CIDR canonical form.


                            - The range must belong to a private address space as defined in [RFC1918](https://datatracker.ietf.org/doc/html/rfc1918).

                            - Allowed prefix lengths: 1-29.

                            - The range must not overlap with 192.168.128.0/17.

                            - The range must not overlap with other Subnets on the same VPC.'
                          example: 10.0.1.0/24
                          format: ip
                          type: string
                          x-linode-cli-display: 3
                        label:
                          description: '__Filterable__ The VPC Subnet''s label, for display purposes only.


                            - Must be unique among the VPC''s Subnets.

                            - Can only contain ASCII letters, numbers, and hyphens (`-`). You can''t use two consecutive hyphens (`--`).'
                          example: cool-vpc-subnet
                          maxLength: 64
                          minLength: 1
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        linodes:
                          description: '__Read-only__ An array of Linode IDs assigned to the VPC Subnet.


                            A Linode is assigned to a VPC Subnet if it has a Configuration Profile with a `vpc` purpose interface with the subnet''s `subnet_id`. Even if the Configuration Profile is not active, meaning the Linode does not have access to the Subnet, the Linode still appears in this array.'
                          items:
                            additionalProperties: false
                            properties:
                              id:
                                description: ID of a Linode assigned to the VPC Subnet.
                                example: 111
                                type: integer
                              interfaces:
                                description: VPC purpose interfaces with the subnet's `subnet_id` assigned to the Linode.
                                items:
                                  additionalProperties: false
                                  properties:
                                    active:
                                      description: Returns `true` if the Interface is in use, meaning that the Linode was powered on using the Configuration Profile to which the Interface belongs. Otherwise returns `false`.
                                      example: true
                                      type: boolean
                                    config_id:
                                      description: The globally general entity identifier for the Linode configuration profile that includes the VPC. If this is a VPC Linode interface, the value is `null`.
                                      example: 4567
                                      type:
                                      - integer
                                      - 'null'
                                    id:
