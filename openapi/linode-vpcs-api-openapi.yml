                  nodebalancer_id:
                    description: __Read-only__ Identifies the NodeBalancer.
                    example: 8
                    readOnly: true
                    type: integer
                  subnet_id:
                    description: The VPC's subnet. Run the [List VPCs](https://techdocs.akamai.com/linode-api/reference/get-vpcs) operation provides data for your VPCs and their subnets.
                    example: 1
                    type: integer
                    x-linode-cli-display: 11
                  vpc_id:
                    description: __Read-only__ The `id` of the VPC configured for this NodeBalancer.
                    example: 1
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                required:
                - subnet_id
                type: object
                x-akamai:
                  file-path: schemas/node-balancer-vpc.yaml
              x-example:
                x-ref: ../examples/get-node-balancer-config-200.json
          description: The requested NodeBalancer VPC configuration.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - nodebalancers:read_only
      summary: Get a VPC configuration
      tags:
      - VPCs
      x-akamai:
        tabs:
        - syntax: "linode-cli nodebalancers vpcs-view \\\n  12345 7"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: vpc-view
      x-linode-grant: read_only
      x-linode-iam:
      - permissions:
        - view_nodebalancer_vpc_config
    servers:
    - url: https://api.linode.com
  /{apiVersion}/vpcs:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/vpcs.yaml
      path-info: /{apiVersion}/vpcs
    x-linode-cli-command: vpcs
    post:
      description: 'Create a new VPC and optionally define new subnets within it. A successful request triggers a `vpc_create` event, and `subnet_create` events for any created VPC subnets.


        You can create VPCs as either a `regular` network or a high-speed `rdma` network designed for GPUDirect RDMA clusters.


        By default, a VPC initializes with a standard set of private IPv4 ranges if the `ipv4` field is omitted or `null`. Use the List VPC default and forbidden IPv4 ranges operation to view `default_ipv4_ranges`.


        You can optionally specify up to 30 custom IPv4 ranges (CIDRs) at the VPC level. These ranges serve as the global address pool for the entire VPC, unlike subnet ranges, which apply only to individual subnets. All subnets within the VPC must be contained within these defined ranges. Custom ranges must be provided in canonical, aggregated form and cannot overlap with forbidden infrastructure ranges. Run the List VPC default and forbidden IPv4 ranges operation to view `forbidden_ipv4_ranges`. If you''re specifying the VPC''s IPv4 range, consider the following:

        - The array must contain at least one range. This array represents the desired final state of the VPC''s IPv4 space.

        - All ranges must be provided in canonical format with no host bits set. For example, `10.0.0.0/8` is valid, but `10.1.0.0/8` is rejected.

        - Ranges must be fully aggregated. Overlapping ranges or sub-ranges already contained within a larger prefix are not allowed. For example, you can''t provide both `10.0.0.0/8` and `10.1.0.0/24`.

        - The system automatically sorts the IPv4 ranges using standard Python network sorting logic, the primary sort is by network address, and then by prefix length.


        > 📘 Forbidden ranges

        >

        > Some specific IP ranges are reserved for internal VPC infrastructure and services such as DNS and route management. These ranges are blocked from being assigned as top-level VPC CIDRs to prevent routing conflicts. You can view these forbidden ranges by checking the `forbidden_ipv4_ranges` field.


        After you create a VPC, you can attach it to a Linode by assigning a VPC subnet to one of the Linode''s network interfaces.


        You can also attach managed databases and NodeBalancers to a subnet belonging to a `regular` VPC type.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_vpc`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `vpc:read_write`


        **CLI**


        ```shell

        linode-cli vpcs create \

        --description "A description of my VPC." \

        --label vpc-example \

        --region us-east \

        --subnets.label vpc-subnet-example \

        --subnets.ipv4 10.0.1.0/24

        --ipv4 ''[{"range": "10.0.0.0/8"}, {"range": "172.16.0.0/12"}, {"range": "192.168.0.0/17"}]''

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-vpc
      operationId: post-vpc
      requestBody:
        content:
          application/json:
            examples:
              ex-ipv4:
                summary: IPv4 VPC
                value:
                  created: '2026-07-11T00:00:00'
                  description: A description of my VPC.
                  id: 123
                  ipv4:
                  - range: 10.0.0.0/8
                  - range: 172.16.0.0/12
                  - range: 192.168.0.0/17
                  ipv6:
                  - range: 2001:db8:1234:abcd::/64
                  label: vpc-name
                  region: us-ord
                  subnets:
                  - created: '2026-07-11T00:00:00'
                    databases:
                    - id: 3333
                      ipv4_range: 192.168.0.20/30
                    id: 456
                    ipv4: 10.0.1.0/24
                    label: example-subnet-name
                    linodes:
                    - id: 111
                      interfaces:
                      - active: true
                        config_id: 4567
                        id: 421
                    nodebalancers:
                    - id: 4444
                      ipv4_range: 192.168.0.20/30
                    updated: '2026-09-11T00:00:00'
                    vpc_type: regular
                  updated: '2026-09-11T00:00:00'
                  vpc_type: regular
              ex-ipv6:
                summary: Dual Stack VPC
                value:
                  created: '2025-05-11T00:00:00'
                  description: VPC example.
                  id: 123
                  ipv4: []
                  ipv6:
                  - range: 2001:db8:0:5000::/52
                  label: vpc-example
                  region: us-east
                  subnets:
                  - created: '2025-05-11T00:00:00'
                    databases:
                    - id: 1337
                      ipv4_range: 192.168.0.20/30
                      ipv6_ranges:
                      - range: 2001:DB8::/62
                    id: 456
                    ipv4: 10.0.1.0/24
                    ipv6:
                    - range: 2001:db8:0:5100::/56
                    label: vpc-subnet-test
                    linodes:
                    - id: 111
                      interfaces:
                      - active: true
                        id: 421
                    nodebalancers: []
                    updated: '2025-06-11T00:00:00'
                  updated: '2025-06-11T00:00:00'
                  vpc_type: regular
            schema:
              allOf:
              - required:
                - label
                - region
              - properties:
                  subnets:
                    required:
                    - ipv4
                    - label
              - additionalProperties: false
                description: An object describing a VPC belonging to the Account.
                properties:
                  created:
                    description: __Filterable__, __Read-only__ The date-time of VPC creation.
                    example: '2023-07-11T00:00:00'
                    format: date-time
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  description:
                    default: ''
                    description: A written description to help distinguish the VPC.
                    example: A description of my VPC.
                    maxLength: 255
                    type: string
                    x-linode-cli-display: 3
                  id:
                    description: __Filterable__, __Read-only__ The unique ID of the VPC.
                    example: 123
                    readOnly: true
                    type: integer
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                    x-linode-filterable: true
                  ipv4:
                    description: "The IPv4 ranges belonging to this VPC.\n  - When creating a VPC, if `ipv4` is `null` or omitted, the system applies the VPC's default ranges.\n  - When updating a VPC, if `ipv4` is `null` or omitted, existing ranges remain unchanged.\n  - If provided, the array must contain at least one range.\n  - A single VPC can be configured with a maximum of 30 distinct IPv4 ranges.\n  - Ranges can be defined with a prefix length anywhere from `/5` to `/30`.\n  - Ranges must be unique and must not overlap with restricted ranges defined in `forbidden_ipv4_ranges`.\n  - Ranges must be provided in canonical format with no host bits set. For example, `10.0.0.0/8` is valid, but `10.1.0.0/8` is rejected.\n  - Ranges must be fully aggregated. Overlapping ranges or sub-ranges already contained within a larger prefix are not allowed. For example, you can't provide both `10.0.0.0/8` and `10.1.0.0/24`.`\n  - All subnet ranges must be contained within these VPC IPv4 ranges.\n  - Changing the ranges for a VPC with Linodes is subject to a 15 minute cooldown measured from the last VPC update."
                    items:
                      properties:
                        range:
                          description: The IPv4 network CIDR.
                          example: 10.0.0.0/24
                          type: string
                      type: object
                    maxItems: 30
                    minItems: 1
                    type:
                    - array
                    - 'null'
                  ipv6:
                    description: 'The IPv6 prefix if this `regular` VPC uses IPv6 addressing. IPv6 prefixes can either be automatically allocated from Akamai’s IPv6 address space, or you can use your own IPv6 space. To ensure proper routing, all prefixes need to come from IP ranges that are announced from the same data center where the VPC is located.

                      - Each subnet within a VPC gets a single IPv6 prefix, which must be part of the VPC’s assigned range.

                      - Network interfaces within the subnet can then use one or more `/64` prefixes derived from the subnet’s prefix.

                      - Akamai reserves the first `/64` prefix. This means you can''t use the first `/64` prefix in your subnet.

                      - Not available for `rdma` VPCs'
                    items:
                      additionalProperties: false
                      description: Specifies the IPv6 prefix in CIDR notation allocated to the VPC, along with the source inventory from which this prefix is assigned.
                      properties:
                        allocation_range:
                          default: null
                          description: An IPv6 CIDR block for the VPC.
                          example: 2001:db8:1234::/52
                          type: string
                          x-linode-cli-display: 2
                        range:
                          default: /52
                          description: 'The IPv6 prefix, options include:


                            - An IPv6 prefix that you own, which is not currently assigned to another VPC or network entity, and is located within the same region as the VPC.

                            - A prefix length of `/52`, `/48`, or `/44`, indicating that an IPv6 prefix of that length should be automatically allocated for the VPC. Not all prefixes may be available on your account.

                            - If `allocation_range` is set then `range` can only be a prefix length of `/52`, `/48`, or `/44`.

                            - A value of `auto`, an empty string, or omitted value, indicating that a prefix of the default length `/52` is allocated for the VPC.'
                          example: /52
                          type: string
                          x-linode-cli-display: 1
                      type: object
                      x-akamai:
                        file-path: schemas/vpc-ipv6.yaml
                    maxItems: 1
                    minItems: 0
                    type: array
                  label:
                    description: '__Filterable__ The VPC''s label, for display purposes only.


                      - Needs to be unique among the Account''s VPCs.

                      - Can only contain ASCII letters, numbers, and hyphens (`-`). You can''t use two consecutive hyphens (`--`).'
                    example: vpc-example
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  region:
                    description: __Filterable__ The Region for the VPC.
                    example: us-east
                    type: string
                    x-akamai:
                      labels:
