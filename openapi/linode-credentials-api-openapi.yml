- description: Use these operations to manage the username and password values used to access your MySQL or PostgreSQL Managed Database.
  name: Credentials
paths:
  /{apiVersion}/databases/mysql/instances/{instanceId}/credentials:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the Managed PostgreSQL Database.
      example: '{{instanceId}}'
      in: path
      name: instanceId
      required: true
      schema:
        example: 123458
        type: integer
      x-akamai:
        file-path: parameters/instance-id-path.yaml
    x-akamai:
      file-path: paths/mysql-credentials.yaml
      path-info: /{apiVersion}/databases/mysql/instances/{instanceId}/credentials
    x-linode-cli-command: databases
    get:
      description: 'Display the root username and password for an accessible MySQL Managed Database. The database''s status needs to be `active`.


        >


        ---


        - __CLI__.


        ```

        linode-cli databases mysql-creds-view 123

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-mysql-instance-credentials
      operationId: get-databases-mysql-instance-credentials
      responses:
        '200':
          content:
            application/json:
              example:
                password: s3cur3P@ssw0rd
                username: adevi
              schema:
                additionalProperties: false
                description: Managed Database object for database credentials.
                properties:
                  password:
                    description: __Read-only__ The randomly generated root password for the Managed Database instance.
                    example: s3cur3P@ssw0rd
                    readOnly: true
                    type: string
                    x-linode-cli-display: 2
                  username:
                    description: __Read-only__ The root username for the Managed Database instance.
                    example: linroot
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                type: object
                x-akamai:
                  file-path: schemas/database-credentials.yaml
          description: MySQL Managed Database root username and password.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
