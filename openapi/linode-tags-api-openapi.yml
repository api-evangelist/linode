openapi: 3.2.0
info:
  title: Linode Tags API
  version: '1.0'
  description: 'Operations tagged Tags across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: Use tags to organize and group your various Akamai cloud computing services. You can create a common tag and assign it to similar objects on your account to help organize them.
  name: Tags
paths:
  /{apiVersion}/tags:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/tags.yaml
      path-info: /{apiVersion}/tags
    x-linode-cli-command: tags
    post:
      description: 'Creates a new tag and lets you optionally add it to specific objects. Tags are labels you can attach to objects in your account. Use them to specify and group attributes of objects that are relevant to you. Currently, you can add a tag to your `linodes`, your `nodebalancers`, your `reserved_ipv4_addresses`, the `domains` for your Linodes, and the `volumes` on your Linodes.


        > 📘

        >

        > - This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.

        >

        > - If you don''t add a tag to a supported object with this operation, you can use that object''s update operation to later add the tag you created.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli tags create \

        --label ''example tag'' \

        --linodes 123 \

        --linodes 456 \

        --volumes 9082 \

        --volumes 10003 \

        --reserved_ipv4_addresses "192.0.2.141"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-tag
      operationId: post-tag
      requestBody:
        content:
          application/json:
            example:
              domains:
              - 564
              - 565
              label: example tag
              linodes:
              - 123
              - 456
              nodebalancers:
              - 10301
              - 10501
              reserved_ipv4_addresses:
              - 192.0.2.141
              - 192.0.2.142
              volumes:
              - 9082
              - 10003
            schema:
              additionalProperties: false
              properties:
                domains:
                  description: The `id` values for the domains where you want to apply the tag. You need `read_write` access to each domain. If you don't, the API won't create the tag and you'll receive an error. You can run the [List domains](https://techdocs.akamai.com/linode-api/reference/get-domains) operation to store the `id` for desired domains and to review any `tags` currently applied.
                  example:
                  - 564
                  - 565
                  items:
                    type: integer
                  type: array
                label:
                  description: The name of your tag. This is used for display purposes.
                  example: '{{label}}'
                  maxLength: 50
                  minLength: 3
                  type: string
                linodes:
                  description: The `id` values for the Linodes where you want to apply the tag. You need `read_write` access to each Linode. If you don't, the API won't create the tag and you'll receive an error. You can run the [List Linodes](https://techdocs.akamai.com/linode-api/reference/get-linode-instances) operation to store the `id` for desired Linodes and to review any `tags` currently applied.
                  example:
                  - 123
                  - 456
                  items:
                    type: integer
                  type: array
                nodebalancers:
                  description: The `id` values for the NodeBalancers where you want to apply the tag. You need `read_write` access to each NodeBalancer. If you don't, the API won't create the tag and you'll receive an error. You can run the [List NodeBalancers](https://techdocs.akamai.com/linode-api/reference/get-node-balancers) operation to store the `id` for desired NodeBalancers and to review any `tags` currently applied.
                  example:
                  - 10301
                  - 10501
                  items:
                    type: integer
                  type: array
                reserved_ipv4_addresses:
                  description: The reserved IPv4 addresses where you want to apply the tag. Each IP must be reserved on your account before you can tag it. Run the [Reserve a public IPv4 address](https://techdocs.akamai.com/linode-api/reference/post-reserved-ip) operation to reserve one.
                  example:
                  - 192.0.2.141
                  - 192.0.2.142
                  items:
                    format: ipv4
                    type: string
                  type: array
                volumes:
                  description: The `id` values for the Linode volumes where you want to apply the tag. You need `read_write` access to each volume. If you don't, the API won't create the tag and you'll receive an error. You can run the [List volumes](https://techdocs.akamai.com/linode-api/reference/get-volumes) operation to store the `id` for desired Linode volumes and to review any `tags` currently applied.
                  example:
                  - 9082
                  - 10003
                  items:
                    type: integer
                  type: array
              required:
              - label
              type: object
              x-akamai:
                file-path: schemas/added-post-tag.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                label: example tag
              schema:
                additionalProperties: false
                description: A tag you've created to apply to objects on your account. Tags are for organizational purposes only.
                properties:
                  label:
                    description: The name of the tag used for organization of objects on your account.
                    example: example tag
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/tag.yaml
          description: The new tag.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Create a tag
      tags:
      - Tags
      x-akamai:
        tabs:
        - syntax: "linode-cli tags create \\\n  --label 'example tag' \\\n  --linodes 123 \\\n  --linodes 456 \\\n  --volumes 9082 \\\n  --volumes 10003 \\\n  --reserved_ipv4_addresses \"192.0.2.141\""
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: create
      x-linode-grant: unrestricted only
    get:
      description: 'Returns a paginated list of tags you''ve created on your account. This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli tags list

        linode-cli tags ls

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-tags
      operationId: get-tags
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - label: example tag
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      description: A tag you've created to apply to objects on your account. Tags are for organizational purposes only.
                      properties:
                        label:
                          description: The name of the tag used for organization of objects on your account.
                          example: example tag
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/tag.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/added-get-tags-200.yaml
          description: A paginated list of tags.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List tags
      tags:
      - Tags
      x-akamai:
        tabs:
        - syntax: 'linode-cli tags list

            linode-cli tags ls'
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action:
      - list
      - ls
      x-linode-grant: unrestricted only
    servers:
    - url: https://api.linode.com
  /{apiVersion}/tags/{tagLabel}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The `label` of the tag to access.
      example: '{{tagLabel}}'
      in: path
      name: tagLabel
      required: true
      schema:
        example: production
        type: string
      x-akamai:
        file-path: parameters/tag-label-path.yaml
    x-akamai:
      file-path: paths/tag-label.yaml
      path-info: /{apiVersion}/tags/{tagLabel}
    x-linode-cli-command: tags
    get:
      description: 'Returns a paginated list of all objects you''ve tagged with the specified tag. The response includes a mixed collection of all object types. This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-tagged-objects
      operationId: get-tagged-objects
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - data:
                    alerts:
                      cpu: 180
                      io: 10000
                      network_in: 10
                      network_out: 10
                      transfer_quota: 80
                    backups:
                      available: true
                      enabled: true
                      last_successful: '2018-01-01T00:01:01'
                      schedule:
                        day: Saturday
                        window: W22
                    capabilities:
                    - Block Storage Encryption
                    created: '2018-01-01T00:01:01'
                    disk_encryption: disabled
                    group: Linode-Group
                    has_user_data: true
                    host_uuid: 1a2bcd34e5f67gh8ij901234567kl89mn01opqr2
                    hypervisor: kvm
                    id: 123
                    image: linode/debian13
                    interface_generation: linode
                    ipv4:
                    - 203.0.113.1
                    - 192.0.2.1
                    ipv6: 2001:DB8::/128
                    label: linode123
                    lke_cluster_id: 1
                    placement_group:
                      id: 528
                      label: PG_Miami_failover
                      placement_group_policy: strict
                      placement_group_type: anti_affinity:local
                    region: us-east
                    specs:
                      disk: 81920
                      gpus: 0
                      memory: 4096
                      transfer: 4000
                      vcpus: 2
                    status: running
                    tags:
                    - example tag
                    - another example
                    type: g6-standard-1
                    updated: '2018-01-01T00:01:01'
                    watchdog_enabled: true
                  type: linode
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      properties:
                        data:
                          description: Details on the specific object `type` the tag is assigned to.
                          oneOf:
                          - additionalProperties: false
                            properties:
                              alerts:
                                additionalProperties: false
                                properties:
                                  cpu:
                                    description: The percentage of CPU usage required to trigger an alert. If the average CPU usage over two hours exceeds this value, we'll send you an alert. Your Linode's total CPU capacity is represented as 100%, multiplied by its number of cores. For example, a two-core Linode's CPU capacity is represented as 200%. If you want to be alerted at 90% of a two-core Linode's CPU capacity, set the alert value to `180`. The default value is 90% multiplied by the number of cores. If the value is set to `0` (zero), the alert is disabled.
                                    example: 180
                                    type: integer
                                  io:
                                    description: The amount of disk IO operation per second required to trigger an alert. If the average disk IO over two hours exceeds this value, we'll send you an alert. If set to `0` (zero), this alert is disabled.
                                    example: 10000
                                    type: integer
                                  network_in:
                                    description: The amount of incoming traffic, in Mbit/s, required to trigger an alert. If the average incoming traffic over two hours exceeds this value, we'll send you an alert. If this is set to `0` (zero), the alert is disabled.
                                    example: 10
                                    type: integer
                                  network_out:
                                    description: The amount of outbound traffic, in Mbit/s, required to trigger an alert. If the average outbound traffic over two hours exceeds this value, we'll send you an alert. If this is set to `0` (zero), the alert is disabled.
                                    example: 10
                                    type: integer
                                  transfer_quota:
                                    description: The percentage of network transfer that may be used before an alert is triggered. When this value is exceeded, we'll alert you. If this is set to `0` (zero), the alert is disabled.
                                    example: 80
                                    type: integer
                                type: object
                              backups:
                                additionalProperties: false
                                description: Information about this Linode's backups status. For information about available backups, run [List backups](https://techdocs.akamai.com/linode-api/reference/get-backups).
                                properties:
                                  available:
                                    description: __Read-only__ Whether backups taken for this Linode are available for restoration. Backups undergoing maintenance are not available for restoration.
                                    example: true
                                    readOnly: true
                                    type: boolean
                                  enabled:
                                    description: __Read-only__ If this Linode has the Backup service enabled. To enable backups, run [Enable backups](https://techdocs.akamai.com/linode-api/reference/post-enable-backups).
                                    example: true
                                    readOnly: true
                                    type: boolean
                                  last_successful:
                                    description: __Read-only__ The last successful backup time. Displayed as `null` if there was no previous backup.
                                    example: '2018-01-01T00:01:01'
                                    readOnly: true
                                    type: string
                                  schedule:
                                    additionalProperties: false
                                    properties:
                                      day:
                                        description: The day of the week that your Linode's weekly backup is taken, either `Scheduling` or a day of the week (`Sunday`, `Monday`, `Tuesday`, `Wednesday`, `Thursday`, `Friday`, `Saturday`). If not set manually, a day will be chosen for you. Backups are taken every day, but backups taken on this day are preferred when selecting backups to retain for a longer period. If you don't set this manually, when backups are initially enabled, this may come back as `Scheduling` until the `day` is automatically selected.
                                        enum:
                                        - Scheduling
                                        - Sunday
                                        - Monday
                                        - Tuesday
                                        - Wednesday
                                        - Thursday
                                        - Friday
                                        - Saturday
                                        example: Saturday
                                        type:
                                        - string
                                        - 'null'
                                      window:
                                        description: When your backups will be taken, in UTC. A backups window is a two-hour span of time in which the backup may occur. Possible values are `W0`, `W2`, `W4`, `W6`, `W8`, `W10`, `W12`, `W14`, `W16`, `W18`, `W20`, and `W22`. For example, `W10` indicates that your backups should be taken between 10:00 and 12:00. If you don't choose a backup window, the API automatically assigns one. If you don't set this manually, when backups are initially enabled, this may come back as `Scheduling` until the `window` is automatically selected.
                                        enum:
                                        - Scheduling
                                        - W0
                                        - W2
                                        - W4
                                        - W6
                                        - W8
                                        - W10
                                        - W12
                                        - W14
                                        - W16
                                        - W18
                                        - W20
                                        - W22
                                        example: W22
                                        type:
                                        - string
                                        - 'null'
                                    type: object
                                type: object
                              capabilities:
                                description: __Limited availability__, __Read-only__ A list of capabilities this Linode supports.
                                example:
                                - Block Storage Encryption
                                items:
                                  type: string
                                readOnly: true
                                type: array
                                x-akamai:
                                  status: LA
                              created:
                                description: __Read-only__ When this Linode was created.
                                example: '2018-01-01T00:01:01'
                                readOnly: true
                                type: string
                              disk_encryption:
                                default: enabled
                                description: __Read-only__ Indicates the local disk encryption setting for this Linode, either `enabled` or `disabled`. If the Linode is part of an LKE cluster, the value is `null`.
                                enum:
                                - enabled
                                - disabled
                                example: disabled
                                readOnly: true
                                type:
                                - string
                                - 'null'
                                x-linode-cli-display: 8
                              group:
                                deprecated: true
                                description: __Deprecated__, __Filterable__ The group label for this Linode.
                                example: Linode-Group
                                type: string
                                x-akamai:
                                  labels:
                                  - Filterable
                                  status: DEPRECATED
                                x-linode-filterable: true
                              has_user_data:
                                description: __Read-only__ Whether this Linode was provisioned with `user_data` provided via the Metadata service. See the [Create a Linode](https://techdocs.akamai.com/linode-api/reference/post-linode-instance) description for more information on Metadata.
                                example: true
                                readOnly: true
                                type: boolean
                              host_uuid:
                                description: __Read-only__ The Linode's host machine identifier.
                                example: 1a2bcd34e5f67gh8ij901234567kl89mn01opqr2
                                readOnly: true
                                type: string
                              hypervisor:
                                description: __Read-only__ The virtualization software powering this Linode. The only value currently supported at this time is `kvm` (Kernel-based Virtual Machine).
                                enum:
                                - kvm
                                example: kvm
                                readOnly: true
                                type: string
                              id:
                                description: __Filterable__, __Read-only__ This Linode's unique identifier, which you need to provide for all operations impacting this Linode.
                                example: 123
                                readOnly: true
                                type: integer
                                x-akamai:
                                  labels:
                                  - Filterable
                                x-linode-cli-display: 1
                                x-linode-filterable: true
                              image:
                                allOf:
                                - description: The identifier assigned to the disk image to be deployed to the new Linode. You can run the [List images](https://techdocs.akamai.com/linode-api/reference/get-images) operation with authentication to view all available images, and store the `id` from the applicable one. Official Linode images start with `linode/`, while any custom images available on your account start with `private/`. To create a disk from a `private/` image, you need `read_only` or `read_write` permissions for it. Run the [Update a user's grants](https://techdocs.akamai.com/linode-api/reference/put-user-grants) operation to adjust permissions for a `private/` image, or talk to your local account administrator.
                                  example: linode/debian9
                                  type:
                                  - string
                                  - 'null'
                                example: linode/debian13
                                readOnly: true
                                x-akamai:
                                  labels:
                                  - Filterable
                                x-linode-cli-display: 5
                                x-linode-filterable: true
                              interface_generation:
                                description: __Filterable__, __Read-only__ Indicates if the Linode is configured to use Linode interfaces (`linode`) or legacy configuration profile interfaces (`legacy_config`).
                                enum:
                                - legacy_config
                                - linode
                                example: linode
                                readOnly: true
                                type: string
                                x-akamai:
                                  labels:
                                  - Filterable
                                x-linode-cli-display: 9
                                x-linode-filterable: true
                              ipv4:
                                description: __Filterable__ This Linode's IPv4 Addresses. Each Linode is assigned a single public IPv4 address upon creation, and may get a single private IPv4 address if needed. You may need to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) to get additional IPv4 addresses. IPv4 addresses may be reassigned between your Linodes, or shared with other Linodes. See the [networking](https://techdocs.akamai.com/linode-api/reference/post-firewalls) operations for details.
                                example:
                                - 203.0.113.1
                                - 192.0.2.1
                                items:
                                  format: ipv4
                                  type: string
                                type: array
                                x-akamai:
                                  labels:
                                  - Filterable
                                x-linode-cli-display: 7
                                x-linode-filterable: true
                              ipv6:
                                description: __Read-only__ This Linode's IPv6 SLAAC address. This address is specific to a Linode, and may not be shared. If the Linode has not been assigned an IPv6 address, the return value will be `null`.
                                example: c001:d00d::1337/128
                                format: ipv6-cidr
                                readOnly: true
                                type:
                                - string
                                - 'null'
                              label:
                                description: '__Filterable__ Provides a name for the Linode. If not provided, the API generates one for it. A Linode label has some constraints:


                                  - It needs to begin and end with an alphanumeric character.


