    get:
      description: '__Beta__ This operation returns all interfaces assigned to a specific Linode. They list in the order they were created. On the Linode, interfaces also list in this order, and are typically named `eth0`, `eth1`, `eth2`, and so on. The MAC address is the most reliable method to identify an interface. This operation requires the `read_only` grant for the Linode. The Linode needs to use `interfaces` and not configuration profile interfaces. Run Get account settings to see if Linode interfaces are supported.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes interfaces-list $linodeId

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_only

        ```


        Learn more...'
