      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The unique identifier for a PostgreSQL Managed Database. Run the [List PostgreSQL Managed Databases](https://techdocs.akamai.com/linode-api/reference/get-databases-postgre-sql-instances) operation and store the `id` for the desired one.
      example: '{{postgresqlInstanceId}}'
      in: path
      name: postgresqlInstanceId
      required: true
      schema:
        example: 123458
        type: integer
      x-akamai:
        file-path: parameters/postgresql-instance-id-path.yaml
    x-akamai:
      file-path: paths/postgresql-connection-pools.yaml
      path-info: /{apiVersion}/databases/postgresql/instances/{postgresqlInstanceId}/connection-pools
    x-linode-cli-command: databases
    post:
      description: 'Configure PGBouncer connection pool settings, using our partner Aiven''s specification. You can only create a connection pool on an active cluster in an existing PostgreSQL Managed Database. Run the List PostgreSQL Managed Databases operation, locate the desired database, and verify its `status` is not `suspended`. Then store both its `id`, as your `postgresqlInstanceId`, and its `label`.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_admin`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `databases:read_write`


        **CLI**


        ```shell

        linode-cli databases postgresql-conn-pool-create \

        --database PostgreSQL-DB-video-streaming-data

        --mode session

        --label Connection-Pool-01 \

        --size 10 \

        --username john-doe

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-databases-postgre-sql-conn-pools
      operationId: post-databases-postgre-sql-conn-pools
      requestBody:
        content:
          application/json:
            example:
              database: PostgreSQL-DB-video-streaming-data
              label: Connection-Pool-01
              mode: session
              size: 15
              username: jperez
            schema:
              additionalProperties: false
              description: The PostgreSQL Managed Database connection pool request object.
              properties:
                database:
                  default: defaultdb
                  description: The name of the PostgreSQL Managed Database where the connection pool is assigned. This is the **Database name** value from connection details. To learn how to get this value, see [View connection details](https://techdocs.akamai.com/cloud-computing/docs/aiven-postgresql#view-connection-details).
                  example: '{{database}}'
                  type: string
                label:
                  description: 'The name of the connection pool. These points apply:


                    - It needs to be unique in a database instance.


                    - It can contain alphanumeric characters, underscores, or hyphens, and it can''t start with hyphen.


                    - It has a maximum length of 63 characters.


                    - It can''t be edited once the connection pool is created.'
                  example: '{{label}}'
                  type: string
                mode:
                  default: transaction
