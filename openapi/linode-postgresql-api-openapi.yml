      summary: Get a PostgreSQL Managed Database
      tags:
      - PostgreSQL
      x-akamai:
        tabs:
        - syntax: linode-cli databases postgresql-view 123
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
