        - database_viewer
    put:
      description: 'Make changes to an existing PostgreSQL Managed Database.


        - The database''s status can''t be `suspended`.


        - New values set in the `allow_list` overwrite existing values. To keep existing values, run the List PostgreSQL Managed Databases operation, store the `allow_list` addresses from the response, and include them with any new addresses in this operation.


        - Updates to your `allow_list` may take a short period of time to complete, making this operation inappropriate for rapid successive updates.


        - Also allows resizing the database cluster to a larger one.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the Managed PostgreSQL Database. Use the `updates` object in this operation to modify the maintenance window for these updates.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. Use the `updates` object to adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - You can''t update `engine_config` advanced parameter settings for a suspended database. You''ll need to resume it first.


        - A successful request triggers a `database_update` event.


        - You can update an existing PostgreSQL Managed Database to move it to a Virtual Private Cloud (VPC) using the `private_network` object in the request.


        > 📘

        >

        > Currently, VPC subnets associated with Managed Database instances don''t automatically block outbound connections outside the subnet. To limit network exposure, you should configure Cloud Firewall rules to explicitly deny outbound connections beyond the intended subnet. For more details on configuring rules, see the Cloud Firewall documentation.


        - This operation is asynchronous. The 200 response body with the `provisioning` and `updating` status may contain legacy values.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_admin`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `databases:read_write`


        **CLI**


        ```shell

        linode-cli databases postgresql-update 123 \

        --label example-db \

        --allow_list 203.0.113.1 \

        --allow_list 192.0.1.0/24 \

        --type g6-standard-1 \

        --updates.frequency weekly \

        --updates.duration 3 \

        --updates.hour_of_day 12 \

        --updates.day_of_week 4 \

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-databases-postgre-sql-instance
      operationId: put-databases-postgre-sql-instance
      requestBody:
        content:
          application/json:
            example:
              allow_list:
              - 192.0.2.207/24
              - 192.0.2.134/24
              cluster_size: 2
              engine_config:
                pg:
                  autovacuum_analyze_scale_factor: 1
                  autovacuum_analyze_threshold: 2147483647
                  autovacuum_max_workers: 20
                  autovacuum_naptime: 86400
                  autovacuum_vacuum_cost_delay: 100
                  autovacuum_vacuum_cost_limit: 10000
                  autovacuum_vacuum_scale_factor: 1
                  autovacuum_vacuum_threshold: 2147483647
                  bgwriter_delay: 200
                  bgwriter_flush_after: 512
                  bgwriter_lru_maxpages: 100
                  bgwriter_lru_multiplier: 2.5
                  deadlock_timeout: 1000
                  default_toast_compression: lz4
                  idle_in_transaction_session_timeout: 604800000
                  jit: true
                  max_files_per_process: 1024
                  max_locks_per_transaction: 1024
                  max_logical_replication_workers: 64
                  max_parallel_workers: 96
                  max_parallel_workers_per_gather: 96
                  max_pred_locks_per_transaction: 5120
                  max_replication_slots: 64
                  max_slot_wal_keep_size: 1000000
                  max_stack_depth: 2097152
                  max_standby_archive_delay: 1
                  max_standby_streaming_delay: 10
                  max_wal_senders: 20
                  max_worker_processes: 96
                  password_encryption: scram-sha-256
                  pg_partman_bgw.interval: 3600
                  pg_partman_bgw.role: myrolename
                  pg_stat_monitor.pgsm_enable_query_plan: true
                  pg_stat_monitor.pgsm_max_buckets: 10
                  pg_stat_statements.track: all
                  temp_file_limit: 5000000
                  timezone: Europe/Helsinki
                  track_activity_query_size: 1024
                  track_commit_timestamp: 'on'
                  track_functions: all
                  track_io_timing: 'off'
                  wal_sender_timeout: 60000
                  wal_writer_delay: 200
                pg_stat_monitor_enable: false
                pglookout:
                  max_failover_replication_time_lag: 10
                shared_buffers_percentage: 41.5
                work_mem: 4
              label: example-db
              private_network:
                public_access: false
                subnet_id: 456
                vpc_id: 123
              type: g6-standard-1
              updates:
                day_of_week: 1
                duration: 4
                frequency: weekly
                hour_of_day: 0
              version: '13.2'
            schema:
              additionalProperties: false
              description: Updated information for the Managed PostgreSQL Database.
              properties:
                allow_list:
                  description: 'Controls access to the Managed Database.


                    - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                    - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                    - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                  example:
                  - 203.0.113.1/32
                  - 192.0.1.0/24
                  items:
                    format: ipv4/prefix_length
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                    type: string
                  minItems: 0
                  type: array
                cluster_size:
                  default: 1
                  description: 'The number of Linode instance nodes deployed to the Managed Database, from `1` to `3`. Consider these points when setting a `cluster_size`:


                    - Choose `3` nodes to create a high availability cluster that consists of one `primary` node and two `standby` nodes.


                    - A `2` node cluster is only available with a dedicated plan. It consists of one `primary` node and one `standby` node.'
                  enum:
                  - 1
                  - 2
                  - 3
                  example: '{{cluster_size}}'
                  type: integer
                  x-linode-cli-display: 5
                engine_config:
                  additionalProperties: false
                  description: 'Advanced parameters you can apply to a PostgreSQL Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/postgresql/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                    > 📘

                    >

                    > Aiven may offer additional parameters in their specification. Currently, only those listed here are supported for use in a PostgreSQL Managed Database. You can also run the [List PostgreSQL Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-postgresql-config) operation to see an up-to-date list.'
                  properties:
                    pg:
                      additionalProperties: false
                      description: PostgreSQL-specific advanced configuration parameters.
                      properties:
                        autovacuum_analyze_scale_factor:
                          default: 0.2
                          description: Specifies a fraction of the table size to add to `autovacuum_analyze_threshold` when deciding whether to trigger an `ANALYZE`.
                          example: 1
                          maximum: 1
                          minimum: 0
                          type: number
                        autovacuum_analyze_threshold:
                          default: 50
                          description: Specifies the minimum number of inserted, updated, or deleted tuples needed to trigger an `ANALYZE` in any one table.
                          example: 2147483647
                          maximum: 2147483647
                          minimum: 0
                          type: integer
                        autovacuum_max_workers:
                          default: 3
                          description: Specifies the maximum number of `autovacuum` processes, other than the `autovacuum` launcher, that may be running at any one time. This parameter can only be set at server start.
                          example: 20
                          maximum: 20
                          minimum: 1
                          type: integer
                        autovacuum_naptime:
                          default: 60
                          description: Specifies the minimum delay between `autovacuum` runs on any given database. The delay is measured in seconds.
                          example: 86400
                          maximum: 86400
                          minimum: 1
                          type: integer
                        autovacuum_vacuum_cost_delay:
                          default: 20
                          description: Specifies the cost delay value that will be used in automatic `VACUUM` operations. If `-1` is specified, the regular `vacuum_cost_delay` value will be used.
                          example: 100
                          maximum: 100
                          minimum: -1
                          type: integer
                        autovacuum_vacuum_cost_limit:
                          default: -1
                          description: Specifies the cost limit value that will be used in automatic `VACUUM` operations. The default of `-1` applies the regular `vacuum_cost_limit` value.
                          example: 10000
                          maximum: 10000
                          minimum: -1
                          type: integer
                        autovacuum_vacuum_scale_factor:
                          default: 0.2
                          description: Specifies a fraction of the table size to add to `autovacuum_vacuum_threshold` when deciding whether to trigger a `VACUUM`.
                          example: 1
                          maximum: 1
                          minimum: 0
                          type: number
                        autovacuum_vacuum_threshold:
                          default: 50
                          description: Specifies the minimum number of updated or deleted tuples needed to trigger a `VACUUM` in any one table.
                          example: 2147483647
                          maximum: 2147483647
                          minimum: 0
                          type: integer
                        bgwriter_delay:
                          default: 200
                          description: Specifies the delay between activity rounds for the background writer in milliseconds.
                          example: 200
                          maximum: 10000
                          minimum: 20
                          type: integer
                        bgwriter_flush_after:
                          default: 512
                          description: Whenever more than `bgwriter_flush_after` bytes have been written by the background writer, attempt to force the OS to issue these writes to the underlying storage. Specified in kilobytes. A setting of `0` disables forced writeback.
                          example: 512
                          maximum: 2048
                          minimum: 0
                          type: integer
                        bgwriter_lru_maxpages:
                          default: 100
                          description: In each round, no more than this many buffers will be written by the background writer. Setting this to `0` disables background writing.
                          example: 100
                          maximum: 1073741823
                          minimum: 0
                          type: integer
                        bgwriter_lru_multiplier:
                          default: 2.5
                          description: The average recent need for new buffers is multiplied by bgwriter_lru_multiplier to arrive at an estimate of the number that will be needed during the next round, (up to `bgwriter_lru_maxpages`). `1.0` represents a `\u201cjust` in `time\u201d` policy of writing exactly the number of buffers predicted to be needed. Larger values provide some cushion against spikes in demand, while smaller values intentionally leave writes to be done by server processes.
                          example: 2.5
                          maximum: 10
                          minimum: 0
                          type: number
                        deadlock_timeout:
                          description: This is the amount of time, in milliseconds, to wait on a lock before checking to see if there is a deadlock condition.
                          example: 1000
                          maximum: 1800000
                          minimum: 500
                          type: integer
                        default_toast_compression:
                          default: lz4
