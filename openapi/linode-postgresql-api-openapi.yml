                            minimum: 1
                            type: integer
                          max_standby_streaming_delay:
                            description: Maximum standby streaming delay in milliseconds.
                            example: 10
                            maximum: 43200000
                            minimum: 1
                            type: integer
                          max_wal_senders:
                            description: PostgreSQL maximum write ahead log (WAL) senders.
                            example: 20
                            maximum: 64
                            minimum: 20
                            type: integer
                          max_worker_processes:
                            description: Maximum number of background processes that the system can support.
                            example: 96
                            maximum: 96
                            minimum: 8
                            type: integer
                          password_encryption:
                            default: scram-sha-256
                            description: Chooses the algorithm for encrypting passwords, either `scram-sha-256` or `md5`.
                            enum:
                            - scram-sha-256
                            - md5
                            example: scram-sha-256
                            type: string
                          pg_partman_bgw.interval:
                            description: Sets the time interval to run `pg_partman` scheduled tasks.
                            example: 3600
                            maximum: 604800
                            minimum: 3600
                            type: integer
                          pg_partman_bgw.role:
                            description: Controls which role to use for `pg_partman` scheduled background tasks.
                            example: myrolename
                            type: string
                          pg_stat_monitor.pgsm_enable_query_plan:
                            description: Enables query plan monitoring.
                            example: true
                            type: boolean
                          pg_stat_monitor.pgsm_max_buckets:
                            description: Sets the maximum number of buckets.
                            example: 10
                            maximum: 10
                            minimum: 1
                            type: integer
                          pg_stat_statements.track:
                            default: top
                            description: Controls which statements are counted. Specify `top` to track top-level statements that are issued directly by clients, `all` to also track nested statements, such as those invoked within functions, or `none` to disable statement statistics collection.
                            enum:
                            - all
                            - top
                            - none
                            example: all
                            type: string
                          synchronous_replication:
                            description: Used to enable synchronous replication per Aiven's [specification](https://aiven.io/docs/products/alloydbomni/reference/advanced-params#synchronous_replication). This is only supported for PostgreSQL Managed Database clusters with three nodes.
                            enum:
