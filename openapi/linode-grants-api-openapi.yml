                    additionalProperties: false
                    description: The grants the user has to all resources on your account.
                    properties:
                      account_access:
                        description: 'The level of access this user has to account-level actions, like billing information and user management.


                          > 📘

                          >

                          > A `restricted` user can''t be used to manage users, even if this is set to `read-write`. Only unrestricted users can manage other users on an account.


                          __Parent and child accounts__


                          In a [parent and child account](https://www.linode.com/docs/guides/parent-child-accounts/) environment, this grant can be added to a child account user, to give the user `read-write` access. This gives the child user unrestricted access to expected management operations, such as creating other child users. However, child users don''t have write access to billing operations. The API issues a specific error message if a write operation is attempted by a child user.'
                        enum:
                        - read_only
                        - read_write
                        example: read_only
                        type:
                        - string
                        - 'null'
                      add_databases:
                        description: Whether this user can add Managed Databases on the account.
                        example: true
                        type: boolean
                      add_domains:
                        description: Whether this user can add domains on the account.
                        example: true
                        type: boolean
                      add_firewalls:
                        description: Whether this user can add Firewalls on the account.
                        example: true
