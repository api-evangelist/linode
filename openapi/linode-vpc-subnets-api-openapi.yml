openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode VPC subnets API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Use the VPC subnet endpoints to view, create, and manage Virtual Private Cloud (VPC) subnet resources.
  name: VPC subnets
paths:
  /{apiVersion}/vpcs/{vpcId}/subnets:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The `id` of the VPC.
      example: '{{vpcId}}'
      in: path
      name: vpcId
      required: true
      schema:
        example: 527
        type: integer
      x-akamai:
        file-path: parameters/vpc-id.yaml
    x-akamai:
      file-path: paths/subnets.yaml
      path-info: /{apiVersion}/vpcs/{vpcId}/subnets
    x-linode-cli-command: vpcs
    post:
      description: 'Create a VPC subnet within an existing VPC.


        A successful request triggers a `subnet_create` event.


        After you create a VPC subnet, you can attach it to a Linode by assigning the subnet to one of the Linode''s network interfaces. You can also attach managed databases and NodeBalancers.


        If the subnet''s VPC is an `rdma` network type, consider the following when creating a subnet:


        - Your account must include the required capability to create a subnet in an RDMA VPC.

        - RDMA subnets don''t support routing outside the VPC or NAT gateways.

        - RDMA subnets currently support only IPv4 addressing.

        - You can''t attach managed databases or NodeBalancers to an RDMA subnet. These subnets are dedicated exclusively to interconnected RDMA instance interfaces.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_vpc_subnet`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `vpc:read_write`


        **CLI**


        ```shell

        linode-cli vpcs subnet-create $vpcId \

        --label vpc-subnet-example \

        --ipv4 10.0.1.0/24 \

        --ipv6.range /56

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-vpc-subnet
      operationId: post-vpc-subnet
      requestBody:
        content:
          application/json:
            example:
              created: '2025-05-11T00:00:00'
              databases:
              - id: 1337
                ipv4_range: 192.168.0.20/30
                ipv6_ranges:
                - range: 2001:DB8::/62
              id: 456
              ipv4: 10.0.1.0/24
              ipv6:
              - range: 2001:db8:0:5100::/56
              label: vpc-subnet-example
              linodes:
              - id: 111
                interfaces:
                - active: true
                  config_id: 4567
                  id: 421
              nodebalancers:
              - id: 4444
                ipv4_range: 192.168.0.20/30
                ipv6_ranges:
                - range: 2001:DB8::/62
              updated: '2025-05-11T00:00:00'
              vpc_type: regular
            schema:
              description: The VPC subnet's IPv4 or IPv6 or dual stack.
              oneOf:
              - additionalProperties: false
                description: VPC subnet create request object.
                properties:
                  ipv4:
                    description: 'IPv4 range in CIDR canonical form.


                      - The range must belong to a private address space as defined in [RFC1918](https://datatracker.ietf.org/doc/html/rfc1918).

                      - Allowed prefix lengths: 1-29.

                      - The range must not overlap with 192.168.128.0/17.

                      - The range must not overlap with other Subnets on the same VPC.'
                    example: 10.0.1.0/24
                    format: ip
                    type: string
                    x-linode-cli-display: 3
                  label:
                    description: '__Filterable__ The VPC subnet''s unique label that is used as an identifier for the VPC subnet.


                      - Must be unique among the VPC''s subnets.

                      - Can only contain ASCII letters, numbers, and dashes (`-`). You can''t use two consecutive dashes (`--`).'
                    example: vpc-subnet-example
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                required:
                - label
                - ipv4
                title: IPv4 only
                type: object
                x-akamai:
                  file-path: schemas/added-post-vpc-subnet-ipv4.yaml
              - additionalProperties: false
                description: VPC subnet create request object.
                properties:
                  ipv6:
                    description: 'The IPv6 prefix for the subnet of a `regular` VPC. Options include:


                      - The IPv6 prefix in CIDR notation (such as `2001:db8:115:200::/54`) within the VPC''s allocated IPv6 space. Ensure that this new subnet prefix does not overlap with any existing prefixes owned by other subnets on the same VPC.

                      - The default `auto` allows the system to automatically allocate an IPv6 prefix. This results in the allocation of a `/56` prefix if the VPC has enough aligned, and unallocated space within its prefixes for the request.

                      - A prefix length preceded by a slash (such as `/56`). This results in the allocation of a prefix of the specified length.


                      Optionally, you can specify an `allocation_range` to constrain the area from which the system can allocate the subnet. If you provide an `allocation_range`, the `range` must be any size starting from the VPC prefix length down to `/62`. The final assigned prefix will be within both the VPC''s CIDR block and the `allocation_range`, and must fit entirely within the smallest of the two ranges.


                      Once an IPv6 prefix is assigned to a subnet, it can''t be changed. To modify the prefix, delete and recreate the subnet.'
                    items:
                      additionalProperties: false
                      properties:
                        allocation_range:
                          description: An IPv6 CIDR block that limits where the subnet can be allocated. It must overlap with the VPC's CIDR block. The `range` must be contained within the smallest of `allocation_range` and the VPC's range.
                          example: 2001:db8:1234::/56
                          type: string
                        range:
                          default: auto
                          description: "The range to allocate:\n  - A specific IPv6 CIDR, such as `2001:db8::/64`,\n  - The string `\"auto\"` (default),\n  - A prefix length from `/52` to `/62` to request an auto-assigned range of that size.\n\nIf `allocation_range` is set, then `range` must be a prefix length."
                          enum:
                          - auto
                          - /56
                          - /52
                          - /53
                          - /54
                          - /55
                          - /57
                          - /58
                          - /59
                          - /60
                          - /61
                          - /62
                          type: string
                      type: object
                    maxItems: 1
                    type: array
                  label:
                    description: '__Filterable__ The VPC subnet''s unique label that is used as an identifier for the VPC subnet.


                      - Must be unique among the VPC''s subnets.

                      - Can only contain ASCII letters, numbers, and dashes (`-`). You can''t use two consecutive dashes (`--`).'
                    example: vpc-subnet-example
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                required:
                - label
                - ipv6
                title: IPv6 only
                type: object
                x-akamai:
                  file-path: schemas/added-post-vpc-subnet-ipv6.yaml
              - additionalProperties: false
                description: VPC subnet create request object.
                properties:
                  ipv4:
                    description: 'IPv4 range in CIDR canonical form.


                      - The range must belong to a private address space as defined in [RFC1918](https://datatracker.ietf.org/doc/html/rfc1918).

                      - Allowed prefix lengths: 1-29.

                      - The range must not overlap with 192.168.128.0/17.

                      - The range must not overlap with other Subnets on the same VPC.'
                    example: 10.0.1.0/24
                    format: ip
                    type: string
                    x-linode-cli-display: 3
                  ipv6:
                    description: 'The IPv6 prefix for the subnet of a `regular` VPC. Options include:


                      - The IPv6 prefix in CIDR notation (such as `2001:db8:115:200::/54`) within the VPC''s allocated IPv6 space. Ensure that this new subnet prefix doesn''t overlap with any existing prefixes owned by other subnets on the same VPC.

                      - The default `auto` allows the system to automatically allocate an IPv6 prefix. This results in the allocation of a `/56` prefix if the VPC has enough aligned, and unallocated space within its prefixes for the request.

                      - A prefix length preceded by a slash (such as `/56`). This results in the allocation of a prefix of the specified length.


                      Optionally, you can specify an `allocation_range` to constrain the area from which the system can allocate the subnet. If you provide an `allocation_range`, the `range` must be any size starting from the VPC prefix length down to `/62`. The final assigned prefix will be within both the VPC''s CIDR block and the `allocation_range`, and must fit entirely within the smallest of the two ranges.


                      Once an IPv6 prefix is assigned to a subnet, it can''t be changed. To modify the prefix, delete and recreate the subnet.'
                    items:
                      additionalProperties: false
                      properties:
                        allocation_range:
                          description: An IPv6 CIDR block that limits where the subnet can be allocated. It must overlap with the VPC's CIDR block. The `range` must be contained within the smallest of `allocation_range` and the VPC's range.
                          example: 2001:db8:1234::/56
                          type: string
                        range:
                          default: auto
                          description: "The range to allocate:\n  - A specific IPv6 CIDR, such as `2001:db8::/64`,\n  - The string `\"auto\"` (default),\n  - A prefix length from `/52` to `/62` to request an auto-assigned range of that size.\n\nIf `allocation_range` is set, then `range` must be a prefix length."
                          enum:
                          - auto
                          - /56
                          - /52
                          - /53
                          - /54
                          - /55
                          - /57
                          - /58
                          - /59
                          - /60
                          - /61
                          - /62
                          type: string
                      type: object
                    maxItems: 1
                    type: array
                  label:
                    description: '__Filterable__ The VPC subnet''s unique label that is used as an identifier for the VPC subnet.


                      - Must be unique among the VPC''s subnets.

                      - Can only contain alphanumeric characters and non-consecutive dashes (`-`).'
                    example: vpc-subnet-example
                    maxLength: 64
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                required:
                - label
                - ipv4
                - ipv6
                title: IPv4 and IPv6
                type: object
                x-akamai:
                  file-path: schemas/added-post-vpc-subnet-ipv4-ipv6.yaml
              x-akamai:
                file-path: schemas/added-post-vpc-subnet.yaml
