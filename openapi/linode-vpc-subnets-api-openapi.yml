                            description: "The range to allocate:\n  - A specific IPv6 CIDR, such as `2001:db8::/64`,\n  - The string `\"auto\"` (default),\n  - A prefix length from `/52` to `/62` to request an auto-assigned range of that size.\n\nIf `allocation_range` is set, then `range` must be a prefix length."
                            enum:
                            - auto
                            - /56
                            - /52
                            - /53
                            - /54
                            - /55
                            - /57
                            - /58
                            - /59
                            - /60
                            - /61
                            - /62
                            type: string
                        type: object
                      maxItems: 1
                      type: array
                    label:
                      description: '__Filterable__ The VPC subnet''s unique label that is used as an identifier for the VPC subnet.


                        - Must be unique among the VPC''s subnets.

                        - Can only contain ASCII letters, numbers, and dashes (`-`). You can''t use two consecutive dashes (`--`).'
                      example: vpc-subnet-example
                      maxLength: 64
                      minLength: 1
                      type: string
                      x-akamai:
                        labels:
                        - Filterable
                      x-linode-cli-display: 2
                      x-linode-filterable: true
                    linodes:
                      description: '__Read-only__ An array of Linode IDs assigned to the VPC Subnet.


                        A Linode is assigned to a VPC Subnet if it has a Configuration Profile with a `vpc` purpose interface with the subnet''s `subnet_id`. Even if the Configuration Profile is not active, meaning the Linode does not have access to the Subnet, the Linode still appears in this array.'
                      items:
                        additionalProperties: false
                        properties:
                          id:
                            description: ID of a Linode assigned to the VPC Subnet.
                            example: 111
                            type: integer
                          interfaces:
