                                  type: string
                              type: object
                            readOnly: true
                            type:
                            - array
                            - 'null'
                        type: object
                        x-linode-cli-display: 7
                      readOnly: true
                      type: array
                    updated:
                      description: __Filterable__, __Read-only__ The date-time of the most recent VPC Subnet update.
                      example: '2023-09-11T00:00:00'
                      format: date-time
                      readOnly: true
                      type:
