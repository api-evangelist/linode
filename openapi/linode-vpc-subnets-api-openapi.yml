                              properties:
                                range:
                                  description: An IPv6 address range in CIDR notation.
                                  example: 2830:0:0:4::/62
                                  type: string
                              type: object
                            readOnly: true
                            type:
                            - array
                            - 'null'
                        type: object
                      readOnly: true
                      type: array
                      x-linode-cli-display: 6
                    id:
                      description: __Filterable__, __Read-only__ The unique ID of the VPC Subnet.
                      example: 456
                      readOnly: true
                      type: integer
                      x-akamai:
                        labels:
                        - Filterable
                      x-linode-cli-display: 1
                      x-linode-filterable: true
                    ipv6:
                      description: 'The IPv6 prefix for the subnet of a `regular` VPC. Options include:


                        - The IPv6 prefix in CIDR notation (such as `2001:db8:115:200::/54`) within the VPC''s allocated IPv6 space. Ensure that this new subnet prefix does not overlap with any existing prefixes owned by other subnets on the same VPC.

                        - The default `auto` allows the system to automatically allocate an IPv6 prefix. This results in the allocation of a `/56` prefix if the VPC has enough aligned, and unallocated space within its prefixes for the request.

                        - A prefix length preceded by a slash (such as `/56`). This results in the allocation of a prefix of the specified length.


