openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Quotas API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Quotas are limits related to your resource usage in Object Storage. Use these operations to review and manage your Object Storage quotas.
  name: Quotas
paths:
  /{apiVersion}/object-storage/global-quotas:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/object-storage-global-quotas.yaml
      path-info: /{apiVersion}/object-storage/global-quotas
    x-linode-cli-command: object-storage
    get:
      description: 'Returns the active Object Storage-related global quotas applied to your account, such as the maximum number of access keys. The operation includes any quota overrides in the response.


        > 📘

        >

        > You can''t combine parameters when filtering with this operation. Only a single filterable parameter can be used.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `object_storage:read_only`


        **CLI**


        ```shell

        linode-cli object-storage global-quotas-list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-object-storage-global-quotas
      operationId: get-object-storage-global-quotas
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - description: Current number of access keys per account
                  has_usage: true
                  quota_id: keys
                  quota_limit: 100
                  quota_name: Number of Access Keys
                  quota_type: keys
                  resource_metric: key
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      description: The current Object Storage-related quotas on your account.
                      properties:
                        description:
                          description: A description for the Object Storage-related global quota.
                          type: string
                          x-linode-cli-display: 3
                        has_usage:
                          description: Indicates whether usage metrics are collected for this quota. If `true`, you can use the [Get Object Storage global quota usage](https://techdocs.akamai.com/linode-api/reference/get-object-storage-global-quota-usage) operation to see the current usage for this quota.
                          type: boolean
                          x-linode-cli-display: 7
                        quota_id:
                          description: Identifies the Object Storage-related quota.
                          type: string
                          x-linode-cli-display: 1
                        quota_limit:
                          description: The maximum quantity of the `resource_metric` allowed by the quota.
                          type: integer
                          x-linode-cli-display: 5
                        quota_name:
                          description: __Filterable__ The human-readable name of the Object Storage-related global quota. Currently the only available quota is named `Number of Access Keys`.
                          enum:
                          - Number of Access Keys
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        quota_type:
                          description: 'Identifies the type of Object Storage global quota. Currently only one type of Object Storage global quota is available:


                            - `keys`: Current number of access keys per account'
                          enum:
                          - keys
                          type: string
                          x-linode-cli-display: 6
                        resource_metric:
                          description: The specific Object Storage-based resource for the global quota. Currently the only resource metric for Object Storage global quotas is `key`, which refers to access keys.
                          enum:
                          - key
                          type: string
                          x-linode-cli-display: 4
                      type: object
                      x-akamai:
                        file-path: schemas/object-storage-global-quota.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/object-storage-global-quotas.yaml
          description: A paginated list of Object Storage-related global quotas applied to your account.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - object_storage:read_only
