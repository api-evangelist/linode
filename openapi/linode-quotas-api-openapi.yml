      operationId: get-object-storage-quotas
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - description: Current number of buckets per account, per endpoint
                  endpoint_type: E1
                  has_usage: true
                  quota_id: obj-buckets-us-sea-1.linodeobjects.com
