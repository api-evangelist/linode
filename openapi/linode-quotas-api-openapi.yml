                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      description: An Object Storage-related quota on your account.
                      properties:
                        description:
                          description: A description for the Object Storage-related quota.
                          type: string
                          x-linode-cli-display: 3
                        endpoint_type:
                          description: The type of `s3_endpoint`, either `E0`, `E1`, `E2`, or `E3`. See [Endpoint types](https://techdocs.akamai.com/cloud-computing/docs/endpoint-types) for more information.
                          enum:
                          - E0
                          - E1
                          - E2
                          - E3
                          type: string
                          x-linode-cli-display: 6
                        has_usage:
                          description: Indicates whether usage metrics are collected for this quota. If `true`, you can use the [Get Object Storage quota usage](https://techdocs.akamai.com/linode-api/reference/get-object-storage-quota-usage) operation to see the current usage for this quota.
                          type: boolean
                          x-linode-cli-display: 8
                        quota_id:
                          description: Identifies the Object Storage-related quota. Formatted as `<quota_type>-<s3_endpoint>`.
                          type: string
                          x-linode-cli-display: 1
                        quota_limit:
                          description: The maximum quantity of the `resource_metric` allowed by the quota.
                          type: integer
                          x-linode-cli-display: 5
                        quota_name:
                          description: '__Filterable__ The human-readable name of the Object Storage-related quota. Values include:


                            - `Number of Buckets`

                            - `Number of Objects`

                            - `Total Capacity`

                            - `Ingress Throughput (per endpoint)`

                            - `Egress Throughput (per endpoint)`

                            - `Ingress Throughput (per IP)`

                            - `Egress Throughput (per IP)`'
                          enum:
                          - Number of Objects
                          - Number of Buckets
                          - Total Capacity
                          - Ingress Throughput (per endpoint)
                          - Egress Throughput (per endpoint)
                          - Ingress Throughput (per IP)
                          - Egress Throughput (per IP)
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        quota_type:
                          description: 'Identifies the type of Object Storage quota. Values include:


                            - `obj-buckets`: Current number of buckets per account, per endpoint

                            - `obj-objects`: Current number of objects per account, per endpoint

                            - `obj-bytes`: Current total capacity per account, per endpoint

                            - `obj-total-ingress-throughput`: Current total ingress bandwidth per account, per endpoint

                            - `obj-total-egress-throughput`: Current total egress bandwidth per account, per endpoint

                            - `obj-per-ip-ingress-throughput`: Current ingress bandwidth per account, per destination IP address

                            - `obj-per-ip-egress-throughput`: Current egress bandwidth per account, per destination IP address'
                          enum:
                          - obj-buckets
                          - obj-objects
                          - obj-bytes
                          - obj-total-ingress-throughput
                          - obj-total-egress-throughput
                          - obj-per-ip-ingress-throughput
                          - obj-per-ip-egress-throughput
                          type: string
                          x-linode-cli-display: 7
                        resource_metric:
                          description: The specific Object Storage-based resource for the quota, either `bucket`, `object`, `byte`, or `byte_per_second`.
                          enum:
                          - bucket
                          - object
                          - byte
                          - byte_per_second
                          type: string
                          x-linode-cli-display: 4
                        s3_endpoint:
                          description: __Filterable__ The URL for the s3 endpoint where the quota applies. Every `s3_endpoint` exists in a specific Akamai Cloud Computing data center (`region`). Run the [List Object Storage endpoints](https://techdocs.akamai.com/linode-api/reference/get-object-storage-endpoints) operation to see more specifics on this `s3_endpoint`.
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 9
                          x-linode-filterable: true
                      type: object
                      x-akamai:
                        file-path: schemas/object-storage-quota.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
