    x-linode-cli-command: object-storage
    get:
      description: 'Returns the active Object Storage-related quotas applied to your account. For example, you may have a quota for the maximum number of buckets you can have on a single endpoint. The operation includes any quota overrides in the response.


        > 📘

        >

        > You can''t combine parameters when filtering with this operation. Only a single filterable parameter can be used.


        **Permissions and scopes**


        To call this operation, you need the following:


