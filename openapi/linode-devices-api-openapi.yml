    post:
      description: 'Creates a firewall device, which assigns a firewall to a service (referred to as the device''s `entity`) and applies the firewall''s rules to the device.


        - Currently, devices with `linode`, `linode_interface`, and `nodebalancer` entity types are accepted.

        - The `linode` type is not allowed for Linodes using Linode interfaces.

        - The `linode_interface` type is not allowed for legacy config interfaces. For VPC and public legacy config profile interfaces, the firewall is applied through the `linode` device.

        - The `linode_interface` type only supports regular Linode interfaces, (public or VPC Linode interfaces).


        - Firewalls only apply to inbound TCP traffic to NodeBalancers.


        - A firewall can be assigned to multiple services at a time.


        - A service can have one assigned firewall at a time.


        - Assigned Linodes must not have any ongoing live migrations.


        - A `firewall_device_add` event is generated when the firewall device is added successfully.


        - RDMA VPC interfaces don''t support firewalls and can''t be assigned to a firewall device.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_firewall_device`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `firewall:read_write`


        **CLI**


        ```shell

        linode-cli firewalls device-create 123 \

        --id 456 \

        --type "linode"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-firewall-device
      operationId: post-firewall-device
      requestBody:
        content:
          application/json:
            example:
              id: 123
              type: linode
            schema:
              allOf:
              - additionalProperties: false
                description: The Linode, NodeBalancer, or Linode interface this firewall is assigned to.
                properties:
                  id:
                    description: The entity's ID.
                    example: 123
                    type: integer
                  label:
                    description: __Read-only__ The entity's label.
                    example: my-linode
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  parent_entity:
                    additionalProperties: false
                    description: __Read-only__ The Linode this `linode_interface` is assigned to. Returns `null` when the entity `type` is `linode` or `nodebalancer`.
                    properties:
                      id:
                        description: The ID of the Linode assigned to this `linode_interface`.
                        example: 5000
                        type: integer
                      label:
                        description: The name of the Linode this `linode_interface` is assigned to.
                        example: linode5000
                        type: string
                      parent_entity:
                        description: __Read-only__ Currently, no parent entity has a parent of its own. Each `parent_entity` will have its own `parent_entity` set to `null`.
