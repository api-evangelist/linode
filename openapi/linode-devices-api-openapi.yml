                        readOnly: true
                        type:
                        - string
                        - 'null'
                      type:
                        description: A Linode interface’s `parent_entity` is a Linode.
                        enum:
                        - linode
                        example: linode
                        type: string
                      url:
                        description: The API URL path you can use to access this entity.
                        example: /v4/linode/instances/5000
                        format: url
                        type: string
                    readOnly: true
                    type:
                    - object
                    - 'null'
                  type:
                    description: The entity's type.
                    enum:
                    - linode
                    - nodebalancer
                    - linode_interface
                    example: linode
                    type: string
                  url:
                    description: __Read-only__ The API URL path you can use to access this entity.
                    example: /v4/linode/instances/123
                    format: url
                    readOnly: true
                    type: string
                type: object
              required:
