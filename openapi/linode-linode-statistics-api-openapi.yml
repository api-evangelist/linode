openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Linode statistics API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to review various statistics for your Linodes.
  name: Linode statistics
paths:
  /{apiVersion}/linode/instances/{linodeId}/stats:
