      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: ID of the Linode to look up.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path.yaml
    x-akamai:
      file-path: paths/linode-stats.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/stats
    x-linode-cli-command: linodes
    get:
      description: 'Returns CPU, IO, IPv4, and IPv6 statistics for your Linode for the past 24 hours.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_linode_stats`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_only`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-linode-stats
      operationId: get-linode-stats
      responses:
        '200':
          content:
            application/json:
              example:
                cpu:
                - - - 1521483600000
                    - 0.42
                io:
                  io:
                  - - - 1521484800000
                      - 0.19
                  swap:
                  - - - 1521484800000
                      - 0
                netv4:
                  in:
                  - - - 1521484800000
                      - 2004.36
                  out:
                  - - - 1521484800000
                      - 3928.91
                  private_in:
                  - - - 1521484800000
                      - 0
                  private_out:
                  - - - 1521484800000
                      - 5.6
                netv6:
                  in:
                  - - - 1521484800000
                      - 0
                  out:
                  - - - 1521484800000
                      - 0
                  private_in:
                  - - - 1521484800000
                      - 195.18
                  private_out:
                  - - - 1521484800000
                      - 5.6
                title: linode.com - my-linode (linode123456) - day (5 min avg)
              schema:
                additionalProperties: false
                description: CPU, IO, IPv4, and IPv6 statistics. Graph data, if available, is in `[timestamp, reading]` array format. Timestamp is a UNIX timestamp in EST.
                properties:
                  cpu:
                    description: Percentage of CPU used.
                    example:
                    - 0.42
                    - 1521483600000
                    items:
                      items:
                        type: number
                      type: array
                    type: array
                  io:
                    additionalProperties: false
                    description: Input/Output statistics.
                    properties:
                      io:
                        description: Block/s written.
                        example:
                        - 1521484800000
                        - 0.19
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      swap:
                        description: Block/s written.
                        example:
                        - 1521484800000
                        - 0
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                    type: object
                  netv4:
                    additionalProperties: false
                    description: IPv4 statistics.
                    properties:
                      in:
                        description: Input stats for IPv4, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 2004.36
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      out:
                        description: Output stats for IPv4, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 3928.91
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      private_in:
                        description: Private IPv4 input statistics, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 0
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      private_out:
                        description: Private IPv4 output statistics, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 5.6
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                    type: object
                  netv6:
                    additionalProperties: false
                    description: IPv6 statistics.
                    properties:
                      in:
                        description: Input stats for IPv6, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 0
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      out:
                        description: Output stats for IPv6, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 0
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      private_in:
                        description: Private IPv6 input statistics, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 195.18
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                      private_out:
                        description: Private IPv6 output statistics, measured in bits/s (bits/second).
                        example:
                        - 1521484800000
                        - 5.6
                        items:
                          items:
                            type: number
                          type: array
                        type: array
                    type: object
                  title:
                    description: The title for this data set.
                    example: linode.com - my-linode (linode123456) - day (5 min avg)
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/linode-stats.yaml
          description: The Linode's stats for the past 24 hours.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - linodes:read_only
      summary: Get daily Linode statistics
      tags:
      - Linode statistics
      x-linode-cli-action: stats
      x-linode-cli-skip: true
      x-linode-iam:
      - permissions:
        - view_linode_stats
