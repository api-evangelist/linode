        file-path: parameters/api-version-path.yaml
    - description: ID of the Linode to clone.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path-8a1bf096.yaml
    x-akamai:
      file-path: paths/linode-clone.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/clone
    x-linode-cli-command: linodes
    post:
      description: 'Clone your Linode''s existing disks, configuration profiles, and interfaces to another Linode on your account. Consider these points before cloning a Linode:


        - Cloning to a new Linode incurs a charge on your account.


        - If cloning to an existing Linode, any actions currently running or queued need to finish before you can clone to it.


        - You can run up to five concurrent clone operations, from a single Linode. If you exceed this limit, you''ll receive an HTTP 400 error.


        - For Linodes using Linode interfaces, the region where you want the clone to live also needs to support Linode interfaces. You can run the GET a region operation to see what''s supported. Your user''s account settings also need ot be set to allow creation of Linodes with Linode interfaces.


        - Any tags you have set on your source Linode will be cloned to the target Linode.


        - If your source Linode is protected with a resource lock, the lock is _not included_ on the clone. You''ll need to add a new resource lock if you want to protect the clone.


        - If the target Linode uses Metadata, with `has_user_data` set to `true`, you need to create the clone with `metadata.user_data` in the request.


        - If the target Linode has a `vpc` interface on its active legacy configuration profile, and it includes a `1:1 NAT`, the resulting clone is configured with an `any` 1:1 NAT. See the VPC documentation guide for its specifications and limitations.


        - Only next generation network (NGN) data centers (regions) support VLANs. If a VLAN is attached to your Linode and you try to clone it to a non-NGN region, the clone won''t start. If a Linode can''t be cloned because of an incompatibility, you''re prompted to select a different region or contact support. See the VLANs Overview guide for more specifications and limitations.


        - When cloning an Advanced GPU Linode, any associated RDMA VPC interfaces are cloned along with the standard network interfaces. The new instance inherits the same interface structure, subnet associations, and fixed RDMA allocations as the source Linode. During cloning, the system ensures the new instance is assigned to a compute host with the necessary physical GPU and high-speed network resources that match the selected Linode plan.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `clone_linode`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli linodes clone 123 \

        --linode_id 124 \

        --region us-east \

        --type g6-standard-2 \

        --label cloned-linode \

        --backups_enabled true \

        --placement_group.id 528 \

        --disks 25674 \

        --configs 23456 \

        --private_ip true \

        --metadata.user_data I2Nsb3VkLWNvbmZpZw==

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-clone-linode-instance
      operationId: post-clone-linode-instance
      requestBody:
        content:
          application/json:
            example:
              backups_enabled: true
              configs:
              - 23456
              disks:
              - 25674
              label: cloned-linode
              linode_id: 124
              maintenance_policy: linode/migrate
              private_ip: false
              region: us-east
              type: g6-standard-2
            schema:
              additionalProperties: false
              properties:
                backups_enabled:
                  description: 'If this field is set to `true`, the created Linode will automatically be enrolled in the Linode Backup service. This will incur an additional charge. Pricing is included in the response from [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types).


                    - Can only be included when cloning to a new Linode.'
                  example: '{{backups_enabled}}'
                  type: boolean
                configs:
                  description: 'An array of configuration profile IDs.


                    - If the `configs` parameter __is not provided__, then __all configuration profiles and their associated disks will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will also be cloned.

                    - __If an empty array is provided__ for the `configs` parameter, then __no configuration profiles (nor their associated disks) will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will still be cloned.

                    - __If a non-empty array is provided__ for the `configs` parameter, then __the configuration profiles specified in the array (and their associated disks) will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will also be cloned.'
                  items:
                    example: 23456
                    type: integer
                  type: array
                disks:
                  description: 'An array of disk IDs.


                    - If the `disks` parameter __is not provided__, then __no extra disks will be cloned__ from the source Linode. All disks associated with the configuration profiles specified by the `configs` parameter will still be cloned.

                    - __If an empty array is provided__ for the `disks` parameter, then __no extra disks will be cloned__ from the source Linode. All disks associated with the configuration profiles specified by the `configs` parameter will still be cloned.

                    - __If a non-empty array is provided__ for the `disks` parameter, then __the disks specified in the array will be cloned__ from the source Linode, in addition to any disks associated with the configuration profiles specified by the `configs` parameter.'
                  items:
                    example: 25674
                    type: integer
                  type: array
                group:
                  deprecated: true
                  description: __Deprecated__ A label used to group Linodes for display. Linodes are not required to have a group.
                  example: '{{group}}'
                  type: string
                  x-akamai:
                    status: DEPRECATED
                label:
                  description: 'The label to assign this Linode when cloning to a new Linode.


                    - Can only be provided when cloning to a new Linode.

                    - Defaults to `linode`.'
                  example: '{{label}}'
                  maxLength: 64
                  minLength: 3
                  type: string
                linode_id:
                  description: If an existing Linode is the target for the clone, the ID of that Linode. The existing Linode must have enough resources to accept the clone.
                  example: '{{linode_id}}'
                  type: integer
                maintenance_policy:
                  description: Defines the maintenance policy for the new Linode. If you don't provide it, the new Linode inherits the maintenance policy from the original Linode. Review [maintenance policy](https://techdocs.akamai.com/cloud-computing/docs/host-maintenance-policy) documentation for more details.
                  enum:
                  - linode/migrate
                  - linode/power_off_on
                  example: '{{maintenance_policy}}'
                  type: string
                metadata:
                  additionalProperties: false
                  description: __Write-only__ An object containing user-defined data relevant to the creation of Linodes.
                  properties:
