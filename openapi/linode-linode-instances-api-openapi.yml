                                  enum:
                                  - Scheduling
                                  - W0
                                  - W2
                                  - W4
                                  - W6
                                  - W8
                                  - W10
                                  - W12
                                  - W14
                                  - W16
                                  - W18
                                  - W20
                                  - W22
                                  example: W22
                                  type:
                                  - string
                                  - 'null'
