openapi: 3.2.0
info:
  title: Linode Instances API
  version: '1.0'
  description: 'Operations tagged Linode Instances across 2 of this provider''s published API definitions: linode-api-v4-openapi.yml, linode-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com/v4
  description: Production Server
- url: https://api.linode.com
tags:
- name: Linode Instances
  description: Create and manage Linode compute instances, including configuration profiles, disks, backups, networking, migration, resize, and rebuild operations.
paths:
  /linode/instances:
    get:
      operationId: getLinodeInstances
      summary: List Linodes
      description: Returns a paginated list of Linode instances on your account, including their status, region, type, and IP addresses.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Linode instances retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinodeList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createLinodeInstance
      summary: Create a Linode
      description: Creates a new Linode instance. Requires a region, type, and either an image or backup to deploy from. Optionally accepts root password, authorized keys, StackScript, and other configuration options.
      tags:
      - Linode Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinodeRequest'
      responses:
        '200':
          description: Linode instance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Linode'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}:
    get:
      operationId: getLinodeInstance
      summary: Get a Linode
      description: Returns the details for a single Linode instance, including its status, region, type, IP addresses, and configuration.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      responses:
        '200':
          description: Linode instance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Linode'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    put:
      operationId: updateLinodeInstance
      summary: Update a Linode
      description: Updates a Linode instance, including its label, group, alerts, and watchdog settings.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinodeUpdateRequest'
      responses:
        '200':
          description: Linode instance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Linode'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    delete:
      operationId: deleteLinodeInstance
      summary: Delete a Linode
      description: Deletes a Linode instance. All disks, backups, and IP addresses associated with the instance will be permanently removed.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      responses:
        '200':
          description: Linode instance deleted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/boot:
    post:
      operationId: bootLinodeInstance
      summary: Boot a Linode
      description: Boots a Linode instance. Optionally specify a configuration profile to boot with.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config_id:
                  type: integer
                  description: The ID of the configuration profile to boot with.
      responses:
        '200':
          description: Linode instance booted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/reboot:
    post:
      operationId: rebootLinodeInstance
      summary: Reboot a Linode
      description: Reboots a Linode instance. Optionally specify a configuration profile to boot with after the reboot.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config_id:
                  type: integer
                  description: The ID of the configuration profile to boot with.
      responses:
        '200':
          description: Linode instance rebooted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/shutdown:
    post:
      operationId: shutdownLinodeInstance
      summary: Shut down a Linode
      description: Shuts down a running Linode instance. The instance will be placed in an offline state.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      responses:
        '200':
          description: Linode instance shut down successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/resize:
    post:
      operationId: resizeLinodeInstance
      summary: Resize a Linode
      description: Resizes a Linode instance to a new plan type. The instance must be powered off or will be automatically shut down during the resize.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  description: The Linode type ID to resize to.
                allow_auto_disk_resize:
                  type: boolean
                  description: Whether to automatically resize the primary disk.
                  default: true
      responses:
        '200':
          description: Linode instance resize initiated successfully
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/rebuild:
    post:
      operationId: rebuildLinodeInstance
      summary: Rebuild a Linode
      description: Rebuilds a Linode instance with a new image. All existing disks will be destroyed and a new root disk will be created.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinodeRebuildRequest'
      responses:
        '200':
          description: Linode instance rebuild initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Linode'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/clone:
    post:
      operationId: cloneLinodeInstance
      summary: Clone a Linode
      description: Clones a Linode instance to a new or existing instance. The clone will include the source instance's disks and configuration profiles.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The region to clone to.
                type:
                  type: string
                  description: The Linode type for the new clone.
                label:
                  type: string
                  description: The label for the new clone.
                linode_id:
                  type: integer
                  description: An existing Linode ID to clone to.
      responses:
        '200':
          description: Linode instance clone initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Linode'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/backups:
    get:
      operationId: getBackups
      summary: List backups
      description: Returns the available backups for a Linode instance, including automatic daily and weekly snapshots.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      responses:
        '200':
          description: Backups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/disks:
    get:
      operationId: getLinodeDisks
      summary: List disks
      description: Returns a paginated list of disks attached to a Linode instance.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Disks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiskList'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/configs:
    get:
      operationId: getLinodeConfigs
      summary: List configuration profiles
      description: Returns a paginated list of configuration profiles for a Linode instance.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Configuration profiles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConfigList'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/instances/{linodeId}/ips:
    get:
      operationId: getLinodeIPs
      summary: Get networking information
      description: Returns networking information for a Linode instance, including its IPv4 and IPv6 addresses.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/linodeIdParam'
      responses:
        '200':
          description: Networking information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinodeIPAddresses'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Linode instance not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/types:
    get:
      operationId: getLinodeTypes
      summary: List types
      description: Returns a paginated list of available Linode instance types, including their resources, pricing, and availability.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Linode types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinodeTypeList'
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /linode/kernels:
    get:
      operationId: getKernels
      summary: List kernels
      description: Returns a paginated list of available kernels that can be used with Linode instances.
      tags:
      - Linode Instances
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Kernels retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKernelList'
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /{apiVersion}/linode/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/linode-instances.yaml
      path-info: /{apiVersion}/linode/instances
    x-linode-cli-command: linodes
    post:
      description: 'Creates a Linode Instance on your Account. In order for this request to complete successfully, your User must have the `add_linodes` grant. Creating a new Linode will incur a charge on your Account. Linodes can be created using one of the available Types. Run List Linode types to get more information about each Type''s specs and cost. Linodes can be created in any one of our available Regions, which are accessible from the List regions operation. In an effort to fight spam, Linode restricts outbound connections on ports 25, 465, and 587 on all Linodes for new accounts created after November 5th, 2019. For more information, see our guide on Running a Mail Server. __Important__. You must be an unrestricted User in order to add or modify tags on Linodes. Linodes can be created in a number of ways:


        - Using a Linode Public Image distribution or a Private Image you created based on another Linode. - Run the List images operation with authentication to view all available Images. - The Linode will be `running` after it completes `provisioning`. - A default config with two Disks, one being a 512 swap disk, is created. - `swap_size` can be used to customize the swap disk size. - Requires a `root_pass` be supplied to use for the root User''s Account. - It is recommended to supply SSH keys for the root User using the `authorized_keys` field. - You may also supply a list of usernames via the `authorized_users` field. - These users must have an SSH Key associated with your Profile first. See the Add an SSH key) operation for more information. - Using cloud-init with Metadata. - Automate system configuration and software installation by providing a base-64 encoded cloud-config file. - Requires a compatible Image. You can determine compatible Images by checking for `cloud-init` under `capabilities` when running List images. - Requires a compatible Region. You can determine compatible Regions by checking for `Metadata` under `capabilities` when running List regions. - Using a StackScript. - Run List StackScripts for a list of available StackScripts. - The Linode will be `running` after it completes `provisioning`. - Requires a compatible Image to be supplied. - Run Get a StackScript for compatible Images. - Requires a `root_pass` be supplied to use for the root User''s Account. - It is recommended to supply SSH keys for the root User using the `authorized_keys` field. - You may also supply a list of usernames via the `authorized_users` field. - These users must have an SSH Key associated with your Profile first. See Add an SSH key for more information. - Using one of your other Linode''s backups. - You must create a Linode large enough to accommodate the Backup''s size. - The Disks and Config will match that of the Linode that was backed up. - The `root_pass` will match that of the Linode that was backed up. - Attached to a private VLAN. - Review the `interfaces` property of the Request Body Schema for details. - For more information, see our guide on Getting Started with VLANs. - Create an empty Linode. - The Linode will remain `offline` and must be manually started. - Run Boot a Linode. - Disks and Configs must be created manually. - This is only recommended for advanced use cases. Depending on your account settings, you can choose between legacy configuration interfaces or Linode interfaces when creating a Linode. Only one type of interface is allowed per Linode. The `interface_generation` field lets you select one interface type for new Linodes when both legacy and Linode interfaces options are available on your account. If a Linode is configured with a Linode interface, legacy configuration interfaces can no longer be used on that Linode. >


        ---


        - __CLI__.'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-linode-instance
      operationId: post-linode-instance
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - additionalProperties: false
                description: Common properties for creating and rebuilding Linodes.
                properties:
                  authorized_keys:
                    description: __Write-only__ A list of public SSH keys that will be automatically appended to the root user's `~/.ssh/authorized_keys` file when deploying from an Image.
                    example:
                    - ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  authorized_users:
                    description: __Write-only__ A list of usernames for authorized users. Before you can add a user, it needs an SSH key assigned to its profile. See [Add an SSH key](https://techdocs.akamai.com/linode-api/reference/post-add-ssh-key) for more information. If the usernames already have associated SSH keys, the keys will be appended to the root users `~/.ssh/authorized_keys` file automatically when deploying from an image.
                    example:
                    - myUser
                    - secondaryUser
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  booted:
                    default: true
                    description: __Write-only__ This field defaults to `true` if the Linode is created with an Image or from a Backup. If it is deployed from an Image or a Backup and you wish it to remain `offline` after deployment, set this to `false`.
                    type: boolean
                    writeOnly: true
                  disk_encryption:
                    description: 'Local disk encryption ensures that your data stored on Linodes is secured. Disk encryption protects against unauthorized data access by keeping the data encrypted if the disk is ever removed from the data center, decommissioned, or disposed of. The platform manages the encryption and decryption for you.


                      By default, encryption is `enabled` on all Linodes. If you opted out of encryption or if the Linode was created prior to local disk encryption support, you can encrypt your data using [Rebuild](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance).'
                    enum:
                    - enabled
                    - disabled
                    type: string
                    x-linode-cli-display: 8
                  image:
                    description: 'An Image ID to deploy the Linode Disk from.


                      Run the [List images](https://techdocs.akamai.com/linode-api/reference/get-images) operation with authentication to view all available Images. Official Linode Images start with `linode/`, while your Account''s Images start with `private/`. Creating a disk from a Private Image requires `read_only` or `read_write` permissions for that Image. Run the [Update a user''s grants](https://techdocs.akamai.com/linode-api/reference/put-user-grants) operation to adjust permissions for an Account Image.'
                    example: linode/debian9
                    type:
                    - string
                    - 'null'
                  maintenance_policy:
                    description: '__Beta__ Defines the maintenance policy for this Linode. Choose from the following policies:


                      - `linode/migrate`: Migrates the Linode to a new host while it remains fully operational (with some performance degradation). Recommended for maximizing availability.

                      - `linode/power_off_on`: Powers off the Linode at the start of the maintenance event and reboots it once the maintenance finishes. Recommended for maximizing performance.


                      Review [maintenance policy](https://techdocs.akamai.com/cloud-computing/docs/host-maintenance-policy) documentation for more details.'
                    enum:
                    - linode/migrate
                    - linode/power_off_on
                    example: linode/migrate
                    type: string
                    x-akamai:
                      status: BETA
                  metadata:
                    additionalProperties: false
                    description: __Write-only__ An object containing user-defined data relevant to the creation of Linodes.
                    properties:
                      user_data:
                        description: 'Base64-encoded [cloud-config](https://www.linode.com/docs/products/compute/compute-instances/guides/metadata-cloud-config/) data.


                          Cannot be modified after provisioning. To update, use either the [Clone a Linode](https://techdocs.akamai.com/linode-api/reference/post-clone-linode-instance) or [Rebuild a Linode](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance) operations.


                          Must not be included when cloning to an existing Linode.


                          Unencoded data must not exceed 65535 bytes, or about 16kb encoded.'
                        example: I2Nsb3VkLWNvbmZpZwpwYWNrYWdlX3VwZGF0ZTogdHJ1ZQpwYWNrYWdlX3VwZ3JhZGU6IHRydWU=
                        format: byte
                        type: string
                    type: object
                    writeOnly: true
                  root_pass:
                    description: '__Write-only__ This sets the root user''s password on a newly created Linode Disk when deploying from an Image.


                      - __Required__ when creating a Linode Disk from an Image, including when using a StackScript.


                      - Must meet a password strength score requirement that is calculated internally by the API. If the strength requirement is not met, you will receive a `Password does not meet strength requirement` error.'
                    example: aComplexP@ssword
                    format: password
                    maxLength: 128
                    minLength: 7
                    type: string
                    writeOnly: true
                  stackscript_data:
                    description: 'This field is required only if the StackScript being deployed requires input data from the User for successful completion. See [User Defined Fields (UDFs)](https://www.linode.com/docs/products/tools/stackscripts/guides/write-a-custom-script/#declare-user-defined-fields-udfs) for more details.


                      This field is required to be valid JSON.


                      Total length cannot exceed 65,535 characters.'
                    example:
                      gh_username: linode
                    maxLength: 65535
                    type: object
                  stackscript_id:
                    description: A StackScript ID that will cause the referenced StackScript to be run during deployment of this Linode. A compatible `image` is required to use a StackScript. To get a list of available StackScript and their permitted Images, run [List StackScripts](https://techdocs.akamai.com/linode-api/reference/get-stack-scripts). This field cannot be used when deploying from a Backup or a Private Image.
                    example: 10079
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/linode-request.yaml
              - properties:
                  backup_id:
                    description: 'A Backup ID from another Linode''s available backups. Your User must have `read_write` access to that Linode, the Backup must have a `status` of `successful`, and the Linode must be deployed to the same `region` as the Backup. Run [List backups](https://techdocs.akamai.com/linode-api/reference/get-backups) for a Linode''s available backups.


                      This field and the `image` field are mutually exclusive.'
                    example: 1234
                    type: integer
                  backups_enabled:
                    description: 'If this field is set to `true`, the created Linode will automatically be enrolled in the Linode Backup service. This will incur an additional charge. The cost for the Backup service is dependent on the Type of Linode deployed.


                      This option is always treated as `true` if the account-wide `backups_enabled` setting is `true`.  See [Get account settings](https://techdocs.akamai.com/linode-api/reference/get-account-settings) for more information.


                      Backup pricing is included in the response from [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types)'
                    type: boolean
                  firewall_id:
                    description: The `id` of the Firewall to attach this Linode to upon creation. This `firewall_id` field is for Linodes using VLAN and legacy configuration interfaces only.
                    type: integer
                  group:
                    deprecated: true
                    description: __Deprecated__, __Filterable__ The group label for this Linode.
                    example: Linode-Group
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                      status: DEPRECATED
                    x-linode-filterable: true
                  interface_generation:
                    description: '__Beta__ Specifies the interface type for the Linode. The value can be either `legacy_config` or `linode`. The default value is determined by the `interfaces_for_new_linodes` setting in the [account settings](https://techdocs.akamai.com/linode-api/reference/get-account-settings). If the `interface_generation` option is set to `linode`, legacy configuration interfaces can no longer be used on the Linode.

                      - If `interfaces_for_new_linodes` is set to `linode_only`, set `interface_generation` to `linode` or omit it for Linode interfaces.

                      - If `interfaces_for_new_linodes` is set to `legacy_config_only`, set `interface_generation` to `legacy_config` or omit it for legacy configuration interfaces.

