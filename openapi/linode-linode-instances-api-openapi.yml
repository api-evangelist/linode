  /{apiVersion}/linode/instances/{linodeId}/clone:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: ID of the Linode to clone.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path-8a1bf096.yaml
    x-akamai:
      file-path: paths/linode-clone.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/clone
    x-linode-cli-command: linodes
    post:
      description: 'You can clone your Linode''s existing disks, configuration profiles and interfaces to another Linode on your account. In order for this request to complete successfully, you need the `add_linodes` grant.


        For Linodes using Linode interfaces, the clone needs to be located in a region that supports Linode interfaces (see GET a region). The account settings need to allow creation of Linodes with Linode interfaces.


        Cloning to a new Linode incurs a charge on your account.


        If cloning to an existing Linode, any actions currently running or queued must be completed first before you can clone to it.


        Up to five clone operations from any given source Linode can be run concurrently. If more concurrent clones are attempted, an HTTP 400 error will be returned by this operation.


        Any tags existing on the source Linode will be cloned to the target Linode.


        Linodes utilizing Metadata (`"has_user_data": true`) must be cloned to a new Linode with `metadata.user_data` included with the clone request.


        `vpc` details


        - If the Linode you''re cloning has a `vpc` interface on its active legacy configuration profile that includes a 1:1 NAT, the resulting clone is configured with an `any` 1:1 NAT.

        - See the VPC documentation guide for its specifications and limitations.


        `vlan` details


        - Only Next Generation Network (NGN) data centers support VLANs. If a VLAN is attached to your Linode and you attempt clone it to a non-NGN data center, the cloning will not initiate. If a Linode cannot be cloned because of an incompatibility, you will be prompted to select a different data center or contact support.

        - See the VLANs Overview guide to view additional specifications and limitations.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes clone 123 \

        --linode_id 124 \

        --region us-east \

        --type g6-standard-2 \

        --label cloned-linode \

        --backups_enabled true \

        --placement_group.id 528 \

        --disks 25674 \

        --configs 23456 \

        --private_ip true \

        --metadata.user_data I2Nsb3VkLWNvbmZpZw==

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-clone-linode-instance
      operationId: post-clone-linode-instance
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                backups_enabled:
                  description: 'If this field is set to `true`, the created Linode will automatically be enrolled in the Linode Backup service. This will incur an additional charge. Pricing is included in the response from [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types).


                    - Can only be included when cloning to a new Linode.'
                  example: '{{backups_enabled}}'
                  type: boolean
                configs:
                  description: 'An array of configuration profile IDs.


                    - If the `configs` parameter __is not provided__, then __all configuration profiles and their associated disks will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will also be cloned.

                    - __If an empty array is provided__ for the `configs` parameter, then __no configuration profiles (nor their associated disks) will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will still be cloned.

                    - __If a non-empty array is provided__ for the `configs` parameter, then __the configuration profiles specified in the array (and their associated disks) will be cloned__ from the source Linode. Any disks specified by the `disks` parameter will also be cloned.'
                  items:
                    example: 23456
                    type: integer
                  type: array
                disks:
                  description: 'An array of disk IDs.


                    - If the `disks` parameter __is not provided__, then __no extra disks will be cloned__ from the source Linode. All disks associated with the configuration profiles specified by the `configs` parameter will still be cloned.

                    - __If an empty array is provided__ for the `disks` parameter, then __no extra disks will be cloned__ from the source Linode. All disks associated with the configuration profiles specified by the `configs` parameter will still be cloned.

                    - __If a non-empty array is provided__ for the `disks` parameter, then __the disks specified in the array will be cloned__ from the source Linode, in addition to any disks associated with the configuration profiles specified by the `configs` parameter.'
                  items:
                    example: 25674
                    type: integer
                  type: array
                group:
                  deprecated: true
                  description: A label used to group Linodes for display. Linodes are not required to have a group.
                  example: '{{group}}'
                  type: string
                label:
                  description: 'The label to assign this Linode when cloning to a new Linode.


                    - Can only be provided when cloning to a new Linode.

                    - Defaults to `linode`.'
                  example: '{{label}}'
                  maxLength: 64
                  minLength: 3
                  type: string
                linode_id:
                  description: If an existing Linode is the target for the clone, the ID of that Linode. The existing Linode must have enough resources to accept the clone.
                  example: '{{linode_id}}'
                  type: integer
                maintenance_policy:
                  description: __Beta__ Defines the maintenance policy for the new Linode. If you don't provide it, the new Linode inherits the maintenance policy from the original Linode. Review [maintenance policy](https://techdocs.akamai.com/cloud-computing/docs/host-maintenance-policy) documentation for more details.
                  enum:
                  - linode/migrate
                  - linode/power_off_on
                  example: '{{maintenance_policy}}'
                  type: string
                  x-akamai:
                    status: BETA
                metadata:
                  additionalProperties: false
                  description: __Write-only__ An object containing user-defined data relevant to the creation of Linodes.
                  properties:
                    user_data:
                      description: 'Base64-encoded [cloud-config](https://www.linode.com/docs/products/compute/compute-instances/guides/metadata-cloud-config/) data.


                        Cannot be modified after provisioning. To update, use either the [Clone a Linode](https://techdocs.akamai.com/linode-api/reference/post-clone-linode-instance) or [Rebuild a Linode](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance) operations.


                        Must not be included when cloning to an existing Linode.


                        Unencoded data must not exceed 65535 bytes, or about 16kb encoded.'
                      example: I2Nsb3VkLWNvbmZpZwpwYWNrYWdlX3VwZGF0ZTogdHJ1ZQpwYWNrYWdlX3VwZ3JhZGU6IHRydWU=
                      format: byte
                      type: string
                  type: object
                  writeOnly: true
                placement_group:
                  additionalProperties: false
                  description: 'Include this to assign this Linode to an existing [placement group](https://www.linode.com/docs/products/compute/compute-instances/guides/placement-groups/). Consider these points when cloning:


                    - If the Linode you''re cloning exists in a placement group, the API won''t automatically add the cloned instance to the same placement group. You need to specify a placement group to add the clone to.


                    - The target placement group needs to be in the same `region` set for this Linode.


                    - The placement group needs to have capacity. Run the [Get a region](https://techdocs.akamai.com/linode-api/reference/get-region) operation and note either the `maximum_linodes_per_pg` (strict) or `maximum_linodes_per_flexible_pg` (flexible), based on your selected `placement_group_policy`. These represent the Linode limit per placement group, for each `placement_group_policy` type. You can then run the [Get a placement group](https://techdocs.akamai.com/linode-api/reference/get-placement-group) operation to review the Linodes in that group.'
                  properties:
                    id:
                      description: The placement group's ID. You need to provide it for all operations that affect it.
                      example: 528
                      type: integer
                      x-linode-cli-display: 1
                  required:
                  - id
                  type: object
                private_ip:
                  description: 'If `true`, the created Linode will have private networking enabled and assigned a private IPv4 address.


                    - Can only be provided when cloning to a new Linode.'
                  example: '{{private_ip}}'
                  type: boolean
                region:
                  description: 'This is the Region where the Linode will be deployed. To view all available Regions you can deploy to, run [List regions](https://techdocs.akamai.com/linode-api/reference/get-regions).


                    - Region can only be provided and is required when cloning to a new Linode.'
                  example: '{{region}}'
                  type: string
                type:
                  description: 'A Linode''s Type determines what resources are available to it, including disk space, memory, and virtual cpus. The amounts available to a specific Linode are returned as `specs` on the Linode object.


                    To view all available Linode Types you can deploy with, run [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types).


                    - Type can only be provided and is required when cloning to a new Linode.'
                  example: '{{type}}'
                  type: string
              type: object
              x-akamai:
                file-path: schemas/added-post-clone-linode-instance.yaml
            x-example:
              x-ref: ../examples/post-clone-linode-instance.json
        description: The requested state your Linode will be cloned into.
        required: true
        x-linode-cli-allowed-defaults:
        - region
        - type
