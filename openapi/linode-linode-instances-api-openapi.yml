components:
  schemas:
    PaginatedDiskList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                label:
                  type: string
                status:
                  type: string
                  enum:
                  - ready
                  - not ready
                  - deleting
                size:
                  type: integer
                filesystem:
                  type: string
                  enum:
                  - raw
                  - swap
                  - ext3
                  - ext4
                  - initrd
                created:
                  type: string
                  format: date-time
                updated:
                  type: string
                  format: date-time
    BackupResponse:
      type: object
      properties:
        automatic:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
          description: Automatic backups.
        snapshot:
          type: object
          properties:
            current:
              $ref: '#/components/schemas/Backup'
            in_progress:
              $ref: '#/components/schemas/Backup'
          description: Snapshot backups.
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: The current page number.
        pages:
          type: integer
          description: The total number of pages.
        results:
          type: integer
          description: The total number of results.
    Linode:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this Linode instance.
        label:
          type: string
          description: The label for this Linode instance.
        region:
          type: string
          description: The region where this Linode is located.
        type:
          type: string
          description: The Linode type ID of this instance.
        image:
          type: string
          description: The image ID used to deploy this Linode.
        status:
          type: string
          enum:
          - running
          - offline
          - booting
          - rebooting
          - shutting_down
          - provisioning
          - deleting
          - migrating
          - rebuilding
          - cloning
          - restoring
          - stopped
          description: The current status of the Linode instance.
        ipv4:
          type: array
          items:
            type: string
            format: ipv4
          description: The IPv4 addresses associated with this Linode.
        ipv6:
          type: string
          description: The IPv6 SLAAC address for this Linode.
        created:
          type: string
          format: date-time
          description: When this Linode was created.
        updated:
          type: string
          format: date-time
          description: When this Linode was last updated.
        group:
          type: string
          description: The display group for this Linode.
          deprecated: true
        tags:
          type: array
          items:
            type: string
          description: Tags applied to this Linode for organizational purposes.
        hypervisor:
          type: string
          description: The hypervisor this Linode is running on.
        specs:
          type: object
          properties:
            disk:
              type: integer
              description: The amount of disk space in MB.
            memory:
              type: integer
              description: The amount of RAM in MB.
            vcpus:
              type: integer
              description: The number of virtual CPUs.
            gpus:
              type: integer
              description: The number of GPUs.
            transfer:
              type: integer
              description: The monthly network transfer quota in GB.
          description: The hardware specifications for this Linode type.
        alerts:
          type: object
          properties:
            cpu:
              type: integer
              description: CPU usage alert threshold percentage.
            io:
              type: integer
              description: Disk IO rate alert threshold.
            network_in:
              type: integer
              description: Incoming network traffic alert threshold in Mb/s.
            network_out:
              type: integer
              description: Outgoing network traffic alert threshold in Mb/s.
            transfer_quota:
              type: integer
              description: Transfer quota usage alert threshold percentage.
          description: Alert thresholds for this Linode instance.
        backups:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the backup service is enabled.
            available:
              type: boolean
              description: Whether any backups are available.
            schedule:
              type: object
              properties:
                day:
                  type: string
                  description: The day of the week for automatic backups.
                window:
                  type: string
                  description: The window for automatic backups.
          description: Information about this Linode's backup service.
        watchdog_enabled:
          type: boolean
          description: Whether Lassie the watchdog is enabled to restart this Linode if it crashes.
    LinodeRequest:
      type: object
      required:
      - region
      - type
      properties:
        region:
          type: string
          description: The region where the Linode will be created.
        type:
          type: string
          description: The Linode type to deploy.
        image:
          type: string
          description: The image to deploy with. Required if no backup_id is provided.
        label:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-zA-Z]((?!--|__)[a-zA-Z0-9-_])+$
          description: The label for the new Linode instance.
        root_pass:
          type: string
          description: The root password for the new Linode instance.
        authorized_keys:
          type: array
          items:
            type: string
          description: A list of public SSH keys to deploy with.
        authorized_users:
          type: array
          items:
            type: string
          description: A list of usernames whose SSH keys to deploy.
        tags:
          type: array
          items:
            type: string
          description: Tags for the new Linode.
        stackscript_id:
          type: integer
          description: A StackScript ID to deploy with.
        stackscript_data:
          type: object
          additionalProperties:
            type: string
          description: UDF data for the StackScript.
        backup_id:
          type: integer
          description: A backup ID to restore from.
        backups_enabled:
          type: boolean
          description: Whether to enable the backup service.
        private_ip:
          type: boolean
          description: Whether to assign a private IPv4 address.
        booted:
          type: boolean
          default: true
          description: Whether the new Linode should be booted after creation.
    PaginatedLinodeTypeList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
                class:
                  type: string
                  enum:
                  - nanode
                  - standard
                  - dedicated
                  - gpu
                  - highmem
                  - premium
                disk:
                  type: integer
                memory:
                  type: integer
                vcpus:
                  type: integer
                gpus:
                  type: integer
                transfer:
                  type: integer
                network_out:
                  type: integer
                price:
                  type: object
                  properties:
                    hourly:
                      type: number
                    monthly:
                      type: number
    IPAddress:
      type: object
      properties:
        address:
          type: string
          description: The IP address.
        gateway:
          type: string
          description: The default gateway.
        subnet_mask:
          type: string
          description: The subnet mask.
        prefix:
          type: integer
          description: The network prefix length.
        type:
          type: string
          enum:
          - ipv4
          - ipv6
          description: The type of IP address.
        public:
          type: boolean
          description: Whether this is a public IP address.
        rdns:
          type: string
          description: The reverse DNS entry for this address.
        linode_id:
          type: integer
          description: The ID of the Linode this IP is assigned to.
        region:
          type: string
          description: The region for this IP address.
    IPv6Range:
      type: object
      properties:
        range:
          type: string
          description: The IPv6 range.
        prefix:
          type: integer
          description: The prefix length.
        region:
          type: string
          description: The region for this range.
    Backup:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this backup.
        type:
          type: string
          enum:
          - auto
          - snapshot
          description: The type of backup.
        status:
          type: string
          enum:
          - paused
          - pending
          - running
          - needsPostProcessing
          - successful
          - failed
          - userAborted
          description: The status of this backup.
        created:
          type: string
          format: date-time
          description: When this backup was created.
        updated:
          type: string
          format: date-time
          description: When this backup was last updated.
        finished:
          type: string
          format: date-time
          description: When this backup finished.
        label:
          type: string
          description: The label for snapshot backups.
        disks:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              size:
                type: integer
              filesystem:
                type: string
          description: Disk information for this backup.
    LinodeRebuildRequest:
      type: object
      required:
      - image
      - root_pass
      properties:
        image:
          type: string
          description: The image to rebuild with.
        root_pass:
          type: string
          description: The root password for the rebuilt instance.
        authorized_keys:
          type: array
          items:
            type: string
          description: A list of public SSH keys.
        authorized_users:
          type: array
          items:
            type: string
          description: A list of usernames whose SSH keys to deploy.
        stackscript_id:
          type: integer
          description: A StackScript ID to deploy with.
        stackscript_data:
          type: object
          additionalProperties:
            type: string
          description: UDF data for the StackScript.
        booted:
          type: boolean
          default: true
          description: Whether to boot after rebuild.
    IPv6Address:
      type: object
      properties:
        address:
          type: string
          description: The IPv6 address.
        prefix:
          type: integer
          description: The network prefix length.
        rdns:
          type: string
          description: The reverse DNS entry.
        type:
          type: string
          description: The type of IPv6 address.
        region:
          type: string
          description: The region for this address.
    PaginatedLinodeList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Linode'
    PaginatedConfigList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                label:
                  type: string
                kernel:
                  type: string
                run_level:
                  type: string
                  enum:
                  - default
                  - single
                  - binbash
                virt_mode:
                  type: string
                  enum:
                  - paravirt
                  - fullvirt
                root_device:
                  type: string
                memory_limit:
                  type: integer
    LinodeIPAddresses:
      type: object
      properties:
        ipv4:
          type: object
          properties:
            public:
              type: array
              items:
                $ref: '#/components/schemas/IPAddress'
              description: Public IPv4 addresses.
            private:
              type: array
              items:
                $ref: '#/components/schemas/IPAddress'
              description: Private IPv4 addresses.
            shared:
              type: array
              items:
                $ref: '#/components/schemas/IPAddress'
              description: Shared IPv4 addresses.
            reserved:
              type: array
              items:
                $ref: '#/components/schemas/IPAddress'
              description: Reserved IPv4 addresses.
        ipv6:
          type: object
          properties:
            slaac:
              $ref: '#/components/schemas/IPv6Address'
            link_local:
              $ref: '#/components/schemas/IPv6Address'
            global:
              type: array
              items:
                $ref: '#/components/schemas/IPv6Range'
    PaginatedKernelList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
                version:
                  type: string
                architecture:
                  type: string
                  enum:
                  - x86_64
                  - i386
    LinodeUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 3
          maxLength: 64
          description: The label for the Linode instance.
        tags:
          type: array
          items:
            type: string
          description: Tags for the Linode.
        watchdog_enabled:
          type: boolean
          description: Whether to enable Lassie the watchdog.
        alerts:
          type: object
          properties:
            cpu:
              type: integer
            io:
              type: integer
            network_in:
              type: integer
            network_out:
              type: integer
            transfer_quota:
              type: integer
  parameters:
    linodeIdParam:
      name: linodeId
      in: path
      required: true
      schema:
        type: integer
      description: The ID of the Linode instance.
    pageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 25
        maximum: 500
        default: 100
      description: The number of items per page.
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: The page number to return.
  securitySchemes:
    oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://login.linode.com/oauth/authorize
          scopes:
            account:read_only: Allows access to GET information about your account.
            account:read_write: Allows access to all endpoints related to your account.
            child_account:read_only: Allows access to GET information about deprecated parent/child operations.
            child_account:read_write: Allows access to deprecated parent/child operations.
            databases:read_only: Allows access to GET information about databases.
            databases:read_write: Allows access to all endpoints related to databases.
            domains:read_only: Allows access to GET Domains on your account.
            domains:read_write: Allows access to all Domain endpoints.
            events:read_only: Allows access to GET your Events.
            events:read_write: Allows access to all endpoints related to your Events.
            firewall:read_only: Allows access to GET information about your Firewalls.
            firewall:read_write: Allows access to all Firewall endpoints.
            images:read_only: Allows access to GET your Images.
            images:read_write: Allows access to all endpoints related to your Images.
