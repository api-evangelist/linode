      description: 'Updates a Linode that you have permission to `read_write`. Only unrestricted users can add or modify tags on Linodes.

        >


        > 🚧

        >

        > All tags for the instance are overwritten if `tags` are included in the request.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes update 7833080 \

        --label linode123 \

        --backups.schedule.day "Saturday" \

        --backups.schedule.window "W22" \

        --alerts.cpu 180 \

        --alerts.network_in 10 \

        --alerts.network_out 10 \

        --alerts.transfer_quota 80 \

        --alerts.io 10000

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_write

        ```


        Learn more...'
