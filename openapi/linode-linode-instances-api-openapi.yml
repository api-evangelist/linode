openapi: 3.2.0
info:
  title: Linode instances API
  version: '1.0'
  description: 'Operations tagged Linode instances across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: A Linode is a virtual machine that runs on Akamai's secure and reliable global infrastructure. Use the Linode instances operations to create, configure, and manage your Linodes.
  name: Linode instances
paths:
  /{apiVersion}/linode/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/linode-instances.yaml
      path-info: /{apiVersion}/linode/instances
    x-linode-cli-command: linodes
    post:
      description: Creates a new Linode instance on your account.
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-linode-instance
      operationId: post-linode-instance
      requestBody:
        content:
          application/json:
            example:
              authorized_keys:
              - ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
              authorized_users:
              - example-user
              booted: true
              disk_encryption: enabled
              image: linode/debian13
              interface_generation: linode
              interfaces:
              - firewall_id: -1
                rdma_vpc:
                  ipv4:
                    addresses:
                    - address: auto
                  subnet_id: 1234
              - firewall_id: -1
                rdma_vpc:
                  ipv4:
                    addresses:
                    - address: 10.0.0.25
                      primary: true
                  subnet_id: 1234
              - firewall_id: 2
                vpc:
                  ipv4:
                    addresses:
                    - address: 10.0.0.25
                      primary: true
                  subnet_id: 4
              ipv4: 192.0.2.141
              label: example-linode
              maintenance_policy: linode/migrate
              network_helper: true
              region: us-ord
              root_pass: strong-password
              type: g6-standard-2
            schema:
              allOf:
              - description: Common properties for creating and rebuilding Linodes.
                properties:
                  authorized_keys:
                    description: '__Write-only__ A list of public SSH keys that will be automatically appended to the root user''s `~/.ssh/authorized_keys` file when deploying from an image.


                      > 📘

                      >

                      > You need to set at least one form of authentication to access a Linode disk. This can be `authorized_keys`, `authorized_users`, or a `root_pass`. You can optionally combine `authorized_keys` with a `root_pass` for added security.'
                    example:
                    - ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  authorized_users:
                    description: '__Write-only__ A list of usernames for authorized users. Before you can add a user, it needs an SSH key assigned to its profile. See [Add an SSH key](https://techdocs.akamai.com/linode-api/reference/post-add-ssh-key) for more information. If the usernames already have associated SSH keys, the keys will be appended to the root users `~/.ssh/authorized_keys` file automatically when deploying from an image.


                      > 📘

                      >

                      > You need to set at least one form of authentication to access a Linode disk. This can be `authorized_users`, `authorized_keys` or a `root_pass`. You can optionally combine `authorized_users` with a `root_pass` for added security.'
                    example:
                    - myUser
                    - secondaryUser
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  booted:
                    default: true
                    description: __Write-only__ The boot status of the Linode after deployment. This defaults to `true` if you create the Linode using an image or from a backup. Set this to `false` to have it remain `offline` after deployment.
                    type: boolean
                    writeOnly: true
                  disk_encryption:
                    description: 'Whether disk encryption is applied on this Linode. Local disk encryption ensures that your data is secured. Disk encryption protects against unauthorized data access by keeping the data encrypted if the disk is ever removed from the data center, decommissioned, or disposed of. The platform manages the encryption and decryption for you.


                      By default, encryption is `enabled` on all Linodes. If you opted out of encryption or if the Linode was created prior to local disk encryption support, you can encrypt your data using the [Rebuild a Linode](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance) operation.'
                    enum:
                    - enabled
                    - disabled
                    type: string
                    x-linode-cli-display: 8
                  image:
                    description: The identifier assigned to the disk image to be deployed to the new Linode. You can run the [List images](https://techdocs.akamai.com/linode-api/reference/get-images) operation with authentication to view all available images, and store the `id` from the applicable one. Official Linode images start with `linode/`, while any custom images available on your account start with `private/`. To create a disk from a `private/` image, you need `read_only` or `read_write` permissions for it. Run the [Update a user's grants](https://techdocs.akamai.com/linode-api/reference/put-user-grants) operation to adjust permissions for a `private/` image, or talk to your local account administrator.
                    example: linode/debian9
                    type:
                    - string
                    - 'null'
                  maintenance_policy:
                    description: 'Defines the maintenance policy for this Linode. This can be one of two policies:


                      - `linode/migrate`. This migrates the Linode to a new host while it remains fully operational, but with some performance degradation. This focuses on maximizing availability.


                      - `linode/power_off_on`. This powers off the Linode at the start of the maintenance event and reboots it once the maintenance finishes. This focuses on maximizing performance.


                      Review the [maintenance policy](https://techdocs.akamai.com/cloud-computing/docs/host-maintenance-policy) documentation for more details.'
                    enum:
                    - linode/migrate
                    - linode/power_off_on
                    example: linode/migrate
                    type: string
                  metadata:
                    additionalProperties: false
                    description: __Write-only__ An object containing user-defined data relevant to the creation of Linodes.
                    properties:
                      user_data:
                        description: 'Base64-encoded [cloud-config](https://www.linode.com/docs/products/compute/compute-instances/guides/metadata-cloud-config/) data. Consider these points when including `user_data`:


                          - You can''t update an existing Linode to modify this information. You need to either [clone](https://techdocs.akamai.com/linode-api/reference/post-clone-linode-instance) or [rebuild](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance) an existing Linode and apply new `user_data`.


                          - You can''t include this field when cloning to an existing Linode.


                          - Unencoded data can''t exceed 65535 bytes when encoded.'
                        example: I2Nsb3VkLWNvbmZpZwpwYWNrYWdlX3VwZGF0ZTogdHJ1ZQpwYWNrYWdlX3VwZ3JhZGU6IHRydWU=
                        format: byte
                        type: string
                    type: object
                    writeOnly: true
                  root_pass:
                    description: '__Write-only__ This sets the root user''s password on a newly created Linode disk when deploying from an `image`. A `root_pass` needs to meet a password strength score requirement that is calculated internally by the API. If the strength requirement isn''t met, you''ll receive a `Password does not meet strength requirement` error.


                      > 📘

                      >

                      > You need to set at least one form of authentication to access a Linode disk. This can be a `root_pass`, `authorized_keys`, or `authorized_users`. You can optionally combine a `root_pass` and either `authorized_keys` or `authorized_users` for added security.'
                    example: aC0mplexP@$$w0rd
                    format: password
                    maxLength: 128
                    minLength: 7
                    type: string
                    writeOnly: true
                  stackscript_data:
                    description: 'This field is required only if the StackScript being deployed requires input data from the user for successful completion. See [Declare user-defined fields (UDFs)](https://techdocs.akamai.com/cloud-computing/docs/write-a-custom-script-for-use-with-stackscripts#declare-user-defined-fields-udfs) for more details.


                      - This field needs to be formatted in valid JSON.


                      - The total length can''t exceed 65,535 characters.'
                    example:
                      gh_username: linode
                    type: object
                  stackscript_id:
                    description: An identifier for a StackScript that to be run during deployment of this Linode. A compatible `image` is required to use a StackScript. To get a list of available StackScripts and their permitted images, run the [List StackScripts](https://techdocs.akamai.com/linode-api/reference/get-stack-scripts) operation. This field can't be used when deploying from a backup or a private image.
                    example: 10079
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/linode-request.yaml
              - properties:
                  backup_id:
                    description: 'A unique identifier for a backup taken for another Linode. You can run the [List backups](https://techdocs.akamai.com/linode-api/reference/get-backups) operation to see a Linode''s available backups. Consider these points when targeting a `backup_id`:


                      - Your user needs `read_write` access to that Linode.


                      - The backup needs to have a `status` of `successful`.


                      - The Linode needs to be deployed to the same `region` as the backup.


                      - This field and the `image` field are mutually exclusive.'
                    example: 1234
                    type: integer
                  backups_enabled:
                    description: 'If this field is set to `true`, the created Linode will automatically be enrolled in the Linode Backup service. Consider these points when applying this service:


                      - This incurs an additional charge. The cost for the Linode Backup service depends on the type of Linode deployed.


                      - This option is always treated as `true` if the account-wide `backups_enabled` setting is `true`. See [Get account settings](https://techdocs.akamai.com/linode-api/reference/get-account-settings) for more information.


                      - Linode Backups pricing is included in the response from the [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types) operation.'
                    type: boolean
                  boot_size:
                    description: '__Write-only__ Specifies the size in MB of the primary boot disk. Consider these points when setting a `boot_size`:


                      - The minimum boot disk size is 8,192 MB.


                      - The combined `boot_size` and `swap_size` can''t exceed the overall `size` of a disk.


                      - Any remaining disk space beyond the `boot_size` and `swap-size` partition is left unallocated.'
                    example: 8192
                    minimum: 8192
                    type: integer
                    writeOnly: true
                  firewall_id:
                    description: The firewall to attach this Linode to upon creation. This `firewall_id` field is for Linodes using VLAN and legacy configuration profile interfaces only. Setting `firewall_id` to `-1` indicates that no firewall device will be attached. If the `firewall_id` is not provided or is set to `null`, the default firewall assigned to this Linode will be used, if available.
                    example: 123
                    minimum: -1
                    type:
                    - integer
                    - 'null'
                  group:
                    deprecated: true
                    description: __Deprecated__, __Filterable__ The group label for this Linode.
                    example: Linode-Group
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                      status: DEPRECATED
                    x-linode-filterable: true
                  interface_generation:
                    description: 'Specifies the interface type for the Linode. The value can be either `legacy_config` or `linode`. The default value is determined by the `interfaces_for_new_linodes` setting in your [account settings](https://techdocs.akamai.com/linode-api/reference/get-account-settings). If the `interface_generation` option is set to `linode`, legacy configuration interfaces can no longer be used on the Linode.


                      - If `interfaces_for_new_linodes` is set to `linode_only`, set `interface_generation` to `linode` or omit it for Linode interfaces.


                      - If `interfaces_for_new_linodes` is set to `legacy_config_only`, set `interface_generation` to `legacy_config` or omit it for legacy configuration interfaces.


                      - If `interfaces_for_new_linodes` is set to `linode_default_but_legacy_config_allowed`, set `interface_generation` to `linode` or omit it for Linode interfaces, and to `legacy_config` if the Linode uses legacy configuration interfaces.


                      - If `interfaces_for_new_linodes` is set to `legacy_config_default_but_linode_allowed`, set `interface_generation` to `legacy_config` or omit it for legacy configuration interfaces, and to `linode` if the Linode uses Linode interfaces.'
                    enum:
                    - legacy_config
                    - linode
                    type:
                    - string
                    - 'null'
                  interfaces:
                    default: []
                    description: Interfaces for the Linode. This can be a Linode interface or legacy configuration interface.
                    items:
                      oneOf:
                      - description: 'Defines Linode interfaces. You can configure interfaces for one of the following types: `vpc`, `rdma_vpc`, `public`, or `vlan`.'
                        oneOf:
                        - additionalProperties: false
                          description: Defines a Linode public interface. Any other type must either be omitted or set to `null`.
                          properties:
                            default_route:
                              additionalProperties: false
                              description: Indicates if the interface serves as the default route when multiple interfaces are eligible for this role. A public interface can have both an IPv4 `default_route` and an IPv6 `default_route`, provided it has at least one IP address of the corresponding type.
                              properties:
                                ipv4:
                                  description: If set to `true`, the interface is used for the IPv4 `default_route`. Only one interface per Linode can be set as the IPv4 default route.
                                  example: true
                                  type:
                                  - boolean
                                  - 'null'
                                ipv6:
                                  description: If set to `true`, the interface is used for the IPv6 `default_route`. Only one interface per Linode can have the IPv6 default route.
                                  example: true
                                  type:
                                  - boolean
                                  - 'null'
                              type: object
                            firewall_id:
                              description: The enabled firewall to secure this public Linode interface. Setting `firewall_id` to `-1` indicates that no firewall device will be attached. If the `firewall_id` is not provided or is set to `null`, the default `public_interface` firewall is used. If no default firewall is available and `-1` is not specified, the request fails.
                              example: 123
                              minimum: -1
                              type:
                              - integer
                              - 'null'
                            public:
                              additionalProperties: false
                              description: Public interface settings. A Linode can have only one public interface. A public interface can have both IPv4 and IPv6 configurations.
                              properties:
                                ipv4:
                                  additionalProperties: false
                                  description: IPv4 address settings for this public interface. If omitted, a public IPv4 address is automatically allocated.
                                  properties:
                                    addresses:
                                      description: List of IPv4 addresses to assign to this interface. Setting any to `auto` allocates a public IPv4 address. To create a public interface that uses IPv6 and no IPv4, set the IPv4 address as an empty list `[]`.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          address:
                                            anyOf:
                                            - example: 192.0.2.141
                                              format: ip
                                              minLength: 1
                                              title: User assigned IPv4
                                              type: string
                                            - enum:
                                              - auto
                                              title: Automatically assigned IPv4
                                              type: string
                                            - example: []
                                              items:
                                                type: string
                                              maxItems: 0
                                              title: No IPv4 [empty list]
                                              type: array
                                            default: auto
                                            description: The interface's public IPv4 address. You can specify which public IPv4 address to configure for the interface. Setting this to `auto` automatically allocates a public address. To create a public interface that uses IPv6 and no IPv4, set the IPv4 address as an empty list `[]`. If the address is a reserved or automatically assigned, it needs to be reserved or already assigned to a single Linode, and it can’t be assigned to any other interface.
                                            type: string
                                          primary:
                                            default: false
                                            description: 'The IPv4 primary address configures the source address for routes within the Linode on the corresponding network interface.

                                              - Don''t set this to `false` if there''s only one address in the `addresses` array.

                                              - If more than one address is provided, primary can be set to `true` for one address.

                                              - If only one address is present in the `addresses` array, this address is automatically set as the primary address.'
                                            example: true
                                            type: boolean
                                        type: object
                                      type: array
                                  type: object
                                ipv6:
                                  additionalProperties: false
                                  description: IPv6 address settings for the public interface.
                                  properties:
                                    ranges:
                                      default: []
                                      description: IPv6 address ranges to assign to this interface. If omitted, no ranges are assigned.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          range:
                                            description: 'Your assigned IPv6 range in CIDR notation (`2001:0db8::1/64`) or prefix (`/64`).

                                              - The prefix of `/64` or `/56` block of IPv6 addresses.

                                              - If provided in CIDR notation, the prefix must be within the assigned ranges for the Linode.'
                                            example: 2001:0a0a::1/64
                                            type: string
                                        required:
                                        - range
                                        type: object
                                      type: array
                                  type: object
                              type:
                              - object
                              - 'null'
                          title: Public interface
                          type: object
                          x-akamai:
                            file-path: schemas/added-post-linode-interface-public.yaml
                        - additionalProperties: false
                          description: Defines a Linode VLAN interface. Any other type must either be omitted or set to `null`.
                          properties:
                            vlan:
                              additionalProperties: false
                              description: VLAN interface settings. A Linode can have up to three VLAN interfaces, with a unique `vlan_label` for each.
                              properties:
                                ipam_address:
                                  description: This VLAN interface's private IPv4 address in classless inter-domain routing (CIDR) notation.
                                  example: 10.0.0.1/24
                                  format: ipv4-cidr
                                  type: string
                                  x-linode-cli-display: 4
                                vlan_label:
                                  description: The VLAN's unique label. VLAN interfaces on the same Linode must have a unique `vlan_label`.
                                  example: my-vlan
                                  maxLength: 64
                                  minLength: 1
                                  pattern: '[a-zA-Z0-9-]+'
                                  type: string
                                  x-linode-cli-display: 2
                              type:
                              - object
                              - 'null'
                          title: VLAN interface
                          type: object
                          x-akamai:
                            file-path: schemas/added-post-linode-interface-vlan.yaml
                        - additionalProperties: false
                          description: Defines a Linode VPC interface. Any other type must either be omitted or set to `null`.
                          properties:
                            default_route:
                              additionalProperties: false
                              description: Indicates if the interface is used as the default route when multiple interfaces are eligible for this role. A VPC interface can have an IPv4 `default_route`.
                              properties:
                                ipv4:
                                  description: If set to `true`, the interface is used for the IPv4 `default_route`. Only one interface per Linode can be set as the IPv4 default route.
                                  example: true
                                  type:
                                  - boolean
                                  - 'null'
                              type: object
                            firewall_id:
                              description: The enabled firewall to secure this VPC Linode interface. Setting `firewall_id` to `-1` indicates that no firewall device will be attached. If the `firewall_id` is not provided or is set to `null`, the default `vpc_interface` firewall is used. If no default firewall is available and `-1` is not specified, the request fails.
                              example: 123
                              minimum: -1
                              type:
                              - integer
                              - 'null'
                            vpc:
                              additionalProperties: false
                              description: VPC interface settings. A Linode can have one VPC interface. The maximum number of interfaces allowed on a Linode is three.
                              properties:
                                ipv4:
                                  additionalProperties: false
                                  description: IPv4 assigned through `addresses` or `ranges`.
                                  properties:
                                    addresses:
                                      description: IPv4 address settings for this VPC interface.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          address:
                                            anyOf:
                                            - example: 10.0.0.1
                                              format: ip
                                              minLength: 1
                                              title: User assigned IPv4 from the VPC subnet
                                              type: string
                                            - enum:
                                              - auto
                                              title: Automatically assigned IPv4
                                              type: string
                                            default: auto
                                            description: Specifies which IPv4 address to use in the VPC subnet. You can specify which VPC Ipv4 address in the subnet to configure for the interface. You can't use an IPv4 address taken from another Linode or interface, or the first two or last two addresses in the VPC subnet. When `address` is set to `auto`, an IP address from the subnet is automatically assigned.
                                            type: string
                                          nat_1_1_address:
                                            anyOf:
                                            - example: 203.0.113.2
                                              format: ip
                                              minLength: 1
                                              title: User assigned public IPv4
                                              type: string
                                            - enum:
                                              - auto
                                              title: Automatically assigned public IPv4
                                              type: string
                                            default: null
                                            description: 'The 1:1 NAT IPv4 address used to associate a public IPv4 address with the interface''s VPC subnet IPv4 address.

                                              - You can set this to a specific public IPv4 address that''s available on the Linode.

                                              - If set to `auto`, a public IPv4 address is automatically selected.

                                              - If a public IPv4 address or `auto` is specified, primary must be set to `true`.

                                              - The address can''t be used on another Linode.

                                              - If the address is a reserved or an automatically assigned IP, the IP must be reserved or already assigned to a single Linode, and not assigned to an interface.

                                              - If this property is omitted or set to `null`, no 1:1 NAT configuration will be applied to the VPC interface.'
                                            type:
                                            - string
                                            - 'null'
                                          primary:
                                            default: false
                                            description: 'The IPv4 primary address is used to configure the source address for routes within the Linode on the corresponding network interface.

                                              Should not be set to `false` if there is only one address present in the `addresses` array.

                                              If more than one address is provided, primary must be set to `true` for one address.

                                              If only one address is present in the `addresses` array, this address is automatically set as the primary address.'
                                            example: true
                                            type:
                                            - boolean
                                            - 'null'
                                        type: object
                                      type: array
                                    ranges:
                                      default: []
                                      description: VPC IPv4 ranges.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          range:
                                            description: 'CIDR notation of a range (`1.2.3.4/24`) or prefix only (`/24`).

                                              - When only the prefix is provided, then an available range of that size within the VPC''s subnet is automatically selected.

                                              - If specified as CIDR notation, it must belong to the VPC subnet. All addresses in the range must not be taken by any other Linode or interfaces in the VPC subnet and must not include any of the first two or last two addresses of the VPC subnet.'
                                            example: 192.168.100.100/28
                                            type: string
                                        required:
                                        - range
                                        type: object
                                      type: array
                                  type: object
                                ipv6:
                                  additionalProperties: false
                                  description: 'IPv6 assigned through `slaac` and `ranges`. If omitted, or `null`, the IPv6 configuration is unchanged.

                                    The assigned IPv6 prefix must be a `/64` subnet within the VPC subnet''s allocated IPv6 range. Within each subnet, Akamai reserves the first `/64` prefix. This means you can''t use the first `/64` prefix in your subnet.'
                                  properties:
                                    is_public:
                                      default: false
                                      description: 'Indicates whether the IPv6 configuration on the Linode interface is public.

                                        - `false`: Only VPC traffic is allowed.

                                        - `true`: Internet access is allowed.'
                                      example: true
                                      type: boolean
                                    ranges:
                                      default: []
                                      description: Defines additional IPv6 network ranges.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          range:
                                            default: auto
                                            description: The IPv6 network range in CIDR notation.
                                            example: 2001:db8:abcd::/64
                                            type:
                                            - string
                                            - 'null'
                                        required:
                                        - range
                                        type: object
                                      type: array
                                    slaac:
                                      description: Defines IPv6 SLAAC address ranges. An address automatically generates from the assigned `/64` prefix using the Linode’s MAC address, just like on public IPv6 interfaces. Router advertisements (RA) are sent to the Linode, so standard SLAAC configuration works without any changes. The full `/64` prefix is routed to the Linode’s interface, allowing flexible use of any address within that range, regardless of the Linode’s internal network setup.
                                      items:
                                        additionalProperties: false
                                        properties:
                                          address:
                                            description: __Read-only__ The assigned IPv6 address within the range.
                                            example: 2001:db8:abcd::100
                                            format: ipv6
                                            readOnly: true
                                            type: string
                                          range:
                                            default: auto
                                            description: 'The IPv6 network range in CIDR notation.

                                              Must be a `/64` prefix within the VPC subnet''s IPv6 range.'
                                            example: 2001:db8:abcd::/64
                                            type: string
                                        required:
                                        - range
                                        type: object
                                      maxItems: 1
                                      minItems: 0
                                      type: array
                                  type:
                                  - object
                                  - 'null'
                                subnet_id:
                                  description: The VPC subnet identifier for this interface. Your subnet’s VPC must be in the same data center (region) as the Linode.
                                  example: 321
                                  type: integer
                              required:
                              - subnet_id
                              type:
                              - object
                              - 'null'
                          title: VPC interface
                          type: object
                          x-akamai:
                            file-path: schemas/added-post-linode-interface-vpc.yaml
                        - additionalProperties: false
                          description: 'Defines a Linode RDMA VPC interface. When deploying a new Linode, you can include multiple interfaces at once by adding an array of interface objects in the request payload.


                            For advanced GPU Linode plans, you must allocate multiple interfaces during creation. The request payload should include:


                            1. A standard networking interface, such as a public IP or a regular VPC interface, for instance management, external routing, and internet connectivity.

                            2. The specific number of RDMA VPC interfaces required by the selected GPU hardware plan.'
                          properties:
                            default_route:
                              additionalProperties: false
                              description: Default route configuration. For RDMA VPC interfaces, default route configurations are rejected and must either be omitted or set to `false`.
                              properties:
                                ipv4:
                                  description: Must be set to `false` or omitted. RDMA VPC interfaces can't act as the primary IPv4 default route.
                                  example: false
                                  type:
                                  - boolean
                                  - 'null'
                                ipv6:
