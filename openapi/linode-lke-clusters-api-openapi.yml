                      description: '__Beta__, __LKE Enterprise__ Enables audit logs on the cluster''s control plane. These logs provide detailed information about user access and the operations performed on the cluster, which can be useful for security and compliance. See [LKE audit logs](https://techdocs.akamai.com/cloud-computing/docs/lke-audit-logs) for more information.


