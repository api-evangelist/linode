                      type: boolean
                      x-linode-cli-display: 6
                    metrics_enabled:
                      default: false
                      description: '__Beta__, __LKE Enterprise__, __Write-only__ Enables metrics on the cluster''s control plane. These metrics provide detailed information about the performance and resource usage of the cluster, which can be useful for monitoring and optimization purposes. See [Metrics for LKE Enterprise](https://techdocs.akamai.com/cloud-computing/docs/lke-e-metrics) for more information.


                        > 🚧

