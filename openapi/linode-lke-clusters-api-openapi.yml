                      type: boolean
                      writeOnly: true
                      x-akamai:
                        labels:
                        - LKE Enterprise
                        status: BETA
                      x-linode-cli-display: 5
                  type: object
                k8s_version:
                  description: 'The desired Kubernetes version for this Kubernetes cluster in the format of &lt;major&gt;.&lt;minor&gt;. New and recycled Nodes in this cluster will be installed with the latest available patch for the Cluster''s Kubernetes version.


