                    example:
                    - 10.0.0.64/26
                    - fd04:495a:691c:971c::1:0/112
                    items:
                      format: ip
                      type: string
                    type:
                    - array
                    - 'null'
                  ipam_address:
                    description: 'This interface''s private IP address in classless inter-domain routing (CIDR) notation.


