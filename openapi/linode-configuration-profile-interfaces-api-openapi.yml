    put:
      description: 'Update a `vpc` or `public` configuration profile interface for a specific configuration profile, on a specific Linode.


        - To access this operation, your user needs the `read_write` grant for the Linode.


        - A successful request triggers a `linode_config_update` event.


        - Only certain attributes can be updated for a configuration profile interface. You need to add a new configuration profile interface on your Linode if you need new values for any other attribute. Here are the supported objects, based on the interface''s `purpose`:


        - `public`. The `primary` attribute.


        - `vpc`. The `ip_ranges`, `ipv4`, or `primary` attributes.


        - You can''t update a configuration profile with a `purpose` of `vlan`.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes config-interface-update $linodeId $configId $interfaceId \

        --primary true \

        --ipv4.vpc "10.0.1.2" \

        --ipv4.nat_1_1 "203.0.113.2"

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-linode-config-interface
      operationId: put-linode-config-interface
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Linode configuration profile interface update request object.
              properties:
                ip_ranges:
                  description: 'IPv4 CIDR VPC subnet ranges that are routed to this interface.


                    - A range can''t include any addresses that are assigned to an active Linode or another VPC subnet.


                    - When updating, you need to include any existing ranges to maintain them. If a range is left out, it will be removed.


                    - Include this as an empty array (`[]`) to remove all existing `nat_1_1` values.


                    - Omit this array to leave all existing `ip_ranges` as is.

                    <<LB>>

                    > 📘

                    >

                    > This only applies to interfaces with a `purpose` of `vpc`.'
                  example:
                  - 10.0.0.64/26
                  - fd04:495a:691c:971c::1:0/112
                  items:
                    format: ip
                    type: string
                  type: array
                ipv4:
                  additionalProperties: false
                  description: 'IPv4 addresses configured for this interface.


                    > 📘

                    >

                    > This only applies to interfaces with a `purpose` of `vpc`.'
                  properties:
                    nat_1_1:
                      anyOf:
                      - format: ip
                        minLength: 1
                        title: An available public IPv4 address
                        type: string
                      - enum:
                        - any
                        title: The assigned public IPv4 address
                        type: string
                      description: 'The 1:1 NAT IPv4 address, used to associate a public IPv4 address with the interface''s VPC subnet IPv4 address.


                        - You can set this to a specific, public IPv4 address that''s available on the Linode. You can also use the `any` keyword to enable the Linode''s assigned public IPv4 address.


                        - A specified address can''t be used on another Linode.


                        - Include this as an empty object (`""`) to remove an existing `nat_1_1` value.


                        - Omit this object or include it and set it to `null` to leave an existing `nat_1_1` value as is.'
                      example: 203.0.113.2
                      type:
                      - string
                      - 'null'
                    vpc:
                      description: 'The VPC subnet IPv4 address for this interface.


                        - The `vpc` can''t be assigned to an existing Linode as an address or in a range.


                        - The target address can''t be the first two or last two addresses in the subnet IPv4 range.


                        - If omitted, a valid address within the subnet IPv4 range is automatically assigned.'
                      example: 10.0.0.2
                      format: ip
                      type:
                      - string
                      - 'null'
                  type: object
                primary:
                  description: 'Set to `true` to label this configuration profile interface as the default route to the Linode.


                    - Each Linode can have one interface set as its `primary`.


                    - If you don''t specifically set a `primary`, the first non-`vlan` type interface is automatically treated as the primary.'
                  example: '{{primary}}'
                  type: boolean
              type: object
              x-akamai:
                file-path: schemas/added-put-linode-config-interface.yaml
            x-example:
              x-ref: ../examples/put-linode-config-interface.json
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: The network interface to apply to this Linode's configuration profile.
                properties:
                  active:
                    description: __Read-only__ Returned as `true` if the interface has been booted using the configuration profile to which the interface belongs.
                    example: true
                    readOnly: true
                    type: boolean
                  id:
                    description: __Read-only__ The unique ID representing this interface.
                    example: 101
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  ip_ranges:
                    description: IPv4 CIDR VPC subnet ranges that are routed to this interface. This only applies to interfaces with a `purpose` of `vpc`. Returned as an empty string (`""`) if the interface has a `purpose` of `public` or `vlan`.
                    example:
                    - 10.0.0.64/26
                    - fd04:495a:691c:971c::1:0/112
                    items:
                      format: ip
                      type: string
                    type:
                    - array
                    - 'null'
                  ipam_address:
                    description: 'The interface''s private IP address, in classless inter-domain routing (CIDR) notation. Only applies to interfaces with a `purpose` of `vlan`. Returned as `null` if the interface has a `purpose` of `public` or `vpc`.


                      > 📘

                      >

                      > If Network Helper is enabled, the Linode''s interface is automatically configured to use this address after the Linode is rebooted. If Network Helper is disabled, enable the address using [manual static IP configuration](https://www.linode.com/docs/guides/manual-network-configuration/).'
                    example: 10.0.0.1/24
                    format: ip/netmask
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 4
                  ipv4:
                    additionalProperties: false
                    description: IPv4 addresses configured for this interface. Only applies to interfaces with a `purpose` of `vpc`. Returned as `null` if the interface has a `purpose` of `public` or `vlan`.
                    properties:
                      nat_1_1:
                        description: The 1:1 NAT IPv4 address, used to associate a public IPv4 address with the interface's VPC subnet IPv4 address. This only applies to interfaces with a `purpose` of `vpc`. Returned as `null` if no 1:1 NAT is set for a `vpc` interface. Returned as an empty string (`""`) if the interface has a `purpose` of `public` or `vlan`.
                        example: 203.0.113.2
                        format: ip
                        type:
                        - string
                        - 'null'
                      vpc:
                        description: The VPC subnet IPv4 address for this interface. This only applies to interfaces with a `purpose` of `vpc`. Returned as an empty string (`""`) if the interface has a `purpose` of `public` or `vlan`.
                        example: 10.0.0.2
                        format: ip
                        type:
                        - string
                        - 'null'
                    type: object
                  label:
                    description: __Filterable__ The name set for an interface with a `purpose` of `vlan`. Returned as `null` if the interface has a `purpose` of `public` or `vpc`.
                    example: example-interface
                    maxLength: 64
                    minLength: 1
                    pattern: '[a-zA-Z0-9-]+'
                    type:
                    - string
                    - 'null'
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  primary:
                    description: 'The default route to the Linode. Each Linode can have one interface set as its `primary`. Defaults to the first non-`vlan` type interface, if you haven''t specifically set a `primary`.


                      > 📘

                      >

                      > The value needs to `false` for any interface that uses `vlan` as its `purpose`.'
                    example: true
                    type: boolean
                  purpose:
                    description: 'The type of interface. This can be `public`, `vlan`, or `vpc`.


                      For interfaces with a `purpose` of `public`:


                      - You can only define one `public` interface per Linode.


                      - The Linode''s default public IPv4 address is assigned to the `public` interface.


                      - A Linode needs a `public` interface in the first or `eth0` position to be reachable via the public internet, after it boots. If no `public` interface is configured, you can only access the Linode through [LISH](https://www.linode.com/docs/products/compute/compute-instances/guides/lish/), or through another Linode that''s connected to the same VLAN or VPC.


                      For interfaces with a `purpose` of `vlan`:


                      - The target Linode is attached to the VLAN with the specified `label`.


                      - If an `ipam_address` is configured, the Linode uses this address.


                      For interfaces with a `purpose` of `vpc`:


                      - The target Linode is attached to an existing VPC subnet with the specified `subnet_id`.


                      - When the interface is activated, the Linode is configured to use an IP address from the range in the assigned VPC subnet. See `ipv4.vpc` for more information.'
                    enum:
                    - public
                    - vlan
                    - vpc
                    example: vlan
                    type: string
                    x-linode-cli-display: 3
                  subnet_id:
                    description: 'The `id` of the VPC subnet for this interface. Only applies to interfaces with a `purpose` of `vpc`. Returned as `null` if the interface has a `purpose` of `public` or `vlan`.


                      > 📘

                      >

                      > You need to reboot a Linode using the interface''s configuration profile to assign the Linode to a VPC subnet.'
                    example: 101
                    type:
                    - integer
                    - 'null'
                  vpc_id:
                    description: __Read-only__ The `id` of the VPC configured for this interface. Returned as `null` for non-`vpc` type interfaces.
                    example: 111
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                required:
                - purpose
                type: object
                x-akamai:
                  file-path: schemas/linode-config-update.yaml
              x-example:
                x-ref: ../examples/get-linode-config-interface-200.json
          description: Configuration profile interface successfully updated.
