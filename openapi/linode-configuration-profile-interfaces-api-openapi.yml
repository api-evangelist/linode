                        example: 203.0.113.2
                        type:
                        - string
                        - 'null'
                      vpc:
                        description: 'The VPC subnet IPv4 address for this interface.


                          - This only applies to interfaces with a `purpose` of `vpc`.


                          - Returned as an empty string (`""`) for non-`vpc` type interfaces.


