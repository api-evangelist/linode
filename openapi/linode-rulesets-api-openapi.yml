                        additionalProperties: false
                        description: 'Prefix List references, IPv4 and IPv6 addresses affected by this rule. A rule can have up to 255 total addresses or networks listed across its `ipv4` and `ipv6` arrays. A network and a single IP are treated as equivalent when accounting for this limit.


                          Must contain `ipv4`, `ipv6`, or both.'
