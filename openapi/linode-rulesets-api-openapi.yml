                  example: '{{created}}'
                  format: date-time
                  readOnly: true
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 4
                  x-linode-filterable: true
                deleted:
                  description: __Read-only__ This indicates when a Rule Set was deleted, or `null` if it's not deleted.
                  example: '{{deleted}}'
                  format: date-time
                  readOnly: true
                  type:
                  - string
                  - 'null'
                  x-linode-cli-display: 9
                description:
                  description: Describes this Rule Set. For display purposes only.
                  example: '{{description}}'
                  maxLength: 255
                  minLength: 1
                  type: string
                  x-linode-cli-display: 2
                id:
