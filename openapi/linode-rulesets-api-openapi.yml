                        type:
                        - string
                        - 'null'
                      protocol:
                        description: The type of network traffic affected by this rule.
                        enum:
                        - TCP
                        - UDP
                        - ICMP
                        - IPENCAP
                        example: TCP
                        type: string
                    type: object
                  type: array
                type:
                  description: Indicates whether the Rule Set’s rules are for `inbound` or `outbound` traffic. This needs to match the `type` in the rule group in which it appears.
