      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/firewall-rulesets.yaml
      path-info: /{apiVersion}/networking/firewalls/rulesets
    x-linode-cli-command: firewalls
    post:
      description: 'Creates a Rule Set. A Rule Set is a named ordered set of Cloud Firewall rules. Rule Sets are designed to be reusable and are referenced in your Cloud Firewalls to help control access to network resources and services.


        - Rule Sets can be defined by users or managed services. Rule Sets created by a managed service cannot be modified, but you can view them. For example, LKE-E automatically creates and manages Rule Sets that allow cluster nodes to access necessary resources. You can review these rules, but LKE-E manages them for you.


        - Rule Sets capability is available for Linodes.


        - Rule Sets are versioned for auditing.


        - Rule Sets can be assigned to multiple firewalls, and each firewall can have multiple Rule Sets. However, Rule Sets can''t reference other Rule Sets.


        - A `rulesets_add` event is generated when the firewall device is added successfully.


        - Prefix Lists can be referenced in Rule Sets.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `firewall:read_write`


        **CLI**


        ```shell

        linode-cli firewalls ruleset-create \

        --label ruleset123 \

        --description rulesetABC \

        --type "inbound" \

        --rules ''[{"action":"ACCEPT", "description":"ABC-NeT-RuleSet", "protocol": "TCP", "ports": "22-24, 80, 443", "addresses": {"ipv4": ["192.0.2.0/24", "198.51.100.2/32", "pl::vpcs:1234", "pl::vpcs:"], "ipv6": ["2001:DB8::/128", "pl::vpcs:1234", "pl::vpcs:"]}}]''

        ```


        Learn more'
