                            description: 'A list of IPv4 addresses, networks, and Prefix List references. Addresses must be in IP/mask format. Must not be an empty list.


                              If `0.0.0.0/0` is included in this list, all IPv4 addresses are affected by this rule.'
                            example:
                            - 192.0.2.0/24
                            - 198.51.100.2/32
                            - pl::vpcs:1234
                            - pl::vpcs:<current>
                            - pl:system:test:123
                            items:
                              type: string
                            type: array
                          ipv6:
                            description: 'A list of IPv6 addresses, networks, and Prefix List references. Addresses must be in IP/mask format and must not include zone_id notation as described in [RFC 4007](https://www.rfc-editor.org/rfc/rfc4007). Must not be an empty list.


                              If `::/0` is included in this list, all IPv6 addresses are affected by this rule.'
                            example:
                            - 2001:DB8::/128
                            - pl::vpcs:1234
                            - pl::vpcs:<current>
                            items:
                              type: string
                            type: array
                        type: object
                      description:
                        description: Used to describe this rule. For display purposes only.
                        example: An example firewall rule description.
                        maxLength: 100
                        minLength: 1
                        type: string
                      label:
                        description: Used to identify this rule. For display purposes only.
                        example: RuleSetrule123
                        maxLength: 32
                        minLength: 3
                        type: string
                      ports:
                        description: 'A string representing any ports affected by this rule:


                          - If no ports are configured, or if an empty string value (`""`) or `null` is used, all ports are affected.

                          - The string may be a single port, a range of ports, or a comma-separated list of single ports and port ranges. A space can follow each comma.

                          - A range of ports includes both the start and end values. The end value must be greater than the start value.

                          - Ports must be within 1 and 65535, and may not contain any leading zeroes. For example, port `080` is not allowed.

                          - The `ports` string can have up to 15 _pieces_, where a single port is treated as one piece, and a port range is treated as two pieces. For example, the string `22-24, 80, 443` has four pieces.

                          - Only allowed for the TCP and UDP protocols. Ports are not allowed for the ICMP and IPENCAP protocols.'
