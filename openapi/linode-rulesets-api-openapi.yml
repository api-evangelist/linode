                  example: '{{is_service_defined}}'
                  readOnly: true
                  type: boolean
                  x-linode-cli-display: 7
                label:
                  description: __Filterable__ Unique, user-defined label for this Rule Set. This label helps you identify and describe your Rule Set.
                  example: '{{label}}'
                  maxLength: 32
                  minLength: 2
                  type:
                  - string
                  - 'null'
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 1
                  x-linode-filterable: true
                rules:
                  description: The inbound or outbound access rules for the Rule Set. A Rule Set can have a total of 25 inbound and outbound rules. Multiple rules are applied in order. If two rules conflict, the first rule takes precedence. For example, if the first rule accepts inbound traffic from an address, and the second rule drops inbound traffic from the same address, the first rule applies, and inbound traffic from that address is accepted.
                  items:
                    additionalProperties: false
                    properties:
                      action:
                        description: Controls whether traffic is accepted or dropped by this rule. Overrides the firewall's `inbound_policy` if this is an inbound rule, or the `outbound_policy` if this is an outbound rule.
                        enum:
                        - ACCEPT
                        - DROP
                        example: ACCEPT
                        type: string
