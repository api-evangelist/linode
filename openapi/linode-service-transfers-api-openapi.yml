openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Service transfers API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to manage transfer requests for specific Akamai Cloud Computing services. For example, you could request a service transfer to move a Linode from one region to another. Service transfers have replaced Entity transfers, which have been deprecated.
  name: Service transfers
paths:
  /{apiVersion}/account/service-transfers:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/service-transfers.yaml
      path-info: /{apiVersion}/account/service-transfers
    x-linode-cli-command: service-transfers
    post:
      description: 'Creates a transfer request for the specified services. A request can contain any of the specified service types and any number of each service type. At this time, only Linodes can be transferred.


        When created successfully, a confirmation email is sent to the account that created this transfer containing a transfer token and instructions on completing the transfer.


        When a transfer is accepted, the requested services are moved to the receiving account. Linode services will not experience interruptions due to the transfer process. Backups for Linodes are transferred as well.


        DNS records that are associated with requested services will not be transferred or updated. Please ensure that associated DNS records have been updated or communicated to the recipient prior to the transfer.


        A transfer can take up to three hours to complete once accepted. When a transfer is completed, billing for transferred services ends for the sending account and begins for the receiving account.


        This operation can only be accessed by the unrestricted users of an account.


        There are several conditions that you need to meet to successfully create a transfer request:


        1. The account creating the transfer can''t have a past due balance or active Terms of Service violation.


        1. The service needs to be owned by the account that is creating the transfer.


        1. The service can''t be assigned to another Service Transfer that is pending or that''s been accepted and is incomplete.


        1. Linodes can''t:


        - be assigned to a NodeBalancer, Firewall, VLAN, VPC, or Managed Service.


        - have any attached Block Storage Volumes.


        - have any shared IP addresses.


        - have any assigned /32, /56, /64, or /116 IPv6 ranges.


        >


        ---


        - __CLI__.


        ```

        linode-cli service-transfers \

        create \

        --entities.linodes 111 \

        --entities.linodes 222

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-service-transfer
      operationId: post-service-transfer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entities:
                  additionalProperties: false
                  description: A collection of the services to include in this transfer request, separated by type.
                  properties:
                    linodes:
                      description: An array containing the IDs of each of the Linodes included in this transfer.
                      example:
                      - 111
                      - 222
                      items:
                        type: integer
                      type: array
                      x-linode-cli-display: 5
                  type: object
              required:
              - entities
              type: object
              x-akamai:
                file-path: schemas/added-post-service-transfer.yaml
            x-example:
              x-ref: ../examples/post-service-transfer.json
        description: The services to include in this transfer request.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: An object representing a Service Transfer.
                properties:
                  created:
                    description: When this transfer was created.
                    example: '2021-02-11T16:37:03'
                    format: date-time
                    type: string
                  entities:
                    additionalProperties: false
                    description: A collection of the services to include in this transfer request, separated by type.
                    properties:
                      linodes:
                        description: An array containing the IDs of each of the Linodes included in this transfer.
                        example:
                        - 111
                        - 222
                        items:
                          type: integer
                        type: array
                        x-linode-cli-display: 5
                    type: object
                  expiry:
                    description: When this transfer expires. Transfers will automatically expire 24 hours after creation.
                    example: '2021-02-12T16:37:03'
                    format: date-time
                    type: string
                    x-linode-cli-display: 3
                  is_sender:
                    description: __Filterable__ If the requesting account created this transfer.
                    example: true
                    type: boolean
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  status:
                    description: '__Filterable__ The status of the transfer request.


                      `accepted`: The transfer has been accepted by another user and is currently in progress.

                      Transfers can take up to 3 hours to complete.


                      `canceled`: The transfer has been canceled by the sender.


                      `completed`: The transfer has completed successfully.


                      `failed`: The transfer has failed after initiation.


                      `pending`: The transfer is ready to be accepted.


                      `stale`: The transfer has exceeded its expiration date. It can no longer be accepted or

                      canceled.'
                    enum:
                    - accepted
                    - canceled
                    - completed
                    - failed
                    - pending
                    - stale
                    example: pending
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-color:
                      accepted: yellow
                      canceled: red
                      completed: green
                      default_: white
                      failed: red
                      pending: yellow
                      stale: red
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  token:
                    description: The token used to identify and accept or cancel this transfer.
                    example: 123E4567-E89B-12D3-A456-426614174000
                    format: uuid
                    type: string
                    x-linode-cli-display: 1
                  updated:
                    description: When this transfer was last updated.
                    example: '2021-02-11T16:37:03'
                    format: date-time
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/service-transfer.yaml
              x-example:
                x-ref: ../examples/post-service-transfer-200.json
          description: Returns a Service Transfer object for the request.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
