    post:
      deprecated: true
      description: '__Deprecated__ This operation is disabled and no longer accessible. PayPal can be designated as a payment method for automated payments using Cloud Manager. See Manage Payment Methods.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-execute-pay-pal-payment
      operationId: post-execute-pay-pal-payment
