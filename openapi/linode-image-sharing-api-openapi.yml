                          example: 1
                          type: integer
                          x-linode-cli-display: 1
                        images_count:
                          description: __Read-only__ The total number of images currently belonging to the share group.
                          readOnly: true
                          type: integer
                          x-linode-cli-display: 6
                        is_suspended:
