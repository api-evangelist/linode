  /{apiVersion}/images/sharegroups/tokens:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/images-sharegroup-tokens.yaml
      path-info: /{apiVersion}/images/sharegroups/tokens
    x-linode-cli-command: image-sharegroups
    post:
      description: '__Beta__ Creates a single-use membership token for users who want to join a share group with custom images.


        - Before creating a token, get the share group''s UUID from its owner. The owner can run List share groups or Get a share group to get the group''s UUID. If needed, Create a share group and share the UUID with the user.


        - Share the `token` from the response with the share group owner. The owner can later use the token to Add members to a share group and manage the users'' membership within the group.


        > 📘

        >

        > This operation is in Beta and available from the `v4beta` URL.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `images:read_write`


        **CLI**


        ```shell

        linode-cli image-sharegroups token-create --label "my_token" --valid_for_sharegroup_uuid "abc123"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-sharegroup-tokens
      operationId: post-sharegroup-tokens
      requestBody:
        content:
          application/json:
            example:
              label: Backend Services - Engineering
              valid_for_sharegroup_uuid: e1d0e58b-f89f-4237-84ab-b82077342359
            schema:
              additionalProperties: false
              properties:
                label:
                  description: The token's descriptive name.
                  example: '{{label}}'
                  type: string
                valid_for_sharegroup_uuid:
                  description: The unique identifier of the share group you want to create a token for.
                  example: '{{valid_for_sharegroup_uuid}}'
                  type: string
              required:
              - valid_for_sharegroup_uuid
              type: object
              x-akamai:
                file-path: schemas/post-sharegroup-token.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2025-08-04T10:09:09'
                expiry: null
                label: Backend Services - Engineering
                sharegroup_label: DevOps Base Images
                sharegroup_uuid: e1d0e58b-f89f-4237-84ab-b82077342359
                status: active
                token: eyJhbGciOiJIUzI1 ... VNKDTt2yEiJVGSos
                token_uuid: 13428362-5458-4dad-b14b-8d0d4d648f8c
                updated: null
                valid_for_sharegroup_uuid: e1d0e58b-f89f-4237-84ab-b82077342359
              schema:
                additionalProperties: false
                description: The share group membership token's details.
                properties:
                  created:
                    description: __Read-only__ When the token was created.
                    example: '2025-08-04T10:09:09'
                    readOnly: true
                    type: string
                  expiry:
                    description: __Read-only__ When this token expires.
                    example: null
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  label:
                    description: The token's descriptive name.
                    example: Backend Services - Engineering
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 2
                  sharegroup_label:
                    description: __Read-only__ The share group's descriptive name.
                    example: DevOps Base Images
                    readOnly: true
                    type: string
                    x-linode-cli-display: 6
                  sharegroup_uuid:
                    description: __Read-only__ The share group's unique identifier.
                    example: e1d0e58b-f89f-4237-84ab-b82077342359
                    readOnly: true
                    type: string
                    x-linode-cli-display: 5
                  status:
                    description: '__Read-only__ The membership token''s status:


                      - `pending`: The token has been created but is not yet active.

                      - `active`: The token is currently active and usable.

                      - `revoked`: The token has been deleted and is no longer valid.

                      - `expired`: The token has passed its validity period and is no longer usable.'
                    enum:
                    - pending
                    - active
                    - revoked
                    - expired
                    example: active
                    readOnly: true
                    type: string
                    x-linode-cli-display: 3
                  token:
                    description: '__Read-only__ The single-use JWT membership token encoded as a string. It consists of three parts: header, payload, and signature. Shared image groups owners can use it to [Add members to a share group](https://techdocs.akamai.com/linode-api/reference/post-sharegroup-members).'
                    example: eyJhbGciOiJIUzI1 ... VNKDTt2yEiJVGSos
                    readOnly: true
                    type: string
                    x-linode-cli-display: 7
                  token_uuid:
                    description: __Read-only__ The membership token's unique identifier.
                    example: 13428362-5458-4dad-b14b-8d0d4d648f8c
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  updated:
                    description: __Read-only__ When the token was last updated.
                    example: null
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  valid_for_sharegroup_uuid:
                    description: __Read-only__ The unique identifier of the share group you created a token for.
                    example: e1d0e58b-f89f-4237-84ab-b82077342359
                    readOnly: true
                    type: string
                    x-linode-cli-display: 4
                required:
                - token
                - token_uuid
                - status
                - label
                - created
                - updated
                - expiry
                - valid_for_sharegroup_uuid
                - sharegroup_uuid
                - sharegroup_label
                type: object
                x-akamai:
                  file-path: schemas/post-sharegroup-token-200.yaml
          description: Token generated successfully.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - images:read_write
      summary: Create a token
      tags:
      - Image sharing
      x-akamai:
        status: BETA
        tabs:
        - syntax: linode-cli image-sharegroups token-create --label "my_token" --valid_for_sharegroup_uuid "abc123"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: token-create
      x-linode-redoc-load-ids: true
    get:
      description: '__Beta__ Get details about all the user''s tokens.


        > 📘

        >

        > This operation is in Beta and available from the `v4beta` URL.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


