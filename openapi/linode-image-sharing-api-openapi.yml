    x-akamai:
      file-path: paths/images-sharegroups.yaml
      path-info: /{apiVersion}/images/sharegroups
    x-linode-cli-command: image-sharegroups
    post:
      description: '__Beta__ Creates a group to share images with other users.


        - Include existing `images` in the request or Add images to a share group later. Run the Get an image operation to see the existing images'' `id` values. If needed, Create an image or Upload an image.


        - You can set a `label` and `description` for the group and each image, visible to all group members.


        - If omitted, the shared image keeps the original `label` and `description`. Note that when you Update the original image, it has no effect on shared image''s details within any groups.


        - Run the Add members to a share group to include other users in the group. Use the group''s `uuid` from the response to Create a token for user authentication.


        > 📘

        >

        > This operation is in Beta and available from the `v4beta` URL.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `images:read_write`


        **CLI**


        ```shell

        linode-cli image-sharegroups create --label "my_label" --description "my_description" \

        --images ''[{"id": "private/15", "label": "Linux Debian", "description": "Official Debian Linux image for server deployment"}]''

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-sharegroups
      operationId: post-sharegroups
      requestBody:
        content:
          application/json:
            example:
              description: Group of base operating system images and engineers used for CI/CD pipelines and infrastructure automation
              images:
              - description: Official Debian Linux image for server deployment
                id: private/7
                label: Linux Debian
              label: DevOps Base Images
            schema:
              additionalProperties: false
              properties:
                description:
                  description: A detailed description of this share group.
                  example: '{{description}}'
                  type: string
                images:
                  description: A list of image's details, including the ID, label, and description.
                  items:
                    additionalProperties: false
                    properties:
                      description:
                        description: The image's description within the share group.
                        example: Official Debian Linux image for server deployment
                        type: string
                      id:
                        description: The private image’s unique slug identifier.
                        example: private/7
                        type: string
                      label:
                        description: The image's name within the share group.
                        example: Linux Debian
                        type: string
                    required:
                    - id
                    type: object
                  type: array
                label:
                  description: The share group's descriptive name.
                  example: '{{label}}'
                  type: string
              required:
              - label
              type: object
              x-akamai:
                file-path: schemas/post-sharegroup.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2025-04-14T22:44:02'
                description: Group of base operating system images and engineers used for CI/CD pipelines and infrastructure automation
                expiry: null
                id: 1
                images_count: 0
                is_suspended: false
                label: DevOps Base Images
                members_count: 0
                updated: null
                uuid: 1533863e-16a4-47b5-b829-ac0f35c13278
              schema:
                additionalProperties: false
                description: The share group's details.
                properties:
                  created:
                    description: __Read-only__ When this share group was created.
                    example: '2025-04-14T22:44:02'
                    readOnly: true
                    type: string
                  description:
                    description: A detailed description of this share group.
                    example: Group of base operating system images and engineers used for CI/CD pipelines and infrastructure automation
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 4
                  expiry:
                    description: __Read-only__ When the share group expires.
                    example: null
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  id:
                    description: __Read-only__ The share group's numeric identifier, used primarily as path parameters in URLs.
                    example: 1
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  images_count:
                    description: __Read-only__ The total number of images currently belonging to the share group.
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 6
                  is_suspended:
                    description: __Read-only__ If `true`, the share group is currently suspended.
                    example: false
                    readOnly: true
                    type: boolean
                    x-linode-cli-display: 5
                  label:
                    description: The share group's descriptive name.
                    example: DevOps Base Images
                    type: string
                    x-linode-cli-display: 2
                  members_count:
                    description: __Read-only__ The number of users with access to the share group.
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 7
                  updated:
                    description: __Read-only__ When this share group was last updated.
                    example: null
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  uuid:
                    description: __Read-only__ The share group's unique identifier used for membership token management.
                    example: 1533863e-16a4-47b5-b829-ac0f35c13278
                    format: uuid
                    readOnly: true
                    type: string
                    x-linode-cli-display: 3
                required:
                - id
                - uuid
                - label
                - description
                - is_suspended
                - created
                - updated
                - expiry
                - images_count
                - members_count
                type: object
                x-akamai:
                  file-path: schemas/sharegroup.yaml
          description: New share group created successfully.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - images:read_write
