  /{apiVersion}/databases/valkey/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/valkey-instances.yaml
      path-info: /{apiVersion}/databases/valkey/instances
    x-linode-cli-command: databases
    post:
      description: '__Limited availability__ Creates or restores a Valkey Managed Database.


        - New instances can take 10 to 15 minutes to deploy.


        - When you create a new Valkey Managed Database, our partner Aiven automatically enables disk encryption on each cluster.


        - Valkey databases automatically back up data every 12 hours and support configurable data persistence using Redis Database Backup (RDB). To change the default 12 hours to 24 hours, set the `backup_hour` parameter in the `engine_config` object. It may take another backup cycle for the new backup time to be applied.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the Valkey Managed Database. Configure the maintenance window for these updates with the Update a Valkey Managed Database operation.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. Adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - A successful request triggers a `database_create` event.


        - You can create a Valkey Managed Database in a VPC using the `private_network` object in the request.


        **Restore a Valkey Managed Database**


        Include the `fork` object in the request to target a backed-up database. The only required value is `source`. If you provide other values, the forked cluster will use those settings. You can''t change `engine`.


        > 📘

        >

        > Restoring from a backup creates a second running cluster, which incurs billing. Delete the first cluster after the restore is complete, to avoid this billing.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `account_database_creator`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `databases:read_write`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-databases-valkey-instances
      operationId: post-databases-valkey-instances
      requestBody:
        content:
          application/json:
            examples:
              create-valkey-cluster:
                summary: Create Valkey database
                value:
                  allow_list:
                  - 192.0.2.61/24
                  - 192.0.2.124/24
                  cluster_size: 1
                  engine: valkey/8
                  engine_config:
                    frequent_snapshots: true
                    valkey_active_expire_effort: 3
                    valkey_lfu_decay_time: 20
                  label: example-db
                  private_network:
                    public_access: false
                    subnet_id: 456
                    vpc_id: 123
                  region: us-east
                  ssl_connection: true
                  type: g6-standard-2
              fork-valkey-cluster:
                summary: Restore Valkey database
                value:
                  allow_list:
                  - 192.0.2.61/24
                  - 192.0.2.124/24
                  cluster_size: 1
                  engine_config:
                    frequent_snapshots: true
                    valkey_active_expire_effort: 3
                    valkey_lfu_decay_time: 20
                  fork:
                    restore_time: '2025-12-29T20:40:15'
                    source: 1234
                  label: example-db
                  private_network:
                    public_access: false
                    subnet_id: 456
                    vpc_id: 123
                  region: us-east
                  ssl_connection: true
                  type: g6-standard-2
            schema:
              additionalProperties: false
              description: Managed Valkey Database request object.
              oneOf:
              - additionalProperties: false
                description: Managed Valkey Database request object.
                properties:
                  allow_list:
                    description: 'Controls access to the Managed Database.


                      - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                      - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                      - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                    example:
                    - 203.0.113.1/32
                    - 192.0.1.0/24
                    items:
                      format: ipv4/prefix_length
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                      type: string
                    minItems: 0
                    type: array
                  cluster_size:
                    default: 1
                    description: 'The number of Linode instance nodes deployed to the Managed Database, from `1` to `3`. Consider these points when setting a `cluster_size`:


                      - Choose `3` nodes to create a high availability cluster that consists of one `primary` node and two `standby` nodes.


                      - A `2` node cluster is only available with a dedicated plan. It consists of one `primary` node and one `standby` node.'
                    enum:
                    - 1
                    - 2
                    - 3
                    example: 3
                    type: integer
                    x-linode-cli-display: 5
                  engine:
                    description: The `id` of the Managed Database engine. To get the available values, run the [List Managed Databases engines](https://techdocs.akamai.com/linode-api/reference/get-databases-engines) operation.
                    example: valkey/8
                    type: string
                  engine_config:
                    additionalProperties: false
                    description: 'Advanced parameters applied to a Valkey Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/valkey/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                      > 📘

                      >

                      > Aiven may offer additional parameters in their specification. Currently, only those listed here are supported for use in a Valkey Managed Database. You can also run the [Get Valkey Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-valkey-config) operation to see an up-to-date list.'
                    properties:
                      backup_hour:
                        description: The hour of day (in UTC) when the backup for the service starts. New backups only start if the previous backup has already completed.
                        maximum: 23
                        minimum: 0
                        type: integer
                      backup_minute:
                        description: The minute of an hour when backup for the service is started. New backup is only started if previous backup has already completed.
                        maximum: 23
                        minimum: 0
                        type:
                        - integer
                        - 'null'
                      frequent_snapshots:
                        description: When enabled, Valkey creates frequent local RDB snapshots. When disabled, Valkey only takes RDB snapshots when a backup is created, based on the backup schedule. This setting is ignored when `valkey_persistence` is set to off.
                        type: boolean
                      valkey_acl_channels_default:
                        description: Default ACL for pub/sub channels used when a Valkey user is created. Determines default pub/sub channels' ACL for new users if ACL is not supplied. When this option is not defined, all_channels is assumed to keep backward compatibility. This option doesn't affect Valkey configuration acl-pubsub-default.
                        type: string
                      valkey_active_expire_effort:
                        default: 1
                        description: Active expire effort. Valkey reclaims expired keys both when accessed and in the background. The background process scans for expired keys to free memory. Increasing the active-expire-effort setting uses more CPU to reclaim expired keys faster, reducing memory usage but potentially increasing latency.
                        maximum: 10
                        minimum: 1
                        type: integer
                      valkey_activedefrag:
                        default: false
                        description: Enables active memory defragmentation. When enabled, Valkey relocates objects off sparsely-used memory pages to reduce fragmentation and return memory to the operating system. Defragmentation runs on the main thread and consumes CPU, so it may increase latency under load.
                        example: false
                        type: boolean
                      valkey_lfu_decay_time:
                        default: 1
                        description: LFU maxmemory-policy counter decay time in minutes.
                        maximum: 120
                        minimum: 1
                        type: integer
                      valkey_lfu_log_factor:
                        default: 10
                        description: Counter logarithm factor for volatile-lfu and allkeys-lfu maxmemory-policies.
                        maximum: 100
                        type: integer
                      valkey_maxmemory_policy:
                        default: noeviction
                        description: Valkey maxmemory-policy.
                        type:
                        - string
                        - 'null'
                      valkey_number_of_databases:
                        description: Set number of Valkey databases. Changing this will cause a restart of the Valkey service.
                        maximum: 128
                        minimum: 1
                        type: integer
                      valkey_persistence:
                        default: rdb
                        description: '- If set to `rdb`, Valkey generates periodic snapshots at least according to the backup schedule (either every twelve hours with an initial time chosen by the system or every 24 hours based on `backup_hour` and `backup_minute`, if set). Combined with the `frequent_snapshots` parameter set to `true`, Valkey generates snapshots every ten minutes if data has changed, which limits data loss in case nodes have to restart for any reason.


