                private_network:
                  additionalProperties: false
                  description: Restricts access on a Managed Database to a specific Virtual Private Cloud (VPC) configured for the cluster. Displayed as `null` if no VPC is configured.
                  properties:
                    public_access:
                      default: false
                      description: 'Set to `true` allows clients outside of the VPC to connect to the database using a public IP address.


