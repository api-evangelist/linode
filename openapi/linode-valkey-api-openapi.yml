                region:
                  description: __Filterable__ The unique identifier for the [region](https://techdocs.akamai.com/linode-api/reference/get-regions) where the Managed Database lives.
                  example: '{{region}}'
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 3
                  x-linode-filterable: true
                type:
                  description: 'Request re-sizing of your cluster to a Linode type with more disk space. For example, you could request a Linode type that uses a higher plan.


                    - Needs to be a Linode type with more disk space than your current Linode.


                    - Resizing to a larger Linode type can accrue additional cost. Review the `price` output from the [List types](https://techdocs.akamai.com/linode-api/reference/get-linode-types) operation for more information.


                    - You can''t update the `allow_list` and set a new `type` in the same request.


                    - Any active updates to your cluster need to complete before you can request a resize. The reverse is also true: An active resizing needs to complete before you can perform any other update.'
                  example: '{{type}}'
                  type: string
                updates:
                  additionalProperties: false
                  description: Configuration settings for automated patch update maintenance for the Managed Database.
                  properties:
                    day_of_week:
                      description: The numeric reference for the day of the week to perform maintenance. `1` is Monday, `2` is Tuesday, through to `7` which is Sunday.
                      example: 1
                      maximum: 7
