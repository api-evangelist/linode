                    frequency:
                      default: weekly
                      description: How frequently maintenance occurs. Currently can only be `weekly`.
                      enum:
                      - weekly
                      example: weekly
                      type: string
                    hour_of_day:
                      description: The hour to begin maintenance based in UTC time.
                      example: 0
                      maximum: 23
                      minimum: 0
                      type: integer
                    pending:
                      description: __Read-only__ An array of pending updates.
                      example: []
                      items:
                        additionalProperties: false
                        description: A planned maintenance update.
                        properties:
                          deadline:
                            description: The time when a mandatory update needs to be applied.
                            example: '2024-10-14T19:55:12'
                            type:
                            - string
                            - 'null'
                          description:
                            description: A description of the update.
                            example: TimescaleDB version 2.17.1 is available.
                            type: string
                          planned_for:
                            description: The time when a maintenance update will be applied.
                            example: '2024-10-14T19:55:12'
                            type:
                            - string
                            - 'null'
                        type: object
                      minItems: 0
                      readOnly: true
                      type: array
                  type: object
                version:
                  description: __Filterable__ The Managed Database engine version.
                  example: '{{version}}'
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 7
                  x-linode-filterable: true
