                                      enum:
                                      - TCP
                                      - UDP
                                      - ICMP
                                      - IPENCAP
                                      - ALL
                                      example: TCP
                                      title: Protocol name
                                      type: string
                                    - description: A decimal string representation of an IANA-assigned IP protocol number including "0" to "255". For example, use `"50"` for ESP or `"51"` for AH. Numeric protocols other than `"6"` (TCP), `"17"` (UDP), or `"132"` (SCTP) must not include a `ports` field. Leading zeros are not permitted, for example use `"6"`, not `"06"`.
                                      example: '50'
