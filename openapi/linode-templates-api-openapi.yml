      file-path: paths/firewall-templates.yaml
      path-info: /{apiVersion}/networking/firewalls/templates
      status: BETA
    x-linode-cli-command: firewalls
    get:
      description: '__Beta__ Returns a paginated list of a firewall templates. There are firewall templates specifically for VPC interfaces and public interfaces. Firewall templates come with some protection rules already configured.


        >


        ---


        - __CLI__.


        ```

        linode-cli firewalls templates-list

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        firewall:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-firewall-templates
      operationId: get-firewall-templates
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
