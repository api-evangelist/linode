                      additionalProperties: false
                      description: A list of firewall templates and their `rules`.
                      properties:
                        rules:
                          additionalProperties: false
                          description: 'The inbound and outbound access rules for the VPC firewall template.


                            A firewall can have up to 25 rules across its inbound and outbound rule sets. Multiple rules are applied in order. If two rules conflict, the first rule takes precedence. For example, if the first rule accepts inbound traffic from an address, and the second rule drops inbound traffic from the same address, the first rule applies, and inbound traffic from that address is accepted.'
                          properties:
                            inbound:
                              description: The inbound rules for the firewall.
                              items:
                                additionalProperties: false
                                description: One of a Firewall's inbound or outbound access rules. The `ports` property can be used to allow traffic on a comma-separated list of different ports.
                                properties:
                                  action:
                                    description: Controls whether traffic is accepted or dropped by this rule. Overrides the Firewall's `inbound_policy` if this is an inbound rule, or the `outbound_policy` if this is an outbound rule.
