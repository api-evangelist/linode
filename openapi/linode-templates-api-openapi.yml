          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    example:
                    - rules:
                        inbound:
                        - action: ACCEPT
                          addresses:
                            ipv4:
                            - 0.0.0.0/0
                            ipv6:
                            - ::/0
                          description: Rule to allow inbound SSH traffic.
                          label: accept-inbound-ssh
                          ports: '22'
                          protocol: TCP
                        - action: ACCEPT
                          addresses:
                            ipv4:
                            - 0.0.0.0/0
                            ipv6:
                            - ::/0
                          description: Rule to allow inbound ICMP traffic.
                          label: accept-inbound-icmp
                          protocol: ICMP
                        - action: ACCEPT
                          addresses:
                            ipv4:
                            - 10.0.0.0/8
                            - 192.168.0.0/17
                            - 172.16.0.0/12
                            ipv6: []
                          description: Rule to allow inbound for RFC1918 ranges; `10.0.0.0/8`, `192.168.0.0/17`, `172.16.0.0/12`.
                          label: accept-inbound-rfc1918
                          ports: 1-65535
                          protocol: TCP, UDP
                        inbound_policy: DROP
                        outbound_policy: ACCEPT
                      slug: vpc
                    - rules:
                        inbound:
                        - action: ACCEPT
                          addresses:
                            ipv4:
                            - 0.0.0.0/0
                            ipv6:
                            - ::/0
                          description: Rule to allow inbound SSH traffic.
                          label: accept-inbound-ssh
                          ports: '22'
                          protocol: TCP
                        - action: ACCEPT
                          addresses:
                            ipv4:
                            - 0.0.0.0/0
                            ipv6:
                            - ::/0
                          description: Rule to allow inbound ICMP traffic.
                          label: accept-inbound-icmp
                          protocol: ICMP
