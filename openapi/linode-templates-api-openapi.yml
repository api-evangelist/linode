  /{apiVersion}/networking/firewalls/templates/{slug}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: __Enum__ The firewall template type, available for either `vpc` or `public` interfaces.
      example: '{{slug}}'
      in: path
      name: slug
      required: true
      schema:
        enum:
        - vpc
        - public
        example: public
        type: string
      x-akamai:
        file-path: parameters/firewall-template-path.yaml
    x-akamai:
      file-path: paths/firewall-template.yaml
      path-info: /{apiVersion}/networking/firewalls/templates/{slug}
    x-linode-cli-command: firewalls
    get:
      description: 'Gets a `vpc` or `public` firewall template you can use with Linode VPC and public interfaces. Firewall templates come with some protection rules already configured.


        The public interface''s firewall template allows for login with SSH, and regular networking control data. You should further strengthen these rules by limiting the allowed IPv4 and IPv6 ranges.


        The VPC interface''s firewall template allows for login with SSH, regular networking control data, and inbound traffic from the VPC address space. You should further strengthen these rules by limiting the allowed IPv4 and IPv6 ranges.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. This operation is internet-facing. No permissions are required.

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `firewall:read_only`


        **CLI**


        ```shell

        linode-cli firewalls template-view vpc

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-firewall-template
      operationId: get-firewall-template
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              examples:
                ex-public:
                  summary: Public firewall template
                  value:
                    data:
                    - rules:
                        inbound:
                        - action: ACCEPT
                          addresses:
