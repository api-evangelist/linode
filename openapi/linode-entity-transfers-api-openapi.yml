openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Entity transfers API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: These legacy operations are available to review and manage the transfer of one entity to another. These operations have been deprecated. Use the Service transfers category operations instead.
  name: Entity transfers
paths:
  /{apiVersion}/account/entity-transfers:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/entity-transfers.yaml
      path-info: /{apiVersion}/account/entity-transfers
    post:
      deprecated: true
      description: '__Deprecated__ Please run Request a service transfer.


        >


        ---


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-entity-transfer
      operationId: post-entity-transfer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entities:
                  additionalProperties: false
                  description: A collection of the entities to include in this transfer request, separated by type.
                  properties:
                    linodes:
                      description: An array containing the IDs of each of the Linodes included in this transfer.
                      example:
                      - 111
                      - 222
                      items:
                        type: integer
                      type: array
                      x-linode-cli-display: 5
                  type: object
              required:
              - entities
              type: object
              x-akamai:
                file-path: schemas/added-post-entity-transfer.yaml
            x-example:
              x-ref: ../examples/post-entity-transfer.json
        description: The entities to include in this transfer request.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: An object representing an Entity Transfer.
                properties:
                  created:
                    description: When this transfer was created.
                    example: '2021-02-11T16:37:03'
                    format: date-time
                    type: string
                  entities:
                    additionalProperties: false
                    description: A collection of the entities to include in this transfer request, separated by type.
                    properties:
                      linodes:
                        description: An array containing the IDs of each of the Linodes included in this transfer.
                        example:
                        - 111
                        - 222
                        items:
                          type: integer
                        type: array
                        x-linode-cli-display: 5
                    type: object
                  expiry:
                    description: When this transfer expires. Transfers will automatically expire 24 hours after creation.
                    example: '2021-02-12T16:37:03'
                    format: date-time
                    type: string
                    x-linode-cli-display: 3
                  is_sender:
                    description: __Filterable__ If the requesting account created this transfer.
                    example: true
                    type: boolean
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  status:
                    description: '__Filterable__ The status of the transfer request:


                      `accepted`: The transfer has been accepted by another user and is currently in progress. Transfers can take up to 3 hours to complete.

                      `canceled`: The transfer has been canceled by the sender.

                      `completed`: The transfer has completed successfully.

                      `failed`: The transfer has failed after initiation.

                      `pending`: The transfer is ready to be accepted.

                      `stale`: The transfer has exceeded its expiration date. It can no longer be accepted or canceled.'
                    enum:
                    - accepted
                    - canceled
                    - completed
                    - failed
                    - pending
                    - stale
                    example: pending
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-color:
                      accepted: yellow
                      canceled: red
                      completed: green
                      default_: white
                      failed: red
                      pending: yellow
                      stale: red
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  token:
                    description: The token used to identify and accept or cancel this transfer.
                    example: 123E4567-E89B-12D3-A456-426614174000
                    format: uuid
                    type: string
                    x-linode-cli-display: 1
                  updated:
                    description: When this transfer was last updated.
                    example: '2021-02-11T16:37:03'
                    format: date-time
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/entity-transfer.yaml
              x-example:
                x-ref: ../examples/post-entity-transfer-200.json
          description: Returns an Entity Transfer object for the request.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
