openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode General API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Object Storage is Akamai cloud computing's S3-compatible data storage service. Use these operations to review and manage your Object Storage service.
  name: General
paths:
  /{apiVersion}/databases/engines:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/engines.yaml
      path-info: /{apiVersion}/databases/engines
    x-linode-cli-command: databases
    get:
      description: 'Display all available Managed Databases engine types and versions. Use an engine''s `id` to create a new Managed Databases instance.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_viewer`


        **CLI**


        ```shell

        linode-cli databases engines

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-engines
      operationId: get-databases-engines
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - engine: mysql
                  id: mysql/8.0.26
                  version: 8.0.26
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      description: Managed Database engine object.
                      properties:
                        engine:
                          description: __Filterable__ The Managed Database engine type.
                          example: mysql
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        id:
                          description: The Managed Database engine ID in engine/version format.
                          example: mysql/8.0.26
                          type: string
                          x-linode-cli-display: 1
                        version:
                          description: __Filterable__ The Managed Database engine version.
                          example: 8.0.26
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 3
                          x-linode-filterable: true
                      type: object
                      x-akamai:
                        file-path: schemas/database-engine.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-databases-engines-200.yaml
          description: Returns a paginated list of all available Managed Databases engines and versions.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      summary: List Managed Databases engines
      tags:
      - General
      x-akamai:
        tabs:
        - syntax: linode-cli databases engines
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: engines
      x-linode-iam:
      - roles:
        - database_viewer
  /{apiVersion}/databases/engines/{engineId}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the Managed Database engine. To get this value, run the [List Managed Databases engines](https://techdocs.akamai.com/linode-api/reference/get-databases-engines) operation.
      example: '{{engineId}}'
      in: path
      name: engineId
      required: true
      schema:
        type: string
      x-akamai:
        file-path: parameters/engine-id-path.yaml
    x-akamai:
      file-path: paths/engine.yaml
      path-info: /{apiVersion}/databases/engines/{engineId}
    x-linode-cli-command: databases
    get:
      description: 'Display information for a single Managed Databases engine type and version. Run the List Managed Databases engines operation and store the `id` for the applicable database engine.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_viewer`


        **CLI**


        ```shell

        linode-cli databases engine-view

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-engine
      operationId: get-databases-engine
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                engine: mysql
                id: mysql/8.0.26
                version: 8.0.26
              schema:
                additionalProperties: false
                description: Managed Database engine object.
                properties:
                  engine:
                    description: __Filterable__ The Managed Database engine type.
                    example: mysql
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  id:
                    description: The Managed Database engine ID in engine/version format.
                    example: mysql/8.0.26
                    type: string
                    x-linode-cli-display: 1
                  version:
                    description: __Filterable__ The Managed Database engine version.
                    example: 8.0.26
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 3
                    x-linode-filterable: true
                type: object
                x-akamai:
                  file-path: schemas/database-engine.yaml
          description: Returns information for a single Managed Databases engine type and version.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      summary: Get a Managed Databases engine
      tags:
      - General
      x-akamai:
        tabs:
        - syntax: linode-cli databases engine-view
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: engine-view
      x-linode-iam:
      - roles:
        - database_viewer
  /{apiVersion}/databases/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/database-instances.yaml
      path-info: /{apiVersion}/databases/instances
    x-linode-cli-command: databases
    get:
      description: 'Display information for all Managed Databases accessible to your user, regardless of engine type.


        > 👍

        >

        > For more detailed information, you can list Managed Databases, based on the `engine`, MySQL, PostgreSQL, or Valkey.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_viewer`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `databases:read_only`


        **CLI**


        ```shell

        linode-cli databases list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-instances
      operationId: get-databases-instances
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - allow_list:
                  - 192.0.2.202/24
                  - 192.0.2.14/24
                  available_restore_times: null
                  cluster_size: 3
                  created: '2022-01-01T00:01:01'
                  encrypted: true
                  engine: mysql
                  fork:
                    restore_time: '2024-10-14T19:55:12'
                    source: 176881
                  hosts:
                    endpoints:
                    - address: lin-123-456-mysql-mysql-primary.servers.linodedb.net
                      port: 3306
                      public_access: true
                      role: primary
                    - address: lin-123-456-mysql-primary-private.servers.linodedb.net
                      port: 3306
                      public_access: false
                      role: standby
                    - address: lin-123-456-mysql-standby-public.servers.linodedb.net
                      port: 3306
                      public_access: true
                      role: standby
                    primary: lin-123-456-mysql-mysql-primary.servers.linodedb.net
                    standby: lin-123-456-mysql-primary-private.servers.linodedb.net
                  id: 123
                  instance_uri: /v4/databases/mysql/instances/123
                  label: example-db
                  members:
                    45.56.110.70: primary
                    45.79.159.239: failover
                    69.164.209.80: failover
                  oldest_restore_time: '2024-10-03T20:48:05'
                  platform: rdbms-default
                  port: 3306
                  private_network: null
                  region: us-east
                  status: active
                  total_disk_size_gb: 15
                  type: g6-dedicated-2
                  updated: '2022-01-01T00:01:01'
                  updates:
                    day_of_week: 1
                    duration: 4
                    frequency: weekly
                    hour_of_day: 0
                    pending: []
                  used_disk_size_gb: 2
                  version: 8.0.26
                - allow_list:
                  - 192.0.2.122/24
                  - 192.0.2.133/24
                  available_restore_times: null
                  cluster_size: 3
                  created: '2022-01-01T00:01:01'
                  encrypted: true
                  engine: postgresql
                  engine_config:
                    pg:
                      autovacuum_analyze_scale_factor: 1
                      autovacuum_analyze_threshold: 2147483647
                      autovacuum_max_workers: 20
                      autovacuum_naptime: 86400
                      autovacuum_vacuum_cost_delay: 100
                      autovacuum_vacuum_cost_limit: 10000
                      autovacuum_vacuum_scale_factor: 1
                      autovacuum_vacuum_threshold: 2147483647
                      bgwriter_delay: 200
                      bgwriter_flush_after: 512
                      bgwriter_lru_maxpages: 100
                      bgwriter_lru_multiplier: 2.5
                      deadlock_timeout: 1000
                      default_toast_compression: lz4
                      idle_in_transaction_session_timeout: 604800000
                      jit: true
                      max_files_per_process: 1024
                      max_locks_per_transaction: 1024
                      max_logical_replication_workers: 64
                      max_parallel_workers: 96
                      max_parallel_workers_per_gather: 96
                      max_pred_locks_per_transaction: 5120
                      max_replication_slots: 64
                      max_slot_wal_keep_size: 1000000
                      max_stack_depth: 2097152
                      max_standby_archive_delay: 1
                      max_standby_streaming_delay: 10
                      max_wal_senders: 20
                      max_worker_processes: 96
                      password_encryption: scram-sha-256
                      pg_partman_bgw.interval: 3600
                      pg_partman_bgw.role: myrolename
                      pg_stat_monitor.pgsm_enable_query_plan: true
                      pg_stat_monitor.pgsm_max_buckets: 10
                      pg_stat_statements.track: all
                      temp_file_limit: 5000000
                      timezone: Europe/Helsinki
                      track_activity_query_size: 1024
                      track_commit_timestamp: 'off'
                      track_functions: all
                      track_io_timing: 'off'
                      wal_sender_timeout: 60000
                      wal_writer_delay: 200
                    pg_stat_monitor_enable: false
                    pglookout:
                      max_failover_replication_time_lag: 10
                    shared_buffers_percentage: 41.5
                    synchronous_replication: quorum
                    work_mem: 4
                  fork:
                    restore_time: '2024-10-14T19:55:12'
                    source: 176881
                  hosts:
                    endpoints:
                    - address: lin-123-456-pgsql-primary.servers.linodedb.net
                      port: 3306
                      public_access: true
                      role: primary
                    - address: lin-123-456-pgsql-standby.servers.linodedb.net
                      port: 3306
                      public_access: true
                      role: standby
                    primary: lin-0000-000-pgsql-primary.servers.linodedb.net
                    standby: lin-0000-000-pgsql-standby.servers.linodedb.net
                  id: 123
                  label: example-db
                  members:
                    45.56.110.70: primary
                    45.79.159.239: failover
                    69.164.209.80: failover
                  oldest_restore_time: '2024-10-03T20:48:05'
                  platform: rdbms-default
                  port: 3306
                  private_network:
                    public_access: false
                    subnet_id: 456
                    vpc_id: 123
                  region: us-east
                  ssl_connection: true
                  status: active
                  total_disk_size_gb: 15
                  type: g6-dedicated-2
                  updated: '2022-01-01T00:01:01'
                  updates:
                    day_of_week: 1
                    duration: 4
                    frequency: weekly
                    hour_of_day: 0
                    pending: []
                  used_disk_size_gb: 2
                  version: '13.2'
                page: 1
                pages: 1
                results: 2
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: A list of objects returned for a response.
                    items:
                      additionalProperties: false
                      description: A general Managed Database instance object containing properties that are identical for all database types.
                      properties:
                        allow_list:
                          description: 'Controls access to the Managed Database.


                            - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                            - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                            - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                          example:
                          - 203.0.113.1/32
                          - 192.0.1.0/24
                          items:
                            format: ipv4/prefix_length
                            pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                            type: string
                          minItems: 0
                          type: array
                        available_restore_times:
                          description: Possible times you can create a fork from for a Valkey database. For MySQL or PostgreSQL databases, this is `null`.
                          items:
                            example: '2024-10-03T20:48:05'
                            type: string
                          type:
                          - array
                          - 'null'
                        cluster_size:
                          default: 1
                          description: 'The number of Linode instance nodes deployed to the Managed Database, from `1` to `3`. Consider these points when setting a `cluster_size`:


                            - Choose `3` nodes to create a high availability cluster that consists of one `primary` node and two `standby` nodes.


                            - A `2` node cluster is only available with a dedicated plan. It consists of one `primary` node and one `standby` node.'
                          enum:
                          - 1
                          - 2
                          - 3
                          example: 3
                          type: integer
                          x-linode-cli-display: 5
                        created:
                          description: __Read-only__ When this Managed Database was created.
                          example: '2022-01-01T00:01:01'
                          readOnly: true
                          type: string
                        encrypted:
                          default: true
                          description: __Read-only__ Whether the Managed Databases is encrypted. Currently the only possible value is `true`.
                          example: true
                          readOnly: true
                          type: boolean
                        engine:
                          description: __Filterable__, __Read-only__ The Managed Database engine type, either `mysql` or `postgresql`.
                          enum:
                          - mysql
                          - postgresql
                          - valkey
                          example: mysql
                          readOnly: true
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 6
                          x-linode-filterable: true
                        engine_config:
                          additionalProperties: false
                          description: Managed PostgreSQL Database request object.
                          oneOf:
                          - additionalProperties: false
                            description: 'Advanced parameters you can apply to a MySQL Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/mysql/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                              > 📘

                              >

                              > Aiven may offer additional parameters in their specification, or accept different values and ranges. Currently, only the parameters and settings covered here are supported for use in a MySQL Managed Database. You can also run the [List MySQL Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-mysql-config) operation to see an up-to-date list.'
                            properties:
                              binlog_retention_period:
                                description: The minimum amount of time in seconds to keep `binlog` entries before deletion. This may be extended for services that require `binlog` entries for longer than the default, for example if using the MySQL Debezium Kafka connector.
                                example: 600
                                maximum: 9007199254740991
                                minimum: 600
                                type: integer
                              mysql:
                                additionalProperties: false
                                description: MySQL-specific advanced configuration parameters.
                                properties:
                                  connect_timeout:
                                    description: The number of seconds that the `mysqld` server waits for a connect packet before responding with bad handshake.
                                    example: 10
                                    maximum: 3600
                                    minimum: 2
                                    type: integer
                                  default_time_zone:
                                    description: Default server time zone as an offset from UTC (from -12:00 to +12:00), a time zone name, or `SYSTEM` to use the MySQL server default.
                                    example: +03:00
                                    maxLength: 100
                                    minLength: 2
                                    pattern: ^([-+][\d:]*|[\w/]*)$
                                    type: string
                                  group_concat_max_len:
                                    description: The maximum permitted result length in bytes for the `GROUP_CONCAT()` function.
                                    example: 1024
                                    maximum: 18446744073709552000
                                    minimum: 4
                                    type: integer
                                  information_schema_stats_expiry:
                                    description: The time, in seconds, before cached statistics expire.
                                    example: 86400
                                    maximum: 31536000
                                    minimum: 900
                                    type: integer
                                  innodb_change_buffer_max_size:
                                    default: 25
                                    description: Maximum size for the InnoDB change buffer, as a percentage of the total size of the buffer pool.
                                    example: 30
                                    maximum: 50
                                    minimum: 0
                                    type: integer
                                  innodb_flush_neighbors:
                                    default: 1
                                    description: 'Specifies whether flushing a page from the InnoDB buffer pool also flushes other dirty pages in the same extent: `0` - dirty pages in the same extent are not flushed, `1` - flush contiguous dirty pages in the same extent, `2` - flush dirty pages in the same extent.'
                                    example: 0
                                    maximum: 2
                                    minimum: 0
                                    type: integer
                                  innodb_ft_min_token_size:
                                    description: Minimum length of words that are stored in an InnoDB `-1FULLTEXT` index. Changing this parameter will lead to a restart of the MySQL service.
                                    example: 3
                                    maximum: 16
                                    minimum: 0
                                    type: integer
                                  innodb_ft_server_stopword_table:
                                    description: This option is used to specify your own InnoDB `FULLTEXT` index `stopword` list for all InnoDB tables. Set to `null` for no value.
                                    example: db_name/table_name
                                    maxLength: 1024
                                    pattern: ^.+/.+$
                                    type:
                                    - string
                                    - 'null'
                                  innodb_lock_wait_timeout:
                                    default: 120
                                    description: The length of time in seconds an InnoDB transaction waits for a row lock before giving up.
                                    example: 50
                                    maximum: 3600
                                    minimum: 1
                                    type: integer
                                  innodb_log_buffer_size:
                                    description: The size in bytes of the buffer that InnoDB uses to write to the log files on disk.
                                    example: 16777216
                                    maximum: 4294967295
                                    minimum: 1048576
                                    type: integer
                                  innodb_online_alter_log_max_size:
                                    description: The upper limit in bytes on the size of the temporary log files used during online DDL operations for InnoDB tables.
                                    example: 134217728
                                    maximum: 1099511627776
                                    minimum: 65536
                                    type: integer
                                  innodb_read_io_threads:
                                    default: 4
                                    description: The number of I/O threads for read operations in InnoDB. Changing this parameter will lead to a restart of the MySQL service.
                                    example: 10
                                    maximum: 64
                                    minimum: 1
                                    type: integer
                                  innodb_rollback_on_timeout:
                                    description: When enabled a transaction timeout causes InnoDB to abort and roll back the entire transaction. Changing this parameter will lead to a restart of the MySQL service.
                                    example: true
