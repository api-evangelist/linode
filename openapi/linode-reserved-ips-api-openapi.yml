                assigned_entity: null
                gateway: 192.0.2.1
                interface_id: null
                linode_id: null
                prefix: 24
                public: true
                rdns: ''
                region: us-east
                reserved: true
                subnet_mask: 255.255.255.0
                tags:
                - NB1, Linode1
                type: ipv4
                vpc_nat_1_1: null
              schema:
                additionalProperties: false
                description: A reserved public IPv4 address that can be assigned to any Linode or NodeBalancer in the same region.
                properties:
                  address:
                    description: __Filterable__, __Read-only__ The reserved public IPv4 address.
                    example: 192.0.2.141
                    format: ip
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 1
                  assigned_entity:
                    additionalProperties: false
                    description: __Read-only__ Identifies which resource a specific IP address is currently attached to.
                    properties:
                      id:
                        description: The unique identifier for the resource.
                        example: 1234
                        type: integer
                      label:
                        description: The name of the entity.
                        example: demo-linode
                        type: string
                      type:
                        description: The type of entity.
                        enum:
                        - linode
                        - nodebalancer
                        example: nodebalancer
                        type: string
                      url:
                        description: The API URL path you can use to access this entity.
                        example: /v4/nodebalancer/1234
                        type: string
                    readOnly: true
                    type:
                    - object
                    - 'null'
                    x-linode-cli-display: 10
                  gateway:
                    description: __Read-only__ The default gateway for this address.
                    example: 192.0.2.1
                    format: ip
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  interface_id:
                    description: __Read-only__ The Linode interface ID that this IP address is assigned to.
                    example: 456
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                    x-linode-cli-display: 7
                  linode_id:
                    description: __Read-only__ The ID of the Linode this address is assigned to.
                    example: 123
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                    x-linode-cli-display: 6
                  prefix:
                    description: __Read-only__ The number of bits set in the subnet mask. This prefix refers to the subnet mask of the network to which the IP belongs, and not the size of the IP reservation.
                    example: 24
                    readOnly: true
                    type: integer
                  public:
                    description: __Read-only__ Whether this is a public or private IP address. Reserved IPs are public.
                    example: true
                    readOnly: true
                    type: boolean
                    x-linode-cli-display: 3
                  rdns:
                    description: __Filterable__ The reverse DNS assigned to this address. For public IPv4 addresses, this will be set to a default value provided by Linode if not explicitly set.
                    example: test.example.org
                    type:
                    - string
                    - 'null'
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                  region:
                    description: __Filterable__, __Read-only__ The region this IP address resides in.
                    example: us-east
                    readOnly: true
                    type: string
                    x-akamai:
