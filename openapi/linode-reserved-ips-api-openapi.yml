      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/reserved-ips.yaml
      path-info: /{apiVersion}/networking/reserved/ips
    x-linode-cli-command: networking
    post:
      description: 'Reserve a public IPv4 address within a specific region for future assignment to a resource. Because Reserved IPs are tied to a specific datacenter''s network infrastructure, they can''t be moved across regions. However, they provide a persistent public entry point for your cloud infrastructure inside that region, independent of the underlying resource. Unlike ephemeral IPs that are recycled upon deletion, a reserved IP remains in your account until manually released.


        Benefits:

        - Rebuild or migrate Linodes and NodeBalancers without changing your public-facing IP.

        - Eliminates the need to update allowlists, firewall rules, automation scripts, or DNS records during deployments.

        - Maintain ownership of the address during failovers or maintenance windows when it may be temporarily unassigned.

        - Billed at a flat monthly rate per IP, regardless of assignment status. Unreserving an IP stops billing immediately and returns the address to the general pool, where it can''t be recovered.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `ips:read_write`


        **CLI**


        ```shell

        linode-cli networking reserved-ip-add \

        --region us-east \

        --tags NB1,Linode1

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-reserved-ip
      operationId: post-reserved-ip
      requestBody:
        content:
          application/json:
            example:
              region: us-east
              tags:
              - nb1
              - https-443
            schema:
              additionalProperties: false
              properties:
                region:
                  description: Reserve a public IPv4 address from the specified region.
                  example: '{{region}}'
                  type: string
                tags:
                  description: Tags to apply to this IP that match [existing tags](https://techdocs.akamai.com/linode-api/reference/get-tags).
                  example:
                  - NB1
                  - Linode1
                  items:
                    type: string
                  type: array
              required:
              - region
              type: object
              x-akamai:
                file-path: schemas/post-reserved-ip.yaml
        required: true
