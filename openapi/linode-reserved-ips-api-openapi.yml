                        description: The `id` of the VPC subnet for this interface.
                        example: 101
                        type: integer
                      vpc_id:
                        description: __Read-only__ The `id` of the VPC configured for this interface.
                        example: 111
                        readOnly: true
                        type: integer
                    readOnly: true
                    type:
                    - object
                    - 'null'
                    x-linode-cli-display: 11
                type: object
                x-akamai:
                  file-path: schemas/reserved-ip-address.yaml
              x-linode-cli-use-schema:
                additionalProperties: false
                properties:
                  address:
                    x-linode-cli-display: 1
                  assigned_entity:
                    additionalProperties: false
                    properties:
                      id:
