                              items:
                                type: string
                              type: array
                          type: object
                        enabled:
                          description: Defines a default policy. A value of `true` results in a default policy of `DENY`. A value of `false` results in a default policy of `ALLOW`, such as for disabled access controls. It defaults to `true`. Creating a cluster with ACL, or upgrading a cluster to use ACL for LKE, is an irreversible change. Once upgraded, you can only toggle access controls with this field.
                          example: true
                          type: boolean
                          x-linode-cli-display: 6
                        revision-id:
                          description: Enables clients to track events related to ACL update requests and enforcements. Optional field. If omitted, defaults to a randomly generated string.
                          example: 20240127r001
                          type: string
                      type: object
