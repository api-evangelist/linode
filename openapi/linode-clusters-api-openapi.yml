                  description: 'Defines settings for the Kubernetes control plane, including High Availability (HA) and an IP-based Access Control List (ACL) for the control plane components.


                    When upgrading pre-existing LKE clusters to use the HA Control Plane, the following changes will additionally occur:


                    - All nodes will be deleted and new nodes will be created to replace them.


                    - Any local storage (such as `hostPath` volumes) will be erased.


                    - The upgrade process may take several minutes to complete, as nodes will be replaced on a rolling basis.


                    When upgrading pre-existing LKE clusters to use the control plane ACL for the first time, it may take several hours for external clients to respect the access control settings. This is partly due to delays from DNS propagation.'
                  properties:
                    acl:
                      additionalProperties: false
                      description: Defines settings related to the IP-based ACL of the LKE cluster. The object requires the `enabled` and `addresses` keys. It also supports the optional key `revision-id`. The default policy is set to `ALLOW`, so that access controls are disabled. An empty object value (`{}`) sets default elements.
                      properties:
                        addresses:
                          additionalProperties: false
                          description: Supports keys `ipv4` and `ipv6`. Defaults to `{}`.
                          properties:
                            ipv4:
                              description: A list of individual ipv4 addresses or CIDRs to ALLOW. Defaults to `[]`.
                              example:
