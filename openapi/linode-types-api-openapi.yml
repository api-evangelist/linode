                  label:
                    x-linode-cli-display: 2
                type: object
                x-akamai:
                  file-path: schemas/database-type-cli.yaml
          description: Returns a paginated list of all Managed Databases types.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
