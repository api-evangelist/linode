openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Metrics API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Akamai Cloud Pulse automatically collects and stores performance metrics for your cloud services. You can view them through dashboards and inspect them at the entity level. Metrics data provides insights into the health, behavior, and performance of your cloud resources.
  name: Metrics
paths:
  /{apiVersion}/monitor/dashboards:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/aclp-get-all-dashboards.yaml
      path-info: /{apiVersion}/monitor/dashboards
    x-linode-cli-command: monitor
    get:
      description: '__Limited availability__ Returns all available dashboards.


        > 📘

        >

        > This operation has a specific rate limit.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `monitor:read_only`


        **CLI**


        ```shell

        linode-cli monitor dashboards-list-all

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-dashboards-all
      operationId: get-dashboards-all
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2024-10-10T05:01:58'
                  group_by:
                  - entity_id
                  - node_type
                  id: 1
                  label: Resource Usage
                  service_type: dbaas
                  type: standard
                  updated: '2024-10-10T05:01:58'
                  widgets:
                  - aggregate_function: sum
                    chart_type: area
                    color: default
                    description: Percentage of the available CPU capacity used by the Linode hosting the database
                    group_by:
                    - entity_id
                    label: CPU Usage
                    metric: cpu_usage
                    size: 12
                    unit: '%'
                    widget_grouping: CPU
                    y_label: cpu_usage
                  - aggregate_function: sum
                    chart_type: area
                    color: default
                    description: Number of write operations a storage disk can perform per second
                    label: Disk I/O Write
                    metric: write_iops
                    size: 6
                    unit: IOPS
                    y_label: write_iops
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - additionalProperties: false
                  properties:
                    data:
                      description: A list of objects returned for a response.
                      items:
                        additionalProperties: false
                        properties:
                          created:
                            description: __Read-only__ When the dashboard was created.
                            example: '2026-05-10T05:01:58Z'
                            format: date-time
                            readOnly: true
                            type: string
                          description:
                            description: A brief description of the dashboard.
                            example: Percentage of the available CPU capacity used by the Linode hosting the database
                            type: string
                          group_by:
                            description: '__Read-only__ This dashboard''s data is evaluated and aggregated based on listed values. This can be `entity_id` to aggregate based on each individual entity, any dimension supported for a specific `service_type`, or a combination of the two. For example, if this lists `[“entity_id”, "node_type"]`, all `widget` data in the dashboard is aggregated based on the `entity_id` as well as the `node_type` dimension, which is available for a `service_type` of `dbaas`.


                              Run the [List metrics for a service type](https://techdocs.akamai.com/linode-api/reference/get-monitor-information) operation for information on available `dimension_label` values for each supported `service_type`.'
                            example:
                            - entity_id
                            items:
                              type: string
                            readOnly: true
                            type: array
                          id:
                            description: The unique identifier for the dashboard.
                            example: 1
                            type: integer
                          label:
                            description: The name of the dashboard. This is used for display purposes in Akamai Cloud Manager.
                            example: Resource Usage
                            type: string
                          service_type:
                            description: The Akamai Cloud Computing service used by this dashboard.
                            example: dbaas
                            type: string
                          type:
                            description: The type of dashboard. Currently, this can only be `standard` for a dashboard that uses default formatting.
                            enum:
                            - standard
                            example: standard
                            type: string
                          updated:
                            description: __Read-only__ When the dashboard was last updated.
                            example: '2026-05-12T08:15:37Z'
                            format: date-time
                            readOnly: true
                            type: string
                          widgets:
                            description: The widgets used in the dashboard.
                            items:
                              additionalProperties: false
                              properties:
                                aggregate_function:
                                  default: avg
                                  description: The aggregate function for the metric. This can be `min` for minimum, `max` for maximum, `avg` for average, `sum` for the sum total, or `rate` for the individual rate.
                                  enum:
                                  - min
                                  - max
                                  - avg
                                  - sum
                                  - rate
                                  example: avg
                                  type: string
                                chart_type:
                                  description: The type of chart used in the widget. This can be `line` for a line chart or `area` for an area chart.
                                  enum:
                                  - line
                                  - area
                                  example: line
                                  type: string
                                color:
                                  description: The color used in the widget.
                                  example: red
                                  type: string
                                description:
                                  description: A brief description of the widget.
                                  example: Percentage of the available CPU capacity used by the Linode hosting the database
                                  type: string
                                group_by:
                                  description: '__Read-only__ This widget''s data is evaluated and aggregated based on listed values. This can be `entity_id` to aggregate based on each individual entity, any dimension for a specific `service_type` that apply to the widget, or a combination of the two. For example, if this lists `["node_type"]`, all `widget` data in the dashboard is aggregated based on the the specific `node_type` for each entity. This `group_by` works in conjunction with a `group_by` set for the entire `dashboard`.


                                    Run the [List metrics for a service type](https://techdocs.akamai.com/linode-api/reference/get-monitor-information) operation for information on available `dimension_label` values for each supported `service_type`.'
                                  example:
                                  - entity_id
                                  items:
                                    type: string
                                  readOnly: true
                                  type: array
                                label:
                                  description: The name of the widget. This is used for display purposes in Akamai Cloud Manager.
                                  example: CPU Usage
                                  type: string
                                metric:
                                  description: The metric that the widget queries.
                                  example: cpu_usage
                                  type: string
                                size:
                                  description: The size of the widget. This can be `6` or `12` grid units, expressed as strings.
                                  enum:
                                  - '6'
                                  - '12'
                                  example: '6'
                                  type: string
                                unit:
                                  description: The unit of the metric. This can be `%` for percentage, `Bytes` for individual bytes, `sec` for time in seconds, `bps` for bits per second, `msec` for milliseconds, `Bps` for bytes per second, `KB` for kilobytes, `MB` for megabytes, `GB` for gigabyte, `rate` for a specific rate, `percentile` for a relative rank compared to a group, `ratio` for a comparison of two quantities, `OPS` for operations per second, or `IOPS` for input/output operations per second.
                                  enum:
                                  - '%'
                                  - Bytes
                                  - sec
                                  - bps
                                  - msec
                                  - Bps
                                  - KB
                                  - MB
                                  - GB
                                  - rate
                                  - percentile
                                  - ratio
                                  - OPS
                                  - IOPS
                                  example: Bps
                                  type: string
                                widget_grouping:
                                  description: 'The name of the group that the `widget` belongs to. A `widget_group` gathers related widgets into named sections within a dashboard. These points apply:


                                    - Currently, widget groups are preset by Akamai.


                                    - This field only applies if the `service_type` has `widget_grouping` configured for its widgets. Otherwise, this field is left out of the response.


                                    - If a `service_type` supports `widget_grouping`, all of its widgets are either grouped or ungrouped. The API response never contains a mix of grouped and ungrouped widgets for a single `service_type`.'
                                  example: CPU
                                  type: string
                                y_label:
                                  description: The label for the y-axis in the widget's chart.
                                  example: Usage
                                  type: string
                              type: object
                            type: array
                        required:
                        - id
                        - type
                        - service_type
                        - label
                        - created
                        - updated
                        - widgets
                        type: object
                        x-akamai:
                          file-path: schemas/aclp-dashboard.yaml
                      type: array
                  type: object
                - description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
                    file-path: schemas/pagination-envelope.yaml
                x-akamai:
                  file-path: schemas/aclp-dashboards.yaml
          description: Returns a paginated list of dashboards.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - monitor:read_only
      summary: List dashboards
      tags:
      - Metrics
      x-akamai:
        status: LA
        tabs:
        - syntax: linode-cli monitor dashboards-list-all
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: monitor:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: dashboards-list-all
      x-linode-grant: read_only
