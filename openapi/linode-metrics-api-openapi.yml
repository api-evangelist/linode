    x-linode-cli-command: monitor
    post:
      description: '__Limited availability__ Returns a token that authenticates requests for the entities within a specific service type. To see your currently supported services, run the List supported service types operation. The token has a lifetime of six hours after you create it.


        > 📘

        >

        > When creating this token for Object Storage metrics, the token is accessible to all users on your account.


        > 👍 There''s a tutorial

        >

        > We offer an example you can follow to generate this token.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `monitor:read_only`


        **CLI**


        ```shell

        linode-cli monitor token-get dbaas \

        --entity_ids 189690 \

        --entity_ids 188020 --json

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-get-token
      operationId: post-get-token
      requestBody:
        content:
          application/json:
            example:
              entity_ids:
              - 13166
              - 13122
              - 13245
            schema:
              additionalProperties: false
              description: Name the specific entities you want to include in this token.
              oneOf:
              - additionalProperties: false
                properties:
                  entity_ids:
                    description: 'The `id` for individual Object Storage buckets you want to specifically target for metrics gathering with this token. Run the [List Object Storage buckets](https://techdocs.akamai.com/linode-api/reference/get-object-storage-buckets) operation and store the `hostname` values for the applicable ones. To have the token apply to all of your Object Storage buckets, leave this array out of the request, and just send an empty object (`{ }`).


                      > 📘

                      >

                      > - This field supports up to 100 total entries.

                      >

                      > - You need read access permission to all Object Storage buckets you want to access with this token. Run the [List a user''s grants](https://techdocs.akamai.com/linode-api/reference/get-user-grants) operation to see the permission level for each Object Storage bucket in your account.'
                    example:
                    - primary-bucket-1.us-east-12.linodeobjects.com
                    - backup-bucket-1.us-east-12.linodeobjects.com
                    items:
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                title: Token - Object Storage
                type: object
                x-akamai:
                  file-path: schemas/aclp-token-request-obj.yaml
              - additionalProperties: false
                properties:
                  entity_ids:
                    description: 'The `id` for each individual entity from a `service_type`. Get this value by running the list operation for the appropriate entity. For example, if your entity is one of your PostgreSQL databases, run the [List PostgreSQL Managed Databases](https://techdocs.akamai.com/linode-api/reference/get-databases-postgre-sql-instances) operation and store the `id` for the appropriate database from the response.


