openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Metrics API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Akamai Cloud Pulse automatically collects and stores performance metrics for your cloud services. You can view them through dashboards and inspect them at the entity level. Metrics data provides insights into the health, behavior, and performance of your cloud resources.
  name: Metrics
paths:
  /{apiVersion}/monitor/dashboards:
    parameters:
    - description: __Enum__ Call the `v4beta` URL for operations still only in beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4beta
        example: v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-v4beta-path.yaml
    x-akamai:
      file-path: paths/aclp-get-all-dashboards.yaml
      path-info: /{apiVersion}/monitor/dashboards
    x-linode-cli-command: monitor
    get:
      description: '__Beta__ Returns all available dashboards.


        > 📘

        >

        > This operation is beta. Call it using the `v4beta` path in its URL.


        >


        ---


        - __CLI__.


        ```

        linode-cli monitor dashboards-list-all

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        monitor:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-dashboards-all
      operationId: get-dashboards-all
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2024-10-10T05:01:58'
                  id: 1
                  label: Resource Usage
                  service_type: dbaas
                  type: standard
                  updated: '2024-10-10T05:01:58'
                  widgets:
                  - aggregate_function: sum
                    chart_type: area
                    color: default
                    label: CPU Usage
                    metric: cpu_usage
                    size: 12
                    unit: '%'
                    y_label: cpu_usage
                  - aggregate_function: sum
                    chart_type: area
                    color: default
                    label: Disk I/O Write
                    metric: write_iops
                    size: 6
                    unit: IOPS
                    y_label: write_iops
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - additionalProperties: false
                  properties:
                    data:
                      items:
                        additionalProperties: false
                        properties:
                          created:
                            description: When the dashboard was created.
                            example: '2024-10-10T05:01:58Z'
                            format: date-time
                            type: string
                          id:
                            description: The unique identifier for the dashboard.
                            example: 1
                            type: integer
                          label:
                            description: The name of the dashboard. This is used for display purposes in Akamai Cloud Manager.
                            example: Resource Usage
                            type: string
                          service_type:
                            description: The Akamai Cloud Computing service used by this dashboard.
                            example: dbaas
                            type: string
                          type:
                            description: The type of dashboard. Currently, this can only be `standard` for a dashboard that uses default formatting.
                            enum:
                            - standard
                            example: standard
                            type: string
                          updated:
                            description: When the dashboard was last updated.
                            example: '2024-10-12T08:15:37Z'
                            format: date-time
                            type: string
                          widgets:
                            description: The widgets used in the dashboard.
                            items:
                              additionalProperties: false
                              properties:
                                aggregate_function:
                                  description: The aggregate function for the metric. This defaults to `avg` for average.
                                  enum:
                                  - min
                                  - max
                                  - avg
                                  - sum
                                  - rate
                                  example: avg
                                  type: string
                                chart_type:
                                  description: The type of chart used in the widget. This can be `line` for a line chart or `area` for an area chart.
                                  enum:
                                  - line
                                  - area
                                  example: line
                                  type: string
                                color:
                                  description: The color used in the widget.
                                  example: red
                                  type: string
                                label:
                                  description: The name of the widget. This is used for display purposes in Akamai Cloud Manager.
                                  example: CPU Usage
                                  type: string
                                metric:
                                  description: The metric to query.
                                  example: cpu_usage
                                  type: string
                                size:
                                  description: The size of the widget. This can be `6` or `12` grid units, expressed as strings.
                                  enum:
                                  - '6'
                                  - '12'
                                  example: '6'
                                  type: string
                                unit:
                                  description: The unit of the metric. This can be values like `%` for percentage or `GB` for gigabyte.
                                  enum:
                                  - '%'
                                  - Bytes
                                  - sec
                                  - bps
                                  - msec
                                  - Bps
                                  - KB
                                  - MB
                                  - GB
                                  - rate
                                  - percentile
                                  - ratio
                                  - OPS
                                  - IOPS
                                  type: string
                                y_label:
                                  description: The label for the y-axis in the widget's chart.
                                  example: Usage
                                  type: string
                              type: object
                            type: array
                        required:
                        - id
                        - type
                        - service_type
                        - label
                        - created
                        - updated
                        - widgets
                        type: object
                        x-akamai:
                          file-path: schemas/aclp-dashboard.yaml
                      type: array
                  type: object
                - additionalProperties: false
                  description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
                    file-path: schemas/pagination-envelope.yaml
                x-akamai:
                  file-path: schemas/aclp-dashboards.yaml
          description: Returns a paginated list of dashboards.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - monitor:read_only
      summary: List dashboards
      tags:
      - Metrics
      x-akamai:
        status: BETA
        tabs:
        - syntax: linode-cli monitor dashboards-list-all
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: monitor:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: dashboards-list-all
      x-linode-grant: read_only
