        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: Linux kernel object.
                      properties:
                        architecture:
                          description: __Filterable__, __Read-only__ The architecture of this Kernel.
                          enum:
                          - x86_64
                          - i386
                          example: x86_64
                          readOnly: true
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 4
                          x-linode-filterable: true
                        built:
