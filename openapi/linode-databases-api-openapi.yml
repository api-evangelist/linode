openapi: 3.2.0
info:
  title: Linode Databases API
  version: '1.0'
  description: 'Operations tagged Databases across 2 of this provider''s published API definitions: linode-api-v4-openapi.yml, linode-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com/v4
  description: Production Server
- url: https://api.linode.com
tags:
- name: Databases
  description: Manage Managed Database instances including MySQL and PostgreSQL clusters, backups, credentials, and maintenance windows.
paths:
  /databases/instances:
    get:
      operationId: getDatabaseInstances
      summary: List Managed Databases
      description: Returns a paginated list of all Managed Database instances on your account, including their status, engine type, and region.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Managed Databases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatabaseList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /databases/engines:
    get:
      operationId: getDatabaseEngines
      summary: List Managed Database engines
      description: Returns a paginated list of available Managed Database engines and their versions.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Database engines retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatabaseEngineList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /databases/types:
    get:
      operationId: getDatabaseTypes
      summary: List Managed Database types
      description: Returns a paginated list of available Managed Database node types and their associated pricing.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Database types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatabaseTypeList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /databases/{databaseEngine}/{databaseId}:
    get:
      operationId: getDatabaseInstance
      summary: Get a Managed Database
      description: Returns the details for a single Managed Database instance.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/databaseEngineParam'
      - $ref: '#/components/parameters/databaseIdParam'
      responses:
        '200':
          description: Managed Database retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Database not found
      security:
      - personalAccessToken: []
      - oauth: []
    put:
      operationId: updateDatabaseInstance
      summary: Update a Managed Database
      description: Updates the configuration for a Managed Database instance.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/databaseEngineParam'
      - $ref: '#/components/parameters/databaseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseRequest'
      responses:
        '200':
          description: Managed Database updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Database not found
      security:
      - personalAccessToken: []
      - oauth: []
    delete:
      operationId: deleteDatabaseInstance
      summary: Delete a Managed Database
      description: Deletes a Managed Database instance. All data stored in the database will be permanently lost.
      tags:
      - Databases
      parameters:
      - $ref: '#/components/parameters/databaseEngineParam'
      - $ref: '#/components/parameters/databaseIdParam'
      responses:
        '200':
          description: Managed Database deleted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Database not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /{apiVersion}/databases/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/database-instances.yaml
      path-info: /{apiVersion}/databases/instances
    x-linode-cli-command: databases
    get:
      description: 'Display all Managed Databases accessible to your user, regardless of engine type. For more detailed information on a particular database instance, make a request to its `instance_uri`.


        >


        ---


        - __CLI__.


        ```

        linode-cli databases list

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-instances
      operationId: get-databases-instances
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - allow_list:
                  - 192.0.2.202/24
                  - 192.0.2.14/24
                  cluster_size: 3
                  created: '2022-01-01T00:01:01'
                  encrypted: true
                  engine: mysql
                  fork:
                    restore_time: '2024-10-14T19:55:12'
                    source: '176881'
                  hosts:
                    primary: lin-123-456-mysql-mysql-primary.servers.linodedb.net
                    secondary: lin-123-456-mysql-primary-private.servers.linodedb.net
                  id: 123
                  instance_uri: /v4/databases/mysql/instances/123
                  label: example-db
                  members:
                    45.56.110.70: primary
                    45.79.159.239: failover
                    69.164.209.80: failover
                  oldest_restore_time: '2024-10-03T20:48:05'
                  platform: rdbms-default
                  port: 3306
                  region: us-east
                  status: active
                  total_disk_size_gb: 15
                  type: g6-dedicated-2
                  updated: '2022-01-01T00:01:01'
                  updates:
                    day_of_week: 1
                    duration: 3
                    frequency: weekly
                    hour_of_day: 0
                    pending: []
                  used_disk_size_gb: 2
                  version: 8.0.26
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - additionalProperties: false
                  description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
                    file-path: schemas/pagination-envelope.yaml
                - properties:
                    data:
                      items:
                        additionalProperties: false
                        description: A general Managed Database instance object containing properties that are identical for all database types.
                        properties:
                          allow_list:
                            description: 'Controls access to the Managed Database.


                              - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                              - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                              - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                            example:
                            - 203.0.113.1/32
                            - 192.0.1.0/24
                            items:
                              format: ipv4/prefix_length
                              pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                              type: string
                            minItems: 0
                            type: array
                          cluster_size:
                            default: 1
                            description: "The number of Linode instance nodes deployed to the Managed Database.\n\n - Choose `3` nodes to create a high availability cluster that consists of one primary node and two replica nodes.\n\n- A `2` node cluster is only available with a dedicated plan. It consists of one primary node and one replica node."
                            enum:
                            - 1
                            - 2
                            - 3
                            example: 3
                            type: integer
                            x-linode-cli-display: 5
                          created:
                            description: __Read-only__ When this Managed Database was created.
                            example: '2022-01-01T00:01:01'
                            format: date-time
                            readOnly: true
                            type: string
                          encrypted:
                            default: true
                            description: __Read-only__ Whether the Managed Databases is encrypted. Currently required to be `true`.
                            example: true
                            readOnly: true
                            type: boolean
                          engine:
                            description: __Filterable__, __Read-only__ The Managed Database engine type.
                            enum:
                            - mysql
                            - postgresql
                            example: mysql
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 6
                            x-linode-filterable: true
                          fork:
                            additionalProperties: false
                            description: Details on the database that was the target of the fork. This only exists if the database was restored by creating a fork from another [MySQL](https://techdocs.akamai.com/linode-api/reference/post-databases-mysql-instances) or [PostgreSQL](https://techdocs.akamai.com/linode-api/reference/post-databases-postgre-sql-instances) database.
                            properties:
                              restore_time:
                                description: The database timestamp from which it was restored. This is _not_ when the fork was created.
                                example: '2024-10-14 19:55:12'
                                format: date-time
                                type: string
                              source:
                                description: The instance id of the database that was forked from.
                                example: 176881
                                type: integer
                            type: object
                          hosts:
                            additionalProperties: false
                            description: __Read-only__ The primary hostname and secondary read-only hostname for the Managed Database. The API assigns these hostnames after it successfully creates the Managed Database.
                            properties:
                              primary:
                                description: 'The primary hostname for the Managed Database.


                                  > 📘

                                  >

                                  > - If you''ve configured the Managed Database to use a Virtual Private Cloud (VPC) via the `private_network` object ([MySQL](https://techdocs.akamai.com/linode-api/reference/post-databases-mysql-instances) / [PostgreSQL](https://techdocs.akamai.com/linode-api/reference/post-databases-postgre-sql-instances)), this hostname resolves to a private IPv4 address within that VPC subnet''s address range. Currently, IPv6 addresses aren''t supported in a VPC.

                                  >

                                  > - With `public_access` enabled in a `private_network`, a public version of this hostname is also available. Resolving this hostname returns _publicly_ routable IPv4 and IPv6 addresses.'
                                example: lin-123-456-mysql-mysql-primary.servers.linodedb.net
                                type:
                                - string
                                - 'null'
                              secondary:
                                description: 'The secondary, read-only hostname for the Managed Database. This can only be used to access a Managed Database cluster from Linodes in the same data center (region). Accessing the cluster through this hostname doesn''t incur transfer costs.


                                  > 📘

                                  >

                                  > - The secondary hostname is publicly visible and accessible.

                                  >

                                  > - If you''ve configured the Managed Database to use a VPC via the `private_network` object ([MySQL](https://techdocs.akamai.com/linode-api/reference/post-databases-mysql-instances) / [PostgreSQL](https://techdocs.akamai.com/linode-api/reference/post-databases-postgre-sql-instances)), this hostname resolves to a private IPv4 address within that VPC subnet''s address range. Currently, IPv6 addresses aren''t supported in a VPC. You can also use this hostname for requests between clients within the same VPC to access the cluster over the private network, which avoids transfer costs.

                                  >

                                  > - With `public_access` enabled in a `private_network`, a public version of this hostname is also available. Resolving this hostname returns publicly routable IPv4 and IPv6 addresses.'
                                example: lin-123-456-mysql-primary-private.servers.linodedb.net
                                type:
                                - string
                                - 'null'
                            readOnly: true
                            type: object
                          id:
                            description: __Read-only__ A unique ID that can be used to identify and reference the Managed Database.
                            example: 123
                            readOnly: true
                            type: integer
                            x-linode-cli-display: 1
                          instance_uri:
                            description: __Read-only__ Append this to `https://api.linode.com` to run commands for the Managed Database.
                            example: /v4/databases/mysql/instances/123
                            readOnly: true
                            type: string
                          label:
                            description: __Filterable__ A unique, user-defined string referring to the Managed Database. This string needs to be unique per Managed Database engine type.
                            example: example-db
                            maxLength: 32
                            minLength: 3
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 2
                            x-linode-filterable: true
                          members:
                            description: __Read-only__ A mapping between IP addresses and strings designating them as `primary` or `failover`.
                            example:
                              45.56.110.70: primary
                              45.79.159.239: failover
                            readOnly: true
                            type: object
                          oldest_restore_time:
                            description: __Read-only__ The oldest time to which a database can be restored.
                            example: '2024-10-03 20:48:05'
                            format: date-time
                            readOnly: true
                            type: string
                          platform:
                            description: __Filterable__, __Read-only__ The back-end platform for relational databases used by the service.
                            enum:
                            - rdbms-legacy
                            - rdbms-default
                            example: rdbms-default
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 8
                            x-linode-filterable: true
                          port:
                            description: __Read-only__ The access port for this Managed Database.
                            example: 3306
                            readOnly: true
                            type: integer
                          region:
                            description: __Filterable__ The unique identifier for the [region](https://techdocs.akamai.com/linode-api/reference/get-regions) where the Managed Database lives.
                            example: us-east
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 3
                            x-linode-filterable: true
                          status:
                            description: __Filterable__, __Read-only__ The operating status of the Managed Database.
                            enum:
                            - provisioning
                            - active
                            - suspending
                            - suspended
                            - resuming
                            - failed
                            - degraded
                            - updating
                            - resizing
                            example: active
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-color:
                              active: green
                              default_: white
                              degraded: red
                              failed: red
                              provisioning: yellow
                              restoring: yellow
                              resuming: yellow
                              updating: yellow
                            x-linode-cli-display: 100
                            x-linode-filterable: true
                          total_disk_size_gb:
                            description: __Read-only__ The total disk size of the database, in GB.
                            example: 15
                            readOnly: true
                            type: integer
                          type:
                            description: __Filterable__ The Linode Instance type used by the Managed Database for its nodes.
                            example: g6-dedicated-2
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 4
                            x-linode-filterable: true
                          updated:
                            description: __Read-only__ When this Managed Database was last updated.
                            example: '2022-01-01T00:01:01'
                            format: date-time
                            readOnly: true
                            type: string
                          updates:
                            additionalProperties: false
                            description: Configuration settings for automated patch update maintenance for the Managed Database.
                            properties:
                              day_of_week:
                                description: The numeric reference for the day of the week to perform maintenance. `1` is Monday, `2` is Tuesday, through to `7` which is Sunday.
                                example: 1
                                maximum: 7
                                minimum: 1
                                type: integer
                              duration:
                                description: The maximum maintenance window time in hours.
                                example: 3
                                maximum: 3
                                minimum: 1
                                type: integer
                              frequency:
                                default: weekly
                                description: How frequently maintenance occurs. Currently can only be `weekly`.
                                enum:
                                - weekly
                                example: weekly
                                type: string
                              hour_of_day:
                                description: The hour to begin maintenance based in UTC time.
                                example: 0
                                maximum: 23
                                minimum: 0
                                type: integer
                              pending:
                                description: __Read-only__ An array of pending updates.
                                example: []
                                items:
                                  additionalProperties: false
                                  description: A planned maintenance update.
                                  properties:
                                    deadline:
                                      description: The time when a mandatory update needs to be applied.
                                      example: '2024-10-14T19:55:12'
                                      format: date-time
                                      type:
                                      - string
                                      - 'null'
                                    description:
                                      description: A description of the update.
                                      example: TimescaleDB version 2.17.1 is available.
                                      type: string
                                    planned_for:
                                      description: The date and time a maintenance update will be applied.
                                      example: '2024-10-14T19:55:12'
                                      format: date-time
                                      type:
                                      - string
                                      - 'null'
                                  type: object
                                minItems: 0
                                readOnly: true
                                type: array
                            type: object
                          used_disk_size_gb:
                            description: __Read-only__ The amount of space currently in use in the database, in GB.
                            example: 2
                            readOnly: true
                            type: integer
                          version:
                            description: __Filterable__ The Managed Database engine version.
                            example: 8.0.26
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 7
                            x-linode-filterable: true
                        type: object
                        x-akamai:
                          file-path: schemas/database.yaml
                      type: array
                  type: object
                x-akamai:
                  file-path: schemas/get-databases-instances-200.yaml
          description: Returns a paginated list of all accessible Managed Databases on your account.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - databases:read_only
      summary: List Managed Databases
      tags:
      - Databases
      x-akamai:
        tabs:
        - syntax: linode-cli databases list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: databases:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action:
      - list
      - ls
      x-linode-grant: read_only
    servers:
    - url: https://api.linode.com
  /{apiVersion}/databases/mysql/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/mysql-instances.yaml
      path-info: /{apiVersion}/databases/mysql/instances
    x-linode-cli-command: databases
    post:
      description: '**Provision a MySQL Managed Database**


        Use this operation to create a new MySQL Managed Database.


        - Restricted users need the `add_databases` user grant.


        - New instances can take 10 to 15 minutes to deploy.


        - When you create a new MySQL Managed Database, our partner Aiven automatically enables disk encryption on each cluster.


        - All Managed Databases include automatic, daily backups. Up to seven backups are automatically stored for each Managed Database, providing restore points for each day of the past week.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the MySQL Managed Database. Configure the maintenance window for these updates with the Update a managed MySQL database operation.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. You should adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - A successful request triggers a `database_create` event.


        **Beta** **Virtual Private Cloud (VPC) support**


        You can create a MySQL Managed Database in a VPC using the `private_network` object in the request. Talk to your Akamai account team for more details.


        > 📘

        >

        > Currently, VPC subnets associated with Managed Database instances don''t automatically block outbound connections outside the subnet. To limit network exposure, you should configure Cloud Firewall rules to explicitly deny outbound connections beyond the intended subnet. For more details on configuring rules, see the Cloud Firewall documentation.


        **Restore a MySQL Managed Database**


        Include the `fork` object in the request to target a backed-up database. Your user needs `read_write` access to the target database and its status can be `active`, `degraded`, or `failed`.


        > 📘

        >

        > Restoring from a backup creates a second running cluster, which incurs billing. Delete the first cluster after the restore is complete, to avoid this billing.


        >


        ---


        - __CLI for create operation__.


        ```

        linode-cli databases mysql-create \

        --label example-db1 \

        --region us-east \

        --type g6-dedicated-2 \

        --cluster_size 3 \

        --engine mysql/8.0.26 \

        --engine_config.binlog_retention_period 60 \

        --engine_config.mysql.connect_timeout 10 \

        --engine_config.mysql.default_time_zone +03:00 \

        --ssl_connection true \

        --allow_list 203.0.113.1 \

        --allow_list 192.0.1.0/24

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-databases-mysql-instances
      operationId: post-databases-mysql-instances
      requestBody:
        content:
          application/json:
            example:
              allow_list:
              - 192.0.2.152/24
              - 192.0.2.229/24
              cluster_size: 3
              engine: mysql
              engine_config:
                binlog_retention_period: 600
