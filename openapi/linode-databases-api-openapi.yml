    put:
      description: 'Make changes to an existing MySQL Managed Database.


        - The user needs `read_write` user grant access to the database.


        - The database''s status needs to be `active`.


        - New values set in the `allow_list` overwrite existing values. To keep existing values, run the List MySQL Managed Databases operation, store the `allow_list` addresses from the response, and include them with any new addresses in this operation.


        - Updates to your `allow_list` may take a short time to complete, making this operation inappropriate for rapid successive updates.


        - Also allows resizing the database cluster to a larger one. Clusters can''t be resized to smaller plans.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the Managed MySQL Database. Use the `updates` object in this operation to modify the maintenance window for these updates.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. Use the `updates` object to adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - You can''t update `engine_config` advanced parameter settings for a suspended database. You''ll need to resume it first.


        - A successful request triggers a `database_update` event.


        - **Beta**. You can update an existing MySQL Managed Database to move it to a Virtual Private Cloud (VPC) using the `private_network` object in the request. This support is in beta. Talk to your Akamai account team for more details.


        > 📘

        >

        > Currently, VPC subnets associated with Managed Database instances don''t automatically block outbound connections outside the subnet. To limit network exposure, you should configure Cloud Firewall rules to explicitly deny outbound connections beyond the intended subnet. For more details on configuring rules, see the Cloud Firewall documentation.


        >


        ---


        - __CLI__.


        ```

        linode-cli databases mysql-update 123 \

        --label example-db \

        --allow_list 203.0.113.1 \

        --allow_list 192.0.1.0/24 \

        --type g6-standard-1 \

        --engine_config.binlog_retention_period 60 \

        --engine_config.mysql.connect_timeout 10 \

        --engine_config.mysql.default_time_zone +03:00 \

        --updates.frequency weekly \

        --updates.duration 3 \

        --updates.hour_of_day 12 \

        --updates.day_of_week 4 \

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-databases-mysql-instance
      operationId: put-databases-mysql-instance
      requestBody:
        content:
          application/json:
            example:
              allow_list:
              - 192.0.2.138/24
              - 192.0.2.228/24
              engine_config:
                binlog_retention_period: 600
                mysql:
                  connect_timeout: 10
                  default_time_zone: +03:00
                  group_concat_max_len: 1024
                  information_schema_stats_expiry: 86400
                  innodb_change_buffer_max_size: 30
                  innodb_flush_neighbors: 0
                  innodb_ft_min_token_size: 3
                  innodb_ft_server_stopword_table: db_name/table_name
                  innodb_lock_wait_timeout: 50
                  innodb_log_buffer_size: 16777216
                  innodb_online_alter_log_max_size: 134217728
                  innodb_read_io_threads: 10
                  innodb_rollback_on_timeout: true
                  innodb_thread_concurrency: 10
                  innodb_write_io_threads: 10
                  interactive_timeout: 3600
                  internal_tmp_mem_storage_engine: TempTable
                  max_allowed_packet: 67108864
                  max_heap_table_size: 16777216
                  net_buffer_length: 16384
                  net_read_timeout: 30
                  net_write_timeout: 30
                  sort_buffer_size: 262144
                  sql_mode: ANSI,TRADITIONAL
                  sql_require_primary_key: true
                  tmp_table_size: 16777216
                  wait_timeout: 28800
              label: example-db
              private_network:
                public_access: false
                subnet_id: 456
                vpc_id: 123
              type: g6-standard-1
              updates:
                day_of_week: 1
                duration: 3
                frequency: weekly
                hour_of_day: 0
              version: 8.0.26
            schema:
              additionalProperties: false
              description: Updated information for the Managed MySQL Database.
              properties:
                allow_list:
                  description: 'Controls access to the Managed Database.


                    - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                    - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                    - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                  example:
                  - 203.0.113.1/32
                  - 192.0.1.0/24
                  items:
                    format: ipv4/prefix_length
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                    type: string
                  minItems: 0
                  type: array
                engine_config:
                  additionalProperties: false
                  description: 'Advanced parameters you can apply to a MySQL Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/mysql/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                    > 📘

                    >

                    > Aiven may offer additional parameters in their specification. Currently, only those listed here are supported for use in a MySQL Managed Database. You can also run the [List MySQL Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-mysql-config) operation to see an up-to-date list.'
                  properties:
                    binlog_retention_period:
                      description: The minimum amount of time in seconds to keep `binlog` entries before deletion. This may be extended for services that require `binlog` entries for longer than the default, for example if using the MySQL Debezium Kafka connector.
                      example: 600
                      maximum: 86400
                      minimum: 600
                      type: integer
                    mysql:
                      additionalProperties: false
                      description: MySQL-specific advanced configuration parameters.
                      properties:
                        connect_timeout:
                          description: The number of seconds that the `mysqld` server waits for a connect packet before responding with bad handshake.
                          example: 10
                          maximum: 3600
                          minimum: 2
                          type: integer
                        default_time_zone:
                          description: Default server time zone as an offset from UTC (from -12:00 to +12:00), a time zone name, or `SYSTEM` to use the MySQL server default.
                          example: +03:00
                          maxLength: 100
                          minLength: 2
                          pattern: ^([-+][\\d:]*|[\\w/]*)$
                          type: string
                        group_concat_max_len:
                          description: The maximum permitted result length in bytes for the `GROUP_CONCAT()` function.
                          example: 1024
                          maximum: 18446744073709552000
                          minimum: 4
                          type: integer
                        information_schema_stats_expiry:
                          description: The time, in seconds, before cached statistics expire.
                          example: 86400
                          maximum: 31536000
                          minimum: 900
                          type: integer
                        innodb_change_buffer_max_size:
                          default: 25
                          description: Maximum size for the InnoDB change buffer, as a percentage of the total size of the buffer pool.
                          example: 30
                          maximum: 50
                          minimum: 0
                          type: integer
                        innodb_flush_neighbors:
                          default: 1
                          description: 'Specifies whether flushing a page from the InnoDB buffer pool also flushes other dirty pages in the same extent: `0` - dirty pages in the same extent are not flushed, `1` - flush contiguous dirty pages in the same extent, `2` - flush dirty pages in the same extent.'
                          example: 0
                          maximum: 2
                          minimum: 0
                          type: integer
                        innodb_ft_min_token_size:
                          description: Minimum length of words that are stored in an InnoDB `-1FULLTEXT` index. Changing this parameter will lead to a restart of the MySQL service.
                          example: 3
                          maximum: 16
                          minimum: 0
                          type: integer
                        innodb_ft_server_stopword_table:
                          description: This option is used to specify your own InnoDB `FULLTEXT` index `stopword` list for all InnoDB tables. Set to `null` for no value.
                          example: db_name/table_name
                          maxLength: 1024
                          pattern: ^.+/.+$
                          type:
                          - string
                          - 'null'
                        innodb_lock_wait_timeout:
                          default: 120
                          description: The length of time in seconds an InnoDB transaction waits for a row lock before giving up.
                          example: 50
                          maximum: 3600
                          minimum: 1
                          type: integer
                        innodb_log_buffer_size:
                          description: The size in bytes of the buffer that InnoDB uses to write to the log files on disk.
                          example: 16777216
                          maximum: 4294967295
                          minimum: 1048576
                          type: integer
                        innodb_online_alter_log_max_size:
                          description: The upper limit in bytes on the size of the temporary log files used during online DDL operations for InnoDB tables.
                          example: 134217728
                          maximum: 1099511627776
                          minimum: 65536
                          type: integer
                        innodb_read_io_threads:
                          default: 4
                          description: The number of I/O threads for read operations in InnoDB. Changing this parameter will lead to a restart of the MySQL service.
                          example: 10
                          maximum: 64
                          minimum: 1
                          type: integer
                        innodb_rollback_on_timeout:
                          description: When enabled a transaction timeout causes InnoDB to abort and roll back the entire transaction. Changing this parameter will lead to a restart of the MySQL service.
                          example: true
                          type: boolean
                        innodb_thread_concurrency:
                          default: 0
                          description: Defines the maximum number of threads permitted inside of InnoDB. The default is `0` which indicates infinite concurrency, or no limit.
                          example: 10
                          maximum: 1000
                          minimum: 0
                          type: integer
                        innodb_write_io_threads:
                          default: 4
                          description: The number of I/O threads for write operations in InnoDB. Changing this parameter will lead to a restart of the MySQL service.
                          example: 10
                          maximum: 64
                          minimum: 1
                          type: integer
                        interactive_timeout:
                          description: The number of seconds the server waits for activity on an interactive connection before closing it.
                          example: 3600
                          maximum: 604800
                          minimum: 30
                          type: integer
                        internal_tmp_mem_storage_engine:
                          description: The storage engine for in-memory internal temporary tables.
                          enum:
                          - TempTable
                          - MEMORY
                          example: TempTable
                          type: string
                        max_allowed_packet:
                          default: 7108864
                          description: Size of the largest message in bytes that can be received by the server.
                          example: 67108864
                          maximum: 1073741824
                          minimum: 102400
                          type: integer
                        max_heap_table_size:
                          default: 16777216
                          description: Limits the size of internal in-memory tables. Also set `tmp_table_size`.
                          example: 24777216
                          maximum: 1073741824
                          minimum: 1048576
                          type: integer
                        net_buffer_length:
                          default: 16384
                          description: Start sizes of connection buffer and result buffer. Changing this parameter will lead to a restart of the MySQL service.
                          example: 16384
                          maximum: 1048576
                          minimum: 1024
                          type: integer
                        net_read_timeout:
                          description: The number of seconds to wait for more data from a connection before aborting the read.
                          example: 30
                          maximum: 3600
                          minimum: 1
                          type: integer
                        net_write_timeout:
                          description: The number of seconds to wait for a block to be written to a connection before aborting the write.
                          example: 30
                          maximum: 3600
                          minimum: 1
                          type: integer
                        sql_mode:
                          description: Global SQL mode. Set to empty to use MySQL server defaults. When creating a new service and not setting this field, Akamai defaults to SQL mode which is strict, SQL standard compliant.
                          example: ANSI,TRADITIONAL
                          maxLength: 1024
                          pattern: ^[A-Z_]*(,[A-Z_]+)*$
                          type: string
                        sql_require_primary_key:
                          description: Require primary key to be defined for new tables or old tables modified with `ALTER TABLE` and fail if missing. You should always have primary keys because various functionality may break if any large table is missing them.
                          example: true
                          type: boolean
                        tmp_table_size:
                          default: 16777216
                          description: Limits the size of internal in-memory tables. This also requires a `max_heap_table_size`.
                          example: 24777216
                          maximum: 1073741824
                          minimum: 1048576
                          type: integer
                        wait_timeout:
                          description: The number of seconds the server waits for activity on a non-interactive connection before closing it.
                          example: 28800
                          maximum: 2147483
                          minimum: 1
                          type: integer
                      type: object
                  type: object
                  x-akamai:
                    file-path: schemas/database-mysql-engine-config.yaml
                label:
                  description: __Filterable__ A unique, user-defined string referring to the Managed Database. This string needs to be unique per Managed Database engine type.
                  example: '{{label}}'
                  maxLength: 32
                  minLength: 3
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 2
                  x-linode-filterable: true
                private_network:
                  additionalProperties: false
                  description: __Beta__ Restricts access on a MySQL Managed Database to a specific Virtual Private Cloud (VPC) configured for the cluster.
                  properties:
