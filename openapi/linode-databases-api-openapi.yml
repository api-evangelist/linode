                            example: TempTable
                            type: string
                          max_allowed_packet:
                            default: 7108864
                            description: Size of the largest message in bytes that can be received by the server.
                            example: 67108864
                            maximum: 1073741824
                            minimum: 102400
                            type: integer
                          max_heap_table_size:
                            default: 16777216
                            description: Limits the size of internal in-memory tables. Also set `tmp_table_size`.
                            example: 24777216
                            maximum: 1073741824
                            minimum: 1048576
                            type: integer
                          net_buffer_length:
