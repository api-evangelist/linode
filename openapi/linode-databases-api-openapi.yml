  /{apiVersion}/databases/postgresql/instances:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/postgresql-instances.yaml
      path-info: /{apiVersion}/databases/postgresql/instances
    x-linode-cli-command: databases
    post:
      description: '**Provision a PostgreSQL Managed Database**


        Use this operation to create a new PostgreSQL Managed Database.


        - Restricted users need the `add_databases` user grant.


        - New instances can take 10 to 15 minutes to deploy.


        - When you create a new PostgreSQL Managed Database, our partner Aiven automatically enables disk encryption on each cluster.


        - All Managed Databases include automatic, daily backups. Up to seven backups are automatically stored for each Managed Database, providing restore points for each day of the past week.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the PostgreSQL Managed Database. Configure the maintenance window for these updates with the Update a managed PostgreSQL database operation.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. Adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - A successful request triggers a `database_create` event.


        **Beta** **Virtual Private Cloud (VPC) support**


        You can create a PostgreSQL Managed Database in a VPC using the `private_network` object in the request. Talk to your Akamai account team for more details.


        > 📘

        >

        > Currently, VPC subnets associated with Managed Database instances don''t automatically block outbound connections outside the subnet. To limit network exposure, you should configure Cloud Firewall rules to explicitly deny outbound connections beyond the intended subnet. For more details on configuring rules, see the Cloud Firewall documentation.


        **Restore a PostgreSQL Managed Database**


        Include the `fork` object in the request to target a backed-up database. Your user needs `read_write` access to the target database and its status can be `active`, `degraded`, or `failed`.


        > 📘

        >

        > Restoring from a backup creates a second running cluster, which incurs billing. Delete the first cluster after the restore is complete, to avoid this billing.


        >


        ---


        - __CLI__.


        ```

        linode-cli databases postgresql-create \

        --label example-db \

        --region us-east \

        --type g6-dedicated-2 \

        --cluster_size 3 \

        --engine postgresql/13.2 \

        --engine_config.shared_buffers_percentage 41.5 \

        --engine_config.pg.autovacuum_analyze_scale_factor 0.0 \

        --engine_config.pg.autovacuum_vacuum_cost_delay 60 \

        --engine_config.pg.pg_partman_bgw.interval 3600 \

        --engine_config.pg.pg_partman_bgw.role myrolename \

        --engine_config.pglookout.max_failover_replication_time_lag 60 \

        --ssl_connection true \

        --allow_list 203.0.113.1 \

        --allow_list 192.0.1.0/24

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-databases-postgre-sql-instances
      operationId: post-databases-postgre-sql-instances
      requestBody:
        content:
          application/json:
            example:
              allow_list:
              - 192.0.2.61/24
              - 192.0.2.124/24
              cluster_size: 3
              engine: postgresql/13.2
              engine_config:
                pg:
                  autovacuum_analyze_scale_factor: 1
                  autovacuum_analyze_threshold: 2147483647
                  autovacuum_max_workers: 20
                  autovacuum_naptime: 86400
                  autovacuum_vacuum_cost_delay: 100
                  autovacuum_vacuum_cost_limit: 10000
                  autovacuum_vacuum_scale_factor: 1
                  autovacuum_vacuum_threshold: 2147483647
                  bgwriter_delay: 200
                  bgwriter_flush_after: 512
                  bgwriter_lru_maxpages: 100
                  bgwriter_lru_multiplier: 2.5
                  deadlock_timeout: 1000
                  default_toast_compression: lz4
                  idle_in_transaction_session_timeout: 604800000
                  jit: true
                  max_files_per_process: 1024
                  max_locks_per_transaction: 1024
                  max_logical_replication_workers: 64
                  max_parallel_workers: 96
                  max_parallel_workers_per_gather: 96
                  max_pred_locks_per_transaction: 5120
                  max_replication_slots: 64
                  max_slot_wal_keep_size: 1000000
                  max_stack_depth: 2097152
                  max_standby_archive_delay: 1
                  max_standby_streaming_delay: 10
                  max_wal_senders: 20
                  max_worker_processes: 96
                  password_encryption: scram-sha-256
                  pg_partman_bgw.interval: 3600
                  pg_partman_bgw.role: myrolename
                  pg_stat_monitor.pgsm_enable_query_plan: true
                  pg_stat_monitor.pgsm_max_buckets: 10
                  pg_stat_statements.track: all
                  temp_file_limit: 5000000
                  timezone: Europe/Helsinki
                  track_activity_query_size: 1024
                  track_commit_timestamp: true
                  track_functions: 'off'
                  track_io_timing: 'off'
                  wal_sender_timeout: 60000
                  wal_writer_delay: 200
                pg_stat_monitor_enable: false
                pglookout:
                  max_failover_replication_time_lag: 10
                shared_buffers_percentage: 41.5
                work_mem: 4
              fork:
                restore_time: '2024-10-14 19:55:12'
                source: 176881
              label: example-db
              private_network:
                public_access: false
                subnet_id: 456
                vpc_id: 123
              region: us-east
              ssl_connection: true
              type: g6-dedicated-2
            schema:
              additionalProperties: false
              description: Managed PostgreSQL Database request object.
              properties:
                allow_list:
                  description: 'Controls access to the Managed Database.


                    - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                    - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                    - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                  example:
                  - 203.0.113.1/32
                  - 192.0.1.0/24
                  items:
                    format: ipv4/prefix_length
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                    type: string
                  minItems: 0
                  type: array
                cluster_size:
                  default: 1
                  description: "The number of Linode instance nodes deployed to the Managed Database.\n\n - Choose `3` nodes to create a high availability cluster that consists of one primary node and two replica nodes.\n\n- A `2` node cluster is only available with a dedicated plan. It consists of one primary node and one replica node."
                  enum:
                  - 1
                  - 2
                  - 3
                  example: '{{cluster_size}}'
                  type: integer
                  x-linode-cli-display: 5
                engine:
                  description: The Managed Database engine in engine/version format.
                  example: '{{engine}}'
                  type: string
                engine_config:
                  additionalProperties: false
                  description: 'Advanced parameters you can apply to a PostgreSQL Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/postgresql/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                    > 📘

                    >

                    > Aiven may offer additional parameters in their specification. Currently, only those listed here are supported for use in a PostgreSQL Managed Database. You can also run the [List PostgreSQL Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-postgresql-config) operation to see an up-to-date list.'
                  properties:
                    pg:
                      additionalProperties: false
                      description: PostgreSQL-specific advanced configuration parameters.
                      properties:
                        autovacuum_analyze_scale_factor:
                          default: 0.2
                          description: Specifies a fraction of the table size to add to `autovacuum_analyze_threshold` when deciding whether to trigger an `ANALYZE`.
                          example: 1
                          maximum: 1
                          minimum: 0
                          type: number
                        autovacuum_analyze_threshold:
                          default: 50
                          description: Specifies the minimum number of inserted, updated, or deleted tuples needed to trigger an `ANALYZE` in any one table.
                          example: 2147483647
                          maximum: 2147483647
                          minimum: 0
                          type: integer
                        autovacuum_max_workers:
                          default: 3
                          description: Specifies the maximum number of `autovacuum` processes, other than the `autovacuum` launcher, that may be running at any one time. This parameter can only be set at server start.
                          example: 20
                          maximum: 20
                          minimum: 1
                          type: integer
                        autovacuum_naptime:
                          default: 60
                          description: Specifies the minimum delay between `autovacuum` runs on any given database. The delay is measured in seconds.
                          example: 86400
                          maximum: 86400
                          minimum: 1
                          type: integer
                        autovacuum_vacuum_cost_delay:
                          default: 20
                          description: Specifies the cost delay value that will be used in automatic `VACUUM` operations. If `-1` is specified, the regular `vacuum_cost_delay` value will be used.
                          example: 100
                          maximum: 100
                          minimum: -1
                          type: integer
                        autovacuum_vacuum_cost_limit:
                          default: -1
                          description: Specifies the cost limit value that will be used in automatic `VACUUM` operations. The default of `-1` applies the regular `vacuum_cost_limit` value.
                          example: 10000
                          maximum: 10000
                          minimum: -1
                          type: integer
