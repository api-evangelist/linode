      summary: Get a MySQL Managed Database
      tags:
      - Databases
      x-akamai:
        tabs:
        - syntax: linode-cli databases mysql-view 123
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
