                          type: string
                        size:
                          description: The size of the bucket in bytes.
                          example: 188318981
                          type: integer
                      type: object
                      x-akamai:
                        file-path: schemas/object-storage-bucket.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
