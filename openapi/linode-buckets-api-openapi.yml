openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Buckets API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Buckets are the primary containers within Object Storage. Each bucket stores your files (objects) and lets you access or share those files. Use these operations to create and manage buckets, as well as the objects in them.
  name: Buckets
paths:
  /{apiVersion}/object-storage/buckets:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/object-storage-buckets.yaml
      path-info: /{apiVersion}/object-storage/buckets
    post:
      description: 'Creates an Object Storage bucket in the specified data center (region). If the bucket already exists on your account, this operation returns a 200 response with that bucket as if the API just created it.


        > 📘

        >

        > - Accounts with negative balances can''t access this operation.

        >

        > - The API still supports the `clusterId` equivalent (`us-west-1`) when setting a `region` for a new bucket, but you should use the `regionId` (`us-west`) instead.

        >

        > - This operation has specific rate limits.

        >

        > - You can use an outside API, such as the Ceph Object Gateway S3 API for more options.


        >


        ---


        - __OAuth scopes__.


        ```

        object_storage:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-object-storage-bucket
      operationId: post-object-storage-bucket
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                acl:
                  default: private
                  description: The S3 predefined collection of grantees and permissions set for the bucket, also referred to as a [Canned ACL](https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html#canned-acl).
                  enum:
                  - private
                  - public-read
                  - authenticated-read
                  - public-read-write
                  example: '{{acl}}'
                  type: string
                cors_enabled:
                  description: If set to `false`, cross-origin resource sharing (CORS) is disabled for all origins in the bucket.
                  example: '{{cors_enabled}}'
                  type: boolean
                endpoint_type:
                  description: The type of `s3_endpoint` available to the active `user` in this `region`. See [Endpoint types](https://techdocs.akamai.com/cloud-computing/docs/object-storage#endpoint-types) for more information.
                  enum:
                  - E0
                  - E1
                  - E2
                  - E3
                  example: '{{endpoint_type}}'
                  type: string
                label:
                  description: 'The name for this bucket.


                    * A bucket name can contain from 3 to 63 alphanumeric characters, dashes (`-`), or dots (`.`).

                    * A bucket name can''t end in a dash and you can''t use two consecutive dashes.

                    * A bucket name can''t start or end in a dot, and you can''t use two consecutive dots. As a best practice, only use dots if a certificate you''re using with your bucket requires it. (For example, if you''re using a custom TLS certificate.)

                    * A bucket name needs to be unique in the `region` where you''re creating the bucket. The API only reserves labels for the `region` where active buckets are created and stored. If you want to reserve this bucket''s label in another `region`, create a new bucket with the same label in the new `region`.'
                  example: '{{label}}'
                  pattern: ^(?=.{3,63}$)[a-z0-9]+(?:-[a-z0-9]+)*(?:[.][a-z0-9]+(?:-[a-z0-9]+)*)*$
                  type: string
                region:
                  description: 'The `id` assigned to the data center ([region](https://techdocs.akamai.com/linode-api/reference/get-regions)) where this Object Storage bucket should be created.


                    > 📘

                    >

                    > This supports legacy `clusterId` values that represented a specific region. For example, `us-east-1` is the legacy reference for the `us-east` region.'
                  example: '{{region}}'
                  type: string
                s3_endpoint:
                  description: The active user's S3-compatible endpoint URL, based on the `endpoint_type` and `region`.
                  example: '{{s3_endpoint}}'
                  type: string
              required:
              - label
              type: object
              x-akamai:
                file-path: schemas/post-object-storage-bucket.yaml
            x-example:
              x-ref: ../examples/post-object-storage-bucket.json
        description: Information about the bucket you want to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: An Object Storage bucket.
                properties:
                  cluster:
                    deprecated: true
                    description: '__Deprecated__ The legacy `clusterId` equivalent for the `regionId` where this bucket lives. The API maintains this for backward compatibility.


                      > 📘

                      >

                      > - This value and the `regionId` are interchangeable when used in requests. Best practice is to use the `regionId`.

                      >

                      > - This value is empty for newer regions that don''t have a legacy `clusterId`.'
                    example: us-east-1
                    type: string
                    x-akamai:
                      status: DEPRECATED
                  created:
                    description: When this bucket was created.
                    example: '2019-01-01T01:23:45'
                    format: date-time
                    type: string
                  endpoint_type:
                    description: The type of `s3_endpoint` available to the active `user` in this `region`. See [Endpoint types](https://techdocs.akamai.com/cloud-computing/docs/object-storage#endpoint-types) for more information.
                    enum:
                    - E0
                    - E1
                    - E2
                    - E3
                    example: E1
                    type: string
                  hostname:
                    description: The hostname where this bucket can be accessed. This hostname can be accessed through a browser if the bucket is made public.
                    example: primary-bucket-1.us-east-12.linodeobjects.com
                    type: string
                  label:
                    description: The name of this bucket.
                    example: primary-bucket
                    type: string
                  objects:
                    description: The number of objects stored in this bucket.
                    example: 4
                    type: integer
                  region:
                    description: The `id` of the [region](https://techdocs.akamai.com/linode-api/reference/get-regions) where this Object Storage bucket lives.
                    example: us-east
                    type: string
                  s3_endpoint:
                    description: The active user's S3-compatible endpoint URL, based on the `endpoint_type` and `region`.
                    example: us-east-12.linodeobjects.com
                    type: string
                  size:
                    description: The size of the bucket in bytes.
                    example: 188318981
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/object-storage-bucket.yaml
              x-example:
                x-ref: ../examples/post-object-storage-bucket-200.json
          description: The bucket created successfully.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - object_storage:read_write
      summary: Create an Object Storage bucket
      tags:
