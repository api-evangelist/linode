                description: The token for a delegate user to manage a child account.
                properties:
                  created:
                    description: __Filterable__, __Read-only__ The time this token was created.
                    example: '2024-05-01T00:01:01'
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  expiry:
                    description: __Read-only__ When this token expires, which is 15 minutes from the time of creation. You can't renew the delegate user token. After this time, Akamai revokes the token and you need to generate a new one.
                    example: '2024-05-01T00:16:01'
                    readOnly: true
                    type: string
