  title: 'Akamai: Linode Delegation for parent and child accounts API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to manage delegations for parent and child accounts.
  name: Delegation for parent and child accounts
paths:
  /{apiVersion}/iam/delegation/child-accounts:
    parameters:
    - description: __Enum__ Call the `v4` URL.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-v4-path.yaml
    - description: Users added to the account delegation for each child account, `false` by default.
      example: '{{users}}'
      in: query
      name: users
      schema:
        default: false
        example: true
        type: boolean
      x-akamai:
        file-path: parameters/users.yaml
    x-akamai:
      file-path: paths/iam-delegation-all-child-accounts.yaml
      path-info: /{apiVersion}/iam/delegation/child-accounts
    get:
      description: 'Returns the list of available child accounts under your parent account. With the `users` query parameter set to `true`, it also returns the account delegation for each child account. An *account delegation* is a group of parent account users, either admin or non-admin, delegated to manage a specific child account. The child account''s admins manage the role assignment of delegate users on the child account. To learn more about the parent and child accounts feature and account delegations, see Parent and child accounts.


        > 📘 Parent and child accounts feature

        >

        > This operation is available only within the context of the parent and child accounts feature and can be run only on a parent account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `list_all_child_accounts`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-iam-delegation-all-child-accounts
      operationId: get-iam-delegation-all-child-accounts
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - company: Internet Company
                  euuid: 9971F100-C111-0000-9DDFC3AD1A537B00
                  users:
                  - username
                  - uzantnomo
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: List of child accounts.
                    items:
                      additionalProperties: false
                      properties:
                        company:
                          description: The company name for the child account.
                          type: string
                        euuid:
                          description: The unique identifier of the child account.
                          type: string
                        users:
                          description: Users added to the account delegation for the child account. This appears only when the `users` query parameter is set to `true`.
                          items:
                            type: string
                          minItems: 0
                          type: array
                      type: object
                    minItems: 0
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-iam-delegation-all-child-accounts.yaml
          description: List of child accounts.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      summary: List child accounts
      tags:
      - Delegation for parent and child accounts
      x-linode-cli-skip: true
      x-linode-iam:
      - permissions:
        - list_all_child_accounts
  /{apiVersion}/iam/delegation/child-accounts/{euuid}/users:
