  /{apiVersion}/iam/delegation/default-role-permissions:
    parameters:
    - description: __Enum__ Call the `v4` URL.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-v4-path.yaml
    x-akamai:
      file-path: paths/iam-delegation-default-role-permissions.yaml
      path-info: /{apiVersion}/iam/delegation/default-role-permissions
    get:
      description: 'Returns roles assigned to new delegate users by default. A *delegate user* is a user from the parent account delegated by a parent account''s admin on the parent account to have access to your, child, account. Note that the delegate users'' access can be modified just as a regular child account user, so the returned list doesn''t provide the role assignment of all delegate users. To get the detailed role assignment of a delegate user, run the Get a user''s access level operation. To learn more about the parent and child accounts feature and account delegations, see Parent and child accounts.


        > 📘 Parent and child accounts feature

        >

        > This operation is available only within the context of the parent and child accounts feature and can be run only on a child account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_default_delegate_access`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-iam-delegation-default-role-permissions
      operationId: get-iam-delegation-default-role-permissions
      responses:
        '200':
          content:
            application/json:
              example:
                account_access:
                - account_linode_creator
                - account_firewall_creator
                entity_access:
                - id: 1
                  roles:
                  - linode_contributor
                  type: linode
                - id: 1
                  roles:
                  - firewall_admin
                  type: firewall
              schema:
                additionalProperties: false
                description: The user's access level.
                properties:
                  account_access:
                    description: Assigned account access roles. For a list of available account access roles and their included permissions, see [Available roles](https://techdocs.akamai.com/cloud-computing/docs/identity-access-cm-available-roles).
                    items:
                      enum:
                      - account_admin
                      - account_idp_admin
                      - account_idp_viewer
                      - account_event_viewer
                      - account_maintenance_viewer
                      - account_notification_viewer
                      - account_billing_viewer
                      - account_billing_admin
                      - account_billing_admin
                      - account_linode_creator
                      - account_oauth_client_viewer
                      - account_oauth_client_admin
                      - account_firewall_creator
                      - account_firewall_admin
                      - account_image_creator
                      - account_image_admin
                      - account_nodebalancer_creator
                      - account_maintenance_viewer
                      - account_volume_creator
                      - account_volume_admin
                      - volume_contributor
                      - account_vpc_admin
                      - account_vpc_viewer
                      - account_vpc_creator
                      - account_database_creator
                      - account_domain_creator
                      - account_longview_creator
                      - account_lkecluster_creator
                      - account_longview_subscription_admin
                      - account_placement_group_creator
                      - account_stackscript_creator
                      - account_domain_creator
                      - account_longview_creator
                      type: string
                    minItems: 0
                    type: array
                  entity_access:
                    description: Encapsulates assigned entity access roles and entities they apply to.
                    example:
                    - id: 1
                      roles:
                      - linode_contributor
                      type: linode
                    - id: 1
                      roles:
                      - firewall_admin
                      type: firewall
                    items:
                      additionalProperties: false
                      properties:
                        id:
                          description: A unique identifier for an entity. To get this value, run the [List entities](https://techdocs.akamai.com/linode-api/reference/get-entities) operation.
                          example: 1
                          minimum: 1
                          type: integer
                        roles:
                          description: Entity access roles you want to assign to the entity. For a list of available account access roles and their included permissions, see [Available roles](https://techdocs.akamai.com/cloud-computing/docs/identity-access-cm-available-roles).
                          example:
                          - linode_contributor
                          items:
                            enum:
                            - linode_admin
                            - linode_contributor
                            - linode_viewer
                            - firewall_admin
                            - firewall_contributor
                            - firewall_viewer
                            - nodebalancer_admin
                            - nodebalancer_viewer
                            - vpc_admin
                            - vpc_viewer
                            - volume_admin
                            - volume_viewer
                            - image_admin
                            - image_viewer
                            - lkecluster_admin
                            - lkecluster_viewer
                            - domain_admin
                            - domain_viewer
                            - stackscript_admin
                            - stackscript_viewer
                            - database_admin
                            - database_viewer
                            - longview_admin
                            - longview_viewer
                            type: string
                          minItems: 0
                          type: array
                        type:
                          description: A type of entity. This is the Cloud Manager service or capability that an entity corresponds to. The value is either `linode`, `firewall`, `nodebalancer`, `vpc`, `volume`, `image`, `domain`, `stackscript`, `database`, or `longview`.
                          enum:
                          - linode
                          - firewall
                          - database
                          - domain
                          - image
                          - longview
                          - nodebalancer
                          - stackscript
                          - volume
                          - vpc
                          example: linode
                          type: string
                      required:
                      - id
                      - type
                      - roles
                      type: object
                    minItems: 0
                    type: array
                required:
                - account_access
                - entity_access
                type: object
                x-akamai:
                  file-path: schemas/iam-users-role-permissions.yaml
          description: The list of roles assigned to new delegate users by default.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      summary: Get the default role assignment for delegate users
      tags:
      - Delegation for parent and child accounts
      x-linode-cli-skip: true
      x-linode-iam:
      - permissions:
        - view_default_delegate_access
    put:
      description: 'Updates the default role assignment for new delegate users on your child account. A *delegate user* is a user from the parent account delegated by a parent account''s admin on the parent account to have access to your, child, account. Note that the change applies only to new delegate users coming to your account. To edit current delegate users'' access, you need to run the Update a user''s access level operation. To learn more about the parent and child accounts feature and account delegations, see Parent and child accounts.


        > 📘 Parent and child accounts feature

        >

        > This operation is available only within the context of the parent and child accounts feature and can be run only on a child account by its admin.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `update_default_delegate_access`'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-iam-delegation-default-role-permissions
      operationId: put-iam-delegation-default-role-permissions
      requestBody:
