      description: 'Creates a short-lived bearer token for you as a delegate user to run API operations on a specific child account. The token inherits the permissions set by a child account admin for your delegate user. Your username as the delegate user follows the specific naming convention:


        -


        These variables only use the first 15 and 16 characters of these values, respectively.


