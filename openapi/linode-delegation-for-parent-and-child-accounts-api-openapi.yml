                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      summary: Get the account delegation for a child account
      tags:
      - Delegation for parent and child accounts
      x-linode-cli-skip: true
      x-linode-iam:
      - permissions:
        - list_delegate_users
    put:
      description: 'Updates the list of users added to the account delegation for a specific child account. An *account delegation* is a group of parent account users, either admin or non-admin, delegated to manage a specific child account. The child account''s admins manage the role assignment of delegate users on the child account. To learn more about the parent and child accounts feature and account delegations, see Parent and child accounts.


        > 📘 Parent and child accounts feature

        >

        > This operation is available only within the context of the parent and child accounts feature and can be run only on a parent account.


        **Permissions and scopes**


        To call this operation, you need the following:


