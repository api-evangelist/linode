openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode TLS/SSL certificates API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: You can set up TLS/SSL certificates to secure the connection to the domain you set up for your Object Storage buckets. Use these operations to add, view, and delete these certificates.
  name: TLS/SSL certificates
paths:
  /{apiVersion}/object-storage/buckets/{regionId}/{bucket}/ssl:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: 'Identifies a region where this bucket lives.


        > 📘

        >

        > You can use a `clusterId` in place of `regionId` in requests for buckets that you created using the legacy version of the API. Run [List clusters](https://techdocs.akamai.com/linode-api/reference/get-object-storage-clusters) to see each cluster `id`.'
      example: '{{regionId}}'
      in: path
      name: regionId
      required: true
      schema:
        example: us-east
        type: string
      x-akamai:
        file-path: parameters/region-id-obj.yaml
    - description: The bucket name.
      example: '{{bucket}}'
      in: path
      name: bucket
      required: true
      schema:
        type: string
      x-akamai:
        file-path: parameters/bucket.yaml
    x-akamai:
      file-path: paths/object-storage-bucket-ssl.yaml
      path-info: /{apiVersion}/object-storage/buckets/{regionId}/{bucket}/ssl
    x-linode-cli-command: object-storage
    post:
      description: 'Upload a TLS/SSL certificate and private key to be served when you visit your Object Storage bucket via HTTPS. Your TLS/SSL certificate and private key are stored encrypted at rest.


        To replace an expired certificate, delete your current certificates and upload a new one.


        >


        ---


        - __CLI__.


        ```

        linode-cli object-storage ssl-upload \

        us-east-1 example-bucket \

        --certificate "-----BEGIN CERTIFICATE-----

        CERTIFICATE_INFORMATION

        -----END CERTIFICATE-----" \

        --private_key "-----BEGIN PRIVATE KEY-----

        PRIVATE_KEY_INFORMATION

        -----END PRIVATE KEY-----"

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        object_storage:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-object-storage-ssl
      operationId: post-object-storage-ssl
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Upload a TLS/SSL certificate and private key to be served when you visit your Object Storage bucket via HTTPS.
              properties:
                certificate:
                  description: 'Your Base64 encoded and PEM formatted SSL certificate.


                    Line breaks must be represented as `\n` in the string for requests (but not when using the Linode CLI)'
                  example: '{{certificate}}'
                  type: string
                private_key:
                  description: 'The private key associated with this TLS/SSL certificate.


                    Line breaks must be represented as `\n` in the string for requests (but not when using the Linode CLI)'
                  example: '{{private_key}}'
                  type: string
              required:
              - certificate
              - private_key
              type: object
              x-akamai:
                file-path: schemas/object-storage-ssl.yaml
            x-example:
              x-ref: ../examples/post-object-storage-ssl.json
        description: Upload this TLS/SSL certificate with its corresponding secret key.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: If this Object Storage bucket has a corresponding TLS/SSL Certificate.
                properties:
                  ssl:
                    description: __Read-only__ A boolean indicating if this Bucket has a corresponding TLS/SSL certificate that was uploaded by an Account user.
                    example: true
                    readOnly: true
                    type: boolean
                type: object
                x-akamai:
                  file-path: schemas/object-storage-ssl-response.yaml
              x-example:
                x-ref: ../examples/post-object-storage-ssl-200.json
          description: The response indicates whether this bucket has a corresponding TLS/SSL certificate that was uploaded by a user.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - object_storage:read_write
      summary: Upload an Object Storage TLS/SSL certificate
      tags:
      - TLS/SSL certificates
      x-akamai:
        tabs:
        - syntax: "linode-cli object-storage ssl-upload \\\n  us-east-1 example-bucket \\\n  --certificate \"-----BEGIN CERTIFICATE-----\n                 CERTIFICATE_INFORMATION\n                 -----END CERTIFICATE-----\" \\\n  --private_key \"-----BEGIN PRIVATE KEY-----\n                 PRIVATE_KEY_INFORMATION\n                 -----END PRIVATE KEY-----\""
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: object_storage:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: ssl-upload
    get:
      description: 'Returns a boolean value indicating if this bucket has a corresponding TLS/SSL certificate that was uploaded by an Account user.


        >


        ---


        - __CLI__.


        ```

        linode-cli object-storage ssl-view \

        us-east-1 example-bucket

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        object_storage:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-object-storage-ssl
      operationId: get-object-storage-ssl
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: If this Object Storage bucket has a corresponding TLS/SSL Certificate.
                properties:
                  ssl:
                    description: __Read-only__ A boolean indicating if this Bucket has a corresponding TLS/SSL certificate that was uploaded by an Account user.
                    example: true
                    readOnly: true
                    type: boolean
                type: object
                x-akamai:
                  file-path: schemas/object-storage-ssl-response.yaml
              x-example:
                x-ref: ../examples/get-object-storage-ssl-200.json
          description: Returns a boolean value indicating if this bucket has a corresponding TLS/SSL certificate that was uploaded by an Account user.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - object_storage:read_only
      summary: Get an Object Storage TLS/SSL certificate
      tags:
      - TLS/SSL certificates
      x-akamai:
        tabs:
        - syntax: "linode-cli object-storage ssl-view \\\n  us-east-1 example-bucket"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: object_storage:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: ssl-view
    delete:
      description: 'Deletes this Object Storage bucket''s user uploaded TLS/SSL certificate and private key.


        >


        ---


        - __CLI__.


        ```

        linode-cli object-storage ssl-delete \

        us-east-1 example-bucket

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        object_storage:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/delete-object-storage-ssl
      operationId: delete-object-storage-ssl
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/delete-object-storage-ssl-200.json
          description: Deletes this Object Storage bucket's user uploaded TLS/SSL certificate and private key.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - object_storage:read_write
      summary: Delete an Object Storage TLS/SSL certificate
      tags:
