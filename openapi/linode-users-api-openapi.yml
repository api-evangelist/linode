      x-linode-grant: unrestricted only
    get:
      description: 'Returns a paginated list of all users on your account.


        > 📘

        >

        > This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.


        A user can access all or part of an account based on their access status and grants:


        - __Unrestricted access__. These users can access everything on an account.


        - __Restricted access__. These users can only access entities or perform actions they''ve been given specific grants to.


        >


        ---


        - __CLI__.


        ```

        linode-cli users list

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-users
      operationId: get-users
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - email: jperez@linode.com
                  last_login:
                    login_datetime: '2018-01-01T01:01:01'
                    status: successful
                  password_created: '2018-01-01T01:01:01'
                  restricted: true
                  ssh_keys:
                  - home-pc
                  - laptop
                  tfa_enabled: true
                  user_type: parent
                  username: jsmith
                  verified_phone_number: '+5555555555'
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      allOf:
                      - additionalProperties: false
                        description: A user on your account. Unrestricted users can log in and access information about your account, while restricted users may only access entities or perform actions they've been granted access to.
                        properties:
                          email:
                            description: This user's email address. Akamai uses this address for account management communications.
                            example: example_user@linode.com
                            format: email
                            type: string
                            x-linode-cli-display: 2
                          last_login:
                            additionalProperties: false
                            description: __Read-only__ Details on this user's last login attempt. Returned as `null` if this user hasn't attempted a login since it was created. You can run the [List user logins](https://techdocs.akamai.com/linode-api/reference/get-account-logins) operation for additional login information.
                            properties:
                              login_datetime:
                                description: __Read-only__ The date and time of this user's most recent login attempt.
                                example: '2018-01-01T01:01:01'
                                format: date-time
                                readOnly: true
                                type: string
                              status:
                                description: __Read-only__ The result of this user's most recent login attempt.
                                enum:
                                - successful
                                - failed
                                example: successful
                                readOnly: true
                                type: string
                            readOnly: true
                            type:
                            - object
                            - 'null'
                          password_created:
                            description: __Read-only__ When this user's current password was created. You initially create a password during the account sign-up process, and you can update it using the [Reset Password](https://login.linode.com/forgot/password) webpage. Returned as `null` if this user doesn't have a password set.
                            example: '2018-01-01T01:01:01'
                            format: date-time
                            readOnly: true
                            type:
                            - string
                            - 'null'
                          restricted:
                            description: If `true`, this user needs specific access granted to perform actions or access entities on your account. Run [List a user's grants](https://techdocs.akamai.com/linode-api/reference/get-user-grants) for details on how to configure grants for a restricted user.
                            example: true
                            type: boolean
                            x-linode-cli-display: 3
                          ssh_keys:
                            description: '__Read-only__ A list of the labels for SSH keys added by this user. Users can add keys with the [Add an SSH key](https://techdocs.akamai.com/linode-api/reference/post-add-ssh-key) operation. These keys are deployed when this user is included in the `authorized_users` field of the following requests:


                              - [Create a Linode](https://techdocs.akamai.com/linode-api/reference/post-linode-instance)


                              - [Rebuild a Linode](https://techdocs.akamai.com/linode-api/reference/post-rebuild-linode-instance)


                              - [Create a disk](https://techdocs.akamai.com/linode-api/reference/post-add-linode-disk)'
                            example:
                            - home-pc
                            - laptop
                            items:
                              type: string
                            readOnly: true
                            type: array
                          tfa_enabled:
                            description: __Read-only__ Whether this user has Two Factor Authentication (TFA) enabled. Run the [Create a two factor secret](https://techdocs.akamai.com/linode-api/reference/post-tfa-enable) operation to enable TFA.
                            example: true
                            readOnly: true
                            type: boolean
                          username:
                            description: __Filterable__ The name of this user. This user needs to use this value to log in. It may also display alongside actions this user performs, including events or public StackScripts.
                            example: example_user
                            maxLength: 32
                            minLength: 3
                            pattern: ^[a-zA-Z0-9]((?![_-]{2,})[a-zA-Z0-9-_])+[a-zA-Z0-9]$
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 1
                            x-linode-filterable: true
                          verified_phone_number:
                            description: __Read-only__ The [verified](https://techdocs.akamai.com/linode-api/reference/post-profile-phone-number-verify) phone number for this user profile. Returned as `null` if the user doesn't have a verified phone number.
                            example: '+5555555555'
                            format: phone
                            readOnly: true
                            type:
                            - string
                            - 'null'
                        type: object
                        x-akamai:
                          file-path: schemas/user.yaml
                      - additionalProperties: false
                        description: The type of user on an account. Mostly applies to the use of the parent and child accounts for Akamai partners functionality.
                        properties:
                          user_type:
                            description: '__Read-only__ If the user belongs to a [parent or child account](https://www.linode.com/docs/guides/parent-child-accounts/) relationship, this defines the user type in the respective account. Possible values include:


                              - `parent`. This is a user in an Akamai partner account. Akamai partners have a contractual relationship with their end customers, to sell Akamai services. This user can either have full access (a parent account admin user) or limited access. Limited users don''t have access to manage child accounts, but they can be granted this access by an admin user.


                              - `child`. This is an Akamai partner''s end customer user, in a child account. A child user can have either full or limited access. Full access lets the user manage other child users and the proxy user in a child account.


                              - `proxy`. This is a user on a child account that gives parent account users access to that child account. A parent account user with the `child_account_access` grant can [Create a proxy user token](https://techdocs.akamai.com/linode-api/reference/post-child-account-token) from the parent account. The parent user can use this token to run API operations from the child account, as if they were a child user.


                              - `default`. This applies to all regular, non-parent-child account users.'
                            enum:
                            - parent
                            - child
                            - proxy
                            - default
                            example: parent
                            readOnly: true
                            type: string
                        type: object
                        x-akamai:
                          file-path: schemas/user-type.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/added-get-users-200.yaml
          description: A paginated list of users.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
