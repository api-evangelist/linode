    x-akamai:
      file-path: paths/username.yaml
      path-info: /{apiVersion}/account/users/{username}
    x-linode-cli-command: users
    get:
      description: 'Returns information about a single user on your account.


        > 📘

        >

        > This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.


        >


        ---


        - __CLI__.


        ```

        linode-cli users view example_user

        ```


