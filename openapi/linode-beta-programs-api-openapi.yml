openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Beta programs API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use the Beta Programs operations to view information about available beta programs and sign up to participate in them.
  name: Beta programs
paths:
  /{apiVersion}/account/betas:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/account-betas.yaml
      path-info: /{apiVersion}/account/betas
    x-linode-cli-command: betas
    post:
      description: 'Enroll your Account in an active Beta Program.


        Only unrestricted Users can access this operation.


        To view active Beta Programs, run the List beta programs operation.


        Active Beta Programs may have a limited number of enrollments. If a Beta Program has reached is maximum number of enrollments, an error is returned even though the request is successful.


        Beta Programs with `"greenlight_only": true` can only be enrolled by Accounts that participate in the Greenlight program.


        >


        ---


        - __CLI__.


        ```

        linode-cli betas enroll --id example_open

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-beta-program
      operationId: post-beta-program
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The Beta Program ID to enroll in for your Account.
              properties:
                id:
                  description: The unique identifier of the Beta Program.
                  example: '{{id}}'
                  type: string
                  x-linode-cli-display: 1
              required:
              - id
              type: object
              x-akamai:
                file-path: schemas/added-post-beta-program.yaml
            x-example:
              x-ref: ../examples/post-beta-program.json
        description: Updated information for the Managed MySQL Database.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: The API responds with an empty object.
                maxProperties: 0
                type: object
                x-akamai:
                  file-path: schemas/added-empty-obj.yaml
              x-example:
                x-ref: ../examples/post-beta-program-200.json
          description: Enrollment request successful.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Enroll in a Beta program
      tags:
      - Beta programs
      x-akamai:
        tabs:
        - syntax: linode-cli betas enroll --id example_open
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: account:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: enroll
      x-linode-grant: unrestricted only
    get:
      description: 'Display all enrolled Beta Programs for your Account. Includes inactive as well as active Beta Programs.


        Only unrestricted Users can access this operation.


        >


        ---


        - __CLI__.


        ```

        linode-cli betas enrolled

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-enrolled-beta-programs
      operationId: get-enrolled-beta-programs
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - description: This is an open public beta for an example feature.
                  ended: null
                  enrolled: '2023-09-11T00:00:00'
                  id: example_open
                  label: Example Open Beta
                  started: '2023-07-11T00:00:00'
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - additionalProperties: false
                  description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
                    file-path: schemas/pagination-envelope.yaml
                - properties:
                    data:
                      items:
                        additionalProperties: false
                        description: An object representing an enrolled Beta Program for the Account.
                        properties:
                          description:
                            description: __Read-only__ Additional details regarding the Beta Program.
                            example: This is an open public beta for an example feature.
                            readOnly: true
                            type:
                            - string
                            - 'null'
                            x-linode-cli-display: 3
                          ended:
                            description: '__Filterable__, __Read-only__ The date-time that the Beta Program ended.


                              `null` indicates that the Beta Program is ongoing.'
                            example: null
                            format: date-time
                            readOnly: true
                            type:
                            - string
                            - 'null'
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 5
                            x-linode-filterable: true
                          enrolled:
                            description: __Filterable__, __Read-only__ The date-time of Account enrollment to the Beta Program.
                            example: '2023-09-11T00:00:00'
                            format: date-time
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 6
                            x-linode-filterable: true
                          id:
                            description: The unique identifier of the Beta Program.
                            example: example_open
                            type: string
                            x-linode-cli-display: 1
                          label:
                            description: __Filterable__, __Read-only__ The name of the Beta Program.
                            example: Example Open Beta
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 2
                            x-linode-filterable: true
                          started:
                            description: __Filterable__, __Read-only__ The start date-time of the Beta Program.
                            example: '2023-07-11T00:00:00'
                            format: date-time
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 4
                            x-linode-filterable: true
                        type: object
                        x-akamai:
                          file-path: schemas/beta-program-enrolled.yaml
                      type: array
                  type: object
                x-akamai:
                  file-path: schemas/added-get-enrolled-beta-programs-200.yaml
          description: Returns a paginated list of all enrolled Beta Program objects for the Account.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
