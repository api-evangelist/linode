    delete:
      description: 'Deletes a Linode interface on a specific Linode. Consider these points when deleting a Linode interface:


        - You can''t delete an active interface. First, you need to shut down the associated Linode.


        - You can''t delete a Linode interface from a Linode that has a `cannot_delete_with_subresources` resource lock set for it.


        - You can''t delete an individual RDMA VPC interface. These interfaces are structurally linked to specialized GPU plans. To remove an RDMA VPC interface, you need to delete the Linode instance entirely, which automatically removes its associated virtual attachments.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `update_linode`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli linodes interface-delete $linodeId $interfaceId

        ```


        Learn more'
