    get:
      description: 'This operation returns all interfaces assigned to a specific Linode. They list in the order they were created. On the Linode, interfaces also list in this order, and are typically named `eth0`, `eth1`, `eth2`, and so on. The MAC address is the most reliable method to identify an interface. The Linode needs to use `interfaces` and not configuration profile interfaces. Run Get account settings to see if Linode interfaces are supported.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_linode`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli linodes interfaces-list $linodeId

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-linode-interfaces
      operationId: get-linode-interfaces
      responses:
        '200':
          content:
            application/json:
              examples:
                ex-public:
                  summary: Public interface
                  value:
                    interfaces:
                    - created: '2025-01-01T00:01:01'
                      default_route:
                        ipv4: true
                        ipv6: true
                      id: 1234
                      mac_address: 22:00:AB:CD:EF:01
                      public:
                        ipv4:
                          addresses:
                          - address: 172.30.0.50
                            primary: true
                          shared:
                          - address: 172.30.0.51
                            linode_id: 12345
                        ipv6:
                          ranges:
                          - range: 2001:DB8::/64
                            route_target: 2001:db8:1383:b8dc:33c5:fe0b:c9fa:4e9e
                          - range: 2001:DB8::/64
                            route_target: 2001:db8:dffd:2d09:7aea:176d:17e5:80f5
                          shared:
                          - range: 2001:DB8::/64
                            route_target: null
                          slaac:
                          - address: 2001:db8:5f09:12d6:e014:e11a:aca2:cfa3
                            prefix: 64
                      updated: '2025-01-01T00:01:01'
                      version: 1
                      vlan: null
                      vpc: null
