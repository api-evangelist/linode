    put:
      description: 'Update the configuration of a Linode interface.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `update_linode`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        *Public interface*


        ```shell

        linode-cli linodes interface-update $linodeId $interfaceId \

        --default_route.ipv4 true \

        --default_route.ipv6 false \

        --public.ipv4.addresses ''[{"address": "192.0.2.141", "primary": true}, {"address": "auto", "primary": false}]'' \

        --public.ipv6.ranges ''[{"range": "2001:0db8::/64"}, {"range": "/64"}]''

        ```


        *VLAN interface*


        ```shell

        linode-cli linodes interface-update $linodeId $interfaceId \

        --vlan.vlan_label my-vlan \

        --vlan.ipam_address 192.168.2.2/24

        ```


        *VPC interface*


        ```shell

        linode-cli linodes interface-update $linodeId $interfaceId \

        --default_route.ipv4 true \

        --vpc.subnet_id 321 \

        --vpc.ipv4.addresses ''[{"address": "10.0.0.1", "primary": true, "nat_1_1_address": "auto"}, {"address": "auto", "primary": false, "nat_1_1_address": null}]'' \

        --vpc.ipv4.ranges ''[{"range": "/28"}, {"range": "10.11.12.0/24"}]'' \

        --vpc.ipv6.ranges ''[{"range": "2001:0db8::/64"}]'' \

        --vpc.ipv6.is_public false

        ```


        *RDMA VPC interface*


        ```shell

        linode-cli linodes interface-update \

        --rdma_vpc.subnet_id 8 \

        --rdma_vpc.ipv4.addresses ''[{"address": "10.0.0.2", "primary": true}]'' \

        --default_route.ipv4 false \

        --default_route.ipv6 false

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-linode-interface
      operationId: put-linode-interface
      requestBody:
        content:
          application/json:
            schema:
              description: Modifies an existing Linode interface. The interface type (`vpc`, `public`, `vlan`) can't be changed.
              oneOf:
              - additionalProperties: false
                description: 'Modifies an existing Linode public interface. The public interface can''t be changed to a VLAN or VPC interface type.

                  If Network Helper is enabled, the Linode must be shut down before updating the `address`, or `primary` setting.'
                properties:
                  default_route:
                    additionalProperties: false
                    description: Defines whether IPv4 and IPv6 default routes are enabled for this interface. Public interfaces can have both an IPv4 and IPv6 `default_route`, provided they have at least one IP address of the corresponding type. If the `default_route` is omitted, (or set to `null`), no changes are made to the `default_route` configuration.
                    properties:
                      ipv4:
                        description: If set to `true`, and if the interface has at least one IPv4 address after the PUT request, the `default_route` role is assigned to the interface. If another interface is already configured as the default route, this setting removes that configuration. If the interface has an IPv4 address, the value cannot be set as `false`.
                        example: true
                        type:
                        - boolean
                        - 'null'
                      ipv6:
                        description: If set to `true`, and if the interface has at least one IPv6 address after the PUT request, the `default_route` role is assigned to the interface. If another interface is already configured as the default route, this setting removes that configuration. If the interface has an IPv6 address, the value cannot be set as `false`.
                        example: true
                        type:
                        - boolean
                        - 'null'
                    type:
                    - object
                    - 'null'
                  public:
                    additionalProperties: false
                    description: Public interface settings.
                    properties:
                      ipv4:
                        additionalProperties: false
                        description: IPv4 address settings for this public interface.
                        properties:
                          addresses:
                            description: List of IPv4 addresses to assign to this interface. When updating the addresses, all addresses must be explicitly listed in the array, and any addresses not included in the update are removed. If omitted or set to `null`, no changes are made to the existing IPv4 configuration.
                            items:
                              additionalProperties: false
                              properties:
                                address:
                                  default: auto
                                  description: The public IPv4 address configuration for the interface. If set to `auto`, a public IPv4 address is allocated. If the address is a reserved or an automatically assigned public IP, the IP must be reserved or already assigned to a single Linode, and it can’t be already assigned to an interface.
                                  example: 192.0.2.141
                                  type: string
                                primary:
                                  description: 'The IPv4 primary address for the interface that is used to set up a source address for routes inside the Linode for the corresponding network interface.

                                    Automatically set to `true` and should not be set to `false` if there is only one address present in the addresses array.

                                    If more than one address is provided, primary must be set to `true` for one address.'
                                  example: true
                                  type:
                                  - boolean
                                  - 'null'
                              type: object
                            type:
                            - array
                            - 'null'
                        type: object
                      ipv6:
                        additionalProperties: false
                        description: IPv6 address settings for the public interface.
                        properties:
                          ranges:
                            description: List of IPv6 address ranges to assign to this interface. If range is omitted, or set to `null`, no changes are made to the IPv6 ranges of the interface. If range is updated, specify all ranges in this array, otherwise, the currently assigned ranges will be removed.
                            items:
                              additionalProperties: false
                              properties:
                                range:
                                  default: null
                                  description: 'IPv6 range in CIDR notation (`2001:0db8::1/64`) or prefix-only (`/64`).

                                    - The prefix of `/64` or `/56` block of IPv6 addresses.

                                    - CIDR notation ranges must be within your assigned ranges.'
                                  example: /64
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - range
                              type: object
                            type:
                            - array
                            - 'null'
                        type: object
                    type:
                    - object
                    - 'null'
                title: Public interface
                type: object
                x-akamai:
                  file-path: schemas/added-put-linode-interface-public.yaml
              - additionalProperties: false
                description: Modifies an existing Linode VLAN interface. The VLAN interface can't be changed to a VPC or public interface type.
                properties:
                  vlan:
                    additionalProperties: false
                    description: VLAN interface settings.
                    properties:
                      ipam_address:
                        description: This VLAN interface's private IPv4 address in classless inter-domain routing (CIDR) notation. The `ipam_address` can't be updated. It needs to be the existing value, or `null`.
                        example: 10.0.0.1/24
                        format: ipv4-cidr
                        type:
                        - string
                        - 'null'
                      vlan_label:
                        description: The VLAN's label. Once you specify it, you can't update it.
                        example: my-vlan
                        maxLength: 64
                        minLength: 1
                        pattern: '[a-zA-Z0-9-]+'
                        type: string
                    type: object
                title: VLAN interface
                type: object
                x-akamai:
                  file-path: schemas/added-put-linode-interface-vlan.yaml
              - additionalProperties: false
                description: 'Modifies an existing Linode VPC interface. The VPC interface can''t be changed to a VLAN or public interface type.

                  If Network Helper is enabled, shut down the Linode before updating the `address`, or `primary` setting.'
                properties:
                  default_route:
                    additionalProperties: false
                    description: Indicates if the interface is used as the default route. A VPC interface can have an IPv4 `default_route`.
                    properties:
                      ipv4:
                        description: If set to `true`, and if the interface has at least one IPv4 address after the `PUT` request, the `default_route` role is assigned to the interface. If another interface is already configured as the default route, this setting removes that configuration. If the interface has an IPv4 address, the value can't be set to `false`. If this is omitted, or set to `null`, no changes are made to the interface's IPv4 configuration.
                        example: true
                        type:
                        - boolean
                        - 'null'
                    type: object
                  vpc:
                    additionalProperties: false
                    description: VPC interface settings.
                    properties:
                      ipv4:
                        additionalProperties: false
                        description: Interfaces can be configured with IPv4 `addresses` or `ranges`. If this is omitted, or set to `null`, no changes are made to the IPv4 configuration.
                        properties:
                          addresses:
                            description: IPv4 configuration for this VPC interface. When updating the addresses, all addresses must be explicitly listed in the array, and any addresses not included in the update are removed. If omitted or set to `null`, no changes are made to the existing IPv4 configuration. However, if the `subnet_id` is updated, new default address values are applied.
                            items:
                              additionalProperties: false
                              properties:
                                address:
                                  default: auto
                                  description: Specifies which IPv4 addresses to use in the VPC subnet. You can't use an IPv4 address taken from another Linode or interface, or the first two or last two addresses in the VPC subnet. Setting `address` to `auto` automatically assigns an IP address from the subnet.
                                  example: 192.168.22.3
                                  type: string
                                nat_1_1_address:
                                  default: null
                                  description: 'The 1:1 NAT IPv4 address that links a public IPv4 address with the interface''s VPC subnet IPv4 address.


                                    - You can set this to a specific public IPv4 address that''s available on the Linode.


                                    - If set to `auto`, a public IPv4 address is automatically selected.


                                    - If a public IPv4 address or `auto` is specified, `primary` must be set to `true`.


                                    - A specified address can''t be used on another Linode.


                                    - If the address is a reserved or an automatically assigned public IP, the IP must be reserved or already assigned to a single Linode, and not assigned to an interface.


                                    - Omitting this or setting it to `null` results in no 1:1 NAT configuration for the VPC interface.'
                                  example: 192.0.2.141
                                  type:
                                  - string
                                  - 'null'
                                primary:
                                  description: 'The IPv4 primary address for the interface that sets up a source address for routes inside the Linode for the corresponding network interface.

                                    Automatically sets to `true` and should not be set to `false` if there is only one address present in the `addresses` array.

                                    If more than one `address` is provided, `primary` must be set to `true` for one address.'
                                  example: true
                                  type:
                                  - boolean
                                  - 'null'
                              type: object
                            type: array
                          ranges:
                            default: []
                            description: VPC IPv4 ranges. If you omit `ranges` or set it to `null`, the interface's IPv4 ranges remain unchanged. But if you update `ranges`, you need to specify all of them, otherwise currently assigned ranges are removed.
                            items:
                              additionalProperties: false
                              properties:
                                range:
                                  default: null
                                  description: 'CIDR notation of a range (`1.2.3.4/28`) or prefix only (`/28`):

                                    - When only the prefix is provided, then an available range of that size within the VPC''s subnet is automatically selected.

                                    - If specified as CIDR notation, it must belong to the VPC subnet. All addresses in the range must not be taken by any other Linode or interfaces in the VPC subnet and must not include any of the first two or last two addresses of the VPC subnet.'
                                  example: 192.168.22.16/28
