        file-path: parameters/invoice-id-path.yaml
    x-akamai:
      file-path: paths/invoice-items.yaml
      path-info: /{apiVersion}/account/invoices/{invoiceId}/items
    x-linode-cli-command: account
    get:
      description: 'Returns a paginated list of Invoice items.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `list_invoice_items`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli account invoice-items 123

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-invoice-items
      operationId: get-invoice-items
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - amount: 20.2
                  from: '2018-01-01T00:01:01'
                  label: Linode 123
                  quantity: 4
                  region: us-west
                  tax: 1.25
                  to: '2018-01-31T11:59:59'
                  total: 21.45
                  type: hourly
                  unit_price: 5.05
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: An InvoiceItem object.
                      properties:
                        amount:
                          description: __Read-only__ The price, in US dollars, of the Invoice Item. Equal to the unit price multiplied by quantity.
                          example: 20.2
                          readOnly: true
                          type: number
                          x-linode-cli-display: 4
                        from:
                          description: __Read-only__ The date the Invoice Item started, based on month.
                          example: '2018-01-01T00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                          x-linode-cli-display: 2
                        label:
                          description: __Read-only__ The Invoice Item's display label.
                          example: Linode 123
                          readOnly: true
                          type: string
                          x-linode-cli-display: 1
                        quantity:
                          description: __Read-only__ The quantity of this Item for the specified Invoice.
                          example: 4
                          readOnly: true
                          type: integer
                        region:
                          description: '__Read-only__ The ID of the applicable Region associated with this Invoice Item.


                            `null` if there is no applicable Region.'
                          example: us-west
                          readOnly: true
                          type:
                          - string
                          - 'null'
                          x-linode-cli-display: 7
                        tax:
                          description: __Read-only__ The amount of tax levied on this Item in US Dollars.
                          example: 1.25
                          readOnly: true
                          type: number
                          x-linode-cli-display: 5
                        to:
                          description: __Read-only__ The date the Invoice Item ended, based on month.
                          example: '2018-01-31T11:59:59'
                          format: date-time
                          readOnly: true
                          type: string
                          x-linode-cli-display: 3
                        total:
                          description: __Read-only__ The price of this Item after taxes in US Dollars.
                          example: 21.45
                          readOnly: true
                          type: number
                          x-linode-cli-display: 6
                        type:
                          description: __Read-only__ The type of service, ether `hourly` or `misc`.
                          enum:
                          - hourly
                          - misc
                          example: hourly
                          readOnly: true
                          type: string
                        unit_price:
                          description: __Read-only__ The monthly service fee in US Dollars for this Item.
                          example: 5.05
                          readOnly: true
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/invoice-item.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/added-get-invoice-items-200.yaml
          description: A paginated list of InvoiceItem objects.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: List invoice items
      tags:
      - Invoices
      x-akamai:
        tabs:
        - syntax: linode-cli account invoice-items 123
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: invoice-items
      x-linode-grant: read_only
      x-linode-iam:
      - permissions:
        - list_invoice_items
components:
  securitySchemes:
    oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://login.linode.com/oauth/authorize
          scopes:
            account:read_only: Allows access to GET information about your account.
            account:read_write: Allows access to all endpoints related to your account.
            child_account:read_only: Allows access to GET information about deprecated parent/child operations.
            child_account:read_write: Allows access to deprecated parent/child operations.
            databases:read_only: Allows access to GET information about databases.
            databases:read_write: Allows access to all endpoints related to databases.
            domains:read_only: Allows access to GET Domains on your account.
            domains:read_write: Allows access to all Domain endpoints.
            events:read_only: Allows access to GET your Events.
            events:read_write: Allows access to all endpoints related to your Events.
            firewall:read_only: Allows access to GET information about your Firewalls.
            firewall:read_write: Allows access to all Firewall endpoints.
            images:read_only: Allows access to GET your Images.
            images:read_write: Allows access to all endpoints related to your Images.
            ips:read_only: Allows access to GET your ips.
            ips:read_write: Allows access to all endpoints related to your ips.
            linodes:read_only: Allows access to GET Linodes on your account.
