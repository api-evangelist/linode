                                      type: object
                                    description:
                                      description: Used to describe this rule. For display purposes only.
                                      example: An example firewall rule description.
                                      maxLength: 100
                                      minLength: 1
                                      type: string
                                      x-linode-cli-display: 7
                                    label:
                                      description: Used to identify this rule. For display purposes only.
                                      example: firewallrule123
                                      maxLength: 32
                                      minLength: 3
                                      type: string
                                      x-linode-cli-display: 1
                                    ports:
                                      description: "A string representing any ports affected by this rule:\n\n- May be a single port, a range of ports, or a comma-separated list of both.\n    - A single space is permitted after each comma.\n    - Ranges are inclusive, for example `22-24`. The end value must be greater than the start value.\n    - Ports must be between `1` and `65535` and can't contain leading zeros, for example, `80` is valid, `080` is not.\n- The string can contain up to 15 \"pieces\". A single port counts as one piece; a range counts as two pieces. for example, `22-24, 80, 443` contains four pieces.\n- Only allowed when protocol is `TCP`, `UDP`, or `SCTP`.\n    - Must be omitted for `ICMP` or `IPENCAP`.\n    - An empty string `\"\"` is only permitted for protocols that support ports.\n- If the `ports` field is omitted for a supported protocol, the rule affects all ports.\n- Only allowed when protocol is `TCP`, `UDP`, or `SCTP`, or their IANA numeric equivalents; `6`, `17`, `132`.\n    - Must be omitted for `ICMP`, `IPENCAP`, `ALL`, or any other numeric protocol.\n    - An empty string `\"\"` is only permitted for protocols that support ports."
                                      example: 22-24, 80, 443
                                      type:
