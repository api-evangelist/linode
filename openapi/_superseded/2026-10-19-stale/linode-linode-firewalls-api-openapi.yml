openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Linode firewalls API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to manage the firewalls applied to your Linodes.
  name: Linode firewalls
paths:
  /{apiVersion}/linode/instances/{linodeId}/firewalls:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the Linode.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path-177e235a.yaml
    x-akamai:
      file-path: paths/linode-firewalls.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/firewalls
    x-linode-cli-command: linodes
    get:
      description: 'View Firewall information for Firewalls assigned to this Linode.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `list_linode_firewalls`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_only`


        **CLI**


        ```shell

        linode-cli linodes firewalls-list 123

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-linode-firewalls
      operationId: get-linode-firewalls
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created: '2026-01-01T00:01:01'
                  entities:
                  - id: 123
                    label: my-linode
                    parent_entity:
                      id: 5000
                      label: linode5000
                      parent_entity: null
                      type: linode
                      url: /v4/linode/instances/5000
                    type: linode_interface
                    url: /v4/linode/instances/123
                  id: 123
                  label: firewall123
                  rules:
                    fingerprint: 997dd135
                    inbound:
                    - action: ACCEPT
                      addresses:
                        ipv4:
                        - 192.0.2.0/24
                        - 198.51.100.2/32
                        ipv6:
                        - 2001:DB8::/128
                      description: An example firewall rule description.
                      label: firewallrule123
                      ports: 22-24, 80, 443
                      protocol: TCP
                    inbound_policy: DROP
                    outbound:
                    - action: DROP
                      addresses:
                        ipv4:
                        - 198.51.100.0/24
                      description: Drop TCP traffic to untrusted range
                      label: drop-tcp
                      protocol: TCP
                    outbound_policy: ACCEPT
                    version: 1
                  status: enabled
                  tags:
                  - example tag
                  - another example
                  updated: '2026-01-02T00:01:01'
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: A resource that controls incoming and outgoing network traffic to a compute service. Only one enabled Firewall can be attached to a particular service at any given time. [Create a firewall device](https://techdocs.akamai.com/linode-api/reference/post-firewall-device) to assign a Firewall to a service. Currently, Firewalls can assigned to Linode compute instances and NodeBalancers.
                      properties:
                        created:
