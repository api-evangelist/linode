    put:
      description: 'Make changes to an existing MySQL Managed Database.


        - The database''s status can''t be `suspended`.


        - New values set in the `allow_list` overwrite existing values. To keep existing values, run the List MySQL Managed Databases operation, store the `allow_list` addresses from the response, and include them with any new addresses in this operation.


        - Updates to your `allow_list` may take a short time to complete, making this operation inappropriate for rapid successive updates.


        - Also allows resizing the database cluster to a larger one.


        - All Managed Databases include automatic updates, which apply security patches to the underlying operating system of the Managed MySQL Database. Use the `updates` object in this operation to modify the maintenance window for these updates.


        - If your database cluster is configured with a single node, downtime occurs during maintenance updates. Use the `updates` object to adjust the window to match a time that''s the least disruptive to your application and users. Also consider upgrading to a high availability plan to avoid any maintenance downtime.


        - Major upgrades are optional until the service reaches end of service, and can be done in place.


        - You can''t update `engine_config` advanced parameter settings for a suspended database. You''ll need to resume it first.


        - A successful request triggers a `database_update` event.


        - You can update an existing MySQL Managed Database to move it to a Virtual Private Cloud (VPC) using the `private_network` object in the request.


        > 📘

        >

        > Currently, VPC subnets associated with Managed Database instances don''t automatically block outbound connections outside the subnet. To limit network exposure, you should configure Cloud Firewall rules to explicitly deny outbound connections beyond the intended subnet. For more details on configuring rules, see the Cloud Firewall documentation.


        - This operation is asynchronous. The 200 response body with the `provisioning` and `updating` status may contain legacy values.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `database_admin`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `databases:read_write`


        **CLI**


        ```shell

        linode-cli databases mysql-update 123 \

        --label example-db \

        --allow_list 203.0.113.1 \

        --allow_list 192.0.1.0/24 \

        --type g6-standard-1 \

        --engine_config.binlog_retention_period 600 \

        --engine_config.mysql.connect_timeout 10 \

        --engine_config.mysql.default_time_zone +03:00 \

        --updates.frequency weekly \

        --updates.duration 3 \

        --updates.hour_of_day 12 \

        --updates.day_of_week 4 \

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/put-databases-mysql-instance
      operationId: put-databases-mysql-instance
      requestBody:
        content:
          application/json:
            example:
              allow_list:
              - 192.0.2.138/24
              - 192.0.2.228/24
              cluster_size: 2
              engine_config:
                binlog_retention_period: 600
                mysql:
                  connect_timeout: 10
                  default_time_zone: +03:00
                  group_concat_max_len: 1024
                  information_schema_stats_expiry: 86400
                  innodb_change_buffer_max_size: 30
                  innodb_flush_neighbors: 0
                  innodb_ft_min_token_size: 3
                  innodb_ft_server_stopword_table: db_name/table_name
                  innodb_lock_wait_timeout: 50
                  innodb_log_buffer_size: 16777216
                  innodb_online_alter_log_max_size: 134217728
                  innodb_read_io_threads: 10
                  innodb_rollback_on_timeout: true
                  innodb_thread_concurrency: 10
                  innodb_write_io_threads: 10
                  interactive_timeout: 3600
                  internal_tmp_mem_storage_engine: TempTable
                  max_allowed_packet: 67108864
                  max_heap_table_size: 16777216
                  net_buffer_length: 16384
                  net_read_timeout: 30
                  net_write_timeout: 30
                  sort_buffer_size: 262144
                  sql_mode: ANSI,TRADITIONAL
                  sql_require_primary_key: true
                  tmp_table_size: 16777216
                  wait_timeout: 28800
              label: example-db
              private_network:
                public_access: false
                subnet_id: 456
                vpc_id: 123
              type: g6-standard-1
              updates:
                day_of_week: 1
                duration: 4
                frequency: weekly
                hour_of_day: 0
              version: 8.0.26
            schema:
              additionalProperties: false
              description: Updated information for the Managed MySQL Database.
              properties:
                allow_list:
                  description: 'Controls access to the Managed Database.


                    - Individually included IP addresses or CIDR ranges can access the Managed Database while all other sources are blocked.


                    - A standalone value of `0.0.0.0/0` allows all IP addresses access to the Managed Database.


                    - An empty array (`[]`) blocks all public and private connections to the Managed Database.'
                  example:
                  - 203.0.113.1/32
                  - 192.0.1.0/24
                  items:
                    format: ipv4/prefix_length
                    pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                    type: string
                  minItems: 0
                  type: array
                cluster_size:
                  default: 1
                  description: 'The number of Linode instance nodes deployed to the Managed Database, from `1` to `3`. Consider these points when setting a `cluster_size`:


                    - Choose `3` nodes to create a high availability cluster that consists of one `primary` node and two `standby` nodes.


                    - A `2` node cluster is only available with a dedicated plan. It consists of one `primary` node and one `standby` node.'
                  enum:
                  - 1
                  - 2
                  - 3
                  example: '{{cluster_size}}'
                  type: integer
                  x-linode-cli-display: 5
                engine_config:
                  additionalProperties: false
                  description: 'Advanced parameters you can apply to a MySQL Managed Database, via our partner [Aiven''s specification](https://aiven.io/docs/products/mysql/reference/advanced-params). Only include the objects for parameters you want to set in your database. Omit objects for parameters you don''t want to define or change.


                    > 📘

                    >

                    > Aiven may offer additional parameters in their specification, or accept different values and ranges. Currently, only the parameters and settings covered here are supported for use in a MySQL Managed Database. You can also run the [List MySQL Managed Database advanced parameters](https://techdocs.akamai.com/linode-api/reference/get-databases-mysql-config) operation to see an up-to-date list.'
                  properties:
                    binlog_retention_period:
                      description: The minimum amount of time in seconds to keep `binlog` entries before deletion. This may be extended for services that require `binlog` entries for longer than the default, for example if using the MySQL Debezium Kafka connector.
                      example: 600
                      maximum: 9007199254740991
                      minimum: 600
                      type: integer
                    mysql:
                      additionalProperties: false
                      description: MySQL-specific advanced configuration parameters.
                      properties:
                        connect_timeout:
                          description: The number of seconds that the `mysqld` server waits for a connect packet before responding with bad handshake.
                          example: 10
                          maximum: 3600
                          minimum: 2
                          type: integer
                        default_time_zone:
                          description: Default server time zone as an offset from UTC (from -12:00 to +12:00), a time zone name, or `SYSTEM` to use the MySQL server default.
                          example: +03:00
                          maxLength: 100
                          minLength: 2
                          pattern: ^([-+][\d:]*|[\w/]*)$
                          type: string
                        group_concat_max_len:
                          description: The maximum permitted result length in bytes for the `GROUP_CONCAT()` function.
                          example: 1024
                          maximum: 18446744073709552000
                          minimum: 4
                          type: integer
                        information_schema_stats_expiry:
                          description: The time, in seconds, before cached statistics expire.
                          example: 86400
                          maximum: 31536000
                          minimum: 900
                          type: integer
                        innodb_change_buffer_max_size:
                          default: 25
                          description: Maximum size for the InnoDB change buffer, as a percentage of the total size of the buffer pool.
                          example: 30
                          maximum: 50
                          minimum: 0
                          type: integer
                        innodb_flush_neighbors:
                          default: 1
                          description: 'Specifies whether flushing a page from the InnoDB buffer pool also flushes other dirty pages in the same extent: `0` - dirty pages in the same extent are not flushed, `1` - flush contiguous dirty pages in the same extent, `2` - flush dirty pages in the same extent.'
                          example: 0
                          maximum: 2
                          minimum: 0
                          type: integer
                        innodb_ft_min_token_size:
                          description: Minimum length of words that are stored in an InnoDB `-1FULLTEXT` index. Changing this parameter will lead to a restart of the MySQL service.
                          example: 3
                          maximum: 16
                          minimum: 0
                          type: integer
                        innodb_ft_server_stopword_table:
                          description: This option is used to specify your own InnoDB `FULLTEXT` index `stopword` list for all InnoDB tables. Set to `null` for no value.
                          example: db_name/table_name
                          maxLength: 1024
                          pattern: ^.+/.+$
                          type:
                          - string
                          - 'null'
