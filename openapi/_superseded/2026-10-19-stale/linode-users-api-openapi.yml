  /{apiVersion}/account/users/{username}:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The username to look up.
      example: '{{username}}'
      in: path
      name: username
      required: true
      schema:
        example: jsmith
        type: string
      x-akamai:
        file-path: parameters/username-path.yaml
    x-akamai:
      file-path: paths/username.yaml
      path-info: /{apiVersion}/account/users/{username}
    x-linode-cli-command: users
    get:
      description: 'Returns information about a single user on your account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_user`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli users view example_user

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-user
      operationId: get-user
      responses:
        '200':
          content:
            application/json:
              example:
                email: mrossi@linode.com
                last_login:
                  login_datetime: '2021-09-10T15:00:00'
                  status: successful
                password_created: null
                restricted: false
                ssh_keys:
                - id
                tfa_enabled: true
                tfa_enforced: false
