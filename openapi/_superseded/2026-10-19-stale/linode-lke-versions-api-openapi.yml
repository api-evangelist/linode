        ```shell

        linode-cli lke tiered-versions-list standard

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-lke-tiers-versions
      operationId: get-lke-tiers-versions
      responses:
        '200':
          content:
            application/json:
              examples:
                enterprise:
                  summary: LKE versions for enterprise tier
                  value:
                    data:
                    - id: v1.31.1+lke4
                      tier: enterprise
                    page: 1
                    pages: 1
                    results: 1
                standard:
                  summary: LKE versions for standard tier
                  value:
                    data:
                    - id: '1.33'
                      tier: standard
                    - id: '1.32'
                      tier: standard
                    - id: '1.31'
                      tier: standard
                    page: 1
                    pages: 1
                    results: 3
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: LKE versions for the requested tier.
                    items:
                      additionalProperties: false
                      description: LKE version for a tier.
                      properties:
                        id:
                          description: A Kubernetes version number available for deployment to a Kubernetes cluster in the format of &lt;major&gt;.&lt;minor&gt;, and the latest supported patch version.
                          example: '1.35'
                          minLength: 1
                          type: string
                        tier:
                          description: An LKE tier, either `standard` or `enterprise`. To learn about the features of standard LKE and LKE Enterprise, see [Compare LKE and LKE Enterprise](https://techdocs.akamai.com/cloud-computing/docs/linode-kubernetes-engine#compare-lke-and-lke-enterprise).
                          enum:
                          - standard
                          - enterprise
                          example: standard
                          type: string
                      required:
                      - id
                      - tier
                      type: object
                      x-akamai:
                        file-path: schemas/lke-tiers-version.yaml
                    minItems: 1
                    type: array
                    uniqueItems: true
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-lke-tiers-versions-200.yaml
          description: Returns a list of LKE Kubernetes versions available for deployment to a Kubernetes cluster (any tier).
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
