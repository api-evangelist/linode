  title: 'Akamai: Linode LKE versions API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: View the Kubernetes versions available for deployment on your LKE clusters.
  name: LKE versions
paths:
  /{apiVersion}/lke/tiers/{tier}/versions:
    parameters:
    - description: __Enum__ Call the `v4beta` URL for operations still only in beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4beta
        example: v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-v4beta-path.yaml
    - description: __Enum__ The LKE tier to use.
      example: '{{tier}}'
      in: path
      name: tier
      required: true
      schema:
        enum:
        - standard
        - enterprise
        example: standard
        type: string
      x-akamai:
        file-path: parameters/lke-tier-path.yaml
    x-akamai:
      file-path: paths/lke-tiers-versions.yaml
      path-info: /{apiVersion}/lke/tiers/{tier}/versions
    x-linode-cli-command: lke
    get:
      description: 'List LKE Kubernetes versions available for deployment to a Kubernetes cluster (any tier).


