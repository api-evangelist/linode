                  example: '{{label}}'
                  maxLength: 32
                  minLength: 3
                  pattern: ^[a-zA-Z]((?!--|__|\.\.)[a-zA-Z0-9-_.])+$
                  type: string
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 2
                  x-linode-filterable: true
                status:
                  description: "The status to be applied to this Firewall.\n\n - When a Firewall is first created its status is `enabled`.\n - An assigned default firewall can't be disabled.\n - Run the [Delete a firewall](https://techdocs.akamai.com/linode-api/reference/delete-firewall) operation to delete a Firewall."
                  enum:
                  - enabled
                  - disabled
