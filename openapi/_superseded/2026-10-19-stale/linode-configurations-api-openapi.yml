openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Configurations API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- name: Configurations
paths:
  /{apiVersion}/nodebalancers/{nodeBalancerId}/configs:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the NodeBalancer.
      example: '{{nodeBalancerId}}'
      in: path
      name: nodeBalancerId
      required: true
      schema:
        example: 12345
        type: integer
      x-akamai:
        file-path: parameters/node-balancer-id.yaml
    x-akamai:
      file-path: paths/node-balancer-configs.yaml
      path-info: /{apiVersion}/nodebalancers/{nodeBalancerId}/configs
    x-linode-cli-command: nodebalancers
    post:
      description: 'Creates a NodeBalancer configuration, which allows the NodeBalancer to accept traffic on a new port. You will need to add NodeBalancer nodes to the new configuration before it can actually serve requests.


        > 🚧

        >

        > You can configure UDP on the same NodeBalancer that also uses TCP, HTTP, or HTTPS, but only when managing it through the API. If UDP is configured and you make changes to the TCP, HTTP or HTTPS settings in Cloud Manager, the existing UDP configuration will be overwritten. This is because Cloud Manager doesn''t currently support UDP.


        After creating a NodeBalancer configuration, account administrators can run the Create a resource lock operation to prevent accidentally deleting configurations.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_nodebalancer_config`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `nodebalancers:read_write`


        **CLI**


        *HTTPS*


        ```shell

        linode-cli nodebalancers config-create 12345 \

        --port 443 \

        --protocol https \

        --algorithm roundrobin \

        --stickiness http_cookie \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --check_passive true \

        --proxy_protocol "none" \

        --ssl_cert "-----BEGIN CERTIFICATE-----

        CERTIFICATE_INFORMATION

        -----END CERTIFICATE-----" \

        --ssl_key "REDACTED_PRIVATE_KEY_EXAMPLE" \

        --cipher_suite recommended

        ```


        *UDP*


        ```shell

        linode-cli nodebalancers config-create 12345 \

        --port 80 \

        --protocol udp \

        --algorithm ring_hash \

        --stickiness session \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --udp_check_port 80

        ```


        *TCP*


        ```shell

        linode-cli nodebalancers config-create 12345 \

        --port 80 \

        --protocol tcp \

        --algorithm roundrobin \

        --stickiness none \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --proxy_protocol "v2"

        ```


        *HTTP*


        ```shell

        linode-cli nodebalancers config-create 12345 \

        --port 440 \

        --protocol http \

        --algorithm roundrobin \

        --stickiness http_cookie \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-node-balancer-config
      operationId: post-node-balancer-config
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - description: NodeBalancer `config` options for each protocol.
                oneOf:
                - additionalProperties: false
                  description: __Beta__ A NodeBalancer configuration defines the protocol and settings for a specific port on the NodeBalancer. These fields apply to UDP configurations.
                  properties:
                    algorithm:
                      default: roundrobin
                      description: The algorithm this UDP NodeBalancer uses to route traffic to backends.
                      enum:
                      - roundrobin
                      - leastconn
                      - ring_hash
                      example: leastconn
                      type: string
                      x-linode-cli-display: 4
                    check:
                      default: none
                      description: 'The type of check to perform against backends to ensure they are serving requests. This determines if backends are up or down.


                        - If `none`, no check is performed.

                        - `connection` requires only a connection to the backend to succeed.

                        - `http` and `http_body` rely on the backend serving HTTP, and that the response returned matches what is expected.'
                      enum:
                      - none
                      - connection
                      - http
                      - http_body
                      example: http_body
                      type: string
                    check_attempts:
                      default: 3
                      description: How many times to attempt a check before considering a backend to be down.
                      example: 3
                      maximum: 30
                      minimum: 1
                      type: integer
                    check_body:
                      description: This value must be present in the response body of the check in order for it to pass. If this value isn't present in the response body of a check request, the backend is considered to be down.
                      example: it works
                      type: string
                    check_interval:
                      default: 5
                      description: 'How often, in seconds, to check that backends are up and serving requests.


                        Must be greater than `check_timeout`.'
                      example: 90
                      maximum: 3600
                      minimum: 2
                      type: integer
                    check_passive:
                      description: __Read-only__ Must be `false` for UDP.
                      example: false
                      readOnly: true
                      type: boolean
                      x-linode-cli-display: 8
                    check_path:
                      description: The URL path to check on each backend. If the backend does not respond to this request, it's considered to be down.
                      example: /test
                      pattern: ^[a-zA-Z0-9\/\-%?&=.]*$
                      type: string
                    check_timeout:
                      default: 30
                      description: 'How long, in seconds, to wait for a check attempt before considering it failed.


                        Must be less than `check_interval`.'
                      example: 10
                      maximum: 30
                      minimum: 1
                      type: integer
                    cipher_suite:
                      description: __Read-only__ Not applicable for UDP configs.
                      example: none
                      readOnly: true
                      type: string
                      x-linode-cli-color:
                        default_: white
                        legacy: red
                      x-linode-cli-display: 7
                    id:
                      description: __Read-only__ This config's unique ID.
                      example: 7000
                      readOnly: true
                      type: integer
                      x-linode-cli-display: 1
                    nodebalancer_id:
                      description: __Read-only__ The ID for the NodeBalancer this config belongs to.
                      example: 12345
                      readOnly: true
                      type: integer
                    nodes:
                      description: The NodeBalancer nodes that serve this configuration.
                      items:
                        additionalProperties: false
                        description: __Beta__ A NodeBalancer node represents a single backend serving requests for a single port of a NodeBalancer. Nodes are tied to individual NodeBalancer configurations and route traffic over their private IPv4 address, IPv6 address, or VPC IPv4 address. If the same Linode is serving traffic for more than one port on the same NodeBalancer, one NodeBalancer node is required for each config (port) it should serve requests on.  For example, if you have four backends, and each should respond to both UDP and HTTPS requests, you will need two NodeBalancer configs (port 80 and port 443) and four backends each, one for each of the Linodes serving requests for that port.
                        properties:
                          address:
                            description: "Backend nodes can be Linodes and Linodes within a VPC. The following IP types are supported:\n  - For non-VPC backend nodes, the private IPv4 address and port where this backend can be reached.\n  - For non-VPC backend nodes, the public IPv6 address and port where this backend can be reached.\n  - For backend nodes within a VPC, the IPv4 address and port where this backend can be reached."
                            example:
                            - 192.168.210.120:443
                            - 10.100.5.5:80
                            - '[2300:5800::f03c:93ff:fe6e:1264]:8080'
                            format: ip
                            type: string
                            x-linode-cli-display: 3
                          config_id:
                            description: __Read-only__ The NodeBalancer Config ID that this Node belongs to.
                            example: 4567
                            readOnly: true
                            type: integer
                          id:
                            description: __Read-only__ This node's unique ID.
                            example: 54321
                            readOnly: true
                            type: integer
                            x-linode-cli-display: 1
                          label:
                            description: The label for this node.  This is for display purposes only.
                            example: node54321
                            maxLength: 32
                            minLength: 3
                            pattern: '[a-zA-Z0-9-_.]{3,32}'
                            type: string
                            x-linode-cli-display: 2
                          mode:
                            description: __Read-only__ The mode this NodeBalancer should use when sending traffic to this backend. For backend nodes with a UDP config, the `mode` doesn't apply, so the value is `none`.
                            enum:
                            - none
                            example: none
                            readOnly: true
                            type: string
                            x-linode-cli-display: 6
                          nodebalancer_id:
                            description: __Read-only__ The NodeBalancer ID that this Node belongs to.
                            example: 12345
                            readOnly: true
                            type: integer
                          status:
                            description: __Read-only__ The current status of this node, based on the configured checks of its NodeBalancer config.
                            enum:
                            - unknown
                            - UP
                            - DOWN
                            example: UP
                            readOnly: true
                            type: string
                            x-linode-cli-color:
                              DOWN: red
                              UP: green
                              default_: white
                              unknown: yellow
                            x-linode-cli-display: 4
                          subnet_id:
                            description: Required for VPC backend nodes only. The VPC's subnet. To display information about your VPCs and their subnets, run the [List VPCs](https://techdocs.akamai.com/linode-api/reference/get-vpcs) operation.
                            example: 1
                            type: integer
                            x-linode-cli-display: 8
                          weight:
                            description: Used when picking a backend to serve a request and is not pinned to a single backend yet. Nodes with a higher weight will receive more traffic.
                            example: 50
                            maximum: 255
                            minimum: 1
                            type: integer
                            x-linode-cli-display: 5
                        title: UDP config
                        x-akamai:
                          file-path: schemas/node-balancer-node-udp.yaml
                          status: BETA
                      type: array
                    nodes_status:
                      additionalProperties: false
                      description: __Read-only__ Describes the health of the backends for this port. This data updates periodically as checks are performed against backends.
                      properties:
                        down:
                          description: __Read-only__ The number of backends considered to be `DOWN` and unhealthy.  These are not in rotation, and not serving requests.
                          example: 0
