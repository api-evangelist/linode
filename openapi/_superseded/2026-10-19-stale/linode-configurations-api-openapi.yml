    put:
      description: 'Updates the configuration for a single port on a NodeBalancer.


        > 🚧

        >

        > You can configure UDP on the same NodeBalancer that also uses TCP, HTTP, or HTTPS, but only when managing it through the API. If UDP is configured and you make changes to the TCP, HTTP or HTTPS settings in Cloud Manager, the existing UDP configuration will be overwritten. This is because Cloud Manager doesn''t currently support UDP.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `update_nodebalancer_config`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `nodebalancers:read_write`


        **CLI**


        *HTTPS*


        ```shell

        linode-cli nodebalancers config-update \

        12345 4567 \

        --port 443 \

        --protocol https \

        --algorithm roundrobin \

        --stickiness http_cookie \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --check_passive true \

        --proxy_protocol "none" \

        --ssl_cert "-----BEGIN CERTIFICATE-----

        CERTIFICATE_INFORMATION

        -----END CERTIFICATE-----" \

        --ssl_key "REDACTED_PRIVATE_KEY_EXAMPLE" \

        --cipher_suite recommended

        ```


        *UDP*


        ```shell

        linode-cli nodebalancers config-update \

        12345 4567 \

        --port 80 \

        --protocol udp \

        --algorithm ring_hash \

        --stickiness session \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --udp_check_port 80

        ```


        *TCP*


        ```shell

        linode-cli nodebalancers config-update \

        12345 4567 \

        --port 80 \

        --protocol tcp \

        --algorithm roundrobin \

        --stickiness none \

        --stickiness http_cookie \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works" \

        --proxy_protocol "v2"

        ```


        *HTTP*


        ```shell

        linode-cli nodebalancers config-update \

        12345 4567 \

        --port 440 \

        --protocol http \

        --algorithm roundrobin \

        --stickiness http_cookie \

        --check http_body \

        --check_interval 90 \

        --check_timeout 10 \

        --check_attempts 3 \

        --check_path "/test" \

        --check_body "it works"

        ```


        Learn more'
