                                deprecated: true
                                description: '__Deprecated__ For backwards compatibility, this is included to identify the legacy cluster equivalent of the `region` where this key can be used. The key grants access to each specified `bucket_name`, based on the `permissions` set.


                                  > 📘

                                  >

                                  > Use of clusters in a limited access key has been deprecated.'
                                example: us-west-1
                                type: string
