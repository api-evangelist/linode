                                example: us-west
                                type: string
                              s3_endpoint:
                                description: The S3-compatible hostname you can use to access the Object Storage buckets in this region.
                                example: us-west-00.linodeobjects.com
                                type: string
                            type: object
                          type: array
                        secret_key:
                          description: 'This Object Storage key''s secret key. Used as a password to validate this key when making requests.


                            > 📘

                            >

                            > This value is listed as `[REDACTED]` for this operation, to protect it. It''s only revealed in a response after [creating](https://techdocs.akamai.com/linode-api/reference/post-object-storage-keys) a key.'
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/object-storage-key.yaml
                    type: array
                  page:
                    description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  pages:
                    description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                    example: 1
                    readOnly: true
                    type: integer
                  results:
                    description: __Read-only__ The total number of results.
                    example: 1
                    readOnly: true
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/get-object-storage-keys-200.yaml
          description: A paginated list of Object Storage Keys.
        default:
