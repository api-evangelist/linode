                  id: 123
                  label: my-key
                  limited: true
                  regions:
                  - endpoint_type: E1
                    id: us-west
                    s3_endpoint: us-west-00.linodeobjects.com
                  secret_key: '[REDACTED]'
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: Object Storage access keys added to your account.
                    items:
                      additionalProperties: false
                      description: A key used to validate requests to an S3 API.
                      properties:
