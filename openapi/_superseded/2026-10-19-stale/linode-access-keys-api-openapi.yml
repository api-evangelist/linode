                                - E2
                                - E3
                                example: E1
                                type: string
                              id:
                                description: 'Identifies each region where you can use the Object Storage key.


                                  - **For an unlimited key**. Each `id` represents an individual region you set in the `regions` array, when you set up the key. See [Create an unlimited access key](https://techdocs.akamai.com/linode-api/reference/post-object-storage-keys) for more information.


