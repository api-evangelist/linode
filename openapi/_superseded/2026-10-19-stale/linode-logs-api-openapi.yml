                          description: Settings used for an Object Storage-based destination for a stream. You need an existing Object Storage bucket, configured to use Object Lock. See [Configure audit log delivery](https://techdocs.akamai.com/linode-api/reference/config-audit-log-delivery) for complete details.
                          properties:
                            access_key_id:
                              description: The unique identifier assigned to the Object Storage key required for authentication to the bucket. Run the [List Object Storage keys](https://techdocs.akamai.com/linode-api/reference/get-object-storage-keys) operation and store the `id` for the applicable key.
                              example: 123
                              type: string
                            bucket_name:
                              description: The name of the Object Storage bucket. Run the [List Object Storage buckets](https://techdocs.akamai.com/linode-api/reference/get-object-storage-buckets) operation and store the `label` for the target bucket.
                              example: primary-bucket
                              type: string
                            host:
                              description: The hostname where the Object Storage bucket can be accessed. Run the [List Object Storage buckets](https://techdocs.akamai.com/linode-api/reference/get-object-storage-buckets) operation and store the `hostname` for the target bucket.
                              example: primary-bucket-1.us-east-12.linodeobjects.com
                              type: string
                            path:
