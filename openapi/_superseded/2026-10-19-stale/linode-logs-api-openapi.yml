                                      example: primary-bucket-1.us-east-12.linodeobjects.com
                                      type: string
                                    path:
                                      description: The specific path in an Object Storage bucket where audit logs files are uploaded.
                                      example: audit-logs
                                      type: string
                                  required:
                                  - host
                                  - bucket_name
                                  - access_key_id
                                  type: object
                                  x-akamai:
                                    file-path: schemas/aclp-stream-destination-obj.yaml
                                id:
                                  description: The unique identifier for the destination.
                                  example: 12345
                                  type: integer
                                label:
                                  description: The name of the destination object. Used for display purposes.
                                  example: OBJ_logs_destination
                                  type: string
                                type:
                                  description: The type of destination for logs data sync. Currently, only `akamai_object_storage` is supported for use. This lets you use Akamai Object Storage as your destination.
