                    example: inactive
                    type: string
                  type:
                    description: __Read-only__ The type of stream. This can be `audit_logs` for logs consisting of all of the control plane operations for the services in your Linodes, or `lke_audit_logs` for log data for your Linode Kubernetes Engine (LKE) enterprise clusters.
                    enum:
                    - audit_logs
                    - lke_audit_logs
                    example: audit_logs
                    readOnly: true
                    type: string
                  updated:
                    description: __Read-only__ When the stream was last updated. This is the same as `created` if the stream hasn't been updated.
                    example: '2025-03-20T01:41:09'
                    format: date-time
                    readOnly: true
                    type: string
                  updated_by:
                    description: __Read-only__ The name of the user on your account that last updated the stream. If it hasn't been updated, this value is the same as `created_by`.
                    example: Jane Q. Linode
                    readOnly: true
                    type: string
                  version:
                    description: __Read-only__ Identifies the version of the stream.
                    example: 1
                    readOnly: true
                    type: integer
                required:
                - label
                - type
                - destinations
                type: object
                x-akamai:
                  file-path: schemas/aclp-stream.yaml
