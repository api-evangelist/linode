                          example: akamai_object_storage
                          type: string
                      type: object
                    type: array
                  details:
                    additionalProperties: false
                    description: Additional details for the stream, based on the selected `type`. Returned as an empty object if `type` is set to `audit_logs`.
                    properties:
                      cluster_ids:
                        description: 'The unique identifiers for each LKE enterprise cluster. Run the [List Kubernetes clusters](https://techdocs.akamai.com/linode-api/reference/get-lke-clusters) operation and store the `id` values for all applicable clusters.


                          > 📘

                          >

                          > If `is_auto_add_all_clusters_enabled` is set to `true`, you can''t call out individual `cluster_ids`.'
                        example:
                        - 1234
                        - 5678
                        items:
                          type: integer
                        type: array
                      is_auto_add_all_clusters_enabled:
                        default: false
                        description: Only applies to streams with a `type` of `lke_audit_logs`. When set to `true`, newly added LKE enterprise clusters on your account will be included in the logs stream. If `false`, only existing LKE enterprise clusters are included in the stream.
                        example: false
                        type: boolean
                    type: object
                  id:
                    description: __Read-only__ The unique identifier assigned to the stream.
                    example: 12345
                    readOnly: true
                    type: integer
                  label:
                    description: The name of the stream. This is used for display purposes in Akamai Cloud Manager.
                    example: Linode_services
                    type: string
                  status:
                    default: active
                    description: The availability status of the stream. This can be `active` or `inactive`.
                    enum:
                    - active
