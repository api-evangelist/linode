openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Logs API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Akamai Cloud Pulse lets you capture log data across multiple Akamai Cloud services and deliver it to the destination of your choice. These logs can help you improve operational efficiency, enhance security, ensure compliance, and reduce the overhead of managing your Akamai Cloud services.
  name: Logs
paths:
  /{apiVersion}/monitor/streams:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/aclp-streams.yaml
      path-info: /{apiVersion}/monitor/streams
    x-linode-cli-command: streams
    post:
      description: 'Create a new stream to track logs for an Akamai Cloud Computing service. Consider these points before creating a stream:


        - You first need to create the destination where you want to store log data.


        - By default, you can only set up a single stream for each audit log type. Talk to your account team if you need additional streams.


        - This operation can only be accessed by account users with _unrestricted_ access. Talk to your local account administrator about access management.


        > 🚧

        >

        > By using this service, you acknowledge your obligations under the United States Department of Justice Bulk Sensitive Data Transaction Rule ("BSD Rule"). You also agree that you will not use the service to transfer, onward transfer, or otherwise make accessible any United States government-related data or bulk United States sensitive personal data to countries of concern or a covered person, as each of those terms and concepts are defined in the BSD Rule. Anyone using the service is solely responsible for compliance with the BSD Rule.


        > 👍 There''s a tutorial

        >

        > We offer an example API workflow you can follow to set up a stream and its destination.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `monitor:read_write`


        **CLI**


        ```shell

        linode-cli streams create \

        --label Logs stream for Managed Databases \

        --type audit_logs \

        --destinations 12345 \

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-stream
      operationId: post-stream
      requestBody:
        content:
          application/json:
            example:
              destinations:
              - 1234
              label: Linode_services
              status: active
              type: audit_logs
            schema:
              additionalProperties: false
              properties:
                destinations:
                  description: 'The unique identifier for the sync point that will receive logs data. Run the [List destinations](https://techdocs.akamai.com/linode-api/reference/get-destinations) operation and store the `id` value for the applicable destination.


                    > 📘

                    >

                    > Currently, you can only specify a single destination for a stream.'
                  items:
                    example:
                    - 1234
                    type: integer
                  maxItems: 1
                  type: array
                details:
                  additionalProperties: false
                  description: 'Additional details for the stream, based on the selected `type`.


                    > 📘

                    >

                    > Currently, this only applies to streams with a `type` of `lke_audit_logs`. Leave this object out of requests that use a `type` of `audit_logs`.'
                  properties:
                    cluster_ids:
                      description: 'The unique identifiers for each LKE enterprise cluster. Run the [List Kubernetes clusters](https://techdocs.akamai.com/linode-api/reference/get-lke-clusters) operation and store the `id` values for all applicable clusters.


                        > 📘

                        >

                        > If `is_auto_add_all_clusters_enabled` is set to `true`, you can''t call out individual `cluster_ids`.'
                      example:
                      - 1234
                      - 5678
                      items:
                        type: integer
                      type: array
                    is_auto_add_all_clusters_enabled:
                      default: false
                      description: When set to `true`, newly added LKE enterprise clusters on your account will be included in the stream. If `false`, only existing LKE enterprise clusters are included.
                      example: false
                      type: boolean
                  type: object
                label:
                  description: The name of the stream. This is used for display purposes in Akamai Cloud Manager.
                  example: '{{label}}'
                  type: string
                status:
                  default: active
                  description: The availability status of the stream. This can be `active` or `inactive`.
                  enum:
                  - active
                  - inactive
                  example: '{{status}}'
                  type: string
                type:
                  description: The type of stream. This can be `audit_logs` for logs consisting of all of the control plane operations for the services in your Linodes, or `lke_audit_logs` for log data for your Linode Kubernetes Engine (LKE) enterprise clusters.
                  enum:
                  - audit_logs
                  - lke_audit_logs
                  example: '{{type}}'
                  type: string
              required:
              - label
              - type
              - destinations
              type: object
              x-akamai:
                file-path: schemas/aclp-stream-create.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                created: '2025-03-20T01:41:09'
                created_by: John Q. Linode
                destinations:
                - details:
                    access_key_id: 123
                    bucket_name: primary-bucket
                    host: primary-bucket-1.us-iad-12.linodeobjects.com
                    path: audit-logs
                  id: 12345
                  label: OBJ_logs_destination
                  type: akamai_object_storage
                id: 12345
                label: AuditLog-config
                status: active
                type: audit_logs
                updated: '2025-03-20T01:41:09'
                updated_by: Jane Q. Linode
                version: 1
              schema:
                additionalProperties: false
                properties:
                  created:
                    description: __Read-only__ When the stream was created.
                    example: '2025-03-20T01:41:09'
                    format: date-time
                    readOnly: true
                    type: string
                  created_by:
                    description: __Read-only__ The name of the user on your account that created the stream.
                    example: John Q. Linode
                    readOnly: true
                    type: string
