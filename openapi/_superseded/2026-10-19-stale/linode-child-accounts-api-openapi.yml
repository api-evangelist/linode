    x-linode-cli-command: child-account
    post:
      deprecated: true
      description: '__Deprecated__ Creates a short-lived bearer token for a parent user on a specific child account.


        > 🚧 Parent and child accounts feature in Identity and Access

        >

        > With the introduction of Identity and Access, the parent and child accounts feature has changed. This operation is no longer available. Use the Create a delegate user token operation instead. To learn more about the changes to the parent and child accounts feature, see Changes for migrated partners.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `child_account:read_write`


        **CLI**


        ```shell

        linode-cli child-account create A1BC2DEF-34GH-567I-J890KLMN12O34P56

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-child-account-token
      operationId: post-child-account-token
      responses:
