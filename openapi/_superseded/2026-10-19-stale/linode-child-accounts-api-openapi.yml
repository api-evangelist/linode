          content:
            application/json:
              example:
                created: '2024-05-01T00:01:01'
                expiry: '2024-05-01T00:16:01'
                id: 918
                label: parent1_1234_2024-05-01T00:01:01
                scopes: '*'
                token: abcdefghijklmnop
              schema:
                additionalProperties: false
                description: The token generated manually for a child account so its proxy user can access the API and CLI without going through an OAuth login.
                properties:
                  created:
                    description: __Filterable__, __Read-only__ The date and time this token was created.
                    example: '2024-05-01T00:01:01'
                    format: date-time
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  expiry:
                    description: __Read-only__ When this token expires, which is 15 minutes from the time of creation. Proxy user tokens can't be renewed. After this time, Akamai revokes the token and you need to generate a new one.
                    example: '2024-05-01T00:16:01'
                    format: date-time
                    readOnly: true
                    type: string
                    x-linode-cli-display: 6
                  id:
                    description: __Read-only__ The proxy user token's unique ID, which can be used to revoke it.
                    example: 918
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  label:
                    description: __Filterable__ The name of the token. The API automatically sets this to `<username>_<uid>_<time>`. It's composed of the `username` for your parent account user, the unique `uid` Akamai assigned to identify your user, and the `time` the API generated the token. This is for display purposes only, but you can use it to help track how you're using each proxy user token.
                    example: parent1_1234_2024-05-01T00:01:01
                    maxLength: 100
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  scopes:
                    description: __Read-only__ The scopes this token was created with. Defaults to `*`. Proxy user tokens automatically inherit all the permissions of the proxy user.
                    example: '*'
                    format: oauth-scopes
                    readOnly: true
                    type: string
                    x-linode-cli-display: 3
                  token:
                    description: __Read-only__ The proxy user token that can be used to access the API and CLI. After you [create](https://techdocs.akamai.com/linode-api/reference/post-child-account-token) a token, you can see the full token in the response. All other operations that contain this token only show the first 16 characters in their response.
                    example: abcdefghijklmnop
                    readOnly: true
                    type: string
                    x-linode-cli-display: 5
