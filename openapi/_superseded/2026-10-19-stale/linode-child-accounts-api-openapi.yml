openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Child accounts API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Child accounts let you, as an Akamai partner (a parent account holder), switch between and manage your end customers' accounts (child accounts). Talk to your account team about setting up a parent-child account relationship. Once in place, you can use these operations to review your child accounts and create tokens for your use as a parent, on a child account.
  name: Child accounts
paths:
  /{apiVersion}/account/child-accounts:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/child-accounts.yaml
      path-info: /{apiVersion}/account/child-accounts
    x-linode-cli-command: child-account
    get:
      deprecated: true
      description: '__Deprecated__ Returns a paginated list of child accounts you''re part of the account delegations for.


        > 🚧 Parent and child accounts feature in Identity and Access

        >

        > With the introduction of Identity and Access, the parent and child accounts feature has changed. This operation is now deprecated, so use the List child accounts operation instead. To learn more about the changes, see Changes to the parent and child accounts feature for migrated partners.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `child_account:read_only`


        **CLI**


        ```shell

        linode-cli child-account list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-child-accounts
      operationId: get-child-accounts
      parameters:
      - description: The page of a collection to return.
        example: '{{page}}'
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 6
          minimum: 1
          type: integer
        x-akamai:
          file-path: parameters/page-offset.yaml
      - description: The number of items to return per page.
        example: '{{page_size}}'
        in: query
        name: page_size
        schema:
          default: 100
          example: 50
          maximum: 500
          minimum: 25
          type: integer
        x-akamai:
          file-path: parameters/page-size.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - active_since: '2018-01-01T00:01:01'
                  address_1: 123 Main Street
                  address_2: Suite A
                  balance: 200
                  balance_uninvoiced: 145
                  billing_source: external
                  capabilities:
                  - Linodes
                  - NodeBalancers
                  - Block Storage
                  - Object Storage
                  city: San Diego
                  company: Acme
                  country: US
                  credit_card:
                    expiry: 11/2024
                    last_four: 1111
                  email: asingh@linode.com
                  euuid: A1BC2DEF-34GH-567I-J890KLMN12O34P56
                  first_name: John
                  last_name: Smith
                  phone: 858-555-1212
                  state: CA
                  tax_id: ATU99999999
                  zip: 92111-1234
                page: 1
                pages: 1
                results: 1
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      description: Child account object.
                      properties:
                        active_since:
                          description: __Read-only__ The activation date and time for the child account.
                          example: '2018-01-01T00:01:01'
                          format: date-time
                          readOnly: true
                          type: string
                        address_1:
                          description: __Filterable__ First line of this child account's billing address.
                          example: 123 Main Street
                          maxLength: 64
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        address_2:
                          description: __Filterable__ Second line of this child account's billing address, if applicable.
                          example: Suite A
                          maxLength: 64
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        balance:
                          description: __Read-only__ This child account's balance, in US dollars.
                          example: 200
                          readOnly: true
                          type: number
                          x-linode-cli-display: 4
                        balance_uninvoiced:
                          description: __Read-only__ This child account's current estimated invoice in US dollars. This is not your final invoice balance. Transfer charges are not included in the estimate.
                          example: 145
                          readOnly: true
                          type: number
                          x-linode-cli-display: 4
                        billing_source:
                          description: __Read-only__ The source of service charges for this account, as determined by its relationship with Akamai. The API returns a value of `external` to describe a child account in a parent-child account environment.
                          enum:
                          - external
                          example: external
                          readOnly: true
                          type: string
                        capabilities:
                          description: __Read-only__ A list of the capabilities the child account supports.
                          example:
                          - Linodes
                          - NodeBalancers
                          - Block Storage
                          - Object Storage
                          items:
                            type: string
                          readOnly: true
                          type: array
                        city:
                          description: __Filterable__ The city for this child account's billing address.
                          example: San Diego
                          maxLength: 24
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        company:
                          description: '__Filterable__ The company name for the owner of this child account. It can''t include any of these characters: `<` `>` `(` `)` `"` `=`. You can''t change this value yourself. We use it to create the proxy users that a parent account uses to access a child account. Talk to your account team if you need to change this value.'
                          example: Acme
                          maxLength: 128
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        country:
                          description: __Filterable__ The two-letter ISO 3166 country code for this child account's billing address.
                          example: US
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        credit_card:
                          additionalProperties: false
                          description: __Read-only__ Information for the credit card you've assigned to this child account.
                          properties:
                            expiry:
                              description: The expiration month and year of the credit card.
                              example: 11/2024
                              type: string
                            last_four:
                              description: The last four digits of the credit card.
                              example: 1111
                              type: string
                          readOnly: true
                          type: object
                        email:
                          description: __Filterable__ The email address of the owner of this child account.
                          example: john.smith@linode.com
                          maxLength: 128
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 3
                          x-linode-filterable: true
                        euuid:
                          description: __Read-only__ An external, unique identifier that Akamai assigned to the child account.
                          example: A1BC2DEF-34GH-567I-J890KLMN12O34P56
                          readOnly: true
                          type: string
                        first_name:
                          description: '__Filterable__ The first name of the owner of this child account. It can''t include any of these characters: `<` `>` `(` `)` `"` `=`.'
                          example: John
                          maxLength: 50
                          type: string
                          x-akamai:
