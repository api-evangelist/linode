                        last_name:
                          description: '__Filterable__ The last name of the owner of this child account. It can''t include any of these characters: `<` `>` `(` `)` `"` `=`.'
                          example: Smith
                          maxLength: 50
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-cli-display: 2
                          x-linode-filterable: true
                        phone:
                          description: __Filterable__ The phone number for the owner of this child account.
                          example: 858-555-1212
                          maxLength: 32
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        state:
                          description: '__Filterable__ The state or province for the billing address (`address_1` and `address_2, if applicable`). If in the United States (US) or Canada (CA), this is the two-letter ISO 3166 State or Province code.


                            > 📘

                            >

                            > If this is a US military address, use state abbreviations (AA, AE, AP).'
                          example: CA
                          maxLength: 24
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                        tax_id:
                          description: The tax identification number for this child account. Use this for tax calculations in some countries. If you live in a country that doesn't collect taxes, ensure this is an empty string (`""`).
                          example: ATU99999999
                          maxLength: 25
                          type: string
                        zip:
                          description: '__Filterable__ The postal code of this account''s billing address. The following restrictions apply:


                            - Can only contain ASCII letters, numbers, and dashes (`-`).

                            - Can''t contain more than 10 letter or number characters.'
                          example: 92111-1234
                          maxLength: 10
                          type: string
                          x-akamai:
                            labels:
                            - Filterable
                          x-linode-filterable: true
                      type: object
                      x-akamai:
                        file-path: schemas/child-account.yaml
