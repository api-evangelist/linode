        '200':
          content:
            application/json:
              example:
                quota_limit: 100
                usage: 10
              schema:
                additionalProperties: false
                description: Usage data for a specific Object Storage-related quota on your account.
                properties:
                  quota_limit:
                    description: The availability limit for a specific Object Storage resource (`objQuotaId`) for a single endpoint.
                    example: 100
                    type: integer
                    x-linode-cli-display: 1
                  usage:
                    description: The quantity of the Object Storage resource currently in use on an endpoint. Displayed as `null` if no resources are in use.
                    example: 10
