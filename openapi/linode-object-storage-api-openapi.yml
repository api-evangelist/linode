      operationId: get-object-storage-quotas
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - description: Current number of buckets per account, per endpoint
                  endpoint_type: E1
                  quota_id: obj-buckets-eu-central-1.linodeobjects.com
                  quota_limit: 50
                  quota_name: Number of Buckets
                  resource_metric: bucket
                  s3_endpoint: us-sea-9.linodeobjects.com
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - properties:
                    data:
                      items:
                        additionalProperties: false
                        description: The current Object Storage-related quotas on your account.
                        properties:
                          description:
                            description: A description for the Object Storage-related quota.
                            example: Current number of buckets per account, per endpoint
                            type: string
                            x-linode-cli-display: 3
                          endpoint_type:
                            description: The type of `s3_endpoint`. See [Endpoint types](https://techdocs.akamai.com/cloud-computing/docs/object-storage#endpoint-types) for more information.
                            enum:
                            - E0
                            - E1
                            - E2
                            - E3
                            example: E1
                            type: string
                            x-linode-cli-display: 6
                          quota_id:
                            description: 'Identifies the Object Storage-related quota. Formatted as `obj-<quota_type>-<s3_endpoint>`, where `<quota_type>` is the `resource_metric` in use: `buckets`, `objects` or `bytes`.'
                            example: obj-buckets-eu-central-1.linodeobjects.com
                            type: string
                            x-linode-cli-display: 1
                          quota_limit:
                            description: The maximum quantity of the `resource_metric` allowed by the quota.
                            example: 50
                            type: integer
                            x-linode-cli-display: 5
                          quota_name:
                            description: __Filterable__ The name of the Object Storage-related quota. This is how the quota displays in Akamai Cloud Manager. This can be `Number of Buckets`, `Number of Objects`, or `Total Capacity`.
                            enum:
                            - Number of Objects
                            - Number of Buckets
                            - Total Capacity
                            example: Number of Buckets
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 2
                            x-linode-filterable: true
                          resource_metric:
                            description: 'The specific Object Storage-based resource for the quota. A quota maximum may apply as follows:


                              - The Object Storage `bucket` quota for a single `s3_endpoint`


                              - The `object` quota for a single `s3_endpoint`


                              - The `byte` count quota for content in a single `s3_endpoint`'
                            enum:
                            - bucket
                            - object
                            - byte
                            example: bucket
                            type: string
                            x-linode-cli-display: 4
                          s3_endpoint:
                            description: __Filterable__ The URL for the s3 endpoint where the quota applies. Every `s3_endpoint` exists in a specific Akamai Cloud Computing data center (`region`). Run the [List Object Storage endpoints](https://techdocs.akamai.com/linode-api/reference/get-object-storage-endpoints) operation to see more specifics on this `s3_endpoint`.
                            example: us-sea-9.linodeobjects.com
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 7
                            x-linode-filterable: true
                        type: object
                        x-akamai:
                          file-path: schemas/object-storage-quota.yaml
                      type: array
                  type: object
                - additionalProperties: false
                  description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
