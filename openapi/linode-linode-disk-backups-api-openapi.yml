    x-linode-cli-command: linodes
    post:
      description: 'Restores a Linode''s backup to the specified Linode.


        - Backups can''t be restored across regions.


        - You can only restore a successfully completed backup that is not under maintenance.


        - The Linode that the backup is being restored to can''t be the target of a current backup.


        When you restore a backup, the restored disk is assigned the same UUID as the original disk. In most cases, this is acceptable and doesn''t cause issues. However, if you try to mount both the original disk and the corresponding restore disk at the same time (by assigning them both to devices in your Configuration Profile''s __Block Device Assignment__), you''ll encounter a UUID "collision".


        When this happens, the system selects, and mounts, only one of the disks at random. This is because both disks are sharing the same UUID. Your instance _may fail to boot_ because the API can''t tell which disk is root. If your system boots in this scenario, you won''t see an immediate indication if you''re booted into the restored disk or the original disk, and you''ll be unable to access both disks at the same time.


        To avoid this, only restore a backup to the same Linode if you don''t intend to mount them at the same time, or you''re comfortable modifying UUIDs. If you need access to files on both the original disk and the restored disk simultaneously -- for example, if you need to copy files between them -- you should restore the backup to a separate Linode or create a new Linode using the desired `backup_id`.


        To learn more about block device assignments and viewing your disks'' UUIDs, see our guide on Configuration Profiles.


        > 📘

        >

        > Backups aren''t encrypted even when they''re taken from an encrypted disk. When a backup is restored, and if encryption is enabled, the data stored on the disk is encrypted again.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `restore_linode_backup`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli linodes backup-restore 123 123456 \

        --linode_id 234 \

        --overwrite true

        ```


        Learn more'
