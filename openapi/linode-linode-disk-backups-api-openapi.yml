openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Linode disk backups API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: The Backups service lets you enable automatic backups of the disks on your Linodes. Use these operations to manage your backups.
  name: Linode disk backups
paths:
  /{apiVersion}/linode/instances/{linodeId}/backups:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the Linode the backups belong to.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path-c264fcc4.yaml
    x-akamai:
      file-path: paths/linode-backups.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/backups
    x-linode-cli-command: linodes
    post:
      description: 'Creates a snapshot backup of a Linode.


        > 📘

        >

        > - Backups aren''t encrypted even when they''re taken from an encrypted disk. When a backup is restored, and if encryption is enabled, the data stored on the disk is encrypted again.

        >

        > - If you already have a snapshot of this Linode, the previous snapshot will be deleted.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `create_linode_backup_snapshot`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `linodes:read_write`


        **CLI**


        ```shell

        linode-cli linodes snapshot 123

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-snapshot
      operationId: post-snapshot
      requestBody:
        content:
          application/json:
            example:
              label: SnapshotLabel
            schema:
              additionalProperties: false
              properties:
                label:
                  description: The label for the new snapshot.
                  example: '{{label}}'
                  maxLength: 255
                  minLength: 1
                  type: string
              required:
              - label
              type: object
              x-akamai:
                file-path: schemas/added-post-snapshot.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                available: true
                configs:
                - My Debian 13 Config
                created: '2018-01-15T00:01:01'
                disks:
                - filesystem: ext4
                  label: My Debian 13 Disk
                  size: 9001
                finished: '2018-01-15T00:01:01'
                id: 123456
                label: Webserver-Backup-2018
                region: us-east
                status: successful
                type: snapshot
                updated: '2018-01-15T00:01:01'
              schema:
                additionalProperties: false
                description: A backup for a Linode that can be used as a restore point.
                properties:
                  available:
                    description: '__Read-only__ Whether this backup is available for restoration.


                      Backups undergoing maintenance are not available for restoration.'
                    example: true
                    readOnly: true
                    type: boolean
                  configs:
                    description: __Read-only__ A list of the labels of the configuration profiles that are part of the backup.
                    items:
                      example: My Debian 13 Config
                      type: string
                    readOnly: true
                    type: array
                  created:
                    description: __Read-only__ When the backup was taken.
                    example: '2018-01-15T00:01:01'
                    readOnly: true
                    type: string
                    x-linode-cli-display: 4
                  disks:
                    description: __Read-only__ A list of the disks that are part of the backup.
                    items:
                      additionalProperties: false
                      properties:
                        filesystem:
                          description: 'The disk''s format or file system. A value of `raw` indicates no file system, just a raw binary stream. A value of `swap` indicates a Linux swap area. The values `ext3` or `ext4` represent these Linux journaling file systems. The value `ext2` is the deprecated ext2 Linux file system. Finally, `initrd` indicates the disk is formatted as an uncompressed initial RAM disk.


                            > 📘

                            >

                            > The `ext2` file system doesn''t properly support timestamps and will be removed from Linux support in the near future. Also, `initrd` is a legacy format that no longer applies to most use cases. As a best practice, use the other supported formats or file systems instead.'
                          enum:
                          - raw
                          - swap
                          - ext2
                          - ext3
                          - ext4
                          - initrd
                          example: ext4
                          type: string
                          x-linode-cli-display: 5
                        label:
                          description: The label for the disk.
                          example: My Debian 13 Disk
                          type: string
                        size:
                          description: The size of the disk in megabytes.
                          example: 9001
                          type: integer
                      type: object
                    readOnly: true
                    type: array
                  finished:
                    description: __Read-only__ When the backup completed, or `null` if not yet complete.
                    example: '2018-01-15T00:01:01'
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  id:
                    description: __Read-only__ The unique ID of this backup.
                    example: 123456
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  label:
                    description: A label for backups that are of type `snapshot`.
                    example: Webserver-Backup-2018
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 5
                  region:
                    description: __Read-only__ The region where the backup is located.
                    example: us-east
                    readOnly: true
                    type: string
                  status:
                    description: __Read-only__ The current state of a specific backup, either `paused`, `pending`, `running`, `needsPostProcessing`, `successful`, `failed`, or `userAborted`.
                    enum:
                    - paused
                    - pending
                    - running
                    - needsPostProcessing
                    - successful
                    - failed
                    - userAborted
                    example: successful
                    readOnly: true
                    type: string
                    x-linode-cli-color:
                      default_: yellow
                      failed: red
                      successful: green
                      userAborted: f
                    x-linode-cli-display: 2
                  type:
                    description: __Read-only__ This indicates whether the backup is an automatic backup (`auto`) or manual snapshot taken by the user at a specific point in time (`snapshot`).
                    enum:
                    - auto
                    - snapshot
                    example: snapshot
                    readOnly: true
                    type: string
                    x-linode-cli-display: 3
                  updated:
                    description: __Read-only__ When the backup was most recently updated.
                    example: '2018-01-15T00:01:01'
                    readOnly: true
                    type: string
                type:
                - object
                - 'null'
                x-akamai:
                  file-path: schemas/backup.yaml
          description: Snapshot request successful.
