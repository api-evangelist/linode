openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode OAuth clients API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use an OAuth client to allow users (using their Akamai Cloud Computing account) to log in to your own application, and optionally grant your application some amount of access to their Akamai Cloud Computing services.
  name: OAuth clients
paths:
  /{apiVersion}/account/oauth-clients:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/oauth-clients.yaml
      path-info: /{apiVersion}/account/oauth-clients
    x-linode-cli-command: account
    post:
      description: 'Creates an OAuth Client, which can be used to allow users (using their Linode account) to log in to your own application, and optionally grant your application some amount of access to their Linodes or other entities.


        >


        ---


        - __CLI__.


        ```

        linode-cli account client-create \

        --label Test_Client_1 \

        --redirect_uri https://example.org/callback

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-client
      operationId: post-client
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - additionalProperties: false
                description: A third-party application registered to Linode that users may log into with their Linode account through our authentication server at [login.linode.com](https://login.linode.com).  Using an OAuth Client, a third-party developer may be given access to some, or all, of a User's account for the purposes of their application.
                properties:
                  id:
                    description: __Read-only__ The OAuth Client ID.  This is used to identify the client, and is a publicly known value (it is not a secret).
                    example: 2737bf16b39ab5d7b4a1
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  label:
                    description: __Filterable__ The name of this application.  This will be presented to users when they are asked to grant it access to their Account.
                    example: Test_Client_1
                    maxLength: 512
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  public:
                    default: false
                    description: __Filterable__ If this is a public or private OAuth Client.  Public clients have a slightly different authentication workflow than private clients.  See the [OAuth spec](https://oauth.net/2/) for more details.
                    example: false
                    type: boolean
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  redirect_uri:
                    description: The location a successful log in from [login.linode.com](https://login.linode.com) should be redirected to for this client.  The receiver of this redirect should be ready to accept an OAuth exchange code and finish the OAuth exchange.
                    example: https://example.org/oauth/callback
                    format: url
                    type: string
                    x-linode-cli-display: 5
                  secret:
                    description: __Read-only__ The OAuth Client secret, used in the OAuth exchange.  This is returned as `<REDACTED>` except when an OAuth Client is created or its secret is reset.  This is a secret, and should not be shared or disclosed publicly.
                    example: <REDACTED>
                    readOnly: true
                    type: string
                  status:
                    description: __Read-only__ The status of this application.  `active` by default.
                    enum:
                    - active
                    - disabled
                    - suspended
                    example: active
                    readOnly: true
                    type: string
                    x-linode-cli-color:
                      default_: white
                      suspended: red
                    x-linode-cli-display: 3
                  thumbnail_url:
                    description: __Read-only__ The URL where this client's thumbnail may be viewed, or `null` if this client does not have a thumbnail set.
                    example: https://api.linode.com/v4/account/clients/2737bf16b39ab5d7b4a1/thumbnail
                    format: url
                    readOnly: true
                    type:
                    - string
                    - 'null'
                type: object
                x-akamai:
                  file-path: schemas/oauth-client.yaml
              required:
              - label
              - redirect_uri
              x-akamai:
                file-path: schemas/added-post-client.yaml
            x-example:
              x-ref: ../examples/post-client.json
        description: Information about the OAuth Client to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A third-party application registered to Linode that users may log into with their Linode account through our authentication server at [login.linode.com](https://login.linode.com).  Using an OAuth Client, a third-party developer may be given access to some, or all, of a User's account for the purposes of their application.
                properties:
                  id:
                    description: __Read-only__ The OAuth Client ID.  This is used to identify the client, and is a publicly known value (it is not a secret).
                    example: 2737bf16b39ab5d7b4a1
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  label:
                    description: __Filterable__ The name of this application.  This will be presented to users when they are asked to grant it access to their Account.
                    example: Test_Client_1
                    maxLength: 512
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  public:
                    default: false
                    description: __Filterable__ If this is a public or private OAuth Client.  Public clients have a slightly different authentication workflow than private clients.  See the [OAuth spec](https://oauth.net/2/) for more details.
                    example: false
                    type: boolean
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  redirect_uri:
                    description: The location a successful log in from [login.linode.com](https://login.linode.com) should be redirected to for this client.  The receiver of this redirect should be ready to accept an OAuth exchange code and finish the OAuth exchange.
                    example: https://example.org/oauth/callback
                    format: url
                    type: string
                    x-linode-cli-display: 5
                  secret:
                    description: __Read-only__ The OAuth Client secret, used in the OAuth exchange.  This is returned as `<REDACTED>` except when an OAuth Client is created or its secret is reset.  This is a secret, and should not be shared or disclosed publicly.
                    example: <REDACTED>
                    readOnly: true
                    type: string
                  status:
                    description: __Read-only__ The status of this application.  `active` by default.
                    enum:
                    - active
                    - disabled
                    - suspended
                    example: active
                    readOnly: true
                    type: string
                    x-linode-cli-color:
                      default_: white
                      suspended: red
                    x-linode-cli-display: 3
                  thumbnail_url:
                    description: __Read-only__ The URL where this client's thumbnail may be viewed, or `null` if this client does not have a thumbnail set.
                    example: https://api.linode.com/v4/account/clients/2737bf16b39ab5d7b4a1/thumbnail
                    format: url
                    readOnly: true
                    type:
                    - string
                    - 'null'
                type: object
                x-akamai:
                  file-path: schemas/oauth-client.yaml
              x-example:
                x-ref: ../examples/post-client-200.json
          description: Client created successfully.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_write
      summary: Create an OAuth client
      tags:
