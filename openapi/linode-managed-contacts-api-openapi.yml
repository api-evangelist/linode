openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Managed contacts API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: Create and manage contacts associated with Linode Managed, who can be notified about issues with your managed Linodes.
  name: Managed contacts
paths:
  /{apiVersion}/managed/contacts:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/managed-contacts.yaml
      path-info: /{apiVersion}/managed/contacts
    x-linode-cli-command: managed
    post:
      description: 'Creates a managed contact. When investigating or resolving an issue with a service monitor, Akamai Support may reach out to this contact.


        This operation can only be accessed by the unrestricted users of an account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli managed contact-create \

        --name "John Doe" \

        --email "john.doe@example.org" \

        --phone.primary "123-456-7890"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-managed-contact
      operationId: post-managed-contact
      requestBody:
        content:
          application/json:
            example:
              email: jkowalski@example.org
              group: on-call
              name: John Doe
              phone:
                primary: 123-456-7890
            schema:
              additionalProperties: false
              description: Information about someone Linode's special forces may contact in case an issue is detected with a manager service.
              properties:
                email:
                  description: The address to email this Contact to alert them of issues.
                  example: '{{email}}'
                  format: email
                  type: string
                  x-linode-cli-display: 3
                group:
                  description: __Filterable__ A grouping for this Contact. This is for display purposes only.
                  example: '{{group}}'
                  maxLength: 50
                  minLength: 2
                  type:
                  - string
                  - 'null'
                  x-akamai:
                    labels:
                    - Filterable
                  x-linode-cli-display: 5
                  x-linode-filterable: true
                id:
                  description: __Read-only__ This Contact's unique ID.
                  example: '{{id}}'
                  readOnly: true
                  type: integer
                  x-linode-cli-display: 1
                name:
                  description: The name of this Contact.
                  example: '{{name}}'
                  maxLength: 64
                  minLength: 2
                  pattern: '[a-zA-Z0-9-_ ]{2,64}'
                  type: string
                  x-linode-cli-display: 2
                phone:
                  additionalProperties: false
                  description: Information about how to reach this Contact by phone.
                  properties:
                    primary:
                      description: This Contact's primary phone number.
                      example: 123-456-7890
                      format: phone
                      type:
                      - string
                      - 'null'
                    secondary:
                      description: This Contact's secondary phone number.
                      example: null
                      format: phone
                      type:
                      - string
                      - 'null'
                  type: object
                  x-linode-cli-display: 4
                updated:
                  description: __Read-only__ When this Contact was last updated.
                  example: '{{updated}}'
                  readOnly: true
                  type: string
              type: object
              x-akamai:
                file-path: schemas/managed-contact.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                email: jdupont@example.org
                group: on-call
                id: 567
                name: John Doe
                phone:
                  primary: 123-456-7890
                  secondary: null
                updated: '2018-01-01T00:01:01'
              schema:
                additionalProperties: false
                description: Information about someone Linode's special forces may contact in case an issue is detected with a manager service.
                properties:
                  email:
                    description: The address to email this Contact to alert them of issues.
                    example: john.doe@example.org
                    format: email
                    type: string
                    x-linode-cli-display: 3
                  group:
                    description: __Filterable__ A grouping for this Contact. This is for display purposes only.
                    example: on-call
                    maxLength: 50
                    minLength: 2
                    type:
                    - string
                    - 'null'
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 5
                    x-linode-filterable: true
                  id:
                    description: __Read-only__ This Contact's unique ID.
                    example: 567
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  name:
                    description: The name of this Contact.
                    example: John Doe
                    maxLength: 64
                    minLength: 2
                    pattern: '[a-zA-Z0-9-_ ]{2,64}'
                    type: string
                    x-linode-cli-display: 2
                  phone:
                    additionalProperties: false
                    description: Information about how to reach this Contact by phone.
                    properties:
                      primary:
                        description: This Contact's primary phone number.
                        example: 123-456-7890
                        format: phone
                        type:
                        - string
                        - 'null'
                      secondary:
                        description: This Contact's secondary phone number.
                        example: null
                        format: phone
                        type:
                        - string
                        - 'null'
                    type: object
                    x-linode-cli-display: 4
                  updated:
                    description: __Read-only__ When this Contact was last updated.
                    example: '2018-01-01T00:01:01'
                    readOnly: true
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/managed-contact.yaml
          description: Contact created.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
