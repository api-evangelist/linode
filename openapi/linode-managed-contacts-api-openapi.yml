                              - 'null'
                            secondary:
                              description: This Contact's secondary phone number.
                              example: null
                              format: phone
                              type:
                              - string
                              - 'null'
                          type: object
                          x-linode-cli-display: 4
                        updated:
                          description: __Read-only__ When this Contact was last updated.
                          example: '2018-01-01T00:01:01'
                          readOnly: true
                          type: string
                      type: object
                      x-akamai:
