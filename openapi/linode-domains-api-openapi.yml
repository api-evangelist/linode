openapi: 3.2.0
info:
  title: Linode Domains API
  version: '1.0'
  description: 'Operations tagged Domains across 2 of this provider''s published API definitions: linode-api-v4-openapi.yml, linode-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com/v4
  description: Production Server
- url: https://api.linode.com
tags:
- name: Domains
  description: Manage DNS domains and their associated resource records including A, AAAA, CNAME, MX, TXT, SRV, CAA, and NS records.
paths:
  /domains:
    get:
      operationId: getDomains
      summary: List domains
      description: Returns a paginated list of all domains on your account, including their status, type, and SOA email address.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Domains retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDomainList'
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createDomain
      summary: Create a domain
      description: Creates a new domain on your account. The domain can be a master or slave zone type.
      tags:
      - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRequest'
      responses:
        '200':
          description: Domain created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /domains/{domainId}:
    get:
      operationId: getDomain
      summary: Get a domain
      description: Returns the details for a single domain on your account.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/domainIdParam'
      responses:
        '200':
          description: Domain retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Domain not found
      security:
      - personalAccessToken: []
      - oauth: []
    put:
      operationId: updateDomain
      summary: Update a domain
      description: Updates the configuration for a domain on your account.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/domainIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRequest'
      responses:
        '200':
          description: Domain updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Domain not found
      security:
      - personalAccessToken: []
      - oauth: []
    delete:
      operationId: deleteDomain
      summary: Delete a domain
      description: Deletes a domain from your account. All associated DNS records will also be deleted.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/domainIdParam'
      responses:
        '200':
          description: Domain deleted successfully
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Domain not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /domains/{domainId}/records:
    get:
      operationId: getDomainRecords
      summary: List domain records
      description: Returns a paginated list of all DNS records for a given domain.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/domainIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Domain records retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDomainRecordList'
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Domain not found
      security:
      - personalAccessToken: []
      - oauth: []
    post:
      operationId: createDomainRecord
      summary: Create a domain record
      description: Creates a new DNS record for the given domain.
      tags:
      - Domains
      parameters:
      - $ref: '#/components/parameters/domainIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRecordRequest'
      responses:
        '200':
          description: Domain record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRecord'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing authentication
        '404':
          description: Domain not found
      security:
      - personalAccessToken: []
      - oauth: []
    servers:
    - url: https://api.linode.com/v4
      description: Production Server
  /{apiVersion}/domains:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/domains.yaml
      path-info: /{apiVersion}/domains
    x-linode-cli-command: domains
    post:
      description: 'Adds a new Domain to Linode''s DNS Manager. Linode is not a registrar, and you must own the domain before adding it here. Be sure to point your registrar to Linode''s nameservers so that the records hosted here are used.


        >


        ---


        - __CLI__.


        ```

        linode-cli domains create \

        --type master \

        --domain example.org \

        --soa_email admin@example.org

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        domains:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-domain
      operationId: post-domain
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - additionalProperties: false
                description: A domain zonefile in our DNS system.  You must own the domain name and tell your registrar to use Linode's nameservers in order for a domain in our system to be treated as authoritative.
                properties:
                  axfr_ips:
                    description: 'The list of IPs that may perform a zone transfer for this domain. The total combined length of all data within this array cannot exceed 1000 characters.


                      > 📘

                      >

                      > This is potentially dangerous, and should be set to an empty list unless you intend to use it.'
                    example: []
                    items:
                      format: ip
                      type: string
                    type: array
                  description:
                    description: A description for this domain. This is for display purposes only.
                    example: null
                    maxLength: 253
                    minLength: 1
                    type:
                    - string
                    - 'null'
                  domain:
                    description: __Filterable__ The domain this domain represents. domain labels cannot be longer than 63 characters and must conform to [RFC1035](https://tools.ietf.org/html/rfc1035). domains must be unique on Linode's platform, including across different Linode accounts; there cannot be two domains representing the same domain.
                    example: example.org
                    maxLength: 253
                    minLength: 1
                    pattern: ^(\*\.)?([a-zA-Z0-9-_]{1,63}\.)+([a-zA-Z]{2,3}\.)?([a-zA-Z]{2,16}|xn--[a-zA-Z0-9]+)$
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  expire_sec:
                    default: 0
                    description: 'The amount of time in seconds that may pass before this domain is no longer authoritative.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 1209600.'
                    example: 300
                    type: integer
                  group:
                    deprecated: true
                    description: __Filterable__ The group this domain belongs to.  This is for display purposes only.
                    example: null
                    maxLength: 50
                    minLength: 1
                    type:
                    - string
                    - 'null'
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  id:
                    description: __Read-only__ This domain's unique ID.
                    example: 1234
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  master_ips:
                    description: The IP addresses representing the master DNS for this domain. At least one value is required for `type` slave domains. The total combined length of all data within this array cannot exceed 1000 characters.
                    example: []
                    items:
                      format: ip
                      type: string
                    type: array
                  refresh_sec:
                    default: 0
                    description: 'The amount of time in seconds before this domain should be refreshed.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 14400.'
                    example: 300
                    type: integer
                  retry_sec:
                    default: 0
                    description: 'The interval, in seconds, at which a failed refresh should be retried.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 14400.'
                    example: 300
                    type: integer
                  soa_email:
                    description: Start of Authority email address. This is required for `type` master domains.
                    example: admin@example.org
                    format: email
                    type: string
                    x-linode-cli-display: 5
                  status:
                    default: active
                    description: Used to control whether this domain is currently being rendered.
                    enum:
                    - disabled
                    - active
                    example: active
                    type: string
                    x-linode-cli-color:
                      active: green
                      default_: red
                      disabled: yellow
                      edit_mode: yellow
                    x-linode-cli-display: 4
                  tags:
                    description: __Filterable__ An array of tags applied to this object.  Tags are for organizational purposes only.
                    example:
                    - example tag
                    - another example
                    items:
                      type: string
                    type: array
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  ttl_sec:
                    default: 0
                    description: '"Time to Live" - the amount of time in seconds that this domain''s records may be cached by resolvers or other domain servers.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 86400.'
                    example: 300
                    type: integer
                  type:
                    description: Whether this domain represents the authoritative source of information for the domain it describes (`master`), or whether it is a read-only copy of a master (`slave`).
                    enum:
                    - master
                    - slave
                    example: master
                    type: string
                    x-linode-cli-display: 3
                title: Domain
                type: object
                x-akamai:
                  file-path: schemas/domain.yaml
              required:
              - domain
              - type
              x-akamai:
                file-path: schemas/added-post-domain.yaml
            x-example:
              x-ref: ../examples/post-domain.json
        description: Information about the domain you are registering.
        required: true
      responses:
