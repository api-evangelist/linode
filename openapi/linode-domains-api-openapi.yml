components:
  schemas:
    DomainRecord:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of this domain record.
        type:
          type: string
          enum:
          - A
          - AAAA
          - NS
          - MX
          - CNAME
          - TXT
          - SRV
          - PTR
          - CAA
          description: The type of DNS record.
        name:
          type: string
          description: The hostname or FQDN for this record.
        target:
          type: string
          description: The target for this record.
        priority:
          type: integer
          description: The priority for MX and SRV records.
        weight:
          type: integer
          description: The weight for SRV records.
        port:
          type: integer
          description: The port for SRV records.
        ttl_sec:
          type: integer
          description: The TTL in seconds for this record.
        tag:
          type: string
          description: The tag for CAA records.
    DomainRequest:
      type: object
      required:
      - domain
      - type
      properties:
        domain:
          type: string
          description: The domain name.
        type:
          type: string
          enum:
          - master
          - slave
          description: Whether this is a master or slave zone.
        soa_email:
          type: string
          format: email
          description: The SOA email address.
        description:
          type: string
          description: A description for this domain.
        tags:
          type: array
          items:
            type: string
          description: Tags for this domain.
    PaginatedDomainRecordList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/DomainRecord'
    PaginatedDomainList:
      allOf:
      - $ref: '#/components/schemas/Pagination'
      - type: object
