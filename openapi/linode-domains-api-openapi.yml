openapi: 3.2.0
info:
  title: Linode Domains API
  version: '1.0'
  description: 'Operations tagged Domains across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: Use these operations to create and manage domains on your account.
  name: Domains
paths:
  /{apiVersion}/domains:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/domains.yaml
      path-info: /{apiVersion}/domains
    x-linode-cli-command: domains
    post:
      description: 'Adds a new domain to DNS Manager. You must own the domain before adding it here. Be sure to point your registrar to our nameservers. Akamai Cloud does not act as a registrar.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs these roles assigned. Learn more.

        - Roles: `account_domain_creator`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `domains:read_write`


        **CLI**


        ```shell

        linode-cli domains create \

        --type master \

        --domain example.org \

        --soa_email admin@example.org

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-domain
      operationId: post-domain
      requestBody:
        content:
          application/json:
            example:
              domain: example.org
              expire_sec: 300
              refresh_sec: 300
              retry_sec: 300
              soa_email: admin@example.org
              status: active
              ttl_sec: 300
              type: master
            schema:
              allOf:
              - additionalProperties: false
                description: A domain zonefile in our DNS system.  You must own the domain name and tell your registrar to use Linode's nameservers in order for a domain in our system to be treated as authoritative.
                properties:
                  axfr_ips:
                    description: 'The list of IPs that may perform a zone transfer for this domain. The total combined length of all data within this array cannot exceed 1000 characters.


                      > 📘

                      >

                      > This is potentially dangerous, and should be set to an empty list unless you intend to use it.'
                    example: []
                    items:
                      format: ip
                      type: string
                    type: array
                  description:
                    description: A description for this domain. This is for display purposes only.
                    example: null
                    maxLength: 253
                    minLength: 1
                    type:
                    - string
                    - 'null'
                  domain:
                    description: __Filterable__ The domain this domain represents. domain labels cannot be longer than 63 characters and must conform to [RFC1035](https://tools.ietf.org/html/rfc1035). domains must be unique on Linode's platform, including across different Linode accounts; there cannot be two domains representing the same domain.
                    example: example.org
                    maxLength: 253
                    minLength: 1
                    pattern: ^(\*\.)?([a-zA-Z0-9-_]{1,63}\.)+([a-zA-Z]{2,3}\.)?([a-zA-Z]{2,16}|xn--[a-zA-Z0-9]+)$
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  expire_sec:
                    default: 0
                    description: 'The amount of time in seconds that may pass before this domain is no longer authoritative.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 1209600.'
                    example: 300
                    type: integer
                  group:
                    deprecated: true
                    description: __Deprecated__, __Filterable__ The group this domain belongs to.  This is for display purposes only.
                    example: null
                    maxLength: 50
                    minLength: 1
                    type:
                    - string
                    - 'null'
                    x-akamai:
                      labels:
                      - Filterable
                      status: DEPRECATED
                    x-linode-filterable: true
                  id:
                    description: __Read-only__ This domain's unique ID.
                    example: 1234
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  master_ips:
                    description: The IP addresses representing the master DNS for this domain. At least one value is required for `type` slave domains. The total combined length of all data within this array cannot exceed 1000 characters.
                    example: []
                    items:
                      format: ip
                      type: string
                    type: array
                  refresh_sec:
                    default: 0
                    description: 'The amount of time in seconds before this domain should be refreshed.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 14400.'
                    example: 300
                    type: integer
                  retry_sec:
                    default: 0
                    description: 'The interval, in seconds, at which a failed refresh should be retried.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 14400.'
                    example: 300
                    type: integer
                  soa_email:
                    description: Start of Authority email address. This is required for `type` master domains.
                    example: admin@example.org
                    format: email
                    type: string
                    x-linode-cli-display: 5
                  status:
                    default: active
                    description: Indicates whether this domain is currently being rendered, either `active` or `disabled`.
                    enum:
                    - disabled
                    - active
                    example: active
                    type: string
                    x-linode-cli-color:
                      active: green
                      default_: red
                      disabled: yellow
                      edit_mode: yellow
                    x-linode-cli-display: 4
                  tags:
                    description: __Filterable__ An array of tags applied to this object.  Tags are for organizational purposes only.
                    example:
                    - example tag
                    - another example
                    items:
                      type: string
                    type: array
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  ttl_sec:
                    default: 0
                    description: '"Time to Live" - the amount of time in seconds that this domain''s records may be cached by resolvers or other domain servers.


                      - Valid values are 0, 30, 120, 300, 3600, 7200, 14400, 28800, 57600, 86400, 172800, 345600, 604800, 1209600, and 2419200.


                      - Any other value is rounded up to the nearest valid value.


                      - A value of 0 is equivalent to the default value of 86400.'
                    example: 300
                    type: integer
                  type:
                    description: Whether this domain represents the authoritative source of information for the domain it describes (`master`), or whether it is a read-only copy of a master (`slave`).
                    enum:
                    - master
                    - slave
                    example: master
                    type: string
                    x-linode-cli-display: 3
                title: Domain
                type: object
                x-akamai:
                  file-path: schemas/domain.yaml
              required:
              - domain
              - type
              x-akamai:
                file-path: schemas/added-post-domain.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
