  /{apiVersion}/account/child-accounts/{euuId}/token:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The child account to look up. You can run the [List child accounts](https://techdocs.akamai.com/linode-api/reference/get-child-accounts) operation to find the applicable account and store its `euuid` as your `euuId`.
      example: '{{euuId}}'
      in: path
      name: euuId
      required: true
      schema:
        type: string
      x-akamai:
        file-path: parameters/eeuid.yaml
    x-akamai:
      file-path: paths/child-account-token.yaml
      path-info: /{apiVersion}/account/child-accounts/{euuId}/token
    x-linode-cli-command: child-account
    post:
      description: 'Create a short-lived bearer token for a parent user on a specific child account. In the context of the API, a parent user on a child account is referred to as a "proxy user." When Akamai provisions your parent-child account environment, a proxy user is automatically set in the child account. It follows a specific naming convention:


        _


        > 📘

        >

        > These variables only use the first 15 and 16 characters of these values, respectively.


        The token lets a parent account run API operations through the proxy user, as if they are a child user in the child account.


        These points apply to the use of this operation:


        - To create a token, a parent account user needs the `child_account_access` grant. This lets them use the proxy user on the child account. You can run List a user''s grants on a parent account user to check its `child_account_access` setting. To add this access, you can update the parent account user.


        - The created token inherits the permissions of the proxy user. It will never have less.


        - The API returns the raw token in the response. You can''t get it again, so be sure to store it.


        Example workflow:


        1. List child accounts and store the `euuid` for the applicable one.

        2. Run this operation and store the `token` that''s created for the proxy user.

        3. As a parent account user with access to the proxy user in the child account, use this `token` to authenticate API operations, as if you were a child user.


        >


        ---


        - __CLI__.


        ```

        linode-cli child-account create A1BC2DEF-34GH-567I-J890KLMN12O34P56

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        child_account:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-child-account-token
      operationId: post-child-account-token
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: The token generated manually for a child account so its proxy user can access the API and CLI without going through an OAuth login.
                properties:
                  created:
                    description: __Filterable__, __Read-only__ The date and time this token was created.
                    example: '2024-05-01T00:01:01'
                    format: date-time
                    readOnly: true
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  expiry:
                    description: __Read-only__ When this token expires. This is default set to 15 minutes from the time of creation. Proxy user tokens can't be renewed. After this time, Akamai revokes the token and you need to generate a new one.
                    example: '2024-05-01T00:16:01'
                    format: date-time
                    readOnly: true
                    type: string
                    x-linode-cli-display: 6
                  id:
                    description: __Read-only__ The proxy user token's unique ID, which can be used to revoke it.
                    example: 918
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  label:
                    description: __Filterable__ The name of the token. The API automatically sets this to `<username>_<uid>_<time>`. It's composed of the `username` for your parent account user, the unique `uid` Akamai assigned to identify your user, and the `time` the API generated the token. This is for display purposes only, but you can use it to help track how you're using each proxy user token.
                    example: parent1_1234_2024-05-01T00:01:01
                    maxLength: 100
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  scopes:
                    description: __Read-only__ The scopes this token was created with. Defaults to `*`. Proxy user tokens automatically inherit all the permissions of the proxy user.
