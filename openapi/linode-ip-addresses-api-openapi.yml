openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode IP addresses API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to view and manage the IP addresses assigned to your Linodes.
  name: IP Addresses
paths:
  /{apiVersion}/linode/instances/{linodeId}/ips:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: ID of the Linode to look up.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path.yaml
    x-akamai:
      file-path: paths/linode-ips.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/ips
    x-linode-cli-command: linodes
    post:
      description: 'Allocates a public or private IPv4 address to a Linode. Public IP Addresses, after the one included with each Linode, incur an additional monthly charge. If you need an additional public IP Address you must request one - please Open a support ticket. You may not add more than one private IPv4 address to a single Linode.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes ip-add 123 \

        --type ipv4 \

        --public true

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-add-linode-ip
      operationId: post-add-linode-ip
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                public:
                  description: Whether to create a public or private IPv4 address.
                  example: '{{public}}'
                  type: boolean
                type:
                  description: The type of address you are allocating. Only IPv4 addresses may be allocated through this operation.
                  enum:
                  - ipv4
                  example: '{{type}}'
                  type: string
              required:
              - type
              - public
              type: object
              x-akamai:
                file-path: schemas/added-post-add-linode-ip.yaml
            x-example:
              x-ref: ../examples/post-add-linode-ip.json
        description: Information about the address you are creating.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: An IP address that exists in Linode's system, either IPv4 or IPv6.
                properties:
                  address:
                    description: __Read-only__ The IP address.
                    example: 97.107.143.141
                    format: ip
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  gateway:
                    description: __Read-only__ The default gateway for this address.
                    example: 97.107.143.1
                    format: ip
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  interface_id:
                    description: __Beta__, __Read-only__ The Linode interface ID that this IP address is assigned to. This value is `null` if a Linode interface is not assigned, or if the IP is assigned to a legacy configuration profile interface.
                    example: 456
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                    x-akamai:
                      status: BETA
                    x-linode-cli-display: 7
                  linode_id:
                    description: __Read-only__ The ID of the Linode this address currently belongs to. For IPv4 addresses, this is by default the Linode that this address was assigned to on creation, and these addresses may be moved using the [Assign IPv4s to Linodes](https://techdocs.akamai.com/linode-api/reference/post-assign-ipv4s) operation. For SLAAC and link-local addresses, this value can't be changed.
                    example: 123
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 6
                  prefix:
                    description: __Read-only__ The number of bits set in the subnet mask.
                    example: 24
                    readOnly: true
                    type: integer
                  public:
                    description: __Read-only__ Whether this is a public or private IP address.
                    example: true
                    readOnly: true
                    type: boolean
                    x-linode-cli-display: 3
                  rdns:
                    description: The reverse DNS assigned to this address. For public IPv4 addresses, this will be set to a default value provided by Linode if not explicitly set.
                    example: test.example.org
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 4
                  region:
                    description: __Read-only__ The Region this IP address resides in.
                    example: us-east
                    readOnly: true
                    type: string
                    x-linode-cli-display: 5
                  subnet_mask:
                    description: __Read-only__ The mask that separates host bits from network bits for this address.
                    example: 255.255.255.0
                    format: ip
                    readOnly: true
                    type: string
                  type:
                    description: __Read-only__ The type of address this is.
                    enum:
                    - ipv4
                    - ipv6
                    - ipv6/pool
                    - ipv6/range
                    example: ipv4
                    readOnly: true
                    type: string
                    x-linode-cli-display: 2
                  vpc_nat_1_1:
                    additionalProperties: false
                    description: 'IPv4 address configured as a 1:1 NAT for this Interface. If no address is configured as a 1:1 NAT, `null` is returned.


                      > 📘

                      >

                      > Only allowed for `vpc` type interfaces.'
                    properties:
                      address:
                        description: The IPv4 address that is configured as a 1:1 NAT for this VPC interface.
                        example: 192.168.0.42
                        format: ipv4
                        type: string
                      subnet_id:
                        description: The `id` of the VPC Subnet for this interface.
                        example: 101
                        type: integer
                      vpc_id:
                        description: __Read-only__ The `id` of the VPC configured for this interface.
                        example: 111
                        readOnly: true
                        type: integer
                    type: object
                type: object
                x-akamai:
                  file-path: schemas/ip-address.yaml
              x-example:
                x-ref: ../examples/post-add-linode-ip-200.json
          description: IP address was successfully allocated.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - linodes:read_write
      summary: Allocate an IPv4 address
      tags:
      - IP Addresses
      x-akamai:
        tabs:
        - syntax: "linode-cli linodes ip-add 123 \\\n  --type ipv4 \\\n  --public true"
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: linodes:read_write
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: ip-add
      x-linode-grant: read_write
    get:
      description: 'Returns networking information for a single Linode.


        > 📘

        >

        > If the target Linode has several configuration profiles that include a Virtual Private Cloud (VPC) interface, the response lists address information for all of the VPCs.


