        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-assign-ips
      operationId: post-assign-ips
      requestBody:
        content:
          application/json:
            example:
              assignments:
              - address: 192.0.2.1
                linode_id: 123
              region: us-east
            schema:
              additionalProperties: false
              description: Request object for IP Addresses Assign (POST /networking/ips/assign).
              properties:
                assignments:
                  description: The list of assignments to make. You must have read_write access to all IPs being assigned and all Linodes being assigned to in order for the assignments to succeed.
                  items:
                    additionalProperties: false
                    properties:
                      address:
                        description: 'The IPv4 address or IPv6 range for this assignment.


                          - Must be an IPv4 address or an IPv6 range you can access in the region specified.

                          - IPv6 ranges must include a prefix length of `/56` or `/64`, for example: `2001:db8:3c4d:15::/64`.

                          - Assignment of an IPv6 range to a Linode updates the route target of the range to the assigned Linode''s SLAAC address.

                          - Can be a public or private address.

                          - For Linode interfaces, public IPv4 addresses or public IPv6 ranges can be exchanged on public interfaces. Private IPv4 addresses are not supported.'
                        example: 192.0.2.1
                        format: ipv4|ipv6/prefix_length
                        type: string
                      linode_id:
                        description: 'The ID of the Linode to assign this address to.


                          - If the address is currently assigned to another Linode, that Linode will lose the address.

                          - If the address is an unassigned reserved IP, it will be moved from your account''s unassigned pool to the target Linode.

                          - All Linodes involved must end up with at least one public address and no more than one private address once all assignments have been made.'
                        example: 123
                        type: integer
                    required:
                    - address
                    - linode_id
                    type: object
                  type: array
                region:
                  description: The ID of the region in which these assignments are to take place. All IPs and Linodes must exist in this region.
                  example: '{{region}}'
                  type: string
              required:
              - region
              - assignments
              type: object
              x-akamai:
                file-path: schemas/ip-addresses-assign-request.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example: {}
