openapi: 3.2.0
info:
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode IP addresses API'
  version: 4.229.1
servers:
- url: https://api.linode.com
tags:
- description: 'Use the IP addresses endpoints to view Virtual Private Cloud (VPC):

    - IP addresses

    - default address ranges

    - forbidden CIDR blocks for your environment'
  name: IP Addresses
paths:
  /{apiVersion}/networking/ips:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/networking-ips.yaml
      path-info: /{apiVersion}/networking/ips
    x-linode-cli-command: networking
    post:
      description: 'To manage your network configuration, you can allocate ephemeral or reserved IP addresses depending on your need for temporary or permanent connectivity. The Linode must be configured to support additional addresses. Before you allocate, open a support ticket to request additional addresses.


        Ephemeral IPv4 addresses are temporary and tied directly to a specific resource rather than your account. They''re typically recycled and returned to the pool once the associated resource is deleted.


        Reserved IPs are static, permanent addresses ideal for services requiring a consistent entry point. A reserved IP is permanently locked to the specific region where it was created. You can create a reserved IP independently of a Linode, allowing it to exist on your account with or without an active assignment, but it can only be assigned to resources within that same region. Charges apply as soon as a reserved IP is added to your account, regardless of whether it''s assigned to a resource.


        > 📘

        >

        > You can run this operation for Linodes with legacy configuration interfaces. You can''t use it for Linodes with Linode interfaces. To allocate an IP for a Linode with Linode interfaces, use the Add a Linode interface operation.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `ips:read_write`


        **CLI**


        *CLI example - Ephemeral IP*


        ```shell

        linode-cli networking ip-add \

        --type ipv4 \

        --public false \

        --linode_id 123

        ```


        *CLI example - Reserved IP*


        ```shell

        linode-cli networking ip-add \

        --type ipv4 \

        --public true \

        --linode_id 123 \

        --reserved true \

        --region us-east

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-allocate-ip
      operationId: post-allocate-ip
      requestBody:
        content:
          application/json:
            example:
              linode_id: 123
              public: true
              region: us-east
              reserved: true
              type: ipv4
            schema:
              additionalProperties: false
              oneOf:
              - additionalProperties: false
                description: Allocates a standard, temporary IPv4 address to a specific Linode.
                properties:
                  linode_id:
                    description: The ID of the Linode for this allocation.
                    example: 123
                    type: integer
                required:
                - linode_id
                title: Ephemeral IP allocation
                type: object
              - additionalProperties: false
                description: Allocates a static IPv4 address, with or without assignment to a Linode.
                properties:
                  linode_id:
                    description: The ID of the Linode for this allocation.
                    example: 123
                    type: integer
                  region:
                    description: The region where the reserved IP will reside. Required if `linode_id` is not provided.
                    example: us-east
                    type: string
                  reserved:
                    description: 'Must be `true` for this allocation type.

                      - If only `region` is provided, a new unassigned reserved IP is created in that region.

                      - If only `linode_id` is provided, a reserved IP is created in the Linode''s region and assigned to it.

                      - If both are provided, the reserved IP is created and assigned (the region must match the Linode''s location).'
                    example: true
                    type: boolean
                required:
                - reserved
                title: Reserved IP allocation
                type: object
              properties:
                public:
                  description: Create a public or private IPv4 address. Must be `public` when allocating a reserved IP.
                  example: '{{public}}'
                  type: boolean
                type:
                  description: The type of address you're requesting. Only IPv4 addresses (`ipv4`) may be allocated through this operation.
                  enum:
                  - ipv4
                  example: '{{type}}'
                  type: string
              required:
              - type
              - public
              type: object
              x-akamai:
                file-path: schemas/added-post-allocate-ip.yaml
            x-linode-cli-use-schema:
              additionalProperties: false
              properties:
                linode_id:
                  description: The ID of the Linode for this allocation.
                  type: integer
                  x-linode-cli-display: 6
                public:
                  description: Create a public or private IPv4 address. Must be `public` when allocating a reserved IP.
                  type: boolean
                  x-linode-cli-display: 3
                region:
                  description: The region where the reserved IP is allocated. Required if `linode_id` is not provided.
                  type: string
                  x-linode-cli-display: 5
                reserved:
                  description: "Must be `true` for a reserved IP.\n  - If only `region` is provided, a new unassigned reserved IP is created in that region.\n  - If only `linode_id` is provided, a reserved IP is created in the Linode's region and assigned to it.\n  - If both are provided, the reserved IP is created and assigned (the region must match the Linode's location)."
                  type: boolean
                  x-linode-cli-display: 8
                type:
                  description: The type of address you're requesting. Currently, only IPv4 addresses (`ipv4`) may be allocated through this operation.
                  enum:
                  - ipv4
                  type: string
                  x-linode-cli-display: 2
              type: object
              x-akamai:
                file-path: schemas/post-allocate-ip-cli.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                address: 172.31.140.86
                assigned_entity: null
                gateway: 172.31.140.1
                interface_id: 456
                linode_id: 123
                prefix: 24
                public: true
                rdns: test.example.org
                region: us-east
                reserved: true
                subnet_mask: 255.255.255.0
                type: ipv4
                vpc_nat_1_1:
                  address: 192.168.0.42
                  subnet_id: 101
                  vpc_id: 111
              schema:
                additionalProperties: false
                description: An IP address that exists in Linode's system, either IPv4 or IPv6.
                properties:
                  address:
                    description: __Read-only__ The IP address.
                    example: 97.107.143.141
                    format: ip
                    readOnly: true
                    type: string
                    x-linode-cli-display: 1
                  assigned_entity:
                    additionalProperties: false
                    description: __Read-only__ Identifies which resource a specific IP address is currently attached to.
                    properties:
                      id:
                        description: The unique identifier for the resource.
                        example: 1234
                        type: integer
                      label:
                        description: The name of the entity.
                        example: demo-linode
                        type: string
                      type:
                        description: The type of entity.
                        enum:
                        - linode
                        - nodebalancer
                        example: nodebalancer
                        type: string
                      url:
                        description: The API URL path you can use to access this entity.
                        example: /v4/nodebalancer/1234
                        type: string
                    readOnly: true
                    type:
                    - object
                    - 'null'
                    x-linode-cli-display: 10
                  gateway:
                    description: __Read-only__ The default gateway for this address.
                    example: 97.107.143.1
                    format: ip
                    readOnly: true
                    type:
                    - string
                    - 'null'
                  interface_id:
                    description: __Read-only__ The Linode interface ID that this IP address is assigned to. This value is `null` if a Linode interface is not assigned, or if the IP is assigned to a legacy configuration profile interface.
                    example: 456
                    readOnly: true
                    type:
                    - integer
                    - 'null'
                    x-linode-cli-display: 7
                  linode_id:
                    description: __Read-only__ The ID of the Linode this address currently belongs to. For IPv4 addresses, this is by default the Linode that this address was assigned to on creation, and these addresses may be moved using the [Assign IPv4s to Linodes](https://techdocs.akamai.com/linode-api/reference/post-assign-ipv4s) operation. For SLAAC and link-local addresses, this value can't be changed.
                    example: 123
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 6
                  prefix:
                    description: __Read-only__ The number of bits set in the subnet mask.
                    example: 24
                    readOnly: true
                    type: integer
                  public:
                    description: __Read-only__ Whether this is a public or private IP address.
                    example: true
                    readOnly: true
                    type: boolean
                    x-linode-cli-display: 3
                  rdns:
                    description: The reverse DNS assigned to this address. For public IPv4 addresses, this will be set to a default value provided by Linode if not explicitly set.
                    example: test.example.org
                    type:
                    - string
                    - 'null'
                    x-linode-cli-display: 4
                  region:
                    description: __Read-only__ The region this IP address resides in.
                    example: us-east
                    readOnly: true
                    type: string
                    x-linode-cli-display: 5
                  reserved:
                    description: __Filterable__, __Read-only__ Indicates whether this public IPv4 address is a reserved IP. Unlike ephemeral addresses, a reserved IP is a persistent, static address that remains assigned to your account even if the associated resource is deleted.
                    example: true
                    readOnly: true
                    type: boolean
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 8
                  subnet_mask:
                    description: __Read-only__ The mask that separates host bits from network bits for this address.
                    example: 255.255.255.0
                    format: ip
                    readOnly: true
                    type: string
                  tags:
                    description: __Filterable__, __Read-only__ A list of tags that apply to this IP.
                    example:
                    - NB1
                    - Linode1
                    items:
                      type: string
                    readOnly: true
                    type: array
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 9
                  type:
                    description: __Read-only__ The type of address, either `ipv4`, `ipv6`, `ipv6/pool`, or `ipv6/range`. To learn more about these types, see the [Manage IP addresses on a Linode](https://techdocs.akamai.com/cloud-computing/docs/managing-ip-addresses-on-a-compute-instance) guide.
                    enum:
                    - ipv4
                    - ipv6
                    - ipv6/pool
                    - ipv6/range
                    example: ipv4
                    readOnly: true
                    type: string
                    x-linode-cli-display: 2
                  vpc_nat_1_1:
                    additionalProperties: false
                    description: 'IPv4 address configured as a 1:1 NAT for this Interface. If no address is configured as a 1:1 NAT, `null` is returned.


                      > 📘

                      >

                      > Only allowed for `vpc` type interfaces.'
                    properties:
                      address:
                        description: The IPv4 address that is configured as a 1:1 NAT for this VPC interface.
                        example: 192.168.0.42
                        format: ipv4
                        type: string
                      subnet_id:
                        description: The `id` of the VPC Subnet for this interface.
                        example: 101
                        type: integer
                      vpc_id:
                        description: __Read-only__ The `id` of the VPC configured for this interface.
                        example: 111
                        readOnly: true
                        type: integer
                    type: object
                type: object
                x-akamai:
                  file-path: schemas/ip-address.yaml
              x-linode-cli-use-schema:
                additionalProperties: false
                properties:
                  address:
                    x-linode-cli-display: 1
                  interface_id:
                    x-linode-cli-display: 7
                  linode_id:
                    x-linode-cli-display: 6
                  public:
                    x-linode-cli-display: 3
                  rdns:
                    x-linode-cli-display: 4
                  region:
                    x-linode-cli-display: 5
                  reserved:
                    x-linode-cli-display: 8
                  type:
                    x-linode-cli-display: 2
                type: object
                x-akamai:
                  file-path: schemas/ip-address-cli.yaml
          description: IP Address allocated successfully.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - ips:read_write
      summary: Allocate an IP address
      tags:
      - IP Addresses
      x-akamai:
        tabs:
        - syntax: "linode-cli networking ip-add \\\n  --type ipv4 \\\n  --public false \\\n  --linode_id 123"
          title: CLI example - Ephemeral IP
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: "linode-cli networking ip-add \\\n  --type ipv4 \\\n  --public true \\\n  --linode_id 123 \\\n  --reserved true \\\n  --region us-east"
          title: CLI example - Reserved IP
        - syntax: 'ips:read_write

            linodes:read_write'
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: ip-add
      x-linode-grant: read_write
    get:
      description: 'Returns a paginated list of public IP addresses associated with your account. Private addresses are excluded.


        > 👍

        >

        > if your application frequently accesses this operation and doesn''t require IPv6 RDNS data, you can use the `skip_ipv6_rdns` query string to improve performance.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `ips:read_only`


        **CLI**


        ```shell

        linode-cli networking ips-list

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-ips
      operationId: get-ips
      parameters:
      - description: When `true`, the `rdns` property for any `ipv6` type addresses always returns `null` regardless of whether RDNS data exists for the address.
        example: '{{skip_ipv6_rdns}}'
        in: query
        name: skip_ipv6_rdns
        schema:
          default: false
          example: true
          type: boolean
        x-akamai:
          file-path: parameters/skip-ipv6-rdns-query.yaml
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - address: 198.51.100.141
                  assigned_entity:
                    id: 700000
                    label: prod-web-chicago
                    type: linode
                    url: /v4/linode/instances/700000
                  gateway: 198.51.100.1
                  interface_id: 600
                  linode_id: 700000
                  prefix: 24
                  public: true
                  rdns: 198.51.100.141.ip.linodeusercontent.com
                  region: us-ord
                  reserved: false
                  subnet_mask: 255.255.255.0
                  type: ipv4
                  vpc_nat_1_1: null
                page: 1
                pages: 1
                results: 1
              schema:
                allOf:
                - description: An envelope for paginated response. When accessing a collection through a GET endpoint, the results are wrapped in this envelope which includes metadata about those results. Results are presented within a `data` array. See [Pagination](https://techdocs.akamai.com/linode-api/reference/pagination) for more information.
                  properties:
                    page:
                      description: __Read-only__ The current [page](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    pages:
                      description: __Read-only__ The total number of [pages](https://techdocs.akamai.com/linode-api/reference/pagination).
                      example: 1
                      readOnly: true
                      type: integer
                    results:
                      description: __Read-only__ The total number of results.
                      example: 1
                      readOnly: true
                      type: integer
                  type: object
                  x-akamai:
                    file-path: schemas/pagination-envelope.yaml
                - properties:
                    data:
                      description: IP addresses that exist in Linode's system, either IPv4 or IPv6, specific to the response for the [List IP addresses](https://techdocs.akamai.com/linode-api/reference/get-ips) operation.
                      items:
                        additionalProperties: false
                        description: An IP address that exists in Linode's system, either IPv4 or IPv6, specific to the response for the [List IP addresses](https://techdocs.akamai.com/linode-api/reference/get-ips) operation.
                        properties:
                          address:
                            description: __Filterable__, __Read-only__ The IP address.
                            example: 192.0.2.141
                            format: ip
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 1
                            x-linode-filterable: true
                          assigned_entity:
                            additionalProperties: false
                            description: __Read-only__ Identifies which resource a specific IP address is currently attached to.
                            properties:
                              id:
                                description: The unique identifier for the resource.
                                example: 5678
                                type: integer
                              label:
                                description: The name of the entity.
                                example: prod-promo
                                type: string
                              type:
                                description: The type of entity.
                                enum:
                                - linode
                                - nodebalancer
                                example: linode
                                type: string
                              url:
                                description: The API URL path you can use to access this entity.
                                example: /v4/linode/5678
                                format: url
                                type: string
                            readOnly: true
                            type: object
                            x-linode-cli-display: 10
                          gateway:
                            description: __Read-only__ The default gateway for this address.
                            example: 192.0.2.1
                            format: ip
                            readOnly: true
                            type:
                            - string
                            - 'null'
                          interface_id:
                            description: __Read-only__ The Linode interface ID this public IP address is assigned to.
                            example: 456
                            readOnly: true
                            type:
                            - integer
                            - 'null'
                            x-linode-cli-display: 7
                          linode_id:
                            description: __Read-only__ The ID of the Linode this address currently belongs to.
                            example: 123
                            readOnly: true
                            type: integer
                            x-linode-cli-display: 6
                          prefix:
                            description: __Filterable__, __Read-only__ The number of bits set in the subnet mask.
                            example: 24
                            readOnly: true
                            type: integer
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-filterable: true
                          public:
                            description: __Read-only__ Whether this is a public or private IP address.
                            example: true
                            readOnly: true
                            type: boolean
                            x-linode-cli-display: 3
                          rdns:
                            description: __Filterable__ The reverse DNS assigned to this address. For public IPv4 addresses, this will be set to a default value provided by Linode if not explicitly set.
                            example: test.example.org
                            type:
                            - string
                            - 'null'
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 4
                            x-linode-filterable: true
                          region:
                            description: __Filterable__, __Read-only__ The Region this IP address resides in.
                            example: us-east
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 5
                            x-linode-filterable: true
                          reserved:
                            description: __Filterable__, __Read-only__ The `reserved` status of an IPv4 address.
                            example: true
                            readOnly: true
                            type: boolean
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 8
                            x-linode-filterable: true
                          subnet_mask:
                            description: __Read-only__ The mask that separates host bits from network bits for this address.
                            example: 255.255.255.0
                            format: ip
                            readOnly: true
                            type: string
                          type:
                            description: __Filterable__, __Read-only__ The type of address, either `ipv4`, `ipv6`, `ipv6/pool`, or `ipv6/range`.
                            enum:
                            - ipv4
                            - ipv6
                            - ipv6/pool
                            - ipv6/range
                            example: ipv4
                            readOnly: true
                            type: string
                            x-akamai:
                              labels:
                              - Filterable
                            x-linode-cli-display: 2
                            x-linode-filterable: true
                          vpc_nat_1_1:
                            additionalProperties: false
                            description: IPv4 address configured as a 1:1 NAT for this interface.
                            properties:
                              address:
                                description: The IPv4 address that is configured as a 1:1 NAT for this VPC interface.
                                example: 192.168.0.42
                                format: ipv4
                                type: string
                              subnet_id:
                                description: The `id` of the VPC subnet for this interface.
                                example: 101
                                type: integer
                              vpc_id:
                                description: __Read-only__ The `id` of the VPC configured for this interface.
                                example: 111
                                readOnly: true
                                type: integer
                            type: object
                            x-linode-cli-display: 11
                        type: object
                      type: array
                  type: object
                description: The response data for the [List IP addresses](https://techdocs.akamai.com/linode-api/reference/get-ips) operation.
                x-akamai:
                  file-path: schemas/ip-addresses-list-response.yaml
              x-linode-cli-use-schema:
                additionalProperties: false
                properties:
                  address:
                    x-linode-cli-display: 1
                  interface_id:
                    x-linode-cli-display: 7
                  linode_id:
                    x-linode-cli-display: 6
                  public:
                    x-linode-cli-display: 3
                  rdns:
                    x-linode-cli-display: 4
                  region:
                    x-linode-cli-display: 5
                  reserved:
                    x-linode-cli-display: 8
                  type:
                    x-linode-cli-display: 2
                type: object
                x-akamai:
                  file-path: schemas/ip-address-cli.yaml
          description: A paginated list of IP Addresses.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - ips:read_only
      summary: List IP addresses
      tags:
      - IP Addresses
      x-akamai:
        tabs:
        - syntax: linode-cli networking ips-list
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: ips:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: ips-list
      x-linode-grant: read_only
  /{apiVersion}/networking/ips/assign:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/ips-assign.yaml
      path-info: /{apiVersion}/networking/ips/assign
    x-linode-cli-command: networking
    post:
      description: 'Assigns a set of IPv4 addresses and IPv6 ranges to Linodes within a single region. This operation lets you swap, shuffle, or reorganize IP addresses among your Linodes, and assign reserved IPs that aren''t currently assigned to specific Linode instances.


        The following restrictions apply:


        - All addresses must be an IPv4 address or an IPv6 range you can access in the specified region. This includes unassigned reserved IP addresses belonging to your account.

        - If you specify a reserved IP, it must be reserved in your account. Assigning an unassigned reserved IP moves the IP from your account''s general pool and becomes an assigned resource tied to a specific Linode interface. Using a reserved IP that you don''t own results in a 400 error.

        - You can''t swap an assigned reserved IP with a newly created ephemeral IP using this operation. To convert or toggle the status of an IP, use the Update an IP address''s RDNS and reserved setting operation.

        - All Linodes need to have at least one public IPv4 address assigned.

        - Linodes that use Linode interfaces can''t be assigned a private IPv4 address.

        - Linodes that use configuration profile interfaces may have a maximum of one assigned private IPv4 address.

        - Linodes are restricted to one assigned IPv6 range.

        - Shared IP addresses can''t be swapped between Linodes.


        Open a support ticket to request additional IPv4 addresses or IPv6 ranges beyond standard account limits.


        > 📘

        >

        > Removing an IP address that has been set as a Managed Linode''s `ssh.ip` causes the Managed Linode''s SSH access settings to reset to their default values.


        To view and configure Managed Linode SSH settings, use the following operations:


        - Get a Linode''s managed settings

        - Update a Linode''s managed settings


        **Permissions and scopes**


        To call this operation, you need the following:


        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `ips:read_write, linodes:read_write`


        **CLI**


        ```shell

        linode-cli networking ip-assign \

        --region us-east \

        --assignments.address 192.0.2.1 \

        --assignments.linode_id 123 \

        --assignments.address 2001:db8:3c4d:15::/64 \

        --assignments.linode_id 234

        ```


        Learn more'
