  /{apiVersion}/account/cancel:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/account-cancel.yaml
      path-info: /{apiVersion}/account/cancel
    x-linode-cli-command: account
    post:
      description: 'Deletes an active account. Akamai attempts to charge the credit card on file for any remaining balance. An error occurs if this charge fails.


        > 🚧

        >

        > This operation permanently deletes your account, which _can''t_ be recovered. Also, there is no warning prompt after you execute this operation.


        __Parent and child accounts__


        In the context of the parent and child accounts feature, you need to contact your Akamai account team to delete a child or parent account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `cancel_account`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli account cancel \

        --comments "I''m consolidating my accounts"

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-cancel-account
      operationId: post-cancel-account
      requestBody:
        content:
          application/json:
            example:
              comments: I'm consolidating multiple accounts into one.
            schema:
              additionalProperties: false
              properties:
                comments:
                  description: Share the reason for cancelling your account along with any other feedback or comments about your experience.
                  example: '{{comments}}'
                  type: string
              type: object
              x-akamai:
                file-path: schemas/added-post-cancel-account.yaml
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                survey_link: https://alinktothesurvey.com
              schema:
                additionalProperties: false
                example:
                  survey_link: https://alinktothesurvey.com
                properties:
                  survey_link:
                    description: A link to Linode's exit survey.
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/added-post-cancel-account-200.yaml
          description: Account canceled.
        '409':
          content:
            application/json:
              example:
                errors:
                - reason: We were unable to charge your credit card for services rendered. We cannot cancel this account until the balance has been paid.
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        reason:
                          description: A string explaining that the account could not be canceled because there is an outstanding balance on the account that must be paid first.
                          example: We were unable to charge your credit card for services rendered. We cannot cancel this account until the balance has been paid.
                          type: string
                      type: object
                    type: array
                type: object
                x-akamai:
                  file-path: schemas/post-cancel-account-409.yaml
          description: Could not charge the credit card on file.
          x-akamai:
            file-path: errors/409.yaml
        '504':
          content:
            application/json:
              example:
                errors:
                - reason: Cancellation is taking longer than expected. It may have been successful. Contact customer support to confirm.
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        reason:
                          description: A string explaining that the account is taking longer to close than expected.
                          example: Cancellation is taking longer than expected. It may have been successful. Contact customer support to confirm.
                          type: string
                      type: object
                    type: array
                type: object
                x-akamai:
                  file-path: schemas/post-cancel-account-504.yaml
          description: Account is taking longer than expected to cancel.
          x-akamai:
            file-path: errors/504-account-cancel.yaml
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
