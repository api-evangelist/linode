openapi: 3.2.0
info:
  title: Linode Account API
  version: '1.0'
  description: 'Operations tagged Account across 2 of this provider''s published API definitions: linode-api-v4-official-openapi.json, linode-api-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.linode.com
- url: https://api.linode.com/v4
  description: Production Server
tags:
- description: Use account operations to review and update details about your Akamai Connected Cloud account, including billing information, promotions, and your specific information.
  name: Account
paths:
  /{apiVersion}/account:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        example: v4
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    x-akamai:
      file-path: paths/account.yaml
      path-info: /{apiVersion}/account
    x-linode-cli-command: account
    get:
      description: 'Returns the contact and billing information related to your account.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `view_account`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_only`


        **CLI**


        ```shell

        linode-cli account view

        ```


        Learn more'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-account
      operationId: get-account
      responses:
        '200':
          content:
            application/json:
              example:
                active_promotions:
                - credit_monthly_cap: '10.00'
                  credit_remaining: '50.00'
                  description: Receive up to $10 off your services every month for 6 months! Unused credits will expire once this promotion period ends.
                  expire_dt: '2018-01-31T23:59:59'
                  image_url: https://linode.com/10_a_month_promotion.svg
                  service_type: all
                  summary: $10 off your Linode a month!
                  this_month_credit_remaining: '10.00'
                active_since: '2018-01-01T00:01:01'
                address_1: 123 Main Street
                address_2: Suite A
                balance: 200
                balance_uninvoiced: 145
                billing_source: akamai
                capabilities:
                - Linodes
                - NodeBalancers
                - Block Storage
                - Object Storage
                - Placement Groups
                - Block Storage Encryption
                - Cloud Firewall Rule Set
                - VPC Dual Stack
                - VPC IPv6 Stack
                - VPC IPv6 Large Prefixes
                - Custom VPC IPv4 Ranges
                - GPUDirect RDMA
                city: Philadelphia
                company: Linode LLC
                country: US
                credit_card:
                  expiry: 11/2022
                  last_four: 1111
                email: mrossi@linode.com
                euuid: E1AF5EEC-526F-487D-B317EBEB34C87D71
                first_name: John
                last_name: Smith
                phone: 215-555-1212
                state: PA
                tax_id: ATU99999999
                zip: 19102-1234
              schema:
                additionalProperties: false
                description: Account object.
                properties:
                  active_promotions:
                    items:
                      additionalProperties: false
                      description: 'Promotions generally offer a set amount of credit that can be used toward your Linode services, and the promotion expires after a specified date. As well, a monthly cap on the promotional offer is set.


                        Simply put, a promotion offers a certain amount of credit  month, until either the expiration date is passed, or until the total promotional credit is used, whichever comes first.'
                      properties:
                        credit_monthly_cap:
                          description: The amount available to spend per month.
                          example: '10.00'
                          type: string
                          x-linode-cli-display: 5
                        credit_remaining:
                          description: The total amount of credit left for this promotion.
                          example: '50.00'
                          type: string
                          x-linode-cli-display: 3
                        description:
                          description: A detailed description of this promotion.
                          example: Receive up to $10 off your services every month for 6 months! Unused credits will expire once this promotion period ends.
                          type: string
                        expire_dt:
                          description: When this promotion's credits expire.
                          example: '2018-01-31T23:59:59'
                          type: string
                          x-linode-cli-display: 2
                        image_url:
                          description: The location of an image for this promotion.
                          example: https://linode.com/10_a_month_promotion.svg
                          type: string
                        service_type:
                          description: The service to which this promotion applies, either a specific service or `all` for any service. Specific services include `linode`, `longview`, `nodebalancer`, `objectstorage`, `blockstorage`, `backup`, `db_mysql`, `ip_v4`, `linode_disk`, `linode_memory`, `managed`, `placement_group`, and `transfer_tx`.
                          enum:
                          - all
                          - backup
                          - blockstorage
                          - db_mysql
                          - ip_v4
                          - linode
                          - linode_disk
                          - linode_memory
                          - longview
                          - managed
                          - nodebalancer
                          - objectstorage
                          - placement_group
                          - transfer_tx
                          example: all
                          type: string
                          x-linode-cli-display: 1
                        summary:
                          description: Short details of this promotion.
                          example: $10 off your Linode a month!
                          type: string
                          x-linode-cli-display: 10
                        this_month_credit_remaining:
                          description: The amount of credit left for this month for this promotion.
                          example: '10.00'
                          type: string
                          x-linode-cli-display: 4
                      type: object
                      x-akamai:
                        file-path: schemas/promotion.yaml
                    readOnly: true
                    type: array
                  active_since:
                    description: __Read-only__ The date and time the account was activated.
                    example: '2018-01-01T00:01:01'
                    format: date-time
                    readOnly: true
                    type: string
                  address_1:
                    description: The first line of this account's billing address.
                    example: 123 Main Street
                    maxLength: 64
                    type: string
                  address_2:
                    description: The second line of this account's billing address.
                    example: Suite A
                    maxLength: 64
                    type: string
                  balance:
                    description: __Read-only__ This account's balance, in US dollars.
                    example: 200
                    readOnly: true
                    type: number
                    x-linode-cli-display: 4
                  balance_uninvoiced:
                    description: __Read-only__ This account's current estimated invoice in US dollars. This is not your final invoice balance. Transfer charges are not included in the estimate.
                    example: 145
                    readOnly: true
                    type: number
                    x-linode-cli-display: 4
                  billing_source:
                    description: __Read-only__ The source of service charges for this account. Accounts that are associated with Akamai-specific customers return a value of `akamai`. All other accounts return a value of `linode`.
                    enum:
                    - akamai
                    - linode
                    example: akamai
                    readOnly: true
                    type: string
                  capabilities:
                    description: __Read-only__ The Akamai Cloud Computing services your account supports.
                    example:
                    - Linodes
                    - NodeBalancers
                    - Block Storage
                    - Object Storage
                    - Placement Groups
                    - Block Storage Encryption
                    - Cloud Firewall Rule Set
                    - Custom VPC IPv4 Ranges
                    - GPUDirect RDMA
                    - VPC Dual Stack
                    - VPC IPv6 Stack
                    items:
                      type: string
                    readOnly: true
                    type: array
                  city:
                    description: The city for this account's `address`.
                    example: Philadelphia
                    maxLength: 24
                    type: string
                  company:
                    description: The company name assigned to this account. This value can't include the characters, `<` `>` `(` `)` `"` `=`.
                    example: Linode LLC
                    maxLength: 128
                    type: string
                  country:
                    description: The two-letter ISO 3166 country code for this account's `address`.
                    example: US
                    type: string
                  credit_card:
                    additionalProperties: false
                    description: __Read-only__ The credit card information assigned to this account.
                    properties:
                      expiry:
                        description: The expiration month and year of the `credit_card`.
                        example: 11/2022
                        type:
                        - string
                        - 'null'
                      last_four:
                        description: The last four digits of the `credit_card` assigned to this account.
                        example: 1111
                        type:
                        - string
                        - 'null'
                    readOnly: true
                    type: object
                  email:
                    description: The email address of the person assigned to this account.
                    example: john.smith@linode.com
                    maxLength: 128
                    type: string
                    x-linode-cli-display: 3
                  euuid:
                    description: __Read-only__ An external unique identifier for this account.
                    example: E1AF5EEC-526F-487D-B317EBEB34C87D71
                    readOnly: true
                    type: string
                  first_name:
                    description: The first name of the person assigned to this account. This value can't include the characters, `<` `>` `(` `)` `"` `=`.
                    example: John
                    maxLength: 50
                    type: string
                    x-linode-cli-display: 1
                  last_name:
                    description: The last name of the person assigned to this account. This value can't include the characters, `<` `>` `(` `)` `"` `=`.
                    example: Smith
                    maxLength: 50
                    type: string
                    x-linode-cli-display: 2
                  phone:
                    description: The phone number assigned to this account.
                    example: 215-555-1212
                    maxLength: 32
                    type: string
                  state:
                    description: 'The state or province for the `address` set for your account, if applicable.


                      - If the `address` is in the United States (US) or Canada (CA), this is the two-letter ISO 3166 code for the state or province.


                      - If it''s a US military `address`, this is the abbreviation for that territory. This includes `AA` for Armed Forces Americas (excluding Canada), `AE` for Armed Forces Africa, Europe, Middle East, and Canada, or `AP` for Armed Forces Pacific.


                      - If outside the US or CA, this is the province associated with the account''s `address`.'
                    example: PA
                    maxLength: 24
                    type: string
                  tax_id:
                    description: 'The tax identification number (TIN) assigned to this account, used for tax calculations. A TIN is set by the national authorities in your `country`, based on your `address_1`, and it may be named differently between countries. Set to an empty string (`""`) if a TIN doesn''t apply or for countries that don''t collect tax.


                      > 📘

                      >

                      > This value is externally validated. If the validation is successful, a `tax_id_valid` [event](https://techdocs.akamai.com/linode-api/reference/get-events) is triggered. If unsuccessful, a `tax_id_invalid` event is triggered and an error response is issued for an operation that included it.'
                    example: ATU99999999
                    maxLength: 25
                    type: string
                  zip:
                    description: 'The zip code for this account''s `address`.


                      - It can only contain ASCII letters, numbers, and dashes (`-`).


                      - It can''t contain more than nine letter or number characters.'
                    example: 19102-1234
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/account.yaml
          description: Returns a single account object.
        default:
          content:
            application/json:
              example:
                errors:
                - reason: Invalid JSON
              schema:
                additionalProperties: false
                properties:
                  errors:
                    description: Any warnings associated with a response.
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - account:read_only
      summary: Get your account
      tags:
      - Account
      x-akamai:
        tabs:
        - syntax: linode-cli account view
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
      x-linode-cli-action: view
      x-linode-grant: read_only
      x-linode-iam:
      - permissions:
        - view_account
    put:
      description: 'Updates contact and billing information related to your account. If you exclude any properties from the request, the operation leaves them unchanged.


        > 📘

        >

        > When updating an account''s `country` to `US`, you''ll get an error if the account''s `zip` is not a valid US zip code.


        __Parent and child accounts__


        In the context of the parent and child accounts feature:


        - You can''t change the company for a parent account.


        - Child account users can''t run this operation.


        **Permissions and scopes**


        To call this operation, you need the following:


        - **Identity and access permissions**. Your user needs a role with these permissions assigned. Learn more.

        - Permissions: `update_account`

        - **OAuth scopes**. Your user needs these scopes assigned. Learn more.


        - Scopes: `account:read_write`


        **CLI**


        ```shell

        linode-cli account update \

        --address_1 "123 Main St." \

        --address_2 "Suite 101" \

        --city Philadelphia \

        --company My Company \ LLC \

        --country US \

        --email jsmith@mycompany.com \

        --first_name John \

        --last_name Smith \

        --phone 555-555-1212 \

        --state PA \

        --tax_id ATU99999999 \

        --zip 19102

        ```


        Learn more'
