    get:
      description: 'Returns the zone file for the last rendered zone for the specified domain.


        >


        ---


        - __CLI__.


        ```

        linode-cli domains zone-file 123

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        domains:read_only

        ```


