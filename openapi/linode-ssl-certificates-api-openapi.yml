- description: Use these operations to view the SSL CA certificate for an accessible MySQL or PostgreSQL Managed Database
  name: SSL certificates
paths:
  /{apiVersion}/databases/mysql/instances/{instanceId}/ssl:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: The ID of the Managed MySQL Database.
      example: '{{instanceId}}'
      in: path
      name: instanceId
      required: true
      schema:
        example: 123458
        type: integer
      x-akamai:
        file-path: parameters/instance-id-path-c09a6713.yaml
    x-akamai:
      file-path: paths/mysql-ssl.yaml
      path-info: /{apiVersion}/databases/mysql/instances/{instanceId}/ssl
    x-linode-cli-command: databases
    get:
      description: 'Display the SSL CA certificate for an accessible MySQL Managed Database. The database''s status needs to be `active`.


        >


        ---


        - __CLI__.


        ```

        linode-cli databases mysql-ssl-cert 123

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        databases:read_only

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/get-databases-mysql-instance-ssl
      operationId: get-databases-mysql-instance-ssl
      responses:
        '200':
          content:
            application/json:
              example:
                ca_certificate: LS0tLS1CRUdJ...==
              schema:
                additionalProperties: false
                description: Managed Database SSL object.
                properties:
                  ca_certificate:
                    description: The base64-encoded SSL CA certificate for the Managed Database instance.
                    example: LS0tLS1CRUdJ...==
                    format: base64
                    type: string
                    x-linode-cli-display: 1
                type: object
                x-akamai:
                  file-path: schemas/database-ssl.yaml
          description: Returns the SSL CA certificate of a single MySQL Managed Database.
        default:
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      description: An object for describing a single error that occurred during the processing of a request.
                      properties:
                        field:
                          description: The field in the request that caused this error. This may be a path, separated by periods in the case of nested fields. In some cases this may come back as `null` if the error is not specific to any single element of the request.
                          example: fieldname
                          type: string
                        reason:
                          description: What happened to cause this error. In most cases, this can be fixed immediately by changing the data you sent in the request, but in some cases you will be instructed to [Open a support ticket](https://techdocs.akamai.com/linode-api/reference/post-ticket) or perform some other action before you can complete the request successfully.
                          example: fieldname must be a valid value
                          type: string
                      type: object
                      x-akamai:
                        file-path: schemas/error-object.yaml
                    type: array
                type: object
          description: See [Errors](https://techdocs.akamai.com/linode-api/reference/errors) for the range of possible error response codes.
      security:
      - personalAccessToken: []
      - oauth:
        - databases:read_only
      summary: Get a MySQL Managed Database SSL certificate
      tags:
      - SSL certificates
      x-akamai:
        tabs:
        - syntax: linode-cli databases mysql-ssl-cert 123
          title: CLI
          url: https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
        - syntax: databases:read_only
          title: OAuth scopes
          url: https://techdocs.akamai.com/linode-api/reference/get-started#oauth
      x-linode-cli-action: mysql-ssl-cert
      x-linode-grant: read_only
