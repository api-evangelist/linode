openapi: 3.2.0
info:
  contact:
    email: support@linode.com
    name: Linode
    url: https://linode.com
  description: Add a Cloud Computing instance so you can build, release, and scale applications faster with virtual machines.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: 'Akamai: Linode Disks API'
  version: 4.215.0
servers:
- url: https://api.linode.com
tags:
- description: Use these operations to manage the individual disks on your Linode.
  name: Disks
paths:
  /{apiVersion}/linode/instances/{linodeId}/disks:
    parameters:
    - description: __Enum__ Call either the `v4` URL, or `v4beta` for operations still in Beta.
      example: '{{apiVersion}}'
      in: path
      name: apiVersion
      required: true
      schema:
        enum:
        - v4
        - v4beta
        type: string
      x-akamai:
        file-path: parameters/api-version-path.yaml
    - description: ID of the Linode to look up.
      example: '{{linodeId}}'
      in: path
      name: linodeId
      required: true
      schema:
        example: 234
        type: integer
      x-akamai:
        file-path: parameters/linode-id-path.yaml
    x-akamai:
      file-path: paths/disks.yaml
      path-info: /{apiVersion}/linode/instances/{linodeId}/disks
    x-linode-cli-command: linodes
    post:
      description: 'Add a new disk to an existing Linode. You can create an empty disk to manually configure it later. You can also target a stored `image` to build the disk using a pre-configured file system--either through an image you''ve created or via a StackScript. For added security with all disks, you should supply SSH keys for the disk''s `root_pass` user, using the `authorized_keys` field.


        > 📘

        >

        > A Linode can have up to 50 disks.


        **Empty disks**


        - When creating an empty disk, a `label` is required.


        - The default file system for an empty disk is `ext4`.


        **Disks created from an `image`**


        - A `root_pass` is required for a disk created from a stored image.


        - A created disk inherits both the `label` and the `filesystem` from the target `image`, unless you specify otherwise.


        - We offer an example workflow to create a disk using a stored image.


        **Disks created from a StackScript**


        - You can run List StackScripts to review available StackScripts.


        - You need to include a StackScript-compatible `image` when creating the disk. Run Get a StackScript to review available images.


        >


        ---


        - __CLI__.


        ```

        linode-cli linodes disk-create 123 \

        --size 1300 \

        --authorized_keys "ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer" \

        --authorized_users "myUser" \

        --authorized_users "secondaryUser" \

        --root_pass aComplex@Password \

        --image "linode/debian9" \

        --stackscript_id 10079 \

        --stackscript_data ''{"gh_username": "linode"}''

        ```


        Learn more...


        - __OAuth scopes__.


        ```

        linodes:read_write

        ```


        Learn more...'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-add-linode-disk
      operationId: post-add-linode-disk
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - additionalProperties: false
                description: Disk object request.
                properties:
                  authorized_keys:
                    description: __Write-only__ A list of public SSH keys that will be automatically appended to the root user's `~/.ssh/authorized_keys` file when deploying from an Image.
                    example:
                    - ssh-rsa AAAA_valid_public_ssh_key_123456785== user@their-computer
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  authorized_users:
                    description: __Write-only__ A list of usernames for authorized users. Before you can add a user, it needs an SSH key assigned to its profile. See [Add an SSH key](https://techdocs.akamai.com/linode-api/reference/post-add-ssh-key) for more information. If the usernames already have associated SSH keys, the keys will be appended to the root users `~/.ssh/authorized_keys` file automatically when deploying from an image.
                    example:
                    - myUser
                    - secondaryUser
                    items:
                      type: string
                    type: array
                    writeOnly: true
                  filesystem:
                    description: 'The disk''s format or file system. A value of `raw` indicates no file system, just a raw binary stream. A value of `swap` indicates a Linux swap area. The values `ext3` or `ext4` represent these Linux journaling file systems. The value `ext2` is the deprecated ext2 Linux file system. Finally, `initrd` indicates the disk is formatted as an uncompressed initial RAM disk.


                      > 📘

                      >

                      > The `ext2` file system doesn''t properly support timestamps and will be removed from Linux support in the near future. Also, `initrd` is a legacy format that no longer applies to most use cases. As a best practice, use the other supported formats or file systems instead.'
                    enum:
                    - raw
                    - swap
                    - ext2
                    - ext3
                    - ext4
                    - initrd
                    example: ext4
                    type: string
                    x-linode-cli-display: 5
                  image:
                    description: 'An Image ID to deploy the Linode Disk from.


                      Run the [List images](https://techdocs.akamai.com/linode-api/reference/get-images) operation with authentication to view all available Images. Official Linode Images start with `linode/`, while your Account''s Images start with `private/`. Creating a disk from a Private Image requires `read_only` or `read_write` permissions for that Image. Run the [Update a user''s grants](https://techdocs.akamai.com/linode-api/reference/put-user-grants) operation to adjust permissions for an Account Image.'
                    example: linode/debian9
                    type:
                    - string
                    - 'null'
                  label:
                    description: __Filterable__ The name of the disk. This is for display purposes only.
                    example: Debian 9 Disk
                    maxLength: 48
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  root_pass:
                    description: '__Write-only__ This sets the root user''s password on a newly created Linode Disk when deploying from an Image.


                      - __Required__ when creating a Linode Disk from an Image, including when using a StackScript.


                      - Must meet a password strength score requirement that is calculated internally by the API. If the strength requirement is not met, you will receive a `Password does not meet strength requirement` error.'
                    example: aComplexP@ssword
                    format: password
                    maxLength: 128
                    minLength: 7
                    type: string
                    writeOnly: true
                  size:
                    description: '__Filterable__ The size of the Disk in MB.


                      Images require a minimum size. Run the [Get an image](https://techdocs.akamai.com/linode-api/reference/get-image) operation to view its size.'
                    example: 48640
                    type: integer
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-filterable: true
                  stackscript_data:
                    description: 'This field is required only if the StackScript being deployed requires input data from the User for successful completion. See [User Defined Fields (UDFs)](https://www.linode.com/docs/products/tools/stackscripts/guides/write-a-custom-script/#declare-user-defined-fields-udfs) for more details.


                      This field is required to be valid JSON.


                      Total length cannot exceed 65,535 characters.'
                    example:
                      gh_username: linode
                    maxLength: 65535
                    type: object
                  stackscript_id:
                    description: A StackScript ID that will cause the referenced StackScript to be run during deployment of this Linode. A compatible `image` is required to use a StackScript. To get a list of available StackScript and their permitted Images, run [List StackScripts](https://techdocs.akamai.com/linode-api/reference/get-stack-scripts). This field cannot be used when deploying from a Backup or a Private Image.
                    example: 10079
                    type: integer
                type: object
                x-akamai:
                  file-path: schemas/disk-request.yaml
              required:
              - size
              x-akamai:
                file-path: schemas/added-post-add-linode-disk.yaml
            x-example:
              x-ref: ../examples/post-add-linode-disk.json
        description: The parameters to set when creating the Disk.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  created:
                    description: __Read-only__ When this disk was created.
                    example: '2018-01-01T00:01:01'
                    format: date-time
                    readOnly: true
                    type: string
                  disk_encryption:
                    default: enabled
                    description: __Read-only__ Displays if encryption is enabled on this disk. This setting is based on the `disk_encryption` setting of the Linode.
                    example: disabled
                    readOnly: true
                    type: string
                    x-linode-cli-display: 6
                  filesystem:
                    description: 'The disk''s format or file system. A value of `raw` indicates no file system, just a raw binary stream. A value of `swap` indicates a Linux swap area. The values `ext3` or `ext4` represent these Linux journaling file systems. The value `ext2` is the deprecated ext2 Linux file system. Finally, `initrd` indicates the disk is formatted as an uncompressed initial RAM disk.


                      > 📘

                      >

                      > The `ext2` file system doesn''t properly support timestamps and will be removed from Linux support in the near future. Also, `initrd` is a legacy format that no longer applies to most use cases. As a best practice, use the other supported formats or file systems instead.'
                    enum:
                    - raw
                    - swap
                    - ext2
                    - ext3
                    - ext4
                    - initrd
                    example: ext4
                    type: string
                    x-linode-cli-display: 5
                  id:
                    description: __Read-only__ This disk's ID. You need this value to run other operations that interact with the disk.
                    example: 25674
                    readOnly: true
                    type: integer
                    x-linode-cli-display: 1
                  label:
                    description: __Filterable__ The name of the disk. This is for display purposes only.
                    example: Debian 9 Disk
                    maxLength: 48
                    minLength: 1
                    type: string
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 2
                    x-linode-filterable: true
                  size:
                    description: __Filterable__ The size of the disk in MB.
                    example: 48640
                    type: integer
                    x-akamai:
                      labels:
                      - Filterable
                    x-linode-cli-display: 4
                    x-linode-filterable: true
                  status:
                    description: __Read-only__ The current state of the disk.
                    enum:
                    - ready
                    - not ready
                    - deleting
                    example: ready
                    readOnly: true
                    type: string
                    x-linode-cli-color:
                      default_: yellow
                      not ready: red
                      ready: green
                    x-linode-cli-display: 3
                  updated:
                    description: __Read-only__ When this disk was last updated.
                    example: '2018-01-01T00:01:01'
                    format: date-time
                    readOnly: true
                    type: string
                type: object
                x-akamai:
                  file-path: schemas/disk.yaml
              x-example:
                x-ref: ../examples/post-add-linode-disk-200.json
          description: Disk created.
