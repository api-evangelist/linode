  properties:
  - url: https://pkg.go.dev/github.com/linode/linodego
    type: Documentation
  description: The Linode Go SDK (linodego) is the official Go client library for the Linode API v4. It provides
    idiomatic Go interfaces for managing Akamai Connected Cloud infrastructure programmatically, including compute
    instances, Kubernetes clusters, networking configurations, storage volumes, and DNS domains. The library is
    used internally by the Linode Terraform Provider and Linode CLI, and supports context-based request cancellation,
    pagination helpers, and retry logic for robust API interactions.
