  description: The Linode CLI is a command-line interface that wraps the Linode API v4, allowing developers and
    system administrators to manage Akamai Connected Cloud resources directly from the terminal. It supports all
    API operations including creating and managing compute instances, configuring networking, deploying Kubernetes
    clusters, and managing storage.
