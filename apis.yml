modified: '2026-09-17'
description: 'Linode — operating as Akamai Cloud since Akamai''s acquisition, with the Linode brand retained on
  the API, the CLI and the developer surface — is a cloud infrastructure provider offering virtual compute instances,
  GPU and accelerated plans, managed Kubernetes (LKE), S3-compatible Object Storage, Block Storage volumes, NodeBalancers,
  VPCs, Cloud Firewalls, managed MySQL/PostgreSQL/Valkey databases and DNS hosting. The Linode API v4 is a single
  cohesive REST surface at api.linode.com/v4 covering all of it: 358 paths and 539 operations in the first-party
  OpenAPI, documented at techdocs.akamai.com, with a generated CLI, first-party SDKs in Python, Go and TypeScript,
  a Terraform provider and an official read-only MCP server. Its price book is published as an unauthenticated API,
  so a stack can be costed with no account at all.'
