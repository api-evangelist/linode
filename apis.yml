  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://techdocs.akamai.com/cloud-computing/docs/cli
  properties:
  - url: https://techdocs.akamai.com/cloud-computing/docs/cli
    type: Documentation
  description: >-
    The Linode CLI is a command-line interface that wraps the Linode API v4, allowing developers and system
    administrators to manage Akamai Connected Cloud resources directly from the terminal. It supports
    all API operations including creating and managing compute instances, configuring networking, deploying
    Kubernetes clusters, and managing storage.
- aid: linode:python-sdk
  name: Linode Python SDK
  tags:
  - Client Library
  - Python
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://linode-api4.readthedocs.io/en/latest/
  properties:
  - url: https://linode-api4.readthedocs.io/en/latest/
    type: Documentation
  description: >-
    The Linode Python SDK (linode_api4) is the official Python client library for interacting with the
    Linode API v4. It provides a Pythonic interface for managing all Akamai Connected Cloud resources
    including compute instances, domains, NodeBalancers, volumes, Kubernetes clusters, and account settings.
    The SDK supports both synchronous operations and includes helper methods for common workflows like
    deploying instances from StackScripts, managing SSH keys, and configuring networking resources.
- aid: linode:go-sdk
  name: Linode Go SDK
  tags:
  - Client Library
  - Go
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://pkg.go.dev/github.com/linode/linodego
  properties:
  - url: https://pkg.go.dev/github.com/linode/linodego
    type: Documentation
  description: >-
    The Linode Go SDK (linodego) is the official Go client library for the Linode API v4. It provides
    idiomatic Go interfaces for managing Akamai Connected Cloud infrastructure programmatically, including
    compute instances, Kubernetes clusters, networking configurations, storage volumes, and DNS domains.
    The library is used internally by the Linode Terraform Provider and Linode CLI, and supports context-based
    request cancellation, pagination helpers, and retry logic for robust API interactions.
