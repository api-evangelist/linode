    type: Documentation
  description: >-
    The Linode Terraform Provider enables infrastructure-as-code management of Akamai Connected Cloud
    resources using HashiCorp Terraform. It supports provisioning and managing compute instances, Kubernetes
    clusters, NodeBalancers, firewalls, DNS domains, Block Storage volumes, Object Storage buckets, VPCs,
    and other cloud resources through declarative configuration files.
