note: Derived mechanically, and deliberately conservatively. An entity is a collection path that the contract also
  addresses by id (so /linode/instances is an entity and /linode/instances/{linodeId}/boot is not); has_many/belongs_to
  edges come from nesting one id-addressable collection inside another's id; and a `*_id` property only produces
  an edge when the name resolves to a collection that actually exists in the contract. Payment-instrument and tax
  identifiers are excluded by name — they are external references, not entities in this API.
id_scheme:
  style: integer surrogate keys
  prefixed: false
  note: Linode identifiers are bare integers (linodeId, volumeId, clusterId, domainId). Nothing in an id says what
    it refers to, so an agent holding `12345` cannot tell an instance from a volume without the path it came from.
    There is no id-prefix table to record.
  exceptions:
  - Object Storage buckets and keys are addressed by region plus name, not an integer.
  - Service and entity transfers are addressed by an opaque token.
  - Managed Database instances are addressed by engine plus integer id.
