rfc9457: false
note: 'Linode does not use RFC 9457 problem+json. Every error response is a JSON object with a single top-level
  `errors` array; each element carries a human-readable `reason` and, when the fault is tied to a submitted field,
  a `field` naming it. The `field` key is omitted when no field applies. There are no machine-readable error type
  URIs or stable error codes in the contract, which is the single largest gap in this API''s error surface for an
  agent: a caller must match on prose.'
