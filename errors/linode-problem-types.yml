problem_types:
- status: 400
  title: Request error
  format: vendor-json
  remediation: Read each errors[].reason; when errors[].field is present, correct that field in the request body
    and retry.
- status: 401
  title: Invalid Token
  format: vendor-json
  remediation: Present a valid personal access token or OAuth bearer token in the Authorization header. Tokens carry
    a fixed expiry set at creation and cannot be extended.
- status: 403
  title: Forbidden
  format: vendor-json
  remediation: The token is valid but lacks the scope, or the user lacks the Identity and Access permission, for
    this operation. Each operation's reference page lists its required permission and OAuth scope.
- status: 404
  title: Not found
  format: vendor-json
  remediation: The entity does not exist or is not visible to this token. Linode returns 404 rather than 403 for
    entities outside the account.
- status: 429
  title: Rate limit exceeded
  format: vendor-json
  remediation: Wait for the window named by Retry-After (seconds) or X-RateLimit-Reset (UTC epoch seconds). See
    rate-limits/linode-rate-limits.yml for the per-operation limits.
- status: 500
  title: Server error
  format: vendor-json
  remediation: Retry with backoff. Linode logs errors and asks that repeat failures be reported through a support
    ticket with reproducible steps.
